有：","options":["A. 拟阐明人类基因组DNA长达3×10⁹碱基对的序列","B. 1990年NIH和DOE联合正式启动，计划15年内提供30亿美元资助","C. 中国1999年承担1%序列测序任务，负责第3号染色体3千万核苷酸","D. 2003年4月14日完成图绘制成功，覆盖99.99%"],"answer":"A、B、C、D","analysis":"四项均与素材一致：1985年DOE率先提出3×10⁹ bp目标；1990年NIH与DOE联合启动、15年30亿美元、2005年完成；中国1999年承担1%、3号染色体3千万核苷酸；2003年4月14日完成图（99.99%）提前绘制成功。","pages":[54,55,56]},{"id":"L1-E08","type":"多选题","stem":"下列诺贝尔奖成果与获奖者对应正确的有：","options":["A. 1989年化学奖——Altman和Cech，发现RNA的催化功能（核酶）","B. 1993年生理学或医学奖——Roberts和Sharp，发现断裂基因","C. 2006年化学奖——Roger D. Kornberg，揭示真核细胞转录机制","D. 2024年生理学或医学奖——Victor Ambros和Gary Ruvkun，发现miRNA（lin-4、let-7）及转录后基因调控"],"answer":"A、B、C、D","analysis":"四项均正确。注意区分：2006年生理学或医学奖为Fire与Mello（RNAi），2006年化学奖为R. Kornberg（真核转录）；1993年化学奖为Mullis与Smith（PCR与定点突变），1993年生理学或医学奖为Roberts与Sharp（断裂基因）。","pages":[46,47,59,62,82]},{"id":"L1-E09","type":"填空题","stem":"1953年4月2日，沃森与克里克向《自然》投去了一篇900多单词的论文《________》，于4月25日发表；DNA双螺旋结构的发现标志着________从此诞生。","options":[],"answer":"核酸的分子结构；分子生物学","analysis":"论文题目与“分子生物学诞生标志”是常考填空；注意日期为1953年4月2日投稿、4月25日发表。","pages":[27]},{"id":"L1-E10","type":"填空题","stem":"基因组（genome）一词是1920年由________从GENes和chromosOEs铸成的；人类基因组包括________对染色体，单倍体细胞中约有________亿对核苷酸，编码2.7–3万个基因。","options":[],"answer":"Winkles；23；30","analysis":"三个空分别考词源、染色体数与核苷酸总量，均为高频数字。","pages":[100]},{"id":"L1-E11","type":"判断题","stem":"Pauling提出错误的DNA三螺旋结构，原因之一是他不了解Chargaff碱基配对原则，并认为基因的本质是蛋白质。","options":["A. 正确","B. 错误"],"answer":"A. 正确","analysis":"素材明确指出：加州理工学院Pauling实验室虽为结构化学权威，但认为基因本质是蛋白质、DNA是有机大分子，且不了解Chargaff碱基配对原则，因而提出错误的DNA三螺旋结构。","pages":[29]},{"id":"L1-E12","type":"判断题","stem":"CRISPR/Cas9来自微生物的免疫系统，其编辑效率高于TALEN，且不存在脱靶效应。","options":["A. 正确","B. 错误"],"answer":"B. 错误","analysis":"CRISPR来自微生物免疫系统、效率比TALEN更高，但在人类癌细胞系中可能产生大量“误伤目标”（脱靶效应 off-target effect），尤其对不希望改变的基因做修改时风险更大。","pages":[78]},{"id":"L1-E13","type":"名词解释","stem":"半保留复制（semi-conservative replication）","options":[],"answer":"DNA复制时双链解开，每条亲代链作为模板合成一条新链，形成的两个子代DNA分子各含一条亲代链和一条新链。由Meselson和Stahl于1958年证明。第一代子代DNA全部为杂合双链，第二代中一半为杂合双链、一半为全新链组成的双链。","analysis":"答题须包含“双链解开—亲代链作模板—子代各含一亲代链一新生链”三要素，并写出证明者与年份。","pages":[35]},{"id":"L1-E14","type":"名词解释","stem":"断裂基因（split gene）","options":[],"answer":"由外显子（exon）与内含子（intron）交替组成、转录后需经剪接去除内含子的基因。转录产生初级转录本（primary transcript），经剪接（splicing）切除内含子、连接外显子形成成熟转录本（mature transcript）。由Roberts和Sharp发现，获1993年诺贝尔奖。","analysis":"须写出外显子/内含子定义、初级转录本→剪接→成熟转录本的过程及发现者。","pages":[47]},{"id":"L1-E15","type":"简答题","stem":"简述Griffith（1928）与Avery（1944）肺炎双球菌转化实验的设计、结果与结论，并说明Avery实验相对于Griffith实验的推进之处。","options":[],"answer":"（1）Griffith实验四组：注射活S型菌→小鼠死亡（S型有致病力）；注射活R型菌→小鼠存活（R型无致病力）；注射加热杀死的S型菌→小鼠存活（丧失致病能力）；混合注射加热杀死S型菌与活R型菌→小鼠死亡，并回收得到活的致病性S型菌。结论：加热杀死的S型菌中存在某种“转化因子（transforming principle）”，能把无致病力的R型菌转化为有致病力的S型菌，且该性状可遗传；但Griffith不知转化因子的化学本质。（2）Avery实验：从S型菌制备无细胞提取物，分级分离为RNA、蛋白质、DNA、脂质、碳水化合物五类，分别测试对R型菌的转化能力；结果只有DNA组分使R型菌转化为S型菌，其余组分仍为R型菌。结论：携带可遗传信息的分子是DNA，DNA就是转化源。（3）推进之处：Griffith只证明“存在转化因子”，Avery通过分级分离纯化各组分，证明转化因子的化学本质是DNA，从而提出DNA是遗传信息的载体。","analysis":"评分点：四组实验的分组—结果—结论；Avery五类分子与唯一阳性组分；两者结论差异的表述。","pages":[17,19,20]},{"id":"L1-E16","type":"简答题","stem":"简述中心法则的提出及其三次版本演变（1954年版、1970—1980年版、21世纪修正版），并说明各版本新增内容所对应的发现。","options":[],"answer":"（1）1954年版（Crick提出）：DNA可自我复制；DNA转录为RNA；RNA翻译为蛋白质；蛋白质执行生理功能，即DNA→RNA→蛋白质的线性信息流。（2）1970—1980年版：在1954年版基础上增加RNA→DNA的逆转录（reverse transcription）箭头，对应1975年诺贝尔奖所表彰的在RNA肿瘤病毒中发现逆转录酶（reverse transcriptase）。（3）21世纪修正版：增加tRNA和rRNA、小RNA（microRNAs）、非编码RNA（Non-coding RNAs）等分支，并保留RNA→DNA的反馈，反映非编码RNA调控等发现（如miRNA介导的转录后基因调控）。（4）意义：中心法则由线性模型逐步扩展为包含逆转录、RNA复制与非编码RNA调控的复杂网络。","analysis":"评分点：三版本的箭头组成、逆转录酶的发现、非编码RNA分支、演变意义。","pages":[34,40,82]},{"id":"L1-E17","type":"简答题","stem":"简述真核细胞基因表达可在哪些层次被调控，并说明各层次的调控对象。","options":[],"answer":"共六个层次：（1）转录调控（transcriptional control）：在DNA→RNA转录本步骤，主要调控点，作用对象为DNA/转录起始；（2）RNA加工调控（RNA processing control）：作用于初级转录本→成熟mRNA（如剪接、加帽加尾）；（3）RNA转运与定位调控（RNA transport and localization control）：成熟mRNA出核及在胞质中的定位；（4）mRNA降解调控（mRNA degradation control）：mRNA稳定性与寿命；（5）翻译调控（translation control）：mRNA在核糖体上的翻译效率；（6）蛋白质活性调控（protein activity control）：蛋白质修饰、折叠、定位及活性状态。其中转录与加工在核内进行，其余主要在胞质。","analysis":"评分点：六层次名称齐全、顺序正确、核内/胞质分区；常与第9页五层次表述对照。","pages":[9,95]},{"id":"L1-E18","type":"计算题","stem":"已知DNA双螺旋直径2.0 nm、每个碱基对沿轴上升0.34 nm；人中等大小染色体长约5 μm、宽约1 μm。请计算：（1）一个含1000个碱基对的B型DNA双螺旋的长度；（2）若人单倍体基因组约3×10⁹ bp，其DNA拉直后的总长度（以米表示）；（3）该DNA长度与一条5 μm长染色体长度之比（即该染色体DNA的压缩程度，按数量级表示）。","options":[],"answer":"（1）1000 bp × 0.34 nm/bp = 340 nm = 0.34 μm。（2）3×10⁹ bp × 0.34 nm/bp = 1.02×10⁹ nm = 1.02×10³ μm = 1.02×10⁻³ m ≈ 1 m（约1米）。（3）1.02×10⁻³ m ÷（5×10⁻⁶ m）= 约2×10²，即约200倍；若按整条染色体DNA与染色体长度比较，压缩程度约为10²数量级（约200倍）。","analysis":"考查0.34 nm/bp这一基本参数与单位换算（1 μm=10³ nm，1 m=10⁶ μm）。注意：实际中期染色体压缩比远高于此，因为此处仅以5 μm染色体长度作粗略比较；答题须写出单位换算过程。","pages":[90]},{"id":"L1-E19","type":"实验设计题","stem":"某研究者欲利用pBR322质粒（含ampR、tetR抗性基因与ori）将一段外源DNA片段克隆入大肠杆菌，并筛选出含重组质粒的转化子。请设计完整实验方案，说明各步骤原理，并解释为何要在含Tet平板与含Amp+Tet平板上进行对比筛选。","options":[],"answer":"（1）酶切：用限制性内切酶切割pBR322质粒与外源DNA，选用位于tetR基因内的限制酶位点，使外源片段插入后tetR失活（插入失活）。（2）连接：用DNA连接酶将外源DNA与质粒共价连接，形成重组质粒。（3）转化：将连接产物转化大肠杆菌（宿主细胞）。（4）初筛：涂布含Tet培养基，所有带质粒（含空载体与重组质粒）的菌落均可生长，不带质粒者被淘汰。（5）对比筛选：将Tet平板上的菌落影印转移到含Amp+Tet培养基。空载体质粒ampR与tetR均完好，在Amp+Tet上能生长；重组质粒因外源片段插入tetR使其失活，在Amp+Tet上不能生长。故“在Tet上能生长、在Amp+Tet上不能生长”的菌落即为含重组质粒的转化子。（6）验证：提取质粒酶切鉴定或测序确认插入片段。","analysis":"评分点：限制酶位点选择（tetR内）、连接、转化、Tet初筛、Amp+Tet对比筛选的插入失活逻辑、验证步骤。易错：若插入位点在ampR内则筛选逻辑相反。","pages":[92,93]},{"id":"L1-E20","type":"分析题","stem":"2019年诺贝尔生理学或医学奖揭示了细胞感知氧气的机制。请根据HIF-1α氧感知通路，分析常氧与低氧条件下HIF-1α的命运差异及其对下游基因转录的影响，并说明该机制为何使HIF-1α成为肿瘤治疗的潜在靶点。","options":[],"answer":"（1）常氧（Normoxia）：HIF-1α发生脯氨酰羟化（prolyl hydroxylation），被加上OH修饰；羟化后的HIF-1α被VHL识别并结合，经蛋白酶体降解（proteasomal degradation），细胞内HIF-1α水平低。（2）低氧（Hypoxia）：脯氨酰羟化依赖氧，低氧时HIF-1α不被羟化、不被VHL识别降解，得以积累并进入细胞核；与ARNT结合形成复合物，结合到低氧应答元件HRE（hypoxia response element）上，激活下游靶基因转录。（3）意义：肿瘤内部常处于低氧微环境，HIF-1α积累可激活促血管生成、代谢重编程等靶基因，有利于肿瘤生长，故HIF-1α及其羟化/VHL通路是潜在治疗靶点。","analysis":"评分点：常氧“羟化—VHL识别—蛋白酶体降解”与低氧“稳定—入核—ARNT—HRE—激活转录”两条路径的完整表述；脯氨酰羟化的氧依赖性；肿瘤低氧微环境的推论。","pages":[74]}]},{"lecture":2,"title":"染色体与DNA：从化学组成到高级结构","source_file":"2026_autumn-molecular_biology-02.pdf","pages":105,"overview":"本章围绕“遗传物质是什么、如何组织、如何维持稳定”展开。首先以核酸为遗传物质的证据引入，逐级解析核苷酸—多核苷酸链—DNA双螺旋—染色质—染色体的层级组装；重点讨论真核染色质的核小体结构、组蛋白与非组蛋白的组成与修饰，以及这些修饰如何构成表观遗传信息并调控基因表达；随后比较原核与真核基因组的结构特点（重复序列、基因密度、断裂基因、多顺反子/单顺反子、重叠基因等）；最后介绍DNA的一级、二级、三级结构参数（A/B/Z型、超螺旋、三链与G-四链体）及DNA变复性。本章是后续DNA复制、转录与损伤修复章节的物质基础。","outline":[{"section":"1","title":"遗传物质的本质与核酸组成","points":["DNA是细菌、病毒与动物细胞的遗传物质，某些病毒以RNA为遗传物质","核苷酸由磷酸、戊糖与含氮碱基三部分组成","核苷=碱基+糖；核苷酸=核苷+5′磷酸","核苷酸经3′-5′磷酸二酯键聚合为具5′→3′方向性的多核苷酸链"]},{"section":"2","title":"染色体与染色质","points":["染色体是遗传物质的主要载体；染色质一词由Flemming于1882年提出","原核细胞一般1个环状双链DNA染色体，位于拟核；真核DNA主要在核内，线粒体与叶绿体亦有DNA","染色体由DNA、组蛋白、非组蛋白及少量RNA组成","核小体是染色质基本结构单位：约200 bp DNA+组蛋白八聚体"]},{"section":"3","title":"组蛋白与非组蛋白","points":["组蛋白H1、H2A、H2B、H3、H4；H1为接头组蛋白，其余为核心组蛋白","组蛋白特性：极端保守、无组织特异性、N端碱性C端疏水、普遍修饰","核心组蛋白共享组蛋白折叠（3个α螺旋+2个环），N端尾部为修饰位点","非组蛋白为酸性蛋白，种类多，参与复制转录调控与结构支持"]},{"section":"4","title":"组蛋白修饰与表观遗传","points":["乙酰化由HAT催化、HDAC去除，与染色质开放和转录激活相关","甲基化由HMT/KMT催化、KDM/LSD1去除，与激活或沉默均相关","磷酸化、泛素化、ADP-核糖基化等共同构成组蛋白密码","表观遗传学由Waddington于1942年提出：相同基因型产生不同表型"]},{"section":"5","title":"染色质高级结构与DNA包装","points":["H1结合连接DNA使核小体收紧为10 nm纤维","核小体阵列形成30 nm纤维（螺线管模型/锯齿模型），每圈约6个核小体","30 nm纤维成环锚定于染色体骨架，进一步压缩","四级包装累计宽度增加500—1000倍，长度压缩8400倍"]},{"section":"6","title":"原核与真核基因组特点","points":["真核基因组庞大、>90%非编码、大量重复序列、单顺反子、断裂基因、端粒","原核基因组小、以单拷贝基因主、几乎全为功能基因与调控序列、多顺反子、可有重叠基因","基因密度从原核约860—1060 genes/Mb降至人类9.3 genes/Mb"]},{"section":"7","title":"DNA的结构层次","points":["一级结构：4种核苷酸的连接与排列顺序","二级结构：反向平行双螺旋；B型每圈10.4 bp、螺距34 Å、直径20 Å","A型右手粗短、B型右手适中、Z型左手细长","三级结构：超螺旋；细胞内DNA为负超螺旋，核小体引入负超螺旋","特殊结构：三链DNA（H-DNA）与G-四链体"]}],"concepts":[{"id":"L2-C01","cn":"核酸","en":"nucleic acid","abbr":"","definition":"由核苷酸聚合而成的生物大分子，包括DNA与RNA，是遗传信息的载体。","detail":"DNA是细菌、病毒与动物细胞的遗传物质；某些病毒的遗传物质是RNA。","note":"并非所有病毒都以DNA为遗传物质。","pages":[3]},{"id":"L2-C02","cn":"核苷酸","en":"nucleotide","abbr":"","definition":"由磷酸基团、五碳糖（核糖或脱氧核糖）和含氮碱基共价连接而成的基本结构单位。","detail":"磷酸与戊糖5′-碳以磷酸酯键相连；戊糖1′-碳与碱基氮原子以糖苷键相连。","note":"三部分缺一不可；核苷酸=核苷+5′磷酸。","pages":[4,84]},{"id":"L2-C03","cn":"核苷","en":"nucleoside","abbr":"","definition":"碱基与糖（核糖或脱氧核糖）通过糖苷键结合形成的化合物。","detail":"核苷再加一个磷酸基团即为核苷酸。","note":"命名上“苷”对应核苷，“酸”对应核苷酸。","pages":[5,84]},{"id":"L2-C04","cn":"嘌呤","en":"purine","abbr":"","definition":"双环含氮碱基，包括腺嘌呤（A）和鸟嘌呤（G）。","detail":"嘌呤环编号1N—9。","note":"与单环的嘧啶相区分。","pages":[5]},{"id":"L2-C05","cn":"嘧啶","en":"pyrimidine","abbr":"","definition":"单环含氮碱基，包括胞嘧啶（C）、胸腺嘧啶（T）和尿嘧啶（U）。","detail":"嘧啶环编号1—6。","note":"T只出现在DNA，U只出现在RNA。","pages":[5]},{"id":"L2-C06","cn":"磷酸二酯键","en":"phosphodiester bond","abbr":"","definition":"一个脱氧核苷酸戊糖的3′-OH与下一个脱氧核苷酸5′-磷酸基团脱水缩合形成的共价键，是连接DNA链中相邻核苷酸的键。","detail":"写作3′-5′磷酸二酯键；链延伸时新核苷酸以5′-NTP形式进入，其5′-α-磷酸受链末端3′-OH亲核进攻，释放焦磷酸。","note":"书写方向（3′-5′）与链方向（5′→3′）不同，勿混淆。","pages":[82,86]},{"id":"L2-C07","cn":"DNA一级结构","en":"primary structure of DNA","abbr":"","definition":"指4种核苷酸的连接方式及其排列顺序，表示该DNA分子的化学构成。","detail":"有三种表示法：结构式、线条式、字母式（如5′ ACTGCATAGCTCGA 3′，必须标明5′与3′端）。","note":"字母式只保留碱基序列，不标方向则序列无意义。","pages":[81,82,83]},{"id":"L2-C08","cn":"DNA二级结构","en":"secondary structure of DNA","abbr":"","definition":"两条多核苷酸链反向平行盘绕所生成的双螺旋结构。","detail":"B-DNA：直径约20 Å，碱基上升距离3.4 Å，每圈10.4 bp，螺距34 Å；表面有大沟与小沟。","note":"两条链空间上平行排列但化学方向相反（反向平行）。","pages":[81,87,90,91]},{"id":"L2-C09","cn":"DNA双螺旋结构","en":"DNA double helix","abbr":"","definition":"两条多核苷酸链反向平行盘绕形成的规则螺旋结构，由Watson和Crick于1953年提出。","detail":"三条实验依据：X-光衍射表明为规则螺旋；密度测量说明有两条链；Chargaff规则G=C、A=T。","note":"糖-磷酸骨架在外侧，碱基在内侧以氢键配对。","pages":[88,90]},{"id":"L2-C10","cn":"查加夫规则","en":"Chargaff's Rules","abbr":"","definition":"双链DNA中A的摩尔数等于T、G的摩尔数等于C，即A=T、G=C，由此嘌呤总数等于嘧啶总数。","detail":"不同物种A/G与T/C比值变化大（0.4—1.92），但A/T与G/C恒约1.0；数据来源Chargaff E. et al. 1949 J. Biol. Chem. 177:405。","note":"该规则只说明等量关系，不涉及碱基序列。","pages":[89]},{"id":"L2-C11","cn":"反向平行","en":"antiparallel","abbr":"","definition":"DNA两条链走向相反，一条为5′→3′，另一条为3′→5′，共同盘绕成双螺旋。","detail":"第90页文字表述为“互相平行的脱氧核苷酸长链盘绕”，指空间排列平行而化学方向相反。","note":"“平行”与“反向平行”不矛盾，前者指空间，后者指极性。","pages":[90,91]},{"id":"L2-C12","cn":"B型DNA","en":"B-DNA","abbr":"","definition":"最常见的DNA构象，右手螺旋，主要见于A-T丰富的DNA片段。","detail":"直径2.37 nm，碱基间距0.34 nm，每圈10个碱基，碱基倾角0°，大沟很宽较深、小沟窄深。","note":"生理条件下的典型构象。","pages":[92,93]},{"id":"L2-C13","cn":"A型DNA","en":"A-DNA","abbr":"","definition":"右手螺旋DNA构象，对基因表达有重要意义，存在于DNA-RNA杂交双链（转录状态的DNA）及RNA-RNA双链中。","detail":"粗短；直径2.55 nm，碱基间距0.23 nm，每圈11个碱基，碱基倾角20°，大沟很窄很深、小沟很宽浅。","note":"A型并非只见于DNA，RNA双链区也取A型。","pages":[92,93]},{"id":"L2-C14","cn":"Z型DNA","en":"Z-DNA","abbr":"","definition":"左手螺旋DNA构象，1979年由Rich提出，是右手螺旋结构模型的补充和发展。","detail":"细长；直径1.84 nm，碱基间距0.38 nm，每圈12个碱基，碱基倾角7°，大沟平坦、小沟较窄很深。","note":"A-DNA与Z-DNA可能具有不同的生物活性。","pages":[92,94]},{"id":"L2-C15","cn":"超螺旋结构","en":"supercoil / supercoiled structure","abbr":"","definition":"DNA双螺旋进一步扭曲盘绕形成的高级结构，分为正超螺旋与负超螺旋两大类，特殊情况下可相互转变。","detail":"双螺旋DNA松开导致负超螺旋，拧紧导致正超螺旋；细胞内DNA为负超螺旋；核小体引入负超螺旋；拓扑异构酶可使超螺旋松弛。","note":"溴乙锭也可使负超螺旋经松弛DNA转为正超螺旋。","pages":[95,96]},{"id":"L2-C16","cn":"拓扑异构酶","en":"topoisomerase","abbr":"","definition":"能够改变DNA拓扑状态（超螺旋程度）的酶，可使超螺旋DNA松弛。","detail":"本讲只讲其松弛超螺旋的功能，未区分I型与II型。","note":"与解链酶功能不同。","pages":[95,96]},{"id":"L2-C17","cn":"共价闭合超螺旋DNA","en":"covalently closed circular supercoiled DNA","abbr":"cccDNA","definition":"两条链均完整闭合、且以负超螺旋形式缠绕的环状DNA分子。","detail":"天然细菌质粒DNA的主要存在形式；超螺旋使分子更紧凑。","note":"一条链出现缺口即转为开环DNA。","pages":[97]},{"id":"L2-C18","cn":"开环DNA","en":"open circular DNA","abbr":"ocDNA","definition":"双链环状DNA中一条链出现缺口后，超螺旋张力释放而形成的松弛环状结构。","detail":"只需一条链断裂即可形成。","note":"电泳迁移率最慢。","pages":[97,98]},{"id":"L2-C19","cn":"三链DNA","en":"triple-stranded DNA / triplex DNA","abbr":"H-DNA","definition":"在特定条件下形成的DNA特异性结构，由第三条寡核苷酸链通过Hoogsteen氢键结合于双螺旋大沟中形成。","detail":"富含嘧啶的ODN与富含嘌呤链平行结合形成Hoogsteen键；富含嘌呤的ODN以反向平行方式形成反Hoogsteen键；三联体中同时含一个Hoogsteen对和一个Watson-Crick对（如T=A=T、C=G=C）。","note":"不是DNA在自然状态下的主要结构。","pages":[100]},{"id":"L2-C20","cn":"G-四链体","en":"G-quadruplex","abbr":"G4","definition":"富含鸟嘌呤的DNA区域中，通过四个鸟嘌呤间的环状Hoogsteen氢键层层堆积形成的含四条螺旋链的高级结构。","detail":"中心配位K+离子；人体癌症细胞中存在四螺旋体DNA分子；2013年Nature Chemistry与2020年Nature Chemistry文献实现人细胞及活细胞中的定量与单分子可视化。","note":"与三链DNA同属非Watson-Crick配对的特殊结构。","pages":[100,104]},{"id":"L2-C21","cn":"Hoogsteen碱基对","en":"Hoogsteen base pair","abbr":"","definition":"嘌呤碱基旋转为syn构象后，通过不同于Watson-Crick面的氢键供体/受体与嘧啶配对的碱基对形式。","detail":"DNA可通过碱基翻转形成Hoogsteen碱基对以容纳化学修饰损伤；RNA中该配对内在不稳定。","note":"m1A/m1G修饰会破坏Watson-Crick配对面，需借助Hoogsteen配对缓冲。","pages":[99]},{"id":"L2-C22","cn":"Tm值（解链温度/熔点）","en":"melting temperature","abbr":"Tm","definition":"DNA在260 nm吸光度增加到最大值一半时的温度，称为DNA的解链温度或熔点。","detail":"影响因素：G+C含量、溶液离子强度、DNA均一性。","note":"是“增加到最大值一半”，不是开始变性的温度。","pages":[54]},{"id":"L2-C23","cn":"染色体","en":"chromosome","abbr":"","definition":"由DNA与组蛋白等蛋白质组成的、承载遗传信息的核蛋白复合体结构，是遗传物质的主要载体。","detail":"亲代通过染色体将遗传物质传给子代，保持物种稳定性与连续性；真核染色体仅在细胞分裂期可在光镜下观察到。","note":"与染色质是同一物质在不同细胞周期的形态。","pages":[2,8,9,14]},{"id":"L2-C24","cn":"染色质","en":"chromatin","abbr":"","definition":"真核细胞间期核内由DNA、组蛋白及非组蛋白组成的复合物，基本重复单位为核小体。","detail":"1882年由Walther Flemming首次使用该术语；Alfred Mirsky是首个分离染色质的人；含RNA不到DNA的10%，多为未完成转录仍与模板相连的RNA。","note":"染色体中的RNA不是结构组分。","pages":[8,9,16,33]},{"id":"L2-C25","cn":"核小体","en":"nucleosome","abbr":"","definition":"染色质的基本结构单位，由约200 bp DNA与组蛋白八聚体组成。","detail":"层级：146 bp DNA+组蛋白八聚体→核小体核心；核心+H1→染色小体（166 bp）；再加连接DNA→核小体（约200 bp）。","note":"核小体（约200 bp）≠核小体核心（146 bp）。","pages":[17,53,57,101]},{"id":"L2-C26","cn":"核小体核心","en":"nucleosome core","abbr":"","definition":"146 bp DNA缠绕在组蛋白八聚体上形成的颗粒结构，不含连接DNA与H1。","detail":"晶体结构（Luger and Richmond, Nature 1997, 389:251-260，2.8 Å，重组非洲爪蟾组蛋白）显示DNA以左手超螺旋盘绕约1.65圈，对应147 bp；颗粒直径约11 nm、高约6 nm。","note":"146 bp（生化定义）与147 bp（结构可见）数字差异来自末端碱基对可见性。","pages":[57,59,60,61]},{"id":"L2-C27","cn":"染色小体","en":"chromatosome","abbr":"","definition":"核小体核心加上H1后形成的结构，含166 bp DNA。","detail":"166 bp = 146 bp核心DNA + 约20 bp受H1保护的连接DNA。","note":"介于核小体核心与完整核小体之间。","pages":[57,61]},{"id":"L2-C28","cn":"连接DNA","en":"linker DNA","abbr":"","definition":"相邻核小体核心之间未被核心八聚体缠绕的DNA片段，是H1的结合部位。","detail":"长度因物种而异：酵母13—18 bp、果蝇约33 bp、人38—53 bp、海胆精子约110 bp；图中标注20—60 bp。","note":"核小体重复长度=146 bp核心+连接DNA长度。","pages":[57,58,65]},{"id":"L2-C29","cn":"核小体重复长度","en":"Nucleosome Repeat Length","abbr":"NRL","definition":"相邻两个核小体核心之间重复出现的DNA长度，等于146 bp核心DNA加连接DNA长度。","detail":"酵母160—165 bp、果蝇约180 bp、人185—200 bp、海胆精子约260 bp；常用微球菌核酸酶消化后电泳测得。","note":"不同物种差异主要来自连接DNA长度。","pages":[58]},{"id":"L2-C30","cn":"组蛋白","en":"histone","abbr":"","definition":"真核生物中保守的DNA结合蛋白，形成核小体，即染色质的基本结构单位。","detail":"有H1、H2A、H2B、H3、H4五种；H1分子量21,130 Da、223个残基、Lys 29.5%、Arg 1.3%；H4最小（11,236 Da、102残基）；H3、H4的Arg含量最高（13.3%、13.7%）。H1、H2A、H2B分子量随物种而异，表中除H1来自兔外其余为牛组蛋白。","note":"第18页与第19页分子量数值略有差异，来源不同，各页原值为准。","pages":[17,18,19]},{"id":"L2-C31","cn":"组蛋白八聚体","en":"histone octamer","abbr":"","definition":"由H2A、H2B、H3、H4四种核心组蛋白各两个分子组成的八聚体，是DNA缠绕的核心。","detail":"(H3-H4)₂四聚体位于中心，两侧各结合一个H2A-H2B二聚体；蛋白总质量108 kD（H2A×2 28 kD、H2B×2 28 kD、H3×2 30 kD、H4×2 22 kD）；200 bp DNA约130 kD、长67 nm。","note":"H1不属于核心八聚体，分子量24 kD。","pages":[15,60,61]},{"id":"L2-C32","cn":"接头组蛋白H1","en":"linker histone H1","abbr":"","definition":"结合在核小体核心颗粒外侧、DNA进出位点处连接DNA上的组蛋白，分子量24 kD，不属于核心八聚体。","detail":"相对分子质量21 000、223个氨基酸、最易分离、不保守，染色质中比例0.5；结合后形成染色小体（166 bp），使DNA更紧密缠绕。","note":"H1作用位点是连接DNA而非核心缠绕DNA。","pages":[19,61,65,66]},{"id":"L2-C33","cn":"核心组蛋白","en":"core histone","abbr":"","definition":"H2A、H2B、H3、H4四种组成核小体核心的组蛋白。","detail":"染色质中比例各为1，位于核心；H3、H4最难分离且最保守，H2A、H2B较保守、较难分离。","note":"保守性排序：H3、H4 > H2A、H2B > H1。","pages":[19]},{"id":"L2-C34","cn":"组蛋白折叠","en":"histone fold","abbr":"","definition":"核心组蛋白共有的结构折叠模式，由3个α螺旋和2个环组成。","detail":"位于肽链中部，N端为其前的尾部，C端亦延伸出折叠区之外；四种核心组蛋白共享该折叠。","note":"组蛋白尾部从核小体核心特定位置伸出，如螺丝沟槽引导DNA左手缠绕。","pages":[21]},{"id":"L2-C35","cn":"组蛋白尾巴","en":"histone tail","abbr":"","definition":"核心组蛋白N端（及部分C端）伸出核小体核心之外的肽段，是化学修饰的主要部位。","detail":"H3、H4的N端尾部较短，H2A、H2B较长；尾部伸出方向各异，便于修饰酶接近。","note":"与“N-terminal tail”为同一概念。","pages":[21,22]},{"id":"L2-C36","cn":"组蛋白修饰","en":"histone modification","abbr":"","definition":"组蛋白（主要在其N端尾部）氨基酸残基上发生的共价化学修饰，包括甲基化、乙酰化、磷酸化、泛素化等。","detail":"修饰位点主要集中于N端尾部：H3的T3、K4、K9、S10、T11、K14、R17、K18、K23、K27、S28、K36及K79；H4的S1、R3、K5、K8、K12、K16、K20、K59；H2A的S1、K4、K5；H2B的K5、K12、S14、K15。其它修饰还有ADP-核糖基化、巴豆酰化、乳酰化。","note":"DNA甲基化修饰碱基，组蛋白修饰修饰蛋白，二者不同。","pages":[20,23,24]},{"id":"L2-C37","cn":"组蛋白密码","en":"Histone code","abbr":"","definition":"多种组蛋白修饰方式组合形成的、可被专一识别的修饰信息，能更灵活地影响染色质的结构与功能。","detail":"各种修饰之间存在相互关联（cross-talk）；如H3K9甲基化→异染色质形成与基因沉默，H3K4甲基化+H3K9乙酰化→基因表达，H3S10磷酸化+H3K14乙酰化→基因表达。","note":"单一修饰本身不构成密码，强调组合与专一识别。","pages":[43,45]},{"id":"L2-C38","cn":"表观遗传学","en":"Epigenetics","abbr":"","definition":"研究在不改变DNA序列（基因型）的前提下产生可遗传的表型变化的学科。","detail":"1942年由Conrad Hal Waddington提出；核心命题“Same genotype producing different phenotype”；Waddington地形图以球滚落山谷示意发育命运选择。","note":"表型变化可遗传但不涉及序列改变。","pages":[25]},{"id":"L2-C39","cn":"表观遗传信息","en":"epigenetic information","abbr":"","definition":"由组蛋白尾部多种共价修饰组合所携带的、不改变DNA序列而影响染色质功能的信息。","detail":"决定基因怎样表达，也决定表达方式如何在细胞世代间保持；在肿瘤、免疫、心血管疾病中意义深远。","note":"四种核心组蛋白尾部携带巨大的表观遗传信息量。","pages":[24,47]},{"id":"L2-C40","cn":"组蛋白乙酰化","en":"histone acetylation","abbr":"","definition":"在组蛋白赖氨酸残基ε-氨基上添加乙酰基的共价修饰，由HAT催化、HDAC去除，可逆且高度调控。","detail":"Allfrey于1964年提出其通过调节DNA可及性控制基因表达；高乙酰化对应转录活化，低乙酰化对应转录抑制；H2B和H4的乙酰化对三级染色质结构形成影响最大。","note":"IUPAC名为ethanoylation。","pages":[33,34,35,36]},{"id":"L2-C41","cn":"组蛋白乙酰基转移酶","en":"histone acetyltransferase","abbr":"HAT","definition":"催化组蛋白特定赖氨酸残基乙酰化的酶。","detail":"以乙酰-CoA为乙酰基供体；分Type A（核内：p300/CBP、GNAT、MYST、Basal TF、NRCF）与Type B（胞质：HAT1、HAT2、HAT4、HatB3.1、Rtt109）；首个被鉴定的HAT为C. David Allis从200 L四膜虫培养物中纯化的P55，关联转录共激活因子GCN5。","note":"HAT与HDAC共同维持乙酰化动态平衡。","pages":[35,37,38,39]},{"id":"L2-C42","cn":"组蛋白去乙酰化酶","en":"Histone Deacetylase","abbr":"HDAC","definition":"催化组蛋白赖氨酸残基上乙酰基去除的酶，使组蛋白带正电、与DNA结合更紧密，通常与转录抑制相关。","detail":"分四类：Class I（HDAC1、2、3、8）、Class II（IIa：HDAC4、5、7、9；IIb：HDAC6、10）、Class III（SIRT1—7）、Class IV（HDAC11）；Class I/II/IV为锌依赖型，Class III为NAD+依赖型；非组蛋白底物包括α-tubulin与p53；抑制剂如vorinostat、entinostat。","note":"Class III与细胞代谢状态（NAD+水平）偶联。","pages":[35,37,41]},{"id":"L2-C43","cn":"组蛋白甲基化","en":"histone methylation","abbr":"","definition":"由组蛋白甲基转移酶催化、发生在赖氨酸和精氨酸残基上的甲基化修饰。","detail":"赖氨酸可单、双、三甲基化（Me1/Me2/Me3），精氨酸可单、双甲基化；既与基因激活也与基因沉默相关；是最稳定的一种组蛋白修饰方式；关键位点H3K4、H3K9、H3K27、H3K36、H3K79、H4K20及H3R2、H3R8、H3R17、H3R26、H4R3。","note":"ADMA由I型PRMTs催化（两个甲基在同一氮原子），SDMA由II型PRMTs催化（分居两个氮原子）。","pages":[27,28,29]},{"id":"L2-C44","cn":"赖氨酸甲基转移酶","en":"lysine methyltransferases","abbr":"KMTs","definition":"催化赖氨酸残基甲基化的酶类。","detail":"分两个家族：DOT1样（DOT1L）家族和含SET结构域的赖氨酸甲基转移酶家族。","note":"去甲基化酶KDMs有LSD1和Jumonji C两个主要家族。","pages":[30]},{"id":"L2-C45","cn":"DNA甲基化","en":"DNA methylation","abbr":"","definition":"DNA甲基转移酶以S-腺苷甲硫氨酸为甲基供体，将甲基加到胞嘧啶第5位碳原子上生成5-甲基胞嘧啶的过程。","detail":"主要发生在GC富集序列即CpG岛；非CpG环境（CpH，H=A、T、C）甲基化在植物中普遍、在哺乳动物罕见；通常导致基因转录抑制；启动子区高甲基化致抑癌基因失活是肿瘤共同特征；5-氮胞苷（5位碳被氮取代）可抑制DNMT。","note":"DNA甲基化修饰碱基，与组蛋白甲基化不同。","pages":[31,32]},{"id":"L2-C46","cn":"非组蛋白","en":"Non-histone protein","abbr":"","definition":"细胞核中组蛋白以外的酸性蛋白质。","detail":"约为组蛋白总量的60%—70%，可能有20—100种（常见15—20种）；含天门冬氨酸、谷氨酸，带负电，含色氨酸；功能包括作为酶（RNA合成酶、蛋白质磷酸化酶、组蛋白甲基化酶）、参与遗传信息保持与表达调节（HMG14、HMG17等）、作为染色体结构支持体（基质蛋白、支架蛋白）。","note":"与碱性、带正电、保守的组蛋白相对。","pages":[48,49]},{"id":"L2-C47","cn":"HMG蛋白","en":"High mobility group protein","abbr":"HMG","definition":"高迁移率族蛋白，能与DNA结合但不牢固，也能与H1组蛋白作用，可能与DNA超螺旋结构有关。","detail":"HMG14、HMG17属非组蛋白中的酸性染色体蛋白，参与染色质结构与基因表达调节。","note":"与牢固结合的组蛋白不同。","pages":[49,50]},{"id":"L2-C48","cn":"单链DNA结合蛋白","en":"single-stranded DNA-binding protein","abbr":"SSB","definition":"一类与单链DNA亲和力极大的DNA结合蛋白，又称螺旋失稳蛋白、DNA解链蛋白。","detail":"发现于E. coli，由相同亚基组成的四聚体；与双链DNA结合力较差；相对分子量较低，占非组蛋白20%、染色质8%；参与复制、转录、修复和重组。","note":"与HMG蛋白性质不同。","pages":[50]},{"id":"L2-C49","cn":"基因组","en":"genome","abbr":"","definition":"由生物体内所有的染色体组成的全部遗传物质，通常以单倍体染色体组的DNA含量计量。","detail":"三个基本参数：基因组大小（Mb）、基因数目、基因密度（genes/Mb）。","note":"基因组大小与基因数不平行。","pages":[11]},{"id":"L2-C50","cn":"基因密度","en":"gene density","abbr":"","definition":"每兆碱基对基因组DNA平均所含基因数，单位genes/Mb。","detail":"细菌约860—1060；酵母410—480；线虫200；果蝇80；拟南芥200；人类9.3；小鼠12；玉米>20。","note":"基因组增大主要靠非编码序列扩张，故密度下降。","pages":[11,13]},{"id":"L2-C51","cn":"卫星DNA","en":"satellite DNA","abbr":"","definition":"高度重复序列，碱基组成简单（6—100），重复次数达数百万次，占DNA总量10%—60%。","detail":"真核DNA按重复程度分三类：不重复序列（重复1~几个，编码结构基因，占10%—80%）、中度重复序列（10¹—10⁴次，编码rRNA、tRNA、组蛋白基因，占10%—40%）、高度重复序列。","note":"中度重复序列的碱基组成栏在表中为空。","pages":[52]},{"id":"L2-C52","cn":"断裂基因","en":"split gene","abbr":"","definition":"编码序列被非编码的内含子隔断的基因结构。","detail":"外显子被内含子分隔，是真核基因组特点之一。","note":"原核基因几乎与蛋白质序列线性对应。","pages":[73]},{"id":"L2-C53","cn":"顺式作用元件","en":"cis-acting element","abbr":"","definition":"位于基因旁侧、调控该基因转录的DNA序列。","detail":"包括启动子、增强子、沉默子三类。","note":"与反式作用因子（蛋白）相对。","pages":[73]},{"id":"L2-C54","cn":"端粒","en":"telomere","abbr":"","definition":"真核线性染色体末端的特殊结构。","detail":"功能：保护线性DNA的完整复制、保护染色体末端、决定细胞的寿命。","note":"原核环状染色体无端粒。","pages":[73]},{"id":"L2-C55","cn":"转录单元","en":"transcription unit","abbr":"","definition":"原核生物DNA序列中功能相关的RNA和蛋白质基因丛集在基因组的一个或几个特定部位所形成的、被一起转录的DNA区段。","detail":"转录产生含多个mRNA的分子，即多顺反子mRNA。","note":"真核转录产物为单顺反子。","pages":[78]},{"id":"L2-C56","cn":"多顺反子mRNA","en":"polycistronic mRNA","abbr":"","definition":"一个mRNA分子上携带多个基因（顺反子）编码信息的转录产物。","detail":"与原核转录单元相对应。","note":"真核为单顺反子mRNA。","pages":[73,78]},{"id":"L2-C57","cn":"重叠基因","en":"overlapping gene","abbr":"","definition":"同一段DNA序列携带两种不同蛋白质编码信息的基因组织形式。","detail":"1977年Sanger在ΦX174中发现；重叠方式三种：一个基因完全在另一个基因里面、部分重叠、两个基因只有一个碱基对重叠；ΦX174感染后合成9个蛋白质（分子量约2.5×10⁵，对应6,078个核苷酸），而病毒DNA仅5,375个核苷酸。","note":"存在于一些细菌和动物病毒中。","pages":[79,80]},{"id":"L2-C58","cn":"质粒","en":"plasmid","abbr":"","definition":"细菌细胞内独立于染色体之外的小型环状DNA分子。","detail":"天然状态下以负超螺旋为主；稍被破坏即出现开环结构；两条链均断开则呈线性。","note":"电泳迁移率：超螺旋>线性>开环。","pages":[76,97,98]}],"processes":[{"id":"L2-P01","name":"多聚核苷酸链的组装","en":"polymerization of nucleotides into a polynucleotide chain","overview":"核苷酸作为DNA的building blocks通过共价键依次连接形成具方向性的DNA链。","steps":[{"n":1,"name":"核苷酸形成","detail":"磷酸+糖（sugar-phosphate）与碱基结合形成核苷酸。"},{"n":2,"name":"共价连接","detail":"多个核苷酸经3′-5′磷酸二酯键连接，形成具5′端与3′端方向性的DNA链；图中示例碱基序列5′-G-C-A-T-3′。"}],"key_points":["新核苷酸加到链的3′-OH端，合成方向5′→3′","被进攻的是5′-NTP的α-磷酸，β、γ以焦磷酸释放供能"],"regulation":[],"figures":["糖-磷酸+碱基→核苷酸→DNA单链，左端5′、右端3′"],"pages":[6,82,86]},{"id":"L2-P02","name":"DNA变性复性","en":"DNA denaturation and renaturation","overview":"双螺旋DNA经变性变为随机卷曲单链，复性时经碱基配对缔合与退火恢复双螺旋，过程可逆。","steps":[{"n":1,"name":"变性","detail":"双螺旋DNA→部分变性DNA→链分离为随机卷曲单链；A₂₆₀随温度升高由双链平台跃升至单链平台（增色效应），中点对应Tm。"},{"n":2,"name":"复性","detail":"通过碱基配对使链缔合（association of strands by base pairing），再退火（annealing）恢复双螺旋。"}],"key_points":["Tm为A₂₆₀增至最大值一半时的温度","Tm受G+C含量、离子强度、DNA均一性影响"],"regulation":[],"figures":["熔解曲线：双链平台→单链平台，中点Tm","电镜可见局部解链的单链泡状结构"],"pages":[54]},{"id":"L2-P03","name":"核小体层级组装","en":"Nucleosome assembly hierarchy","overview":"由DNA与组蛋白八聚体逐级组装为核小体核心、染色小体与完整核小体。","steps":[{"n":1,"name":"核小体核心","detail":"146 bp DNA+组蛋白八聚体→核小体核心。"},{"n":2,"name":"染色小体","detail":"核小体核心+H1→染色小体（166 bp）。"},{"n":3,"name":"核小体","detail":"染色小体+连接DNA→核小体（约200 bp DNA）。"}],"key_points":["DNA以左手超螺旋绕核心约1.65圈","连接DNA长度因物种而异"],"regulation":[],"figures":["串珠状结构：组蛋白核心、核心DNA 146 bp、连接DNA 20—60 bp"],"pages":[57]},{"id":"L2-P04","name":"分子伴侣介导的核小体组装","en":"Chaperon-mediated nucleosome assembly","overview":"组蛋白先形成H3-H4异四聚体与H2A-H2B异二聚体，在分子伴侣CAF-1与NAP-1协助下依次结合DNA形成核小体。","steps":[{"n":1,"name":"H3-H4四聚体形成","detail":"H3与H4形成H3-H4 heterotetramer。"},{"n":2,"name":"四聚体就位","detail":"CAF-1协助H3-H4四聚体结合到DNA上。"},{"n":3,"name":"H2A-H2B二聚体形成","detail":"H2A与H2B形成异二聚体。"},{"n":4,"name":"补齐核小体","detail":"NAP-1协助两个H2A-H2B二聚体加入，形成完整核小体。"}],"key_points":["组装顺序与结构中(H3-H4)₂居中、两侧H2A-H2B一致","组蛋白带正电易与DNA聚集，必须由分子伴侣护送"],"regulation":["CAF-1与DNA复制偶联的组装（补充背景）"],"figures":["H3-H4四聚体先就位，两个H2A-H2B二聚体补齐"],"pages":[63]},{"id":"L2-P05","name":"组蛋白乙酰化调控染色质开放与基因表达","en":"histone acetylation-mediated chromatin decondensation","overview":"尾部结构域乙酰化抑制核小体阵列折叠成二级和三级染色质结构，导致染色质解凝聚，使转录因子接近。","steps":[{"n":1,"name":"写入","detail":"Writer（HAT）在组蛋白尾部加上乙酰基Ac。"},{"n":2,"name":"识别","detail":"Reader识别乙酰化标记并结合。"},{"n":3,"name":"重塑","detail":"染色质重塑使染色质由紧密变为开放，Acetylated chromatin开放且具转录活性（Gene On）。"},{"n":4,"name":"擦除","detail":"Eraser（HDAC）去除乙酰基，染色质回到紧密且转录被抑制状态（Gene Off）。"}],"key_points":["H2B和H4的乙酰化对三级结构形成影响最大","HAT以乙酰-CoA为乙酰基供体，HDAC逆转"],"regulation":["特定基因部位的乙酰化/去乙酰化以非随机、位置特异方式进行","HDAC抑制剂（vorinostat、entinostat）升高乙酰化，抑制增殖与迁移、促进细胞死亡"],"figures":["Writer–Reader–Eraser框架；乙酰化染色质开放、去乙酰化染色质紧密"],"pages":[36,37]},{"id":"L2-P06","name":"胞嘧啶甲基化","en":"Methylation of Cytosine","overview":"DNA甲基转移酶以S-腺苷甲硫氨酸为甲基供体，将甲基加到胞嘧啶第5位碳生成5-甲基胞嘧啶。","steps":[{"n":1,"name":"底物","detail":"胞嘧啶含NH2基团，环上编号1—6，甲基化发生在5位碳。"},{"n":2,"name":"甲基转移","detail":"DNMT利用S-腺苷甲硫氨酸提供甲基。"},{"n":3,"name":"产物","detail":"生成5-甲基胞嘧啶。"}],"key_points":["主要发生在GC富集的CpG岛","5-氮胞苷（5位碳被氮取代）阻断DNMT，用作去甲基化药物"],"regulation":["启动子区高甲基化致抑癌基因失活，是肿瘤共同特征"],"figures":["正常细胞启动子CpG多未甲基化、基因可转录；肿瘤细胞高甲基化、转录被阻断"],"pages":[31,32]},{"id":"L2-P07","name":"DNA包装成染色体的层级","en":"hierarchical packaging of DNA into chromosome","overview":"从2 nm双螺旋逐级压缩到1,400 nm中期染色体。","steps":[{"n":1,"name":"DNA双螺旋","detail":"2 nm（左图标注2.5 nm）。"},{"n":2,"name":"串珠状染色质","detail":"核小体串珠，11 nm。"},{"n":3,"name":"30 nm纤维","detail":"核小体包装成的30 nm染色质纤维。"},{"n":4,"name":"伸展染色体片段","detail":"300 nm。"},{"n":5,"name":"中期染色体压缩片段","detail":"700 nm。"},{"n":6,"name":"完整中期染色体","detail":"1,400 nm。"}],"key_points":["四级包装：DNA+组蛋白→核小体（宽5倍、长压缩7倍）；核小体→螺线管（宽3倍、长压缩6倍）；螺线管→超螺旋（宽13倍、长压缩40倍）；超螺旋→染色体（宽2.5—5倍、长压缩5倍）","累计宽度增加500—1000倍，长度压缩8400倍（8000—10000倍）"],"regulation":["30 nm纤维形成需H1和组蛋白N端尾部","30 nm纤维基础上还需额外10³—10⁴倍压缩，机制尚不清楚"],"figures":["逐级压缩示意与尺寸标尺；30 nm纤维电镜照片"],"pages":[68,69,70,71]},{"id":"L2-P08","name":"正、负超螺旋的相互转变","en":"interconversion of negative and positive supercoiling","overview":"负超螺旋经拓扑异构酶或溴乙锭作用变为松弛DNA，再变为正超螺旋。","steps":[{"n":1,"name":"负→松弛","detail":"负超螺旋经拓扑异构酶/溴乙锭作用变为松弛DNA。"},{"n":2,"name":"松弛→正","detail":"松弛DNA经拓扑异构酶/溴乙锭作用变为正超螺旋。"}],"key_points":["双螺旋松开导致负超螺旋，拧紧导致正超螺旋","细胞内DNA为负超螺旋，核小体引入负超螺旋"],"regulation":["拓扑异构酶可使超螺旋DNA松弛"],"figures":["绳子拧紧/松开类比；电镜下松弛与超螺旋DNA对比"],"pages":[95,96]},{"id":"L2-P09","name":"小球菌核酸酶消化+电泳证明核小体重复单位","en":"micrococcal nuclease digestion followed by gel electrophoresis","overview":"小球菌核酸酶优先切割核小体间连接DNA，保留受组蛋白核心保护的片段，电泳呈200 bp整数倍梯状条带。","steps":[{"n":1,"name":"轻度消化","detail":"用小球菌核酸酶处理染色质，得到200 bp、400 bp等片段。"},{"n":2,"name":"彻底消化","detail":"更彻底消化释放核小体核心颗粒（约11 nm）。"},{"n":3,"name":"电泳","detail":"凝胶电泳分离，条带为200 bp基本单位倍数。"}],"key_points":["证明染色质由200 bp基本单位重复排列","核心颗粒约146 bp（补充背景）"],"regulation":[],"figures":["电泳梯状条带200/400/600/800 bp"],"pages":[56]},{"id":"L2-P10","name":"琼脂糖凝胶电泳判断质粒构象","en":"agarose gel electrophoresis","overview":"DNA带负电向正极迁移，迁移率取决于分子大小与构象紧凑程度，可区分质粒拓扑异构体。","steps":[{"n":1,"name":"上样","detail":"质粒DNA上样于琼脂糖凝胶。"},{"n":2,"name":"电泳","detail":"施加电场，DNA向正极迁移。"},{"n":3,"name":"判读","detail":"超螺旋最快、线性次之、开环最慢。"}],"key_points":["相同分子质量下迁移率：超螺旋>线性>开环"],"regulation":[],"figures":["泳道A—D条带示意与凝胶照片，上负下正"],"pages":[98]}],"distinctions":[{"id":"L2-D01","title":"核苷与核苷酸","a":"核苷（nucleoside）","b":"核苷酸（nucleotide）","difference":["核苷仅由碱基与戊糖通过糖苷键组成","核苷酸在核苷的5′位再加上磷酸基团","命名上“苷”对应核苷，“酸”对应核苷酸"],"easy_mistake":"把核苷酸说成“碱基+糖”，漏掉磷酸。","pages":[5,84]},{"id":"L2-D02","title":"原核与真核染色体","a":"原核细胞染色体","b":"真核细胞染色体","difference":["原核一般1个染色体，双链环状DNA，位于拟核，无核膜包被","真核多个染色体、线状DNA，位于核内，与组蛋白结合成染色质","真核染色体仅在分裂期光镜下可见，间期为松散染色质","Agrobacterium tumefaciens含4个染色体（3环状1线状），说明原核并非全为环状"],"easy_mistake":"误认为所有原核染色体都是环状。","pages":[9,10]},{"id":"L2-D03","title":"核小体核心与核小体","a":"核小体核心（nucleosome core，146 bp）","b":"核小体（nucleosome，约200 bp）","difference":["核心只含146 bp缠绕DNA与组蛋白八聚体","核小体还包含H1与连接DNA，总DNA约200 bp","染色小体（166 bp）介于两者之间"],"easy_mistake":"把146 bp当作完整核小体长度。","pages":[57]},{"id":"L2-D04","title":"接头组蛋白H1与核心组蛋白","a":"H1（linker histone）","b":"H2A/H2B/H3/H4（core histone）","difference":["H1位于染色质“接头”位置，比例0.5，不保守，易分离","核心组蛋白位于核心，比例各为1，较保守或最保守，较难或最难分离","H1分子量最大（21,000）、氨基酸数最多（223）","H3、H4最难分离且最保守"],"easy_mistake":"把H1算作核心八聚体成员。","pages":[19,61]},{"id":"L2-D05","title":"DNA甲基化与组蛋白修饰","a":"DNA甲基化（DNA methylation）","b":"组蛋白修饰（histone modification）","difference":["前者修饰DNA碱基（胞嘧啶5位碳，标Me）","后者修饰核心组蛋白N端尾部的氨基酸残基（乙酰化、甲基化、磷酸化、泛素化等）","两者由不同酶催化，共同参与染色质结构与基因表达调控"],"easy_mistake":"把组蛋白甲基化与DNA甲基化混为一谈。","pages":[23,26]},{"id":"L2-D06","title":"ADMA与SDMA","a":"ADMA（不对称双甲基精氨酸）","b":"SDMA（对称双甲基精氨酸）","difference":["ADMA由I型PRMTs催化生成，两个甲基位于同一胍基氮原子上","SDMA由II型PRMTs催化生成，两个甲基分别位于两个不同的胍基氮原子上","两者均由MMA分支而来"],"easy_mistake":"记反I型/II型PRMT对应的产物。","pages":[29]},{"id":"L2-D07","title":"Type A HATs与Type B HATs","a":"Type A HATs","b":"Type B HATs","difference":["Type A位于细胞核（p300/CBP、GNAT、MYST、Basal TF、NRCF），作用于核内染色质","Type B位于细胞质（HAT1、HAT2、HAT4、HatB3.1、Rtt109）"],"easy_mistake":"把HAT1误归入核内Type A。","pages":[38]},{"id":"L2-D08","title":"Class I/II/IV HDACs与Class III HDACs","a":"Class I/II/IV HDACs","b":"Class III HDACs（Sirtuins）","difference":["前者为锌离子依赖（zinc-dependent）型","后者为NAD+依赖（NAD(+)-dependent）型，含SIRT1—SIRT7","Class IV仅含HDAC11"],"easy_mistake":"把Sirtuins当作锌依赖型。","pages":[41]},{"id":"L2-D09","title":"组蛋白乙酰化与去乙酰化","a":"乙酰化（acetylation）","b":"去乙酰化（deacetylation）","difference":["乙酰化由HAT催化，以乙酰-CoA为供体，一般与染色质开放、转录激活相关","去乙酰化由HDAC催化，一般与染色质凝集、基因沉默相关","二者共同参与转录、DNA修复、剪接、复制、染色体组装、基因沉默、信号转导等广泛功能"],"easy_mistake":"认为二者功能单向对应，忽略其共同参与多种过程。","pages":[34,35,42]},{"id":"L2-D10","title":"A-DNA与B-DNA","a":"A-DNA","b":"B-DNA","difference":["A型粗短、右手螺旋、直径2.55 nm、每圈11个碱基、碱基间距0.23 nm、倾角20°、大沟很窄很深、小沟很宽浅","B型适中、右手螺旋、直径2.37 nm、每圈10个碱基、碱基间距0.34 nm、倾角0°、大沟很宽较深、小沟窄深","B型是溶液中最常见构象；A型见于DNA-RNA杂交链与dsRNA"],"easy_mistake":"把A型也当作左手螺旋。","pages":[92,93]},{"id":"L2-D11","title":"B-DNA与Z-DNA","a":"B-DNA","b":"Z-DNA","difference":["B型为右手螺旋，Z型为左手螺旋","Z型直径更小（1.84 nm）、碱基间距更大（0.38 nm）、每圈12个碱基","Z型大沟平坦、小沟较窄很深","Z-DNA于1979年由Rich提出，是右手螺旋模型的补充"],"easy_mistake":"把Z-DNA误记为右手螺旋。","pages":[92,94]},{"id":"L2-D12","title":"超螺旋DNA与开环DNA","a":"超螺旋DNA（supercoiled）","b":"开环DNA（relaxed/open circular）","difference":["两者分子质量相同","超螺旋构象体积小、流体力学半径小，电泳迁移率显著大于开环","迁移率顺序：超螺旋>线性>开环"],"easy_mistake":"误以为迁移率只由分子量决定。","pages":[97,98]},{"id":"L2-D13","title":"染色质DNA与自由DNA","a":"染色质DNA","b":"自由DNA","difference":["染色质DNA的Tm值比自由DNA高","染色质状态下DNA聚合酶与RNA聚合酶催化的复制转录活性大大低于自由DNA","DNase I对染色质DNA的消化远慢于纯DNA"],"easy_mistake":"只记一条证据，忽略三者共同说明DNA与蛋白质结合。","pages":[55]},{"id":"L2-D14","title":"真核基因组与原核基因组","a":"真核基因组","b":"原核基因组","difference":["真核庞大、大量重复序列、>90%非编码、单顺反子、断裂基因、大量顺式作用元件、有端粒","原核小、以单拷贝基因主、几乎全为功能基因与调控序列、多顺反子、可有重叠基因","基因密度：原核约860—1060 genes/Mb，人类仅9.3 genes/Mb"],"easy_mistake":"把多顺反子当作真核特征。","pages":[73,74,75,77,78]},{"id":"L2-D15","title":"基因数目与生物体复杂度","a":"基因数目","b":"生物体复杂度","difference":["最小基因数随复杂度增加：寄生细菌500→自由生活细菌1,500→单细胞真核5,000→多细胞真核13,000→高等植物25,000→哺乳动物40,000","人类基因数2万—2.5万，低于图中哺乳动物上限40,000","基因数量不是关键，最重要的是不同物种如何利用这些基因"],"easy_mistake":"认为基因越多生物越高等。","pages":[12]},{"id":"L2-D16","title":"基因组大小与基因数目","a":"基因组大小","b":"基因数目","difference":["二者不平行：人类基因组比线虫大约30倍，基因数仅约1.4倍","基因组增大主要来自非编码DNA扩张","基因密度随基因组增大而下降"],"easy_mistake":"由基因组大推断基因多。","pages":[13]},{"id":"L2-D17","title":"DNA与RNA作为遗传信息储存库","a":"DNA","b":"RNA","difference":["DNA双螺旋具动态性，可翻转碱基形成Hoogsteen碱基对以弥补化学修饰损伤","RNA碱基移动时整个结构瓦解（m1A/m1G破坏A-RNA结构）","故DNA而非RNA是遗传信息的主要储存库"],"easy_mistake":"只从化学稳定性解释，忽略Hoogsteen配对的缓冲作用。","pages":[99]}],"facts":[{"id":"L2-F01","text":"DNA是细菌、病毒和动物细胞的遗传物质；某些病毒的遗传物质是RNA。","note":"遗传物质本质的经典结论，常以判断或选择题考查“RNA病毒例外”。","pages":[3]},{"id":"L2-F02","text":"核苷酸（nucleotide）由磷酸、戊糖（DNA为脱氧核糖，RNA为核糖）和含氮碱基三部分组成；磷酸与戊糖5′-碳以磷酸酯键（phosphoester bond）相连，戊糖1′-碳与碱基以糖苷键（glycosidic bond）相连。","note":"名词解释与结构辨析高频点；注意核苷=碱基+糖，核苷酸=核苷+5′磷酸。","pages":[4,5,84]},{"id":"L2-F03","text":"嘌呤（purine）为双环，包括A和G；嘧啶（pyrimidine）为单环，包括C、T、U。DNA中四种碱基为A、G、C、T。","note":"常与碱基环编号、氢键数结合出选择题。","pages":[5]},{"id":"L2-F04","text":"人体全部DNA总长度估算：0.332 nm × 3.4×10⁹ bp × 2 × 1×10¹⁴ cells = 2.26×10¹¹ km；地球到太阳距离为1.50×10⁸ km，故人体DNA总长相当于往返太阳约1500次。","note":"计算题原型：给出碱基对间距、单倍体基因组大小、二倍体倍数与细胞数即可复算；结论用于说明DNA必须高度压缩包装。","pages":[7]},{"id":"L2-F05","text":"Walther Flemming 于1882年首次使用“染色质（chromatin）”一词。","note":"人物—年份—术语的对应是填空/选择题常考点。","pages":[8]},{"id":"L2-F06","text":"原核细胞DNA集中于拟核（nucleoid），一般每个细胞只有一个染色体，每个染色体含一个双链环状DNA；真核细胞DNA主要在细胞核内，线粒体和叶绿体也含自身DNA；真核染色体仅在细胞分裂期可在光镜下看到，间期以较细且松散的染色质形式存在。","note":"原核vs真核染色体对比是简答题常客。","pages":[9]},{"id":"L2-F07","text":"Agrobacterium tumefaciens 含4个染色体，其中3个环状、1个线状，说明原核生物染色体并非全部环状；四膜虫（Tetrahymena thermophila）大核有225条染色体、拷贝数10—10,000，属基因扩增的特殊现象；人类为22对常染色体+X和Y，基因组3200 Mb。","note":"表格中的“例外”数据最易出选择题（如“原核染色体都是环状”为错）。","pages":[10]},{"id":"L2-F08","text":"基因组大小（genome size）指一个单倍体染色体组所关联的DNA长度，常用Mb表示；基因密度（gene density）指每Mb基因组DNA平均所含基因数（genes/Mb）。","note":"三个基本参数（大小、基因数、密度）的定义可直接作名词解释。","pages":[11]},{"id":"L2-F09","text":"最小基因数随生物复杂度增加：胞外寄生细菌500 → 自由生活细菌1,500 → 单细胞真核5,000 → 多细胞真核13,000 → 高等植物25,000 → 哺乳动物40,000；人类基因数为20,000—25,000。","note":"常考“基因数是否决定复杂度”——总体正相关但非严格决定，人类低于哺乳动物上限40,000。","pages":[12]},{"id":"L2-F10","text":"基因密度由原核到高等真核总体下降：细菌约860—1,060 genes/Mb（E. coli K-12为4.6 Mb、约4,400基因、950 genes/Mb），酵母410—480（S. cerevisiae 12 Mb、5,800基因、480），线虫200（97 Mb、19,000基因），果蝇80（180 Mb、13,700基因），人类9.3（2,900 Mb、27,000基因），拟南芥200（125 Mb、25,500基因）。","note":"核心结论：基因组增大主要来自非编码序列扩张而非基因数增加；人类基因组比线虫大约30倍而基因数仅约1.4倍。","pages":[13]},{"id":"L2-F11","text":"染色体作为遗传物质具有四个特征：①分子结构相对稳定；②能够自我复制，使亲子代保持连续性；③能够指导蛋白质合成，控制整个生命过程；④能够产生可遗传的变异。","note":"简答题标准四条，缺一扣分。","pages":[14]},{"id":"L2-F12","text":"真核染色体由DNA、蛋白质和RNA组成，其中RNA是尚未完成转录而仍与模板DNA相连的转录产物，含量不到DNA的10%。","note":"易错点：RNA不是染色体的结构组分。","pages":[16]},{"id":"L2-F13","text":"组蛋白有H1、H2A、H2B、H3、H4五种；H1分子量最大（21,130 Da，223个残基，Lys 29.5%、Arg 1.3%），H4最小（11,236 Da，102个残基）；H3、H4的Arg含量最高（13.3%、13.7%）。表注：H1、H2A、H2B的分子量随物种而异，表中除H1来自兔外其余为牛组蛋白。","note":"数据型选择题常考“分子量最大/最小”“碱性氨基酸含量最高”。","pages":[18]},{"id":"L2-F14","text":"H1为接头组蛋白（linker histone），位于接头、染色质中比例0.5、不保守、最易分离；H2A、H2B、H3、H4为核心组蛋白（core histone），位于核心、比例各为1；保守性H3、H4最保守 > H2A、H2B较保守 > H1不保守；分离难易度H3、H4最难，H2A、H2B较难，H1易。","note":"H1与核心组蛋白的对比是必考辨析。","pages":[19]},{"id":"L2-F15","text":"组蛋白四个特性：①进化上极端保守；②无组织特异性；③肽链氨基酸分布不对称——碱性氨基酸在N端、疏水基团在C端；④存在较普遍的修饰作用（甲基化、乙酰化、磷酸化、泛素化等）。","note":"简答“组蛋白特性”四点；注意“无组织特异性”易被误判为有。","pages":[20]},{"id":"L2-F16","text":"核心组蛋白共有的组蛋白折叠（histone fold）由3个α螺旋（α helix 1、2、3）和2个环（Loop 1、Loop 2）构成；每种核心组蛋白都有N端尾部，是广泛修饰的位点；组蛋白尾部在特定位置从核小体核心伸出，如同螺丝的沟槽，引导DNA以左手方式缠绕在组蛋白核心上。","note":"结构—功能结合的考点，常考“组蛋白折叠由几个螺旋几个环组成”。","pages":[21,22]},{"id":"L2-F17","text":"组蛋白修饰位点主要集中于N端尾部：H3的T3、K4、K9、S10、T11、K14、R17、K18、K23、K27、S28、K36及折叠区K79；H4的S1、R3、K5、K8、K12、K16、K20及K59；H2A的S1、K4、K5；H2B的K5、K12、S14、K15。修饰类型包括P（磷酸化）、Me（甲基化）、Ac（乙酰化）。","note":"常以“哪个位点修饰类型”或“修饰主要发生在哪个区域”出题。","pages":[24]},{"id":"L2-F18","text":"1942年Conrad Hal Waddington提出表观遗传学（epigenetics）概念，核心命题为“Same genotype producing different phenotype”（相同基因型可产生不同表型）。","note":"人物—年份—命题三要素，填空高频。","pages":[25]},{"id":"L2-F19","text":"最普遍、最重要的表观遗传修饰是DNA和组蛋白的甲基化，涉及基因组稳定性、基因表达、基因印记、胚胎发育、癌症发生等。","note":"常考“表观修饰的两大载体：DNA甲基化与组蛋白修饰”。","pages":[26]},{"id":"L2-F20","text":"组蛋白甲基化由组蛋白甲基转移酶（HMT）催化，可发生在赖氨酸（单、双、三甲基化）和精氨酸（单、双甲基化）残基上；组蛋白甲基化既与基因激活也与基因沉默相关，且是最稳定的一种组蛋白修饰方式。","note":"易错点：甲基化并非只对应沉默；且甲基化是最稳定的组蛋白修饰。","pages":[27]},{"id":"L2-F21","text":"组蛋白甲基化关键位点：H3K4、H3K9、H3K27、H3K36、H3K79、H4K20（红色代表失活、绿色代表激活）；精氨酸甲基化位点为H3R2、H3R8、H3R17、H3R26、H4R3。","note":"常考“哪个位点甲基化对应激活/沉默”。","pages":[28]},{"id":"L2-F22","text":"赖氨酸甲基化由HKMTs逐步加1、2、3个甲基生成单/双/三甲基赖氨酸，可被LSD1、JHDM等去甲基化酶逆转；精氨酸经I型和II型PRMTs生成MMA，I型PRMTs进一步催化生成ADMA（两个甲基在同一胍基氮上），II型PRMTs催化生成SDMA（两个甲基在不同胍基氮上）。","note":"ADMA vs SDMA的区分是经典选择题。","pages":[29]},{"id":"L2-F23","text":"KMTs分两个家族：DOT1样（DOT1L）家族和含SET结构域的赖氨酸甲基转移酶家族；KDMs有两个主要家族：LSD1和Jumonji C。","note":"酶家族分类常以选择题出现。","pages":[30]},{"id":"L2-F24","text":"DNA甲基化由DNA甲基转移酶（DNMTs）以S-腺苷甲硫氨酸（S-adenosylmethionine）为甲基供体，将甲基加到胞嘧啶第5位碳上生成5-甲基胞嘧啶；主要发生在GC富集的CpG岛；非CpG（CpH，H=A、T、C）甲基化在植物中普遍、在大多数哺乳动物细胞类型中罕见。","note":"甲基供体、修饰位点（C第5位碳）、发生序列（CpG岛）三要素必记。","pages":[31]},{"id":"L2-F25","text":"5-氮胞苷（5-Azacytidine）是胞嘧啶类似物（5位碳被氮取代），可阻断DNMT催化的甲基化，常作去甲基化药物。","note":"药物—机制对应题。","pages":[31]},{"id":"L2-F26","text":"启动子区高甲基化导致抑癌基因失活，是人类肿瘤的共同特征之一；GC富集区域大多是启动子序列；DNA甲基化通常导致基因转录抑制。","note":"常考“肿瘤中启动子CpG岛是高甲基化还是低甲基化”。","pages":[32]},{"id":"L2-F27","text":"Vincent Allfrey（1921–2002）于1964年最早提出组蛋白乙酰化与甲基化通过调节对DNA的可及性来控制基因表达的模型；他早年在洛克菲勒研究所Oswald Avery实验室纯化了肺炎球菌DNA，后在哥伦比亚大学Alfred Mirsky（首个分离染色质的人）实验室工作。","note":"人物—年份—模型对应，选择题高频。","pages":[33]},{"id":"L2-F28","text":"赖氨酸乙酰化是可逆且高度调控的：KATs将乙酰基转移到赖氨酸ε-氨基上（中和正电荷），HDACs水解去除乙酰基。","note":"乙酰化中和赖氨酸正电荷是理解染色质开放的关键。","pages":[34]},{"id":"L2-F29","text":"HAT/HDAC催化H3、H4特定赖氨酸残基的乙酰化/去乙酰化，且以非随机、位置特异的方式进行；高乙酰化对应转录活化，低乙酰化对应转录抑制。","note":"“位置特异”与“高乙酰化=活化”是常考结论。","pages":[35]},{"id":"L2-F30","text":"组蛋白尾部乙酰化抑制核小体阵列折叠成二级和三级染色质结构，其中H2B和H4的乙酰化对三级结构形成影响最大，导致染色质解凝聚，使转录因子和共激活因子得以接近。","note":"常考“哪个组蛋白的乙酰化对三级结构影响最大”。","pages":[36]},{"id":"L2-F31","text":"HAT以乙酰-CoA为乙酰基供体；HDAC的非组蛋白底物包括α-tubulin与p53；HDAC抑制剂如vorinostat、entinostat可使恶性细胞增殖下降、迁移下降、细胞周期改变、细胞死亡增加。","note":"药物与底物举例题。","pages":[37]},{"id":"L2-F32","text":"HATs按亚细胞定位分两类：Type B HATs位于细胞质（HAT1、HAT2、HAT4、HatB3.1、Rtt109），Type A HATs位于细胞核（p300/CBP、GNAT、MYST、Basal TF、NRCF）。","note":"分类与定位对应，易出选择题。","pages":[38]},{"id":"L2-F33","text":"C. David Allis从200 L四膜虫（Tetrahymena）培养物中鉴定出第一个组蛋白乙酰基转移酶P55（HAT），并关联到转录共激活因子GCN5。","note":"经典实验：材料、规模（200 L）、酶名（P55）、关联因子（GCN5）都要记。","pages":[39]},{"id":"L2-F34","text":"2018年阿尔伯特·拉斯克基础医学研究奖授予C. David Allis（Rockefeller University）与Michael Grunstein（UCLA），主题为“Histone modifications and gene expression”。","note":"人物—奖项—主题对应题。","pages":[40]},{"id":"L2-F35","text":"HDAC分四类：Class I（HDAC1、2、3、8）、Class II（IIa：HDAC4、5、7、9；IIb：HDAC6、10）、Class III（Sirtuins，SIRT1–SIRT7）、Class IV（HDAC11）；Class I、II、IV为锌离子依赖型，Class III为NAD+依赖型。","note":"最常考：Class III（Sirtuins）是NAD+依赖，其余锌依赖。","pages":[41]},{"id":"L2-F36","text":"组蛋白密码（histone code）：多种组蛋白修饰方式组合形成的、可被专一识别的修饰信息，能更灵活地影响染色质结构与功能；各种修饰之间存在cross-talk。","note":"名词解释高频；强调“组合”与“可被专一识别”。","pages":[43]},{"id":"L2-F37","text":"H2A的单泛素化位点为C端K119，H2B的单泛素化位点为N端K13/15；H2A泛素连接酶包括RING1A/RING1B/BMI1、2A-HUB、BRCA1/BARD1，去泛素化酶包括USP16、2A-DUB、USP21、BAP1；H2B泛素连接酶包括Bre1/Rad6、RNF20/RNF40、BAF250b/Elo BC/CUL2/RBX1，去泛素化酶包括Ubp8、Ubp10、USP7、SCNY、USP3、USP12/46、USP22。","note":"位点（H2A K119、H2B K13/15）最常考，酶名可作匹配题。","pages":[44]},{"id":"L2-F38","text":"H3尾部修饰组合决定功能：K9甲基化→异染色质形成、基因沉默；K4甲基化+K9乙酰化→基因表达；S10磷酸化+K14乙酰化→基因表达。","note":"经典“组合决定意义”例证，常作分析题素材。","pages":[45]},{"id":"L2-F39","text":"非组蛋白是细胞核中组蛋白以外的酸性蛋白质，约为组蛋白总量的60%～70%，可能有20～100种（常见15～20种），含天门冬氨酸、谷氨酸等酸性氨基酸，带负电，含组蛋白没有的色氨酸，是DNA复制、RNA转录活动的调控因子。","note":"组蛋白（碱性、带正电）vs非组蛋白（酸性、带负电、含色氨酸）是必考辨析。","pages":[48]},{"id":"L2-F40","text":"HMG蛋白（High mobility group protein）能与DNA结合但不牢固，也能与H1组蛋白作用，可能与DNA超螺旋结构有关；单链DNA结合蛋白（SSB）为相同亚基组成的四聚体，与单链DNA亲和力极大、与双链DNA结合力较差，占非组蛋白的20%、占染色质的8%，参与复制、转录、修复和重组。","note":"HMG与SSB的性质对比常考。","pages":[49,50]},{"id":"L2-F41","text":"真核DNA按重复程度分三类：不重复序列（重复1~几个，占DNA总量10%~80%，编码结构基因）、中度重复序列（重复10¹~10⁴次，占10%~40%，编码rRNA、tRNA、组蛋白基因）、高度重复序列（碱基组成6~100，重复数百万次，占10%~60%，即卫星DNA）。","note":"表格型选择题高频，注意各栏数值。","pages":[52]},{"id":"L2-F42","text":"Tm值（melting temperature）指DNA在260 nm吸光度增加到最大值一半时的温度；影响Tm值的因素有：①G+C含量；②溶液中的离子强度；③DNA的均一性。","note":"定义中“增加到最大值一半”是关键，常设陷阱为“开始变性的温度”。","pages":[54]},{"id":"L2-F43","text":"染色质由DNA和蛋白质组成的三个实验证据：①染色质DNA的Tm值比自由DNA高；②染色质状态下DNA聚合酶和RNA聚合酶催化的复制与转录活性大大低于自由DNA；③DNase I对染色质DNA的消化远慢于对纯DNA。","note":"实验证据型简答/分析题标准三条。","pages":[55]},{"id":"L2-F44","text":"小球菌核酸酶（micrococcal nuclease）处理染色质后电泳，保留的DNA片段均为200 bp基本单位的倍数（200、400、600、800 bp梯状条带），彻底消化后释放直径约11 nm的核小体核心颗粒。","note":"经典实验：酶名、200 bp倍数、11 nm三个采分点。","pages":[56]},{"id":"L2-F45","text":"核小体（nucleosome）由约200 bp DNA与组蛋白八聚体组成；核小体核心（nucleosome core）为146 bp DNA缠绕八聚体；染色小体（chromatosome）为核小体核心加H1，含166 bp DNA；连接DNA（linker DNA）为20–60 bp。","note":"146/166/200 bp三个数字的层级关系是必考计算与辨析点。","pages":[57]},{"id":"L2-F46","text":"不同生物核小体重复长度：酿酒酵母160–165 bp（连接DNA 13–18 bp）、海胆精子约260 bp（连接DNA约110 bp）、果蝇约180 bp（连接DNA约33 bp）、人185–200 bp（连接DNA 38–53 bp）。","note":"核小体重复长度=146 bp核心+连接DNA长度；海胆最长、酵母最短。","pages":[58]},{"id":"L2-F47","text":"核小体核心颗粒晶体结构由Luger与Richmond于1997年解析（Nature 389: 251-260），材料为重组表达的非洲爪蟾（Xenopus laevis）组蛋白，分辨率2.8 Å。","note":"年份、分辨率、物种、文献四要素常考。","pages":[59]},{"id":"L2-F48","text":"组蛋白八聚体排布为(H3-H4)₂四聚体位于中心，两侧各结合一个H2A-H2B二聚体；DNA以左手超螺旋方式绕核心约1.65圈，对应147 bp（生化定义核心DNA为146 bp）。","note":"“147 bp（结构学）vs 146 bp（生化定义）”的差异是易错点。","pages":[60]},{"id":"L2-F49","text":"组蛋白八聚体蛋白总质量108 kD（H2A×2 28 kD、H2B×2 28 kD、H3×2 30 kD、H4×2 22 kD）；200 bp DNA约130 kD、长67 nm；核小体核心颗粒直径约11 nm、高约6 nm；H1分子量24 kD，结合在核心颗粒外侧DNA进出位点。","note":"定量数据题：DNA质量大于蛋白质量，说明核小体中DNA占主要质量。","pages":[61]},{"id":"L2-F50","text":"核小体偏好结合本身已弯曲的DNA（bent DNA）；在核小体表面DNA的小沟朝向组蛋白八聚体，A:T富集区段位于弯曲内侧、G:C富集区段位于弯折外侧。","note":"核小体定位（nucleosome positioning）的序列基础，常作分析题。","pages":[62]},{"id":"L2-F51","text":"核小体组装顺序：H3与H4形成H3-H4异四聚体，由CAF-1协助结合到DNA上；H2A与H2B形成异二聚体，由NAP-1协助两个二聚体加入，形成完整核小体。","note":"分子伴侣名称（CAF-1、NAP-1）与先后顺序是采分点。","pages":[63]},{"id":"L2-F52","text":"H1结合于核小体之间的连接DNA（而非核心颗粒上缠绕的DNA），促使DNA更紧密地缠绕，使核小体串珠收紧为10 nm纤维。","note":"H1作用位点是高频易错点。","pages":[65]},{"id":"L2-F53","text":"1979年J. Cell Biol. 83:403-427的电镜实验（标尺1,000 Å=100 nm）表明：有H1时核小体颗粒彼此紧靠、排列致密，无H1时颗粒松散、间距大；H1在结构上位于DNA进出核小体的位置。","note":"实验证据型选择题。","pages":[66]},{"id":"L2-F54","text":"体外转录实验（Laybourn & Kadonaga, Science 254:238-245, 1991）：核心组蛋白与H1均抑制kruppel基因转录，H1的抑制呈剂量依赖（0.5、1.0、1.5递增），转录因子Sp1能缓解这种抑制。","note":"经典实验：结论“组蛋白抑制转录、Sp1激活”常考。","pages":[67]},{"id":"L2-F55","text":"30 nm纤维每圈约6个核小体，其形成需要组蛋白H1和组蛋白N端尾部；30 nm纤维是间期染色质和有丝分裂染色体共同的基本组成成分，该层次使DNA压缩约40倍。","note":"数字（6个/圈、40倍）与“需要H1和N端尾部”是采分点。","pages":[68]},{"id":"L2-F56","text":"30 nm纤维有两种模型：螺线管模型（solenoid model, one-start helix）与锯齿模型（zigzag model, two-start helix）；在30 nm纤维基础上还需额外10³—10⁴倍压缩，机制尚不清楚（核骨架模型仅为提出）。","note":"模型名称与“单起点/双起点”对应常考。","pages":[68,69]},{"id":"L2-F57","text":"DNA包装层级尺寸：DNA双螺旋2 nm（左图标注2.5 nm）→串珠状染色质11 nm→30 nm纤维→伸展染色体片段300 nm→中期染色体压缩片段700 nm→完整中期染色体1,400 nm。","note":"排序题高频，注意2 nm与2.5 nm两处标注并存。","pages":[70]},{"id":"L2-F58","text":"染色体形成四级包装：第一级DNA+组蛋白→核小体（宽度增5倍、长度压缩7倍）；第二级核小体→螺线管（宽3倍、压缩6倍）；第三级螺线管→超螺旋（宽13倍、压缩40倍）；第四级超螺旋→染色体（宽2.5-5倍、压缩5倍）；累计宽度增加500-1000倍，长度压缩8400倍（8000-10000倍）。","note":"计算题原型；第三级压缩倍数最大（40倍）。","pages":[71]},{"id":"L2-F59","text":"DNA包装成染色体的意义：使DNA容纳于细胞内、保护DNA免受损伤、可在细胞分裂时高效传递给两个子细胞、赋予每个DNA分子整体组织形式从而促进基因表达、DNA复制、DNA修复及重组。","note":"简答四点。","pages":[72]},{"id":"L2-F60","text":"真核基因组特点：庞大、存在大量重复序列、非编码序列比例>90%、转录产物为单顺反子、断裂基因（外显子被内含子分隔）、大量顺式作用元件（启动子、增强子、沉默子）、DNA多态性（SNP与串连重复序列多态性）、端粒结构（保护线性DNA完整复制、保护染色体末端、决定细胞寿命）。","note":"真核vs原核基因组对比是简答必考。","pages":[73]},{"id":"L2-F61","text":"大肠杆菌DNA为4.6×10⁶ bp，完全伸展总长约1.3 mm，含4000多个基因；细菌DNA是一条相对分子量约10⁹的共价闭合双链分子，通常也称染色体，此外细胞中还含独立的小型环状质粒DNA。","note":"数字型选择题。","pages":[74,76]},{"id":"L2-F62","text":"原核基因组特点：以单拷贝基因（single-copy gene）为主，仅少数基因（如rRNA基因）多拷贝；整个染色体DNA几乎全部由功能基因与调控序列组成；基因序列与所编码蛋白质序列呈线性对应（colinearity）；存在转录单元并转录产生多顺反子mRNA；存在重叠基因。","note":"“几乎全部为功能基因”与真核“>90%非编码”形成对照。","pages":[75,77,78,79]},{"id":"L2-F63","text":"1977年Sanger正式发现重叠基因：ΦX174感染寄主后共合成9个蛋白质（分子量约2.5×10⁵），需6,078个核苷酸编码，而病毒DNA本身只有5,375个核苷酸；重叠方式有三种：①一个基因完全在另一个基因里面；②部分重叠；③两个基因只有一个碱基对的重叠。","note":"经典计算型推理题：6,078>5,375说明存在重叠基因。","pages":[80]},{"id":"L2-F64","text":"DNA一级结构指4种核苷酸的连接及其排列顺序；相邻核苷酸间由3′-5′磷酸二酯键连接；链有方向性，游离5′-磷酸端为5′端、游离3′-OH端为3′端。","note":"一级结构定义与磷酸二酯键书写方向是易错点。","pages":[82]},{"id":"L2-F65","text":"DNA一级结构有三种表示法：结构式、线条式、字母式；字母式示例5′ ACTGCATAGCTCGA 3′，必须标明5′端与3′端。","note":"常考“字母式必须标注方向”。","pages":[83]},{"id":"L2-F66","text":"核苷=碱基+糖；核苷酸=核苷+磷酸。RNA对应NMP（AMP、GMP、CMP、UMP），DNA对应dNMP（dAMP、dGMP、dCMP、dTMP）；胸腺嘧啶只出现在DNA（dTMP），尿嘧啶只出现在RNA（UMP）。","note":"命名层级与“T只在DNA、U只在RNA”是基础送分点。","pages":[84]},{"id":"L2-F67","text":"核糖核苷酸系列为5′-NMP、5′-NDP、5′-NTP（N=A、G、C、U）；脱氧系列为5′-dNMP、5′-dNDP、5′-dNTP（N=A、G、C、T）；ATP的三个磷酸分别标记为α、β、γ，α位磷酸直接连在核糖5′-OH上。","note":"α、β、γ标记与“5′-NTP是核酸合成前体”常考。","pages":[85,86]},{"id":"L2-F68","text":"链延伸机制：新生核苷酸以5′-三磷酸形式进入，其5′-α-磷酸受链末端3′-OH亲核进攻形成新的磷酸二酯键，β、γ磷酸以焦磷酸形式释放；新核苷酸总是加到3′-OH端，故合成方向为5′→3′。","note":"“被进攻的是α-磷酸”“焦磷酸离去供能”是采分点。","pages":[86]},{"id":"L2-F69","text":"DNA二级结构指两条多核苷酸链反向平行盘绕形成的双螺旋；双螺旋表面存在大沟与小沟，直径约10 Å（20 Å），每圈螺旋34 Å。","note":"二级结构定义关键词：两条链、反向平行、双螺旋。","pages":[87]},{"id":"L2-F70","text":"1953年Watson和Crick基于三方面依据提出DNA双螺旋模型：①X-光衍射数据表明DNA是规则螺旋结构；②密度测量说明螺旋应有两条链；③Chargaff规则（G=C、A=T）。","note":"三条依据常作简答；年份1953必记。","pages":[88]},{"id":"L2-F71","text":"Chargaff规则：双链DNA中A=T、G=C，由此嘌呤总数=嘧啶总数；不同物种A/G与T/C比值差异大（0.4—1.92），但A/T与G/C比值在所有物种中均接近1.0。数据来源：Chargaff E. et al. 1949. J. Biol. Chem. 177: 405。","note":"常考“哪个比值体现物种特异性、哪个体现碱基互补”。","pages":[89]},{"id":"L2-F72","text":"DNA双链基本特点：两条反向平行的脱氧核苷酸长链盘绕；脱氧核糖与磷酸交替排列在外侧构成基本骨架，碱基在内侧；两条链碱基通过氢键结合成碱基对；嘌呤永远与嘧啶配对（A=T、G=C）。","note":"简答“DNA双链特点”标准答案。","pages":[90]},{"id":"L2-F73","text":"B-DNA关键几何参数：碱基上升距离（rise）3.4 Å，每圈10.4个碱基对，螺距（pitch）34 Å，螺旋宽度20 Å；大沟宽22 nm、小沟宽12 nm（图中标注数值）。","note":"计算题：螺距=每圈碱基数×碱基上升距离≈10.4×3.4≈34 Å。","pages":[91]},{"id":"L2-F74","text":"A-、B-、Z-型DNA比较：A型粗短、右手、直径2.55 nm、碱基间距0.23 nm、每圈11个碱基、碱基倾角20°、大沟很窄很深、小沟很宽浅；B型适中、右手、直径2.37 nm、碱基间距0.34 nm、每圈10个碱基、倾角0°、大沟很宽较深、小沟窄深；Z型细长、左手、直径1.84 nm、碱基间距0.38 nm、每圈12个碱基、倾角7°、大沟平坦、小沟较窄很深。","note":"表格型选择题必考，尤其“Z型为左手螺旋”。","pages":[92]},{"id":"L2-F75","text":"B-DNA主要见于A-T丰富的DNA片段；A-DNA对基因表达有重要意义，存在于DNA-RNA杂交双链（处于转录状态的DNA）以及RNA-RNA双链（dsRNA）中。","note":"常考“A型构象出现在哪些情形”。","pages":[93]},{"id":"L2-F76","text":"1979年Rich提出左手螺旋Z-DNA结构，是右手螺旋结构模型的补充和发展；A-DNA和Z-DNA可能具有不同的生物活性。","note":"人物—年份—结构对应题。","pages":[94]},{"id":"L2-F77","text":"DNA高级结构指双螺旋进一步扭曲盘绕形成的特定空间结构，主要形式为超螺旋，分正超螺旋与负超螺旋，特殊情况下可相互转变；双螺旋DNA的松开导致负超螺旋，拧紧则导致正超螺旋；负超螺旋经拓扑异构酶或溴乙锭作用变为松弛DNA，再变为正超螺旋。","note":"“松开→负超螺旋、拧紧→正超螺旋”是高频易错点。","pages":[95]},{"id":"L2-F78","text":"细胞内的DNA是负超螺旋的；真核生物中核小体引入负超螺旋；拓扑异构酶可使超螺旋DNA松弛。","note":"三条结论常作判断或填空。","pages":[96]},{"id":"L2-F79","text":"质粒三种构象：共价闭合超螺旋DNA（cccDNA，天然主要形式，以负超螺旋为主）、开环DNA（ocDNA，一条链有缺口）、线状DNA（两条链均断开）。","note":"构象—链完整性对应关系常考。","pages":[97]},{"id":"L2-F80","text":"相同分子质量的质粒DNA在电场中迁移率顺序为：超螺旋DNA > 线性DNA > 开环DNA。","note":"电泳判读题核心结论；超螺旋最紧凑、迁移最快。","pages":[98]},{"id":"L2-F81","text":"2016年8月1日Nature Structural & Molecular Biology发表“m1A and m1G disrupt A-RNA structure through the intrinsic instability of Hoogsteen base pairs”，首次显示RNA碱基移动时整个结构会瓦解；DNA双螺旋具动态性，可通过碱基翻转和形成Hoogsteen碱基对弥补化学修饰损伤，这解释了为何DNA而非RNA是遗传信息的主要储存库。","note":"“为何是DNA而非RNA”是分析题热门素材。","pages":[99]},{"id":"L2-F82","text":"三链DNA（triplex DNA, H-DNA）由一条富含嘧啶的反义寡核苷酸（ODN）与双链DNA中富含嘌呤的链以平行方式形成Hoogsteen键，或由富含嘌呤的ODN以反向平行方式形成反Hoogsteen键，第三条链位于双螺旋大沟中；G-四链体（G-quadruplex）由富含鸟嘌呤区域经环状Hoogsteen氢键层层堆积形成，中心配位K+离子；二者均为特定条件下形成的特异性结构，不是自然状态下的主要结构。","note":"三链与四链的配对方式（Hoogsteen）与离子（K+）是采分点。","pages":[100]},{"id":"L2-F83","text":"Science 344 (6182): 376-380（Feng Song等，DOI: 10.1126/science.1251413）用冷冻电镜（cryo-EM）以11 Å分辨率解析了由12个核小体组成的DNA串结构，该片段形成30纳米纤维，其本身是双螺旋，由四核小体单元（tetranucleosomal units）盘绕而成；每个核小体缠绕约150 bp DNA，其间有长度不等的连接DNA。","note":"最新结构证据：30 nm纤维=四核小体单元盘绕成的双螺旋。","pages":[103]},{"id":"L2-F84","text":"Nature Chemistry（2013年1月20日在线，DOI: 10.1038/NCHEM.1548；及DOI: 10.1038/s41557-020-0506-4）报道了人细胞及活细胞内DNA G-四链体的定量与单分子可视化，支持G4在细胞内真实存在并具调控功能。","note":"说明G4不仅体外可形成，体内也存在。","pages":[104]}],"methods":[{"id":"L2-M01","cn":"小球菌核酸酶消化结合凝胶电泳","en":"Micrococcal nuclease digestion followed by gel electrophoresis","principle":"小球菌核酸酶优先切割核小体之间的连接DNA，保留受组蛋白核心保护的DNA片段，因此消化产物长度反映核小体重复单位。","steps":"用小球菌核酸酶轻度消化染色质→得到200 bp、400 bp等片段；更彻底消化→释放直径约11 nm的核小体核心颗粒；凝胶电泳分离，可见200 bp整数倍的梯状条带。","applications":"证明染色质由核小体重复单位构成；测定核小体重复长度（如酵母160–165 bp、海胆精子约260 bp、人185–200 bp）。","limitations":"只反映连接区可及性，不反映序列特异性；过度消化会丢失连接DNA信息。","pages":[56,58]},{"id":"L2-M02","cn":"体外转录活性检测","en":"In vitro transcription assay","principle":"以kruppel mRNA的转录产物量反映模板活性，比较不同组蛋白条件下转录被抑制的程度。","steps":"设置不同Histone H1量（0、0.5、1.0、1.5）与Core histones（+/−）组合，并比较加/不加Sp1蛋白（+/−），电泳检测kruppel mRNA活性条带。","applications":"证明核心组蛋白与H1对转录的抑制作用及Sp1的激活作用。","limitations":"体外体系不能完全反映体内染色质环境；结论依赖特定报告基因。","pages":[67]},{"id":"L2-M03","cn":"琼脂糖凝胶电泳判断质粒构象","en":"Agarose gel electrophoresis for plasmid topology","principle":"DNA带负电，在电场中向正极迁移；迁移率取决于分子大小与构象紧凑程度。","steps":"上样于琼脂糖凝胶，施加电场（上端为负极、下端为正极），按条带位置判读：超螺旋最快、线性次之、开环最慢。","applications":"判断质粒结构是否被破坏（被核酸酶切口或断裂）；区分拓扑异构体。","limitations":"仅凭迁移率不能直接读出序列信息；相同分子质量是判读前提。","pages":[98]},{"id":"L2-M04","cn":"电镜观察核小体","en":"Electron microscopy of nucleosomes","principle":"负染/金属投影后在电镜下直接观察核小体颗粒的形态与聚集状态。","steps":"分别制备含组蛋白H1与不含H1的核小体样品，电镜拍照并比较颗粒紧密程度（图中标尺1,000 Å=100 nm）。","applications":"直观证明H1使核小体DNA更加紧实，H1位于DNA进出核小体的位置。","limitations":"样品制备可能改变天然构象；只能观察形态，不能给出分子细节。","pages":[66]},{"id":"L2-M05","cn":"冷冻电镜解析染色质纤维结构","en":"Cryo-EM of chromatin fiber","principle":"快速冷冻保存近天然构象，通过电子显微镜成像与三维重建解析染色质高级结构。","steps":"对由12个核小体组成的DNA串进行冷冻电镜成像，解析至11 Å分辨率。","applications":"揭示30 nm纤维为四核小体单元盘绕成的双螺旋结构。","limitations":"分辨率低于晶体结构；对样品纯度与均一性要求高。","pages":[103]}],"exam_points":[{"id":"L2-X01","point":"原核与真核染色体/基因组的比较","detail":"简答或表格题：从染色体数目与形态（原核一般1个、环状；真核多个、线状）、DNA位置（拟核vs核内+线粒体/叶绿体）、是否与组蛋白结合、重复序列与非编码比例（真核>90%）、转录产物（多顺反子vs单顺反子）、有无内含子与重叠基因等逐条对比。注意Agrobacterium tumefaciens含1条线状染色体的例外。"},{"id":"L2-X02","point":"基因组大小、基因数目与基因密度的关系","detail":"给数据判断或计算基因密度（genes/Mb）；核心结论：基因组增大主要靠非编码序列扩张，故密度由原核约950降至人类9.3；基因数随复杂度总体增加但非严格决定（人类20,000—25,000，低于哺乳动物上限40,000）。"},{"id":"L2-X03","point":"组蛋白种类、分类与特性","detail":"五种组蛋白的分子量、残基数、碱性氨基酸含量；H1为接头组蛋白（比例0.5、不保守、易分离），H2A/H2B/H3/H4为核心组蛋白（比例1、较保守或最保守、较难或最难分离）；组蛋白四特性（极端保守、无组织特异性、N端碱性/C端疏水、广泛修饰）。"},{"id":"L2-X04","point":"核小体的层级结构（146/166/200 bp）","detail":"核小体核心=146 bp+八聚体；染色小体=核心+H1=166 bp；核小体=约200 bp DNA+八聚体（含20–60 bp连接DNA）；八聚体为(H3-H4)₂居中、两侧各一个H2A-H2B；DNA左手超螺旋约1.65圈。常以计算或辨析题出现。"},{"id":"L2-X05","point":"组蛋白修饰的类型与功能","detail":"乙酰化（KATs/HATs加、HDACs去；中和赖氨酸正电荷；高乙酰化=转录活化）、甲基化（HMT催化，Lys可me1/me2/me3、Arg可me1/me2；最稳定；H3K9me→沉默、H3K4me→激活）、磷酸化、泛素化（H2A K119、H2B K13/15）、ADP-核糖基化、巴豆酰化、乳酰化。"},{"id":"L2-X06","point":"组蛋白密码与修饰组合的意义","detail":"名词解释“组蛋白密码”；举例说明组合决定功能：H3K9me→异染色质沉默；H3K4me+H3K9ac→基因表达；H3S10p+H3K14ac→基因表达；同一赖氨酸不能同时甲基化与乙酰化；修饰间存在cross-talk。"},{"id":"L2-X07","point":"DNA甲基化机制及其与肿瘤的关系","detail":"DNMTs以S-腺苷甲硫氨酸为供体在胞嘧啶第5位碳加甲基生成5-甲基胞嘧啶，主要发生在CpG岛；5-氮胞苷为去甲基化药物；启动子区高甲基化导致抑癌基因失活是肿瘤共同特征；非CpG甲基化在植物普遍、哺乳动物罕见。"},{"id":"L2-X08","point":"DNA双螺旋模型的三条依据与Chargaff规则","detail":"1953年Watson与Crick：X-光衍射（规则螺旋）、密度测量（两条链）、Chargaff规则（A=T、G=C）；Chargaff数据中A/G与T/C随物种变化而A/T、G/C恒约1.0。常以选择或简答出现。"},{"id":"L2-X09","point":"A-、B-、Z-型DNA的比较","detail":"表格记忆：螺旋方向（A、B右手；Z左手）、直径（2.55/2.37/1.84 nm）、碱基间距（0.23/0.34/0.38 nm）、每圈碱基数（11/10/12）、碱基倾角（20°/0°/7°）、大沟小沟形态；A-DNA存在于DNA-RNA杂交链与dsRNA中。"},{"id":"L2-X10","point":"DNA超螺旋与拓扑异构体","detail":"松开→负超螺旋、拧紧→正超螺旋；细胞内DNA为负超螺旋，核小体引入负超螺旋，拓扑异构酶可松弛；质粒三构象（cccDNA、ocDNA、线状DNA）与电泳迁移率顺序（超螺旋>线性>开环）。"},{"id":"L2-X11","point":"染色质高级结构的层级与压缩倍数","detail":"2 nm DNA→11 nm串珠→30 nm纤维（每圈约6个核小体，需H1与N端尾部，压缩约40倍）→300 nm伸展片段→700 nm→1,400 nm中期染色体；四级包装累计宽度增500-1000倍、长度压缩8400倍（8000-10000倍）；30 nm纤维两模型（螺线管one-start、锯齿two-start）。"},{"id":"L2-X12","point":"染色质由DNA与蛋白质组成的实验证据","detail":"三条证据：染色质DNA的Tm更高；染色质状态下DNA聚合酶/RNA聚合酶活性大大降低；DNase I消化远慢于纯DNA。另可用小球菌核酸酶消化得200 bp倍数梯状条带证明核小体重复单位。"},{"id":"L2-X13","point":"非组蛋白与HMG、SSB的性质","detail":"非组蛋白为酸性、带负电、含色氨酸、种类多（20～100种）、占组蛋白总量60%～70%，作为酶、调控蛋白与结构支持体；HMG与DNA结合不牢固、与超螺旋有关；SSB为四聚体、与单链DNA亲和力极大，占非组蛋白20%、染色质8%。"},{"id":"L2-X14","point":"重叠基因与ΦX174经典计算","detail":"1977年Sanger发现重叠基因；ΦX174共5,375个核苷酸却编码9个蛋白质（需6,078个核苷酸），说明同一段DNA可携带两种蛋白质信息；重叠方式三种（完全包含、部分重叠、仅一个碱基对重叠）。"},{"id":"L2-X15","point":"DNA一级结构、核苷酸命名与链延伸方向","detail":"一级结构=4种核苷酸的连接及排列顺序；3′-5′磷酸二酯键；三种表示法（结构式、线条式、字母式，字母式须标5′/3′）；核苷vs核苷酸；NMP/dNMP系列；链延伸时5′-α-磷酸受3′-OH进攻、释放焦磷酸，合成方向5′→3′。"}],"exercises":[{"id":"L2-E01","type":"单选题","stem":"下列关于原核生物染色体的叙述，正确的是：","options":["A. 每个原核细胞一般只有一个染色体，且所有原核染色体均为环状双链DNA","B. 原核细胞DNA集中于有核膜包被的细胞核内","C. Agrobacterium tumefaciens 含4个染色体，其中3个环状、1个线状","D. 原核染色体与组蛋白结合形成核小体"],"answer":"C","analysis":"A错：Agrobacterium tumefaciens含1个线状染色体，说明原核染色体并非全为环状；B错：原核DNA位于无核膜包被的拟核；D错：核小体是真核染色质结构。C为第10页表格原文。","pages":[9,10]},{"id":"L2-E02","type":"单选题","stem":"关于核小体及其相关结构，下列数值对应正确的是：","options":["A. 核小体核心含166 bp DNA","B. 染色小体含146 bp DNA","C. 核小体含约200 bp DNA，连接DNA为20–60 bp","D. 核小体核心颗粒直径约30 nm"],"answer":"C","analysis":"核小体核心=146 bp；染色小体=核心+H1=166 bp；核小体≈200 bp（含20–60 bp连接DNA）；核心颗粒直径约11 nm。故A、B、D均错。","pages":[57,61]},{"id":"L2-E03","type":"单选题","stem":"下列组蛋白中，分子量最大、在染色质中比例约为核心组蛋白一半、且最不保守的是：","options":["A. H1","B. H2A","C. H3","D. H4"],"answer":"A","analysis":"H1为接头组蛋白，分子量21,130 Da（最大）、223个残基（最多）、染色质中比例0.5、不保守、最易分离；H3与H4最保守且最难分离。","pages":[18,19]},{"id":"L2-E04","type":"单选题","stem":"关于组蛋白甲基化，下列说法错误的是：","options":["A. 由组蛋白甲基转移酶（HMT）催化","B. 赖氨酸可发生单、双、三甲基化，精氨酸可发生单、双甲基化","C. 组蛋白甲基化只与基因沉默相关","D. 组蛋白甲基化是最稳定的一种组蛋白修饰方式"],"answer":"C","analysis":"组蛋白甲基化既与基因激活（如H3K4me）也与基因沉默（如H3K9me）相关，故C错；A、B、D均为第27页原文。","pages":[27,28]},{"id":"L2-E05","type":"单选题","stem":"下列HDAC中，属于NAD+依赖型的是：","options":["A. HDAC1","B. HDAC6","C. SIRT1","D. HDAC11"],"answer":"C","analysis":"Class I（HDAC1、2、3、8）、Class II（含HDAC6）、Class IV（HDAC11）均为锌离子依赖型；Class III为Sirtuins（SIRT1–SIRT7），为NAD+依赖型。","pages":[41]},{"id":"L2-E06","type":"单选题","stem":"关于A-、B-、Z-型DNA，下列叙述正确的是：","options":["A. 三者均为右手螺旋","B. Z型DNA每圈含12个碱基，为左手螺旋","C. B型DNA每圈含11个碱基，碱基间距0.23 nm","D. A型DNA的大沟很宽较深、小沟窄深"],"answer":"B","analysis":"Z型为左手螺旋、每圈12个碱基、碱基间距0.38 nm；B型每圈10个碱基、间距0.34 nm；A型大沟很窄很深、小沟很宽浅。故A、C、D错。","pages":[92]},{"id":"L2-E07","type":"单选题","stem":"相同分子质量的质粒DNA在琼脂糖凝胶电泳中迁移率由快到慢的顺序是：","options":["A. 开环DNA > 线性DNA > 超螺旋DNA","B. 线性DNA > 超螺旋DNA > 开环DNA","C. 超螺旋DNA > 线性DNA > 开环DNA","D. 超螺旋DNA > 开环DNA > 线性DNA"],"answer":"C","analysis":"超螺旋构象最紧凑、流体力学半径最小，迁移最快；开环松弛DNA最伸展，迁移最慢；线性居中。","pages":[98]},{"id":"L2-E08","type":"单选题","stem":"1953年Watson和Crick提出DNA双螺旋模型所依据的证据不包括：","options":["A. X-光衍射实验数据表明DNA是规则螺旋结构","B. DNA密度测量说明螺旋结构应有两条链","C. Chargaff规则：G=C、A=T","D. 冷冻电镜解析出30 nm染色质纤维由四核小体单元构成"],"answer":"D","analysis":"D为2014年Science论文（Song等）的结果，与1953年双螺旋模型无关；A、B、C为第88页列出的三条依据。","pages":[88,103]},{"id":"L2-E09","type":"多选题","stem":"下列属于真核基因组结构特点的有：","options":["A. 存在大量重复序列，非编码序列比例>90%","B. 转录产物为单顺反子，基因多为断裂基因","C. 整个染色体DNA几乎全部由功能基因与调控序列组成","D. 存在启动子、增强子、沉默子等顺式作用元件及端粒结构"],"answer":"A、B、D","analysis":"C为原核基因组特点（几乎全部为功能基因与调控序列）；真核基因组庞大、大量重复序列、>90%非编码、单顺反子、断裂基因、顺式作用元件与端粒。","pages":[73,75]},{"id":"L2-E10","type":"多选题","stem":"关于组蛋白修饰，下列说法正确的有：","options":["A. 乙酰化由HATs催化、去乙酰化由HDACs催化，乙酰化中和赖氨酸的正电荷","B. H2B和H4的乙酰化对三级染色质结构形成影响最大","C. 高乙酰化通常对应转录活化，低乙酰化对应转录抑制","D. 组蛋白修饰只发生在核心组蛋白的球状折叠结构域内"],"answer":"A、B、C","analysis":"D错：修饰位点主要集中于N端尾部（折叠区也有如H3K79、H4K59等，但“只发生在折叠结构域内”错误）。A、B、C分别为第34、36、35页结论。","pages":[34,35,36]},{"id":"L2-E11","type":"多选题","stem":"下列可作为“染色质由DNA和蛋白质组成”实验证据的有：","options":["A. 染色质DNA的Tm值比自由DNA高","B. 染色质状态下DNA聚合酶和RNA聚合酶催化的活性大大低于自由DNA","C. DNase I对染色质DNA的消化远慢于对纯DNA","D. 小球菌核酸酶消化染色质后电泳得到200 bp整数倍的梯状条带"],"answer":"A、B、C、D","analysis":"A、B、C为第55页三条证据；D为第56页核小体重复单位的直接证据，同样支持DNA与蛋白质结合成重复结构。","pages":[55,56]},{"id":"L2-E12","type":"填空题","stem":"DNA甲基化由________（酶）以________为甲基供体，将甲基加到胞嘧啶第________位碳上，生成________；该修饰主要发生在________富集的________岛。","options":[],"answer":"DNA甲基转移酶（DNMTs）；S-腺苷甲硫氨酸（S-adenosylmethionine）；5；5-甲基胞嘧啶（5-methylcytosine）；GC；CpG","analysis":"四要素（酶、供体、位点、产物）与发生序列是DNA甲基化考点的标准填空。","pages":[31]},{"id":"L2-E13","type":"填空题","stem":"核小体组装时，H3与H4先形成________，由分子伴侣________协助结合到DNA上；随后H2A与H2B形成________，由分子伴侣________协助加入，形成完整核小体。","options":[],"answer":"H3-H4异四聚体（heterotetramer）；CAF-1（Chromatin Assembly Factor 1）；H2A-H2B异二聚体（heterodimer）；NAP-1（Nucleosome Assembly Protein 1）","analysis":"组装顺序与两个分子伴侣名称是采分点；该顺序与八聚体中(H3-H4)₂居中、两侧H2A-H2B的排布一致。","pages":[63]},{"id":"L2-E14","type":"判断题","stem":"双螺旋DNA的松开导致正超螺旋，而拧紧则导致负超螺旋。","options":[],"answer":"错误","analysis":"恰好相反：双螺旋DNA的松开（缠绕不足）导致负超螺旋，拧紧（过度缠绕）导致正超螺旋。细胞内DNA为负超螺旋。","pages":[95,96]},{"id":"L2-E15","type":"判断题","stem":"组蛋白H1结合在核小体核心颗粒上缠绕的DNA上，从而促使DNA更紧密地缠绕。","options":[],"answer":"错误","analysis":"H1的结合位点是核小体之间的连接DNA（linker DNA）及DNA进出位点，而不是核心颗粒上缠绕的DNA；H1结合后使相邻核小体靠拢、收紧为10 nm纤维。","pages":[65,66]},{"id":"L2-E16","type":"名词解释","stem":"组蛋白密码（histone code）","options":[],"answer":"多种组蛋白修饰方式（乙酰化、甲基化、磷酸化、泛素化等）组合形成的、可被专一识别的修饰信息；单一修饰本身不构成密码，通过组合及修饰间的cross-talk更灵活地影响染色质结构与功能。","analysis":"答题须含“组合”“可被专一识别”“影响染色质结构与功能”三个要素，并可举H3K9me与H3K4me+H3K9ac的例子。","pages":[43,45]},{"id":"L2-E17","type":"简答题","stem":"比较原核生物与真核生物染色体（基因组）的主要差异。","options":[],"answer":"①染色体数目与形态：原核一般1个染色体（少数如Agrobacterium tumefaciens有4个，含1个线状），多为双链环状DNA；真核多个染色体、线状DNA。②DNA位置：原核集中于无核膜包被的拟核，另有质粒；真核主要在细胞核内，线粒体与叶绿体也含自身DNA。③蛋白质结合：原核不与组蛋白形成核小体；真核与组蛋白结合形成核小体（146 bp核心、约200 bp重复单位）。④序列组成：原核几乎全部为功能基因与调控序列、以单拷贝为主（rRNA基因等多拷贝）；真核庞大、含大量重复序列、非编码序列>90%。⑤转录产物：原核存在转录单元、产生多顺反子mRNA，可有重叠基因；真核为单顺反子、断裂基因（含内含子）、大量顺式作用元件与端粒。","analysis":"按“数目形态—位置—蛋白—序列—转录”五维度作答，每维度一句即可得分；务必提到原核线状染色体的例外。","pages":[9,10,73,75,77,78,79]},{"id":"L2-E18","type":"简答题","stem":"简述组蛋白修饰调控基因表达的机制，并举例说明修饰组合如何决定染色质状态。","options":[],"answer":"机制两条途径：①改变组蛋白与DNA双链的亲和性，从而改变染色质的疏松或凝集状态（如乙酰化中和赖氨酸正电荷，使染色质解凝聚、转录因子可接近）；②影响转录因子与结构基因启动子的亲和性。举例：H3K9甲基化→异染色质形成、基因沉默；H3K4甲基化+H3K9乙酰化→基因表达；H3S10磷酸化+H3K14乙酰化→基因表达。说明同一残基不能同时甲基化与乙酰化，修饰组合（组蛋白密码）及cross-talk决定最终功能；这些修饰是表观遗传信息的携带者，可在细胞世代间保持。","analysis":"先答两条机制（第46页），再答组合实例（第45页），最后点出表观遗传信息属性（第47页）可拿满分。","pages":[45,46,47]},{"id":"L2-E19","type":"计算题","stem":"已知B-DNA相邻碱基对上升距离为0.34 nm，某双链DNA片段含2,000个碱基对。请计算：(1) 该片段的长度；(2) 若按B型DNA每圈10个碱基对、螺距3.4 nm计算，该片段可形成多少圈螺旋？(3) 若该DNA与全部组蛋白八聚体组装成核小体，按每200 bp一个核小体计，约需多少个组蛋白八聚体？其中含多少个H2A分子？","options":[],"answer":"(1) 长度 = 2,000 × 0.34 nm = 680 nm。(2) 螺旋圈数 = 2,000 ÷ 10 = 200圈（螺距3.4 nm × 200 = 680 nm，与(1)一致）。(3) 核小体数 = 2,000 ÷ 200 = 10个，即需10个组蛋白八聚体；每个八聚体含2个H2A，故H2A共20个分子。","analysis":"考查B-DNA几何参数（rise 0.34 nm、10 bp/turn、pitch 3.4 nm）与核小体重复单位（约200 bp、八聚体含各核心组蛋白2分子）的联合应用；注意螺距=每圈碱基数×上升距离。","pages":[57,61,91]},{"id":"L2-E20","type":"实验设计题","stem":"请设计实验证明：(1) 真核染色质中DNA以约200 bp为重复单位缠绕在组蛋白八聚体上；(2) 组蛋白H1的结合使核小体排列更紧密。简要写出实验材料、关键步骤、预期结果与结论。","options":[],"answer":"(1) 材料：真核细胞核提取的染色质。步骤：用小球菌核酸酶（micrococcal nuclease）对染色质进行梯度消化（轻度→彻底），酚氯仿抽提DNA后琼脂糖凝胶电泳，以200、400、600、800 bp标记对照。预期结果：轻度消化得到200 bp整数倍的梯状条带；彻底消化释放直径约11 nm的核小体核心颗粒（含约146 bp DNA）。结论：染色质以约200 bp为重复单位（核小体）排列。(2) 材料：纯化的核小体，分含H1与不含H1两组。步骤：分别制备样品，电镜观察（标尺1,000 Å=100 nm）并比较颗粒间距；或比较两组在相同条件下的沉降/电泳行为。预期结果：含H1组核小体颗粒彼此紧靠、排列致密，无H1组颗粒松散、间距大；H1位于DNA进出核小体的位置。结论：H1结合连接DNA使核小体DNA更紧实。","analysis":"两问分别对应第56页与第66页经典实验；评分点：酶名、200 bp倍数/11 nm、H1分组对照、电镜或电泳读出、结论与证据对应。","pages":[56,66]},{"id":"L2-E21","type":"分析题","stem":"1977年Sanger测定ΦX174噬菌体基因组仅含5,375个核苷酸，但预测其感染寄主后合成的9个蛋白质共需约6,078个核苷酸编码。请解释这一矛盾，并说明重叠基因的三种重叠方式及其生物学意义。","options":[],"answer":"矛盾原因：ΦX174基因组中存在重叠基因（overlapping gene），即同一段DNA序列携带两种不同蛋白质的编码信息，因此所需核苷酸数可超过基因组实际长度。三种重叠方式：①一个基因完全在另一个基因里面；②部分重叠；③两个基因只有一个碱基对的重叠。生物学意义：以有限的基因组容量编码更多蛋白质，提高遗传信息利用效率；重叠基因见于一些细菌和动物病毒。","analysis":"先指出“同一段DNA携带两种蛋白质信息”这一核心，再列三种方式；注意Sanger发现年份为1977年。","pages":[79,80]}]},{"lecture":3,"title":"DNA的复制、突变与修复","source_file":"2026_autumn-molecular_biology-03.pdf","pages":107,"overview":"本章解决的核心问题是：遗传信息如何以高保真度从亲代DNA精确传递到子代DNA，以及复制错误与DNA损伤如何被纠正。逻辑主线为：染色质结构（核小体、组蛋白、染色质重塑）→ 复制的结构基础（复制叉、复制子、复制泡）→ 半保留复制的实验证明（Meselson-Stahl实验）→ 半不连续复制与冈崎片段 → 复制体系与基本过程（起始、延伸、终止）→ 原核与真核复制机器的比较（DNA聚合酶、滑动夹、解旋酶、引物酶、连接酶）→ 真核复制起始的细胞周期调控（pre-RC、Cdk/Ddk）→ 复制保真性（碱基选择、3'→5'校读、错配修复三步叠加）→ DNA突变类型（替换、缺失/插入、移码、三核苷酸重复扩增）→ DNA修复系统（BER、NER、MMR、HR、NHEJ、直接修复、SOS）。本章是分子生物学中心法则的起点，与后续转录、翻译及基因组稳定性、癌症发生等章节直接衔接。","outline":[{"section":"1","title":"染色质结构与染色质重塑","points":["染色质由DNA、组蛋白与非组蛋白组成，基本单位为核小体","核小体含约200 bp DNA，核心颗粒含147 bp DNA与组蛋白八聚体","连接DNA可被核酸酶优先切割，高盐可逐步解离核小体","ATP依赖的染色质重塑复合物通过核小体滑动使DNA暴露","重塑复合物分SWI/SNF、ISWI、CHD、INO80/SWR1四大家族"]},{"section":"2","title":"DNA复制的基本概念与实验证明","points":["半保留复制：每个子代分子含一条亲代链与一条新链","Meselson-Stahl实验用15N标记与等密度梯度离心区分三种复制模型","复制叉是Y形复制部位，复制子为独立复制单位","原核单个复制子，真核多复制子、多起点双向复制","Cairns放射自显影证明大肠杆菌环状染色体、单一原点、复制与解旋同时进行","脉冲标记实验证明复制为双向等速"]},{"section":"3","title":"半不连续复制与冈崎片段","points":["DNA聚合酶只能沿5'→3'方向合成，两条模板反向平行","前导链连续合成，后随链以冈崎片段不连续合成","细菌冈崎片段约1000 nt，真核约200 nt","[3H]胸苷脉冲追踪与碱性蔗糖梯度实验发现冈崎片段","连接酶温度敏感突变株在非许可温度下小片段累积"]},{"section":"4","title":"DNA复制的体系与基本过程","points":["复制体系需要模板、dNTP、3'-OH引物、多种酶与蛋白","复制分起始、延伸、终止三阶段","大肠杆菌oriC长245 bp，含DnaA box与13-mer重复","起始需DnaA、HU、DnaC、DnaB依次作用","延伸需DNA聚合酶、滑动夹、切除引物的酶、DNA连接酶","终止由Tus-Ter复合物阻断解旋酶，拓扑异构酶IV解链"]},{"section":"5","title":"DNA聚合酶的种类、结构与功能","points":["DNA聚合酶有手掌、手指、拇指三个结构域","手掌含聚合与校对两个催化位点，用两个金属离子催化","手指结合dNTP并使模板弯曲，正确配对时O-helix旋转40°关闭","拇指维持持续合成能力","滑动夹完全环绕DNA，大幅提高持续合成能力","大肠杆菌有Pol I、II、III、IV、V；Pol III全酶为复制主导酶","真核有Pol α、β、γ、δ、ε及修复型ζ、η、ι、κ"]},{"section":"6","title":"真核生物复制起始的细胞周期调控","points":["复制只在S期进行，复制子40-100 kb","ARS长约150 bp，ORC为6蛋白复合物","G1期组装pre-RC：ORC→Cdc6/Cdt1→Mcm2-7","S期Cdk/Ddk磷酸化激活Mcm、使ORC失活","低Cdk允许组装不允许激活，高Cdk允许激活不允许重新组装","多米诺模型：复制子簇按早期、中期、晚期S期依次激活"]},{"section":"7","title":"复制保真性与校读","points":["大肠杆菌每10^10个碱基仅一个错误","校读指对已加入链的单体进行审核","DNA聚合酶3'→5'外切活性切除错配核苷酸","聚合位点与外切位点相距约3 nm","三步叠加：聚合1/10^5、校读1/10^2、错配修复1/10^2，合并1/10^9"]},{"section":"8","title":"DNA突变","points":["突变是DNA碱基序列永久性、可遗传的改变","替换分转换与颠换；按效应分沉默、错义、无义突变","镰状细胞贫血由β-珠蛋白基因单核苷酸置换引起","缺失/插入非3整数倍导致移码","三核苷酸重复扩增导致多种遗传病","癌症由多基因突变累积引起，癌基因激活与抑癌基因失活"]},{"section":"9","title":"DNA修复","points":["每个细胞每天产生50,000-100,000处DNA损伤","BER处理单个受损碱基，NER切除含损伤的寡核苷酸","错配修复纠正复制错配","同源重组修复需模板，NHEJ不需模板","直接修复逆转嘧啶二体或甲基化损伤","SOS系统为易错应急修复，导致变异"]}],"concepts":[{"id":"L3-C01","cn":"染色质","en":"chromatin","abbr":"","definition":"由DNA与组蛋白（histone）及非组蛋白（non-histone protein）结合形成的复合物，是染色体在间期的存在形式。","detail":"基本结构单位为核小体；串珠状染色质中核小体之间由连接DNA相连，并附着多种非组蛋白。","note":"染色质不等于染色体；染色质强调DNA-蛋白复合物组成，染色体强调有丝分裂期的形态。","pages":[2]},{"id":"L3-C02","cn":"核小体","en":"nucleosome","abbr":"","definition":"染色质的基本结构单位，由核心组蛋白八聚体与缠绕其上的DNA组成，包含约200个核苷酸对的DNA。","detail":"核酸酶消化连接DNA后释放核小体核心颗粒（直径11 nm），含147核苷酸对DNA双螺旋与组蛋白八聚体；高盐进一步解离为H2A、H2B、H3、H4四种组蛋白。","note":"约200 bp是核小体（含连接DNA）的DNA量，147 bp是核心颗粒的DNA量，两者不可混淆。","pages":[2]},{"id":"L3-C03","cn":"连接DNA","en":"linker DNA","abbr":"","definition":"相邻两个核小体之间的裸露DNA片段，可被核酸酶优先切割。","detail":"核酸酶消化连接DNA是分离核小体核心颗粒的经典生化手段。","note":"连接DNA不被组蛋白核心保护，因此对核酸酶敏感。","pages":[2]},{"id":"L3-C04","cn":"组蛋白尾巴","en":"histone tail","abbr":"","definition":"核心组蛋白N端伸出于核小体外的柔性肽段，包括H2A tail、H2B tail、H3 tail、H4 tail。","detail":"是组蛋白化学修饰的主要位点，参与染色质结构调控。","note":"组蛋白尾巴的修饰属于共价修饰，与ATP依赖的染色质重塑是两条不同的调控途径。","pages":[2]},{"id":"L3-C05","cn":"ATP依赖的染色质重塑复合物","en":"ATP-dependent chromatin remodeling complex","abbr":"","definition":"利用水解ATP的能量来改变DNA环绕核小体位置的蛋白质机器。","detail":"通过核小体滑动使原本被组蛋白遮蔽的DNA序列暴露，使凝聚染色质转变为解聚染色质；分SWI/SNF、ISWI、CHD、INO80/SWR1四大家族。","note":"重塑改变的是核小体位置，不改变DNA序列，也不等同于组蛋白共价修饰。","pages":[3,4]},{"id":"L3-C06","cn":"SWI/SNF复合体","en":"SWI/SNF complex","abbr":"","definition":"含8-14个亚基、具同源调节域的ATP依赖染色质重塑复合体，可滑动和驱逐核小体，通常促进转录激活。","detail":"在癌症中突变率极高。","note":"SWI/SNF是“滑动/驱逐核小体”功能代表，不是组蛋白变体置换复合体。","pages":[4]},{"id":"L3-C07","cn":"NuRD复合体","en":"NuRD complex","abbr":"","definition":"属于CHD家族的复合体，兼具染色质重塑和组蛋白去乙酰化酶活性，主要参与转录抑制。","detail":"是“重塑”与“修饰”两种活性偶联的典型例子。","note":"NuRD的转录抑制作用来自重塑与去乙酰化的协同，不能只归因于其中一种活性。","pages":[4]},{"id":"L3-C08","cn":"组蛋白变体H2A.Z","en":"histone variant H2A.Z","abbr":"","definition":"由INO80/SWR1家族中的SWR1复合体负责将常规H2A置换而掺入核小体的组蛋白变体。","detail":"属于“置换组蛋白变体”功能，而非滑动核小体。","note":"SWR1置换的是H2A→H2A.Z，不是H3或H4。","pages":[4]},{"id":"L3-C09","cn":"半保留复制","en":"semi-conservative replication","abbr":"","definition":"DNA复制时每条链分别作为模板合成新链，每个子代DNA分子由一条亲代旧链和一条新合成链组成，碱基序列与亲代完全一致。","detail":"由Meselson-Stahl实验证明；保证了DNA在代谢上的稳定性，与DNA的遗传功能相符合。","note":"与全保留复制（一个子代全旧、一个全新）和弥散复制（新旧片段交错）相区别。","pages":[6,7,9,10]},{"id":"L3-C10","cn":"半不连续复制","en":"semi-discontinuous replication","abbr":"","definition":"DNA复制时前导链连续合成，而后随链以冈崎片段形式不连续合成，整体表现为半不连续的复制模式。","detail":"由冈崎等提出以解释等速复制现象；前导链连续复制与后随链不连续复制在生物界具有普遍性。","note":"“半”指两条新链中只有一条（后随链）是不连续合成的，不是两条链都半不连续。","pages":[6,23,24,25]},{"id":"L3-C11","cn":"冈崎片段","en":"Okazaki fragment","abbr":"","definition":"后随链上不连续合成的短DNA片段，每个片段由RNA引物起始，随后引物被去除、片段连接成完整链。","detail":"细菌中长度约1000 nt；真核生物中长度约200 nt。","note":"冈崎片段的存在是半不连续复制的直接证据；其长度在细菌与真核中不同。","pages":[6,24,26,54,57]},{"id":"L3-C12","cn":"复制子","en":"replicon","abbr":"","definition":"独立进行复制的一个DNA单位，含复制起点及其所控制的复制区域；一个复制子只含一个复制起点。","detail":"大肠杆菌1个复制子（4200 kb），酵母500个（平均40 kb），果蝇3500个（40 kb），蟾蜍15000个（200 kb），蚕豆35000个（300 kb）；真核复制子相对较小，为40-100 kb。","note":"复制起点是位点，复制子是包含该起点的独立复制单元，二者不是同一概念。","pages":[6,12,13,71]},{"id":"L3-C13","cn":"复制起点","en":"replication origin","abbr":"ori","definition":"DNA复制开始的固定起始位点，起始蛋白识别并局部解开双螺旋，暴露单链模板。","detail":"大肠杆菌中为oriC，全长245 bp，位于天冬酰胺合酶和ATP合酶操纵子之间；真核生物染色体有多个起点。","note":"E. coli只有一个起点，真核有多个起点。","pages":[12,21,30]},{"id":"L3-C14","cn":"复制叉","en":"replication fork","abbr":"","definition":"DNA复制时双链解开、子代链合成的Y形分叉结构，是复制实际进行的部位，随复制向两侧移动。","detail":"双向复制时一个起点形成两个复制叉，二者移动方向相反、速度相等。","note":"复制叉与复制泡是同一结构的两种描述角度：复制泡两端各有一个复制叉。","pages":[6,11,21]},{"id":"L3-C15","cn":"复制泡","en":"replication bubble","abbr":"","definition":"正在复制的DNA区域，因双链解开、新链合成而呈泡状结构，两端各有一个复制叉。","detail":"真核生物多个复制泡逐渐扩大并相互融合；电镜可见早期果蝇胚胎DNA上多个复制泡，大小不同说明各起点起始时间不同。","note":"复制泡不是独立于复制叉的结构，而是从整体形态描述复制区域。","pages":[14,15]},{"id":"L3-C16","cn":"θ结构","en":"theta structure","abbr":"θ","definition":"环状DNA从单一原点起始双向复制时形成的、形似希腊字母θ的复制中间体，由环状模板和内部的复制泡组成。","detail":"Cairns放射自显影证明大肠杆菌具有环状染色体、单一复制起点、复制与解旋同时进行；复制叉在Terminus处相遇终止，产生两个子代DNA分子。","note":"θ结构是环状染色体复制的形态学标志，真核线性染色体不形成θ结构。","pages":[18,62]},{"id":"L3-C17","cn":"前导链","en":"leading strand","abbr":"","definition":"在复制叉处沿解旋方向连续合成的新链，其合成方向与复制叉移动方向一致。","detail":"只需一个RNA引物即可连续延伸；真核中主要由DNA聚合酶ε负责。","note":"前导链连续合成不等于没有引物，仍需一个RNA引物起始。","pages":[24,54,82]},{"id":"L3-C18","cn":"后随链","en":"lagging strand","abbr":"","definition":"与复制叉移动方向相反、以不连续片段（冈崎片段）形式合成的新链。","detail":"每个冈崎片段都需要独立的RNA引物；真核中主要由DNA聚合酶δ负责，包括冈崎片段的延伸和成熟。","note":"后随链合成方向与复制叉移动方向相反，是“倒退式”合成。","pages":[24,54,57,82]},{"id":"L3-C19","cn":"引物","en":"primer","abbr":"","definition":"一段短的核酸序列（通常为RNA），与DNA模板链配对，提供游离的3'-OH末端，供DNA聚合酶起始合成脱氧核糖核苷酸链。","detail":"引物与模板链的交界处称为引物:模板接头（primer:template junction），是DNA聚合酶的结合与催化位点。","note":"引物和模板对于所有DNA合成都必不可少；DNA聚合酶不能从头合成。","pages":[36,38,43]},{"id":"L3-C20","cn":"引发酶","en":"primase","abbr":"","definition":"一种RNA聚合酶，合成短的RNA片段作为DNA复制的引物，为DNA聚合酶提供3'-OH末端。","detail":"引发酶不需要引物即可起始RNA合成；原核为DnaG，真核为DNA聚合酶α/引发酶。","note":"引发酶是RNA聚合酶，不是DNA聚合酶。","pages":[31,37,57,85]},{"id":"L3-C21","cn":"DNA解旋酶","en":"DNA helicase","abbr":"","definition":"利用ATP水解能量解开DNA双螺旋、产生单链模板的酶。","detail":"原核为DnaB（六聚体，装载需DnaC帮助），真核为MCM复合物；两个解旋酶各自独立作用于一个复制叉。","note":"解旋酶需要ATP供能；单链DNA结合蛋白不起解链作用。","pages":[31,32,56,85]},{"id":"L3-C22","cn":"单链DNA结合蛋白","en":"single-strand DNA-binding protein","abbr":"SSB","definition":"与单链DNA结合的蛋白质，通过协同结合使单链DNA伸展，抑制分子内碱基配对（发夹结构）的形成，防止单链重新退火或被降解。","detail":"以四聚体形式存在于复制叉处；结构上含domain A与domain B，包裹单链DNA。","note":"SSB并不能起解链作用，只维持单链状态。","pages":[31,33]},{"id":"L3-C23","cn":"DNA拓扑异构酶","en":"DNA topoisomerase","abbr":"","definition":"通过切断和重新连接DNA链来改变DNA拓扑状态、消除复制过程中产生的超螺旋张力的酶。","detail":"复制叉前方积累正超螺旋，拓扑异构酶II通过断裂DNA、使DNA通过断裂处并重新连接，将正超螺旋转化为负超螺旋；大肠杆菌复制终止时由拓扑异构酶IV解链。","note":"拓扑异构酶消除的是超螺旋张力，不是解开双链产生单链模板（后者是解旋酶）。","pages":[31,34,59]},{"id":"L3-C24","cn":"滑动夹","en":"sliding DNA clamp","abbr":"","definition":"一种环状蛋白，完全环绕新合成的DNA，与DNA聚合酶结合并将其系在模板上，从而大幅提高持续合成能力。","detail":"中央孔道约20Å可容纳双链DNA，外径约35Å；原核为DNA聚合酶III的β亚基，真核为PCNA；装载物原核为γ复合物，真核为复制因子C（RF-C）。","note":"夹子本身不催化合成，只起“系绳”（tether）作用。","pages":[42,50,51,85]},{"id":"L3-C25","cn":"持续合成能力","en":"processivity","abbr":"","definition":"作用于多聚底物的酶的一种特性；对DNA聚合酶而言，定义为酶每次结合引物:模板接头后平均加入的核苷酸数。","detail":"DNA聚合酶约为50,000个核苷酸；DNA Pol III全酶>10⁵，核心酶仅10-100；持续型聚合酶比非持续型合成效率提高约1000倍。","note":"processivity不等同于单位时间的催化速率（kcat），它反映酶与底物结合的稳定性。","pages":[48,49,63]},{"id":"L3-C26","cn":"DNA聚合酶III全酶","en":"DNA Pol III holoenzyme","abbr":"","definition":"大肠杆菌复制叉上的主要复制聚合酶复合物，由两个拷贝的核心酶、γ复合物（夹子装载器）及τ蛋白等组成。","detail":"含10个亚基，持续合成能力>10⁵；两个核心酶通过τ蛋白与γ复合物相连，使前导链与后随链合成得以协调。","note":"核心酶（3个亚基，持续合成能力10-100）与全酶（10个亚基，>10⁵）性质不同。","pages":[52,63,67]},{"id":"L3-C27","cn":"“长号”模型","en":"trombone model","abbr":"","definition":"描述大肠杆菌复制叉上两个DNA聚合酶通过τ蛋白二聚体连接、后随链模板成环以协调前导链与后随链同时合成的模型。","detail":"名称来自后随链模板环的伸缩如同长号滑管；电镜照片显示复制叉处形成“长号”状结构。","note":"长号模型解释的是两条链合成的协调，不改变半不连续复制的本质。","pages":[55]},{"id":"L3-C28","cn":"Klenow片段","en":"Klenow fragment","abbr":"","definition":"DNA聚合酶I经蛋白酶切割后的大片段（76 000），保留聚合酶活性和3'→5'外切活性，失去5'→3'外切活性。","detail":"由胰蛋白酶/枯草杆菌蛋白酶在324位氨基酸处切割产生；小片段（34 000）保留5'→3'外切活性。","note":"Klenow片段无5'→3'外切活性，不能用于切除RNA引物。","pages":[64]},{"id":"L3-C29","cn":"旁路修复","en":"bypass repair (translesion synthesis)","abbr":"","definition":"由DNA Pol IV、V在损伤位点对面直接掺入核苷酸、越过损伤继续合成的修复方式。","detail":"Pol IV由dinB编码，Pol V由umuD'2C编码，主要在SOS修复中发挥功能；持续合成能力极低（2-4），无外切活性。","note":"旁路修复保真性低，属易错修复。","pages":[63,68]},{"id":"L3-C30","cn":"自主复制序列","en":"autonomously replicating sequence","abbr":"ARS","definition":"真核生物DNA的复制子，长约150 bp，包括数个复制起始必需的保守区。","detail":"酵母ARS1含A元件（A1、A2、A3）与B元件（B1、B2、B3）；ORC结合于ARS。","note":"ARS是真核复制子的功能定义，不是所有真核复制起点都称ARS（酵母中常用）。","pages":[73]},{"id":"L3-C31","cn":"起始点识别复合物","en":"origin recognition complex","abbr":"ORC","definition":"由6种蛋白质组成的启动复合物，结合于ARS，参与真核生物DNA复制的起始。","detail":"G1期ORC结合起点，招募Cdc6、Cdt1，装载Mcm2-7解旋酶形成pre-RC。","note":"ORC是6蛋白复合物，原核对应起始蛋白为DnaA。","pages":[73,74,75,85]},{"id":"L3-C32","cn":"前复制复合体","en":"prereplicative complex","abbr":"pre-RC","definition":"G1期在复制起点组装、含ORC、Cdc6、Cdt1与Mcm2-7解旋酶的复合体，是起点被使用的前提。","detail":"组装顺序：ORC结合replicator→招募Cdc6与Cdt1→共同招募Mcm2-7；只有G1期形成pre-RC的起点才能被激活。","note":"pre-RC形成不等于复制起始，其激活还需Cdk/Ddk磷酸化。","pages":[74,75,76]},{"id":"L3-C33","cn":"Mcm解旋酶","en":"Mcm helicase","abbr":"Mcm2-7","definition":"由Mcm2-7六个亚基组成的DNA解旋酶，被装载到起点形成pre-RC，被Cdk/Ddk磷酸化后激活。","detail":"S期开始时Cdk和Ddk磷酸化Mcm与ORC，激活前者并使后者失活。","note":"Mcm是真核解旋酶，原核对应DnaB。","pages":[74,75,76]},{"id":"L3-C34","cn":"Cdk","en":"cyclin-dependent kinase","abbr":"Cdk","definition":"周期蛋白依赖性激酶，仅在细胞进入S期时被激活，磷酸化pre-RC以启动复制。","detail":"与Ddk一起在S期激活pre-RC；高Cdk活性抑制新的pre-RC形成但激活已存在的pre-RC。","note":"Cdk活性高低与pre-RC组装/激活状态互补，保证每周期只复制一次。","pages":[76,77,78]},{"id":"L3-C35","cn":"突变","en":"mutation","abbr":"","definition":"DNA碱基序列发生的永久性、可遗传的改变（Permanent, heritable alterations in the base sequence of DNA）。","detail":"来源包括复制精确性不足导致的自发错误，以及诱变剂（mutagen）引起的诱变（mutagenesis）。","note":"关键词为permanent、heritable、base sequence，缺一不可。","pages":[87]},{"id":"L3-C36","cn":"转换","en":"transition","abbr":"","definition":"嘌呤被嘌呤替换，或嘧啶被嘧啶替换的碱基替换方式，即A↔G或C↔T。","detail":"与颠换同属替换突变（substitution mutation）。","note":"转换发生在同类碱基之间，颠换发生在嘌呤与嘧啶之间。","pages":[88]},{"id":"L3-C37","cn":"颠换","en":"transversion","abbr":"","definition":"嘌呤被嘧啶替换或嘧啶被嘌呤替换的碱基替换方式，即A/G与C/T之间的互换。","detail":"包括A↔C、A↔T、G↔C、G↔T。","note":"颠换与转换的区别在于碱基类别是否改变。","pages":[88]},{"id":"L3-C38","cn":"移码突变","en":"frameshift mutation","abbr":"","definition":"因核苷酸插入或缺失（非3的整数倍）改变阅读框，使下游密码子全部改变，产生无功能蛋白质。","detail":"若插入/缺失为3的整数倍则不移码，只丢失或增加一个氨基酸。","note":"幻灯片用“may cause frameshift”，说明并非所有插入/缺失都移码。","pages":[92,93]},{"id":"L3-C39","cn":"三核苷酸重复扩增","en":"trinucleotide repeat expansion","abbr":"","definition":"基因组中三核苷酸短串联重复序列拷贝数异常增加，属于插入突变，可导致多种神经系统与发育疾病。","detail":"如Huntington disease（4p16.3，CAG，正常9-35，突变37-100）、Kennedy disease（Xq21，CAG，17-24→40-55）、SCA1（6p23，CAG，19-36→43-81）、DRPLA（12p，CAG，7-23→>49）、Fragile X site A（Xq27.3，CGG，6-54→>200）、Fragile X site E（Xq28，CCG，6-25→>200）、Fragile X site F（Xq28，GCC，6-29→>500）、Myotonic dystrophy（19q13，CTG，5-35→50-4000）。","note":"正常重复数与突变重复数之间存在明确阈值，超过阈值即致病。","pages":[94]},{"id":"L3-C40","cn":"癌基因","en":"oncogene","abbr":"","definition":"其激活（表达异常增高或产物增多）可促进细胞恶性转化、导致癌症的基因。","detail":"癌基因的激活导致癌基因产物增多而致癌。","note":"癌基因是“激活/获得功能”，抑癌基因是“失活/丢失功能”，方向相反。","pages":[91]},{"id":"L3-C41","cn":"抑癌基因","en":"tumor suppressor gene","abbr":"","definition":"其失活或缺失使产物表达下降或缺失，从而失去抑制细胞生长作用、可能使癌基因充分发挥作用而致癌的基因。","detail":"与癌基因激活共同构成多基因突变致癌的两条互补途径。","note":"抑癌基因的致病方式是功能丢失，不是获得功能。","pages":[91]},{"id":"L3-C42","cn":"复制的精确性","en":"replication fidelity","abbr":"","definition":"DNA复制过程中碱基配对准确的程度，对把遗传信息从一代传递到下一代至关重要。","detail":"大肠杆菌每10^10个碱基仅出现一个错误；体内精确性的提高很大程度上归因于DNA聚合酶的校对功能。","note":"体内错误率远低于聚合酶本身引入的错误率，说明还有校读等纠错机制。","pages":[95,101]},{"id":"L3-C43","cn":"校对","en":"proofreading","abbr":"","definition":"纠正在蛋白质或核酸合成过程中所出现错误的任何机制，这些机制涉及在单个亚基被添加到链上之后对其进行检查和审核。","detail":"DNA聚合酶利用3'→5'外切酶活性切除刚掺入的错误核苷酸，再重新掺入正确核苷酸。","note":"校对发生在“单个亚基已添加到链上之后”，区别于聚合酶对进入位点碱基的预先选择。","pages":[96,97,98]},{"id":"L3-C44","cn":"聚合酶活性位点","en":"polymerase site","abbr":"P site","definition":"催化dNTP与引物3'-OH之间形成磷酸二酯键、延伸新链的活性中心。","detail":"位于手掌结构域，结合两个金属离子催化反应。","note":"P位点与外切酶位点（E位点）在空间上是分开的，相距约3 nm。","pages":[99,100]},{"id":"L3-C45","cn":"外切酶活性位点","en":"exonuclease site","abbr":"E site","definition":"水解新链3'端核苷酸的活性中心，负责校读切除。","detail":"发生错配时新链3'端从P位点转移到E位点被切除，随后翻回P位点继续合成。","note":"外切酶活性方向为3'→5'，与合成方向5'→3'相反。","pages":[99,100]},{"id":"L3-C46","cn":"错配修复","en":"mismatch repair","abbr":"MMR","definition":"识别并切除复制后新链上的错配碱基，由DNA连接酶等补齐缺口的修复系统。","detail":"链定向错配修复使错误率再降低约1/10^2，是三步保真机制的最后一步。","note":"错配修复是复制后修复，区别于聚合酶的即时校读。","pages":[104,105]},{"id":"L3-C47","cn":"碱基切除修复","en":"base-excision repair","abbr":"BER","definition":"处理单个受损碱基（如尿嘧啶、无碱基位点、8-氧代鸟嘌呤、单链断裂）的修复途径。","detail":"与核苷酸切除修复（NER）并列，属于切除修复的一种。","note":"BER处理单个碱基损伤，NER切除含损伤的一段寡核苷酸。","pages":[103,104]},{"id":"L3-C48","cn":"核苷酸切除修复","en":"nucleotide-excision repair","abbr":"NER","definition":"切除含损伤的一段寡核苷酸、处理大体积加合物、CPD、(6-4)PP等损伤的修复途径。","detail":"与BER同属切除修复，但切除单位是核苷酸片段而非单个碱基。","note":"UV光产物（CPD、(6-4)PP）由NER修复，不是BER。","pages":[103,104]},{"id":"L3-C49","cn":"非同源末端连接","en":"non-homologous end joining","abbr":"NHEJ","definition":"不需要任何模板的帮助，修复蛋白可以直接将双股裂断的末端彼此拉近，再藉由DNA ligase将断裂的两股重新接合的修复方式。","detail":"与同源重组修复并列，处理双链断裂。","note":"NHEJ不需模板、易产生缺失或插入，属易错修复。","pages":[104]},{"id":"L3-C50","cn":"SOS系统","en":"SOS response","abbr":"","definition":"细胞在DNA受到损伤时为求生存而产生的一种应急措施，可诱导DNA损伤修复、诱变效应、细胞分裂的抑制以及溶原性细菌释放噬菌体等。","detail":"以易错修复为代价换取生存，导致变异。","note":"SOS系统与高保真的校读/错配修复形成对照，是损伤严重时的全局应急反应。","pages":[104]},{"id":"L3-C51","cn":"端粒酶","en":"telomerase","abbr":"","definition":"一种特殊的逆转录酶，携带自身的RNA模板，以RNA为模板在染色体3'端延伸端粒重复序列，补偿末端缩短。","detail":"人类端粒重复序列为TTAGGG；延伸出的3'单链末端回折形成T环（T-loop）保护染色体末端。","note":"端粒酶是逆转录酶，模板是RNA而非DNA；原核生物无端粒酶。","pages":[60,85]}],"processes":[{"id":"L3-P01","name":"核小体滑动（染色质重塑）","en":"nucleosome sliding","overview":"ATP依赖的染色质重塑复合物结合核小体，在ATP水解驱动下沿DNA移动核小体位置，使被遮蔽的DNA序列暴露。","steps":[{"n":1,"name":"结合","detail":"ATP依赖的染色质重塑复合物结合到核小体上。"},{"n":2,"name":"ATP水解","detail":"ATP水解为ADP，催化核小体滑动。"},{"n":3,"name":"核小体移位","detail":"核小体沿DNA移位，DNA上新的区段暴露出来。"}],"key_points":["能量来自ATP水解","反复多轮核小体滑动可使凝聚染色质变为解聚染色质","不改变DNA序列"],"regulation":["与组蛋白修饰酶协同，共同决定基因组在特定时空下的开放或关闭状态"],"figures":["图(A)：重塑复合物结合核小体，ATP水解驱动滑动；图(B)：凝聚染色质经反复多轮滑动变为解聚染色质"],"pages":[3]},{"id":"L3-P02","name":"Meselson-Stahl实验","en":"Meselson-Stahl experiment","overview":"用15N重同位素标记与等密度梯度离心证明DNA半保留复制。","steps":[{"n":1,"name":"轻培养基培养","detail":"细菌在轻培养基中培养，离心得一条轻带（light DNA molecules）。"},{"n":2,"name":"重培养基培养","detail":"细菌转入重培养基培养，离心得一条重带（heavy DNA molecules）。"},{"n":3,"name":"转移至轻培养基","detail":"把重标记细菌转移到轻培养基中再培养20 min，离心得中间密度带（DNA molecules of intermediate weight）。"}],"key_points":["中间密度带只能由“一条旧链＋一条新链”的杂合分子解释","排除全保留复制与弥散复制模型","Meselson是Pauling的研究生；幻灯片称其为“最美的生物学实验”"],"regulation":[],"figures":["三组条件的对照图：锥形瓶（培养条件）、离心管（离心结果）、DNA双螺旋示意（解释）"],"pages":[9]},{"id":"L3-P03","name":"真核生物多复制子复制","en":"multiple eukaryotic replicons","overview":"多个复制起点各自负责一个复制子区域，复制泡逐渐扩大并相互融合。","steps":[{"n":1,"name":"起点对应复制子","detail":"复制起点O1、O2、O3分别对应复制子R1、R2、R3。"},{"n":2,"name":"双螺旋解开","detail":"双螺旋在起点处解开，形成向一个方向生长的“叉”。"},{"n":3,"name":"形成复制泡","detail":"被复制的区域呈泡状，称为复制泡（replication bubble）。"},{"n":4,"name":"复制泡融合","detail":"复制泡逐渐扩大，相邻复制泡最终融合。"}],"key_points":["真核生物靠多起点同时复制缩短总复制时间","复制泡大小不同说明各起点起始时间不同"],"regulation":["真核复制只在S期进行；复制子簇按早期、中期、晚期S期依次激活（多米诺模型）"],"figures":["蓝色为亲代DNA双链，红色为复制泡，O1/O2/O3为复制起点，R1/R2/R3为对应复制子"],"pages":[14,15,72]},{"id":"L3-P04","name":"大肠杆菌oriC起始DNA复制","en":"initiation of DNA replication at E. coli oriC","overview":"由DnaA、HU、DnaC、DnaB依次作用完成起始，最终与引物结合起始DNA复制。","steps":[{"n":1,"name":"DnaA结合","detail":"大约20个DnaA蛋白在ATP的作用下与oriC处的4个9 bp保守序列（DnaA box）相结合。"},{"n":2,"name":"开链","detail":"在HU蛋白和ATP的共同作用下，DnaA复制起始复合物使3x13 bp直接重复序列变形，形成开链（open complex）。"},{"n":3,"name":"装载解链酶","detail":"DnaB（解链酶）六体分别与单链DNA相结合（需要DnaC的帮助），进一步解开DNA双链。"},{"n":4,"name":"起始复制","detail":"与引物结合，起始DNA复制。"}],"key_points":["oriC全长245 bp，含4个9 bp保守序列与3个13 bp直接重复序列","DnaA约20个蛋白分子","DnaB装载需要DnaC帮助"],"regulation":["真核对应起始蛋白为Orc1~Orc6，解链酶为MCM复合物，装载物为Cdc6+Cdr1"],"figures":["oriC上3个13 bp直接重复序列与4个9 bp重复序列的相对排布，以及DnaA、HU、DnaC、DnaB依次作用"],"pages":[30,41]},{"id":"L3-P05","name":"DNA合成的化学反应","en":"chemistry of DNA synthesis","overview":"DNA合成是脱氧核苷酸之间通过磷酸二酯键形成共价连接的缩合反应，由引物3'-OH亲核攻击进入dNTP的α-磷酸基团。","steps":[{"n":1,"name":"碱基配对","detail":"进入的dNTP与模板链上的互补碱基配对。"},{"n":2,"name":"亲核攻击","detail":"引物的3'-OH对dNTP的α-磷酸基团进行亲核攻击。"},{"n":3,"name":"释放焦磷酸","detail":"释放一个焦磷酸（PPᵢ）分子，由焦磷酸酶水解为2个无机磷酸（2 Pi）。"},{"n":4,"name":"形成磷酸二酯键","detail":"形成磷酸二酯键，DNA链沿5'→3'方向延伸。"}],"key_points":["需要引物和模板","需要Mg²⁺激活","链延伸方向为5'→3'","焦磷酸水解推动反应正向进行"],"regulation":[],"figures":["引物3'-OH攻击dNTP α-磷酸基团，释放焦磷酸，焦磷酸酶水解"],"pages":[36,38,39,69]},{"id":"L3-P06","name":"滑动夹装载","en":"clamp loading","overview":"夹子装载器在ATP驱动下打开滑动夹、套上DNA，再水解ATP关闭夹子并释放装载器，随后DNA聚合酶结合夹子。","steps":[{"n":1,"name":"打开夹子","detail":"ATP结合夹子装载器使滑动夹打开。"},{"n":2,"name":"DNA进入","detail":"DNA进入夹子。"},{"n":3,"name":"锁合与释放","detail":"ATP水解使夹子锁合在DNA上并释放装载器。"},{"n":4,"name":"聚合酶结合","detail":"DNA聚合酶结合滑动夹。"},{"n":5,"name":"装载器循环","detail":"释放的夹子装载器被循环利用。"}],"key_points":["ATP依赖过程","夹子最终作为系绳交给DNA聚合酶","原核装载器为γ复合物，真核为RF-C"],"regulation":[],"figures":["夹子装载器将滑动夹装载到DNA上并交给DNA聚合酶的分步示意图"],"pages":[53]},{"id":"L3-P07","name":"后随链合成","en":"lagging strand synthesis","overview":"后随链沿复制叉移动的反方向不连续合成，每一段都以RNA引物起始，切除引物、填补缺口后由DNA连接酶封口。","steps":[{"n":1,"name":"复制叉移动暴露模板","detail":"复制叉移动，旧链（母链）暴露，后随链模板方向为5'→3'（相对复制叉），需反向合成。"},{"n":2,"name":"合成RNA引物","detail":"引物酶（primase）在后随链模板上合成一段新的RNA引物。"},{"n":3,"name":"延伸冈崎片段","detail":"DNA聚合酶按模板序列延伸引物，合成冈崎片段，直至遇到前一个片段的引物。"},{"n":4,"name":"去除引物并填补","detail":"具5'→3'核酸外切酶活性的DNA聚合酶去除RNA引物并填补缺口。"},{"n":5,"name":"连接片段","detail":"DNA连接酶把相邻片段连接起来。"}],"key_points":["每个冈崎片段都需要独立的RNA引物","后随链合成方向与复制叉移动方向相反","细菌冈崎片段约1000 nt，真核约200 nt"],"regulation":["与后随链聚合酶在复制体内自主发挥功能，存在暂停与速度切换"],"figures":["(a)—(e)分步示意图与右侧五步流程图；红色为RNA，蓝色为新合成DNA，橙色为模板链"],"pages":[57]},{"id":"L3-P08","name":"RNA引物去除与缺口填补","en":"removal of RNA primer and gap filling","overview":"从含RNA引物的DNA-RNA杂合链到完全由DNA组成、并由连接酶封口的连续链。","steps":[{"n":1,"name":"RNase H水解","detail":"RNase H特异性地水解DNA-RNA杂合链中的RNA，去除除与DNA末端直接相连的那个核糖核苷酸以外的全部RNA引物。"},{"n":2,"name":"外切酶切除最后一个核苷酸","detail":"5'核酸外切酶去除最后一个核糖核苷酸。"},{"n":3,"name":"聚合酶填补","detail":"DNA聚合酶填补缺口，但在修复链的3'-OH与5'-磷酸之间留下骨架上的断裂（break）。"},{"n":4,"name":"连接酶封口","detail":"DNA连接酶修复该缺口（nick）。"}],"key_points":["原核由DNA聚合酶I完成切除并填补","真核由RNase H与FEN1协同切除RNA引物","缺口（nick）区别于gap（缺失核苷酸）"],"regulation":[],"figures":["自上而下五步的引物去除示意图，绿色为RNA引物，橙色为填补后的DNA"],"pages":[58]},{"id":"L3-P09","name":"大肠杆菌复制终止","en":"termination of replication in E. coli","overview":"复制叉前移遇到终止子序列后形成Tus-Ter复合物，阻止解旋酶继续前进，最终由拓扑异构酶IV解链。","steps":[{"n":1,"name":"遇到Ter","detail":"复制叉前移，遇到20 bp重复性终止子序列（Ter）。"},{"n":2,"name":"形成Tus-Ter复合物","detail":"Tus蛋白与Ter序列结合，形成Tus-Ter复合物。"},{"n":3,"name":"阻断复制叉","detail":"Ter-Tus复合物抑制解旋酶（DnaB）活性，阻挡复制叉继续前移。"},{"n":4,"name":"复制叉解体","detail":"等待相反方向的复制叉到达，在DNA拓扑异构酶IV作用下复制叉解体，释放子链DNA。"}],"key_points":["Ter长20 bp，染色体上有多个（TerA—TerG等）","Ter位点呈两个极性相反的“陷阱”簇排列","复制叉解体依赖DNA拓扑异构酶IV"],"regulation":[],"figures":["上图：Tus-Ter复合物阻断复制叉；下图：环状染色体上复制起点、双向复制叉与Ter位点分布"],"pages":[59]},{"id":"L3-P10","name":"真核生物复制起始的细胞周期调控","en":"initiation of eukaryotic DNA replication","overview":"通过前复制复合体（pre-RC）的组装与磷酸化激活，保证每个复制起点在每个细胞周期中仅被激活一次。","steps":[{"n":1,"name":"G1期组装pre-RC","detail":"ORC结合起点，招募Cdc6、Cdt1，装载Mcm解旋酶，形成前复制复合体。"},{"n":2,"name":"S期磷酸化激活","detail":"Cdk和Ddk磷酸化Mcm与ORC，激活Mcm（解旋酶），使ORC失活。"},{"n":3,"name":"起始合成","detail":"ORC被置换下来，DNA聚合酶等复制蛋白被招募，DNA合成开始。"},{"n":4,"name":"ORC重新结合","detail":"复制叉移动，新的ORC迅速结合到新复制的起点上。"},{"n":5,"name":"防止再起始","detail":"新的前复制复合体无法在该起点形成，直到进入下一个G1期，此时结合的ORC已被去磷酸化。"}],"key_points":["低Cdk活性允许pre-RC形成但不激活","高Cdk活性抑制新的pre-RC形成但激活已存在的pre-RC","Cdk和Ddk仅在细胞进入S期时被激活"],"regulation":["Cdk活性周期性升降与pre-RC组装/激活状态互补，确保每个细胞周期仅复制一次"],"figures":["细胞周期（G1→S→G2）中复制起点状态变化示意图"],"pages":[74,75,76,77,78]},{"id":"L3-P11","name":"DNA聚合酶的校读","en":"proofreading by DNA polymerase","overview":"错误核苷酸掺入后，在继续延伸之前被聚合酶切除并替换为正确核苷酸，随后合成继续。","steps":[{"n":1,"name":"掺入错误核苷酸","detail":"聚合酶掺入了一个错误（错配）的核苷酸，新链3'端出现错配，合成减慢或停止。"},{"n":2,"name":"转移到外切酶位点","detail":"3'端转移到外切酶活性位点（相距约3 nm），由3'→5'校读活性切除错配核苷酸。"},{"n":3,"name":"恢复配对","detail":"3'端翻回聚合酶活性位点，恢复正确配对。"},{"n":4,"name":"继续合成","detail":"合成沿5'→3'方向继续。"}],"key_points":["合成方向5'→3'，切除方向3'→5'","聚合位点与外切位点空间分开","校读发生在延伸之前，不留下突变"],"regulation":["E. coli DNA Pol I与Pol III（核心酶ε亚基）有校读活性；动物细胞δ、ε有校读活性，α没有"],"figures":["四步示意图：掺入错误核苷酸→切除→恢复配对→继续合成；右手模型展示P位点与E位点切换"],"pages":[97,98,99,100,101]},{"id":"L3-P12","name":"多基因突变致癌","en":"multistep carcinogenesis","overview":"外界刺激与遗传因素引起基因突变，突变累及癌基因（激活）和抑癌基因（丢失或失活），共同导致肿瘤。","steps":[{"n":1,"name":"外界刺激与遗传因素","detail":"外界刺激与遗传因素共同作用。"},{"n":2,"name":"基因突变","detail":"发生多次基因突变。"},{"n":3,"name":"癌基因激活","detail":"癌基因被激活，产物增多。"},{"n":4,"name":"抑癌基因失活","detail":"抑癌基因丢失或失活，产物表达下降或缺失。"},{"n":5,"name":"形成肿瘤","detail":"癌基因激活与抑癌基因失活共同作用，导致肿瘤。"}],"key_points":["癌症需多个基因突变累积","癌症发病率随年龄呈指数式上升，符合多基因突变逐步累积模型"],"regulation":[],"figures":["致癌通路示意图；癌症发病率随年龄变化曲线（40岁后急剧上升，75—80岁接近160/10万女性）"],"pages":[91]}],"distinctions":[{"id":"L3-D01","title":"半保留复制 vs 全保留复制","a":"半保留复制（semi-conservative replication）","b":"全保留复制（conservative replication）","difference":["半保留复制后每个子代双链含一条亲代链和一条新链","全保留复制后一个子代分子完全由亲代链组成，另一个完全由新链组成","Meselson-Stahl实验的中间密度带支持半保留复制，排除全保留复制"],"easy_mistake":"误以为全保留复制也会产生中间密度带；实际上全保留复制只产生轻带与重带两条带。","pages":[8,9,10]},{"id":"L3-D02","title":"半保留复制 vs 色散复制","a":"半保留复制（semi-conservative replication）","b":"色散复制（dispersive replication）","difference":["半保留复制中亲代链完整保留于同一子代分子中","色散复制中亲代与新生片段交错分布于两条子代双链的各个
