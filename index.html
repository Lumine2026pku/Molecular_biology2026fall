核糖体上合成，以翻译运转同步机制运输；细胞器蛋白（核、叶绿体、线粒体、乙醛酸循环体、过氧化物酶体中的蛋白质）在游离核糖体上合成，以翻译后运转机制运输；膜形成相关蛋白（质膜、内质网、类囊体中的蛋白质）两种机制兼有。","note":"三类蛋白与两种转运机制的对应关系是必考表格，常以连线或选择题形式出现。","pages":[7]},{"id":"L8-F03","text":"信号肽（signal peptide）位于被运入内质网内腔蛋白的氨基末端，长13-36个残基；一般含10-15个疏水氨基酸；靠近N端常有1个或数个带正电荷的氨基酸；C端靠近蛋白酶切割位点处常有数个极性氨基酸，离切割位点最近的那个氨基酸往往侧链很短（丙氨酸或甘氨酸）。","note":"信号肽的结构特征（长度、疏水核心、N端正电荷、C端切割位点特征）是名词解释与简答题的标准答案要点。","pages":[11]},{"id":"L8-F04","text":"信号识别颗粒（SRP）是一个小的RNA-蛋白质复合体，由约300个核苷酸的7S RNA和6种紧密结合的蛋白质（分子量9~72 kDa）组成；在翻译过程中SRP能识别信号序列，指导核糖体到转运通道。SRP的结构域分别负责延伸停滞（elongation arrest）、受体结合（receptor binding）和信号识别（signal recognition）。","note":"SRP的组成（7S RNA + 6种蛋白，9~72 kDa）与三大功能域是填空/选择常考点。","pages":[14]},{"id":"L8-F05","text":"SRP与DP（停靠蛋白，Docking Protein，即SRP受体）介导的跨膜运转：SRP同时识别需经内质网膜运转的新生肽和自由核糖体，导致多肽合成暂时终止（此时新生肽长约70个残基）；SRP-信号肽-多核糖体复合物被引向内质网膜并与DP结合；SRP与DP结合很可能导致受体聚集形成膜孔道，使信号肽及相连新生肽通过。","note":"“新生肽约70个残基时翻译暂停”是常考数字；SRP受体即DP这一同义名要记住。","pages":[15]},{"id":"L8-F06","text":"信号肽在蛋白质运输中的作用有四点限定：①完整的信号肽是保证蛋白质运转的必要条件；②仅有信号肽还不足以保证运转发生，还要求运转蛋白在信号序列以外的部分有相应结构变化；③信号序列的切除并不是运转所必需的；④并非所有运转蛋白都有可降解的信号肽。","note":"这四点是判断题与简答题的易错点，尤其“切除并非运转必需”“并非所有转运蛋白都有可降解信号肽”。","pages":[16]},{"id":"L8-F07","text":"共翻译转运（同步转运）进入ER腔的关键步骤：新生肽N端信号肽被SRP识别→翻译暂停→复合物结合内质网膜上SRP受体→SRP释放，核糖体与易位子（translocon）结合，GTP水解为GDP+Pi→新生肽穿膜进入ER腔，信号肽被信号肽酶（signal peptidase）切除→信号肽降解→核糖体亚基解离回细胞质循环使用。","note":"该过程顺序（SRP识别→暂停→结合受体→GTP水解→易位子→信号肽酶切除）是简答题标准流程，注意GTP水解与信号肽酶位于ER腔面。","pages":[17]},{"id":"L8-F08","text":"线粒体蛋白跨膜转运：前体蛋白（precursor）由成熟蛋白和N端前导肽（leader peptide）组成；胞质中Hsp70或MSF与前体蛋白结合保持其未折叠状态；外膜Tom受体复合物识别前导肽，经Tom和Tim组成的膜通道进入基质；基质中mHsp70结合前体，ATP水解为ADP+Pi驱动转运；蛋白酶水解切除前导肽，成熟蛋白折叠。转运能量来自Hsp70引发的ATP水解和膜电位差。","note":"Tom（外膜）/Tim（内膜）、Hsp70/MSF维持伸展、mHsp70 ATP驱动、膜电位参与，是线粒体转运的核心考点。","pages":[19]},{"id":"L8-F09","text":"不同定位信号的去向与是否被切除：信号肽（signal peptide）去内质网（分泌/膜/溶酶体蛋白），被切除；前导肽/转运肽（transit peptide）去叶绿体、线粒体，被切除；核定位信号（NLS）去细胞核，不被切除；过氧化物酶体靶向信号（PTS）去过氧化物酶体，是否切除视类型而定。","note":"NLS不被切除、可反复使用，是与信号肽/转运肽最关键的辨析点。","pages":[20]},{"id":"L8-F10","text":"前导肽的性质：①富含带正电荷的碱性氨基酸（特别是精氨酸），分散于不带电荷的氨基酸序列之间；②缺少带负电荷的酸性氨基酸；③羟基氨基酸（Ser等）含量较高；④有形成两亲（既有亲水又有疏水部分）α-螺旋结构的能力。","note":"前导肽四条性质常作简答或选择；两亲α-螺旋是其穿膜与识别的结构基础。","pages":[21]},{"id":"L8-F11","text":"前导肽不同区域在跨膜转运中起不同作用：一部分负责外膜识别；另一部分可作为“止运入”肽段（stop-transfer peptide）使蛋白留在膜间空间；前导肽被切除后成熟蛋白定位于内腔（基质）。","note":"止运入肽段决定蛋白最终定位（膜间空间 vs 基质），是较细的选择题考点。","pages":[22]},{"id":"L8-F12","text":"叶绿体蛋白跨膜转运：叶绿体多肽在胞质游离核糖体上合成后脱离核糖体并折叠成具三级结构的蛋白分子，与叶绿体膜上特异受体位点结合；定位信号肽一般分两部分：第一部分决定能否进入叶绿体基质（STROMA），第二部分决定能否进入类囊体（lumen）。类囊体蛋白前体进入基质后，第一部分信号肽被基质中可溶性蛋白水解酶切除，跨类囊体膜后第二部分信号肽被切除。","note":"叶绿体信号肽“两部分、两次切除”是区别于线粒体的关键；可溶性活性蛋白水解酶位于基质是鉴别翻译后转运的指标之一。","pages":[23,24]},{"id":"L8-F13","text":"核孔运输的方向性与底物选择性（次/孔/分钟）：入核——组蛋白100、非组蛋白100、核糖体蛋白150；出核——核糖体亚基约5、mRNA <1。核孔复合体（NPC）嵌入内外核膜融合处，具环状八重对称结构，比例尺约50 nm。","note":"入核与出核通量不对称（入核100-150 vs 出核<1-5）是常考数据；NPC八重对称结构是填空点。","pages":[25]},{"id":"L8-F14","text":"NLS的共有序列：经典单分型NLS由4~8个氨基酸组成、富含碱性氨基酸，共有序列K(K/R)X(K/R)，典型例子SV40-NLS（126PKKKRKV132）；经典双分型NLS由两簇碱性氨基酸组成，中间隔10~12个非保守残基，共有序列R/K(X)10-12RRKK，例子Nucleoplasmin KR-10aa-KKKL171、P53 KR-12aa-KKK321；非经典NLS1如IκBα的NLS位于第二锚蛋白重复序列上，由疏水性氨基酸构成。NLS可位于核蛋白任何部位，一般不被切除。","note":"单分型/双分型共有序列与SV40、Nucleoplasmin、P53实例是高频填空与选择点。","pages":[27,28]},{"id":"L8-F15","text":"核蛋白入核：Importin α/β异源二聚体为可溶性受体，α亚基直接结合NLS，β亚基参与核孔停靠与转位；入核转位能量来自Ran GTP酶水解GTP（GTP→GDP+Pi）；核内α、β解离、货物释放，α和β分别经核孔复合体返回细胞质循环使用。","note":"“α结合NLS、β负责停靠转位”“Ran GTP水解供能”是简答与选择的必答点。","pages":[29]},{"id":"L8-F16","text":"出核信号序列NES的特征为疏水性氨基酸（尤其亮氨酸和异亮氨酸）富集，共有序列ΦXnΦXnΦXΦ（Φ=L, I, V, F, M，X任意）；实例：HIV-1 Rev（L-PPLERLT-L）、PKI（LALKLAGLD-L）、IκBα（MVKELQEIR-L）、COMMD1（VNQILKTLSEV）、HSCARG（272-278位，I--EL-TLR-L）。NES被CRM1识别介导出核，可被Leptomycine-B（LMB）抑制。","note":"NES共有序列、CRM1依赖、LMB抑制实验是出核部分的三大考点。","pages":[30]},{"id":"L8-F17","text":"Ran-GTP/GDP梯度驱动核质双向运输：入核——胞质中Ran-GDP占优，Importin α/β与NLS货物形成稳定复合物，过孔后核内Ran-GTP结合Importin β使复合物解体、释放货物；出核——核内Ran-GTP促进输出受体（CRM1类）与NES货物结合，过孔后胞质中GTP水解为GDP，复合物解体释放货物。","note":"“Ran-GTP在核内高、Ran-GDP在胞质高”的梯度决定运输方向，是分析题核心逻辑。","pages":[31]},{"id":"L8-F18","text":"细菌蛋白质可以共转运（co-translational translocation）或后转运（post-translational protein transport）两种方式输出，最终可定位于内膜、外膜、周质空间（periplasmic space）或被分泌到胞外；细菌具有内膜与外膜两层膜。","note":"细菌双膜系统与两种转运方式的对应是选择题点；周质空间是内膜与外膜之间的空间。","pages":[32]},{"id":"L8-F19","text":"2004年诺贝尔化学奖授予Aaron Ciechanover、Avram Hershko和Irwin Rose，理由为“for the discovery of ubiquitin-mediated protein degradation”（发现泛素介导的蛋白质降解）。","note":"诺奖年份、三位获奖者姓名与获奖理由是经典填空/选择题。","pages":[34]},{"id":"L8-F20","text":"泛素（ubiquitin）由76个氨基酸组成，分子量8.5 kDa，存在于所有细胞中（故得名ubiquitous），进化上高度保守（酵母与人类同源物之间仅3个氨基酸差异）；泛素化是泛素C端与底物赖氨酸ε-氨基通过异肽键（isopeptide bond）共价连接。","note":"76 aa、8.5 kDa、酵母与人仅差3个氨基酸、异肽键连接Lys ε-氨基，均为高频填空点。","pages":[33,37]},{"id":"L8-F21","text":"泛素化级联的酶数量：人类基因组编码2种E1、约50种E2、超过600种E3（E1 one、E2s tens、E3s hundreds）；E3决定底物特异性。","note":"2/50/600的数量关系体现“少数激活酶—多种连接酶”的层级放大，是选择与简答常考点。","pages":[36,39]},{"id":"L8-F22","text":"泛素链拓扑与命运：单泛素化/多位点单泛素化→蛋白互作、定位与活性调节；K48或K11链→导向26S蛋白酶体降解；K63链→DNA修复、NF-κB信号、溶酶体靶向；K6/K27/K29/K33链→功能尚不明确（DNA修复？蛋白降解？）；分叉/分支链→功能未知；异源链、线性链等→蛋白降解？","note":"K48=降解、K63=信号/修复是最核心的对照，常以选择或简答形式考。","pages":[36,46]},{"id":"L8-F23","text":"泛素分子共有7个赖氨酸（K6、K11、K27、K29、K33、K48、K63）可作为链连接位点，加上N端M1（线性链起始位点），构成泛素链拓扑多样性的结构基础；I44、L8、V70为疏水斑块，参与受体识别。","note":"“7个赖氨酸+M1”是填空点；疏水斑块I44参与受体识别是较细的选择题点。","pages":[38]},{"id":"L8-F24","text":"泛素化反应步骤：Ub的C端羧基与ATP反应释放AMP+PPi，形成Ub-腺苷酸；Ub转移到E1活性半胱氨酸（SH）形成E1-S-Ub硫酯中间体；经转硫酯化转移到E2的活性Cys形成E2-S-Ub；E3结合靶蛋白并催化Ub从E2转移到 底物赖氨酸ε-氨基形成异肽键；多轮循环形成多聚泛素链送入蛋白酶体降解。","note":"“ATP→AMP+PPi”“硫酯中间体”“异肽键”三个关键词是简答与填空的采分点。","pages":[39,40]},{"id":"L8-F25","text":"E3泛素连接酶两大类型：HECT型先与泛素形成共价E3-泛素中间体，再把泛素转移给底物（两步转移）；RING型不形成共价中间体，直接促使泛素从E2~Ub转移到底物（一步转移）。","note":"HECT与RING的机制差异（是否形成共价E3-Ub中间体）是经典选择题。","pages":[42]},{"id":"L8-F26","text":"人类基因组编码近100种对泛素特异的DUB，分属五个基因家族：UCHs（泛素C端水解酶）、USPs（泛素特异性蛋白酶）、OTUs（卵巢肿瘤蛋白酶）、MJD（Machado-Joseph病蛋白酶）、JAMMs（JAB1/MPN/MOV34金属酶，又称MPN+）；前四类为半胱氨酸蛋白酶，JAMMs为含Zn2+的金属蛋白酶。","note":"五个家族名称与“前四类半胱氨酸蛋白酶、JAMM为金属蛋白酶”的归类是填空/选择点。","pages":[45]},{"id":"L8-F27","text":"细胞内蛋白质降解两条主要途径：26S蛋白酶体途径约占80-90%，自噬/溶酶体途径约占10-20%。蛋白酶体途径依赖泛素标记、高度选择性、在胞质中进行；自噬/溶酶体途径可非选择性包裹胞质成分与细胞碎片，在溶酶体酸性环境中由组织蛋白酶（cathepsins，含CYS、ASP、SER、MET四类蛋白酶）降解并回收。","note":"80-90% vs 10-20%的比例与两条途径的选择性差异是必考对照。","pages":[48]},{"id":"L8-F28","text":"26S蛋白酶体由催化性20S核心（20S core）与19S调节颗粒（19S regulator）组成；20S共含14种不同亚基（α1–α7与β1–β7），α环负责调控底物进入及识别结合，催化中心位于β环；19S由环状基底（base）与识别结合多聚泛素化蛋白的盖（lid）组成，其亚基分Rpt（具ATPase活性）与Rpn（不具ATPase活性），其中Rpn11（POH1）为具DUB活性的金属蛋白酶。","note":"20S=α7+β7共14种亚基、催化中心在β环、Rpt含ATPase/Rpn不含、Rpn11为DUB，是结构部分的高频考点。","pages":[49,50]},{"id":"L8-F29","text":"底物靶向26S蛋白酶体需至少四个泛素（at least four Ubs）组成的多聚泛素链；底物可经两条途径结合：直接结合19S调节复合物中的内在泛素受体（intrinsic Ub receptors），或经同时含多聚泛素结合域与蛋白酶体结合域的衔接蛋白（adaptor proteins）结合；底物被切割成小肽，泛素由DUBs回收。","note":"“至少4个泛素”是常考数字；直接受体途径与衔接蛋白途径的区分是选择题点。","pages":[51]},{"id":"L8-F30","text":"p53的泛素系统调控：E3连接酶Mdm2/Mdmx对p53进行多聚泛素化使其经26S蛋白酶体降解；去泛素化酶USP7与USP2a去除p53上的多聚泛素链使p53稳定；Mdm2/Mdmx自身也可被泛素化，并可被USP7或USP2a去泛素化。USP7/USP2a可能参与癌症发病，靶向这些p53特异性DUBs正成为癌症治疗手段。","note":"E3（Mdm2/Mdmx）与DUB（USP7/USP2a）对p53稳态的动态平衡是分析题经典素材。","pages":[52]},{"id":"L8-F31","text":"SUMO化修饰：SUMO（small ubiquitin-like modifier）共价连接到赖氨酸上，该赖氨酸通常位于或邻近共有序列ψ-K-x-E（ψ为疏水氨基酸，x任意，K为赖氨酸，E为谷氨酸）；迄今发现四种SUMO蛋白SUMO1–4；级联为E1激活酶AOS1-UBA2（或SAE1/SAE2）→E2结合酶Ubc9（UBC9）→E3连接酶（>10种，如PIAS、RanBP2、Pc2），由SENP家族蛋白酶去SUMO化，循环可逆。","note":"ψ-K-x-E共有序列、AOS1-UBA2/SAE1-SAE2、Ubc9、SENP是SUMO部分的核心填空点。","pages":[53,55,56]},{"id":"L8-F32","text":"SUMO与泛素结构相似（均具球状β-grasp折叠），属泛素样蛋白（Ubls）家族，特征为泛素折叠与蛋白水解成熟后暴露的C端Gly-Gly基序；SUMO前体C端GGXX经Ulp/SENPs切割暴露GG而成熟。","note":"“C端Gly-Gly基序需蛋白水解成熟”是SUMO区别于泛素的关键结构点。","pages":[54]},{"id":"L8-F33","text":"人类4种SUMO同工型：SUMO-1（97 aa）、SUMO-2（92 aa）、SUMO-3（93 aa）、SUMO-4（93 aa）；SUMO-2与SUMO-3序列一致性高达97%，二者与SUMO-1仅50%一致性；SUMO-2/3含内部SUMO化共有位点VKTE，可形成K11连接的多聚链；SUMO-1体内仅以单体存在或作为SUMO2/3多聚链的链终止子（体外可形成K7/K16/K17链）；SUMO-4第90位为脯氨酸而非谷氨酰胺，正常条件下不被加工和偶联，只在饥饿等应激条件下修饰蛋白。","note":"四种SUMO的氨基酸长度、97%/50%一致性、VKTE内部位点、SUMO-4第90位Pro是高频细节题。","pages":[57,58]},{"id":"L8-F34","text":"砷剂（As2O3）诱导PML的SUMO化与降解：PML先在细胞质中被SUMO化，随后进入核质并固定于PML核体（PML NB）；砷剂处理<1 h SUMO化增强，>1 h含SIM的泛素连接酶RNF4被招募，对PML加上泛素链，最终由核体相关蛋白酶体（20S）降解。PML的SUMO化位点为K65、K160、K490（K65连SUMO-1，K160与K490连SUMO-2/3）。","note":"“SUMO化先改变定位、再招募RNF4泛素化降解”是SUMO靶向泛素化的典型范例，K65/K160/K490是填空点。","pages":[60,61]},{"id":"L8-F35","text":"NEDD8含81 aa，与泛素59%相同、80%同源；NEDDylation与泛素化酶学级联相似（E1/NAE→E2→E3），但NEDD8单修饰不引发蛋白酶体降解，而作为活化信号；NEDD8前体需C端水解酶切除多余序列暴露Gly76成熟，E1为UBA3/APPBP1复合体，E2为UBC12，去Neddylation酶可逆转。","note":"NEDD8的81 aa、59%/80%同源、UBA3/APPBP1、UBC12、Gly76是填空点；“不降解、作活化信号”是与泛素化的核心辨析。","pages":[63,65,66,68]},{"id":"L8-F36","text":"NEDDylation底物实例：Cullin家族（C端保守Lys，连接酶Rbx1/Dcn1，去Neddylation酶COP9信号体CSN，效应为促进构象改变、抑制Cullin与CAND1互作、激活泛素E3活性）；p53（Lys370、Lys372、Lys373，连接酶Mdm2和SCF^FBXO11，去Neddylation酶NEDP1，抑制p53转录因子活性）；pVHL（Lys159，抑制pVHL与CUL2复合体互作）；EGFR（由C-cbl介导，激活EGFR泛素化、下调EGFR水平）；L11等核糖体蛋白（NEDP1去Neddylation，Neddylation增强其稳定性）。","note":"Cullin、p53三个Lys位点、pVHL Lys159、EGFR-C-cbl是NEDDylation部分最可能出题的细节。","pages":[67]},{"id":"L8-F37","text":"N端法则（N-end rule）：成熟蛋白N端第一个氨基酸（除已被切除的N端甲硫氨酸之外，但包括翻译后修饰产物）决定其体内半衰期。稳定型：甲硫氨酸、甘氨酸、丙氨酸、丝氨酸、苏氨酸、缬氨酸（>20 h）；不稳定型：异亮氨酸/谷氨酰胺～30 min、酪氨酸/谷氨酸～10 min、脯氨酸～7 min、亮氨酸/苯丙氨酸/天门冬酰胺/赖氨酸～3 min、精氨酸～2 min（最不稳定）。","note":"稳定型6种残基、精氨酸～2 min最短、稳定型>20 h与最短相差约600倍以上，是计算与选择题素材。","pages":[70,71]}],"methods":[{"id":"L8-M01","cn":"LMB抑制实验","en":"Leptomycine-B (LMB) inhibition assay","principle":"LMB抑制CRM1依赖的核输出，使含NES的蛋白在核内蓄积。","steps":"用LMB处理细胞后检测目标蛋白的亚细胞定位（本页未给出具体操作细节）。","applications":"用于判定某蛋白的出核是否依赖CRM1/NES途径。","limitations":"只能判断CRM1依赖性，不能排除其他输出受体途径；需配合NES突变或CRM1敲低验证。","pages":[30]},{"id":"L8-M02","cn":"免疫印迹","en":"Western blot","principle":"用特异性抗体检测经SDS-PAGE分离后转移到膜上的目标蛋白，条带位置反映分子量、条带强度反映蛋白量。","steps":"砷剂处理细胞（0、1、16 h）→裂解→SDS-PAGE→转膜→抗PML抗体检测；分子量标准75–250 kD。","applications":"本页用于证明砷剂先诱导PML SUMO化增强（1 h出现高分子量PML-SUMO弥散带），随后PML总量下降（16 h），即先修饰后降解。","limitations":"只能反映群体蛋白量变化，不能直接证明降解动力学；SUMO化修饰造成分子量弥散，需注意条带判读。","pages":[61]}],"exam_points":[{"id":"L8-X01","point":"蛋白质转运的三种机制及其状态差异","detail":"常考选择题或简答题：要求区分核孔转运、跨膜转运、囊泡转运，并答出“核孔与囊泡途径蛋白保持折叠、跨膜途径蛋白为伸展状态、三者均需能量”。"},{"id":"L8-X02","point":"信号肽假说与共翻译转运的完整流程","detail":"简答题高频：按顺序写出信号肽被SRP识别→翻译暂停（新生肽约70残基）→结合SRP受体（DP）→GTP水解→易位子通道→信号肽酶切除→核糖体解离；并说明信号肽结构特征（13-36残基、10-15疏水氨基酸、N端正电荷、C端切割位点）。"},{"id":"L8-X03","point":"信号肽的四点限定（易错判断）","detail":"判断题常设陷阱：信号序列切除并非运转必需；并非所有转运蛋白都有可降解信号肽；仅有信号肽不足以保证运转。"},{"id":"L8-X04","point":"线粒体与叶绿体翻译后转运的异同","detail":"简答或分析题：线粒体经Tom/Tim、Hsp70/MSF维持伸展、mHsp70 ATP水解与膜电位驱动、前导肽切除；叶绿体信号肽分两部分（基质+类囊体）、两次切除、基质中可溶性蛋白水解酶切除第一部分。共同点：均为翻译后转运、信号肽均被切除。"},{"id":"L8-X05","point":"NLS与NES的结构特征及核质双向运输机制","detail":"名词解释与简答：NLS单分型K(K/R)X(K/R)（SV40 126PKKKRKV132）、双分型R/K(X)10-12RRKK（Nucleoplasmin、P53）；NES为ΦXnΦXnΦXΦ疏水富集。入核Importin α/β识别NLS、Ran-GTP在核内使复合物解体；出核CRM1识别NES、Ran-GTP促进复合物形成、胞质GTP水解使其解体。"},{"id":"L8-X06","point":"泛素化级联反应与E1/E2/E3的数量关系","detail":"简答必答：ATP→AMP+PPi活化泛素、E1-S-Ub硫酯中间体、E2-S-Ub、E3催化异肽键形成；人类2种E1、约50种E2、>600种E3，E3决定底物特异性。"},{"id":"L8-X07","point":"泛素链拓扑与底物命运","detail":"选择题高频：K48/K11链→26S蛋白酶体降解；K63链→DNA修复、NF-κB信号、溶酶体靶向；单泛素化→互作/定位/活性；7个赖氨酸+M1为连接位点。"},{"id":"L8-X08","point":"HECT型与RING型E3的机制差异","detail":"选择题：HECT形成共价E3-Ub中间体（两步转移）；RING不形成共价中间体，泛素从E2~Ub直接转移到底物（一步转移）。"},{"id":"L8-X09","point":"26S蛋白酶体的结构与底物靶向","detail":"填空/选择：20S核心含α1–α7与β1–β7共14种亚基、催化中心在β环、α环调控底物进入；19S含Rpt（ATPase）与Rpn（非ATPase），Rpn11具DUB活性；底物需至少4个泛素，可经内在泛素受体或衔接蛋白两条途径。"},{"id":"L8-X10","point":"泛素化与NEDDylation、SUMO化的比较","detail":"分析题：三者酶学级联相似（E1→E2→E3、ATP依赖），但泛素化多聚链导向降解，NEDDylation单修饰作活化信号不降解，SUMO化调节互作、定位与转录活性；SUMO共有位点ψ-K-x-E，NEDD8需C端水解暴露Gly76。"},{"id":"L8-X11","point":"SUMO化调控PML定位与降解（砷剂范例）","detail":"分析题：砷剂<1 h诱导PML SUMO化（K65/K160/K490）并固定于PML NB，>1 h招募含SIM的RNF4进行泛素化，最终由核体相关蛋白酶体降解——体现“SUMO化先改定位、再靶向泛素化降解”。"},{"id":"L8-X12","point":"N端法则与半衰期","detail":"选择或计算题：稳定型6种残基（>20 h）；精氨酸～2 min最不稳定；能根据N端残基排序半衰期或估算相差倍数（>600倍）。"},{"id":"L8-X13","point":"蛋白质降解两条途径的比例与选择性","detail":"选择题：26S蛋白酶体途径占80-90%、依赖泛素、高度选择性；自噬/溶酶体途径占10-20%、非选择性、酸性环境、cathepsins降解。"}],"exercises":[{"id":"L8-E01","type":"单选题","stem":"下列膜被细胞器的蛋白质输入机制中，蛋白质以伸展（unfolded）状态穿膜的是：","options":["A. 通过核孔转运进入细胞核","B. 经蛋白质转运体跨膜转运进入线粒体基质","C. 经运转囊泡从内质网运至高尔基体","D. 经运转囊泡从高尔基体运至细胞质膜"],"answer":"B。经蛋白质转运体跨膜转运进入线粒体（及内质网、叶绿体）时蛋白质以伸展状态穿膜；核孔转运与囊泡转运中蛋白质保持折叠状态。","analysis":"考查三种膜被细胞器蛋白输入机制中蛋白质的构象状态。A、C、D均为保持折叠状态的途径；只有跨膜转运（机制2）要求蛋白质伸展。","pages":[8]},{"id":"L8-E02","type":"单选题","stem":"关于信号识别颗粒（SRP）的叙述，错误的是：","options":["A. 由约300个核苷酸的7S RNA和6种蛋白质组成","B. 其蛋白质组分分子量为9~72 kDa","C. 与信号肽结合后使翻译暂时终止，此时新生肽长约70个残基","D. SRP本身就是内质网膜上的信号肽切割酶"],"answer":"D。SRP是识别信号序列并指导核糖体到转运通道的核糖核蛋白复合体；切除信号肽的是信号肽酶（signal peptidase），位于内质网腔面。","analysis":"A、B、C均为SRP的正确描述（7S RNA+6种蛋白、9~72 kDa、翻译暂停时新生肽约70残基）；D混淆了SRP与信号肽酶。","pages":[14,15,17]},{"id":"L8-E03","type":"单选题","stem":"下列定位信号中，在介导蛋白质转运后一般不被切除的是：","options":["A. 内质网信号肽（signal peptide）","B. 线粒体前导肽（leader peptide）","C. 核定位信号（NLS）","D. 叶绿体转运肽（transit peptide）"],"answer":"C。NLS一般不被切除，从而保证核蛋白可反复入核（repeated localization）；信号肽、前导肽/转运肽转运后均被切除。","analysis":"考查不同定位信号是否被切除的对照表。A、B、D均被切除，只有NLS不被切除。","pages":[20,27]},{"id":"L8-E04","type":"单选题","stem":"在核蛋白入核过程中，直接与核定位序列（NLS）结合的是：","options":["A. Importin α亚基","B. Importin β亚基","C. Ran-GTP","D. CRM1"],"answer":"A。Importin α亚基直接识别并结合NLS，β亚基参与核孔停靠与转位；Ran-GTP在核内结合β使复合物解体；CRM1是出核受体。","analysis":"考查Importin α/β的分工。B负责停靠与转位，C负责核内复合物解体，D负责NES出核。","pages":[29,31]},{"id":"L8-E05","type":"单选题","stem":"某蛋白的出核可被Leptomycine-B（LMB）抑制，说明其出核依赖：","options":["A. Importin α/β","B. CRM1与NES","C. Ran-GDP直接结合货物","D. 核孔复合体的被动扩散"],"answer":"B。LMB抑制CRM1依赖的核输出，使含NES的蛋白在核内蓄积，故可判定该蛋白出核依赖CRM1/NES途径。","analysis":"考查LMB抑制实验的原理与用途。A为入核受体；C、D均不符合CRM1依赖出核机制。","pages":[30]},{"id":"L8-E06","type":"单选题","stem":"关于泛素化级联反应，下列叙述正确的是：","options":["A. 泛素C端羧基与ATP反应生成Ub-AMP并释放PPi","B. 泛素通过E1直接与底物赖氨酸形成异肽键","C. E2决定底物特异性，E3仅提供能量","D. 泛素与底物通过二硫键连接"],"answer":"A。泛素C端羧基与ATP反应释放AMP+PPi形成Ub-腺苷酸，随后经E1-S-Ub、E2-S-Ub硫酯中间体，由E3催化与底物Lys ε-氨基形成异肽键。","analysis":"B错在泛素需经E1→E2→E3逐级传递；C错在E3决定底物特异性；D错在连接键为异肽键而非二硫键。","pages":[39,40]},{"id":"L8-E07","type":"单选题","stem":"下列多聚泛素链中，主要作为信号导向26S蛋白酶体降解的是：","options":["A. K48连接链","B. K63连接链","C. K27连接链","D. M1线性链"],"answer":"A。K48（及K11）连接链主要导向26S蛋白酶体降解；K63链参与DNA修复、NF-κB信号与溶酶体靶向；线性链激活信号通路。","analysis":"考查泛素链拓扑与命运的对应关系，K48=降解是最经典的结论。","pages":[36,46]},{"id":"L8-E08","type":"单选题","stem":"HECT型与RING型E3泛素连接酶作用机制的关键区别是：","options":["A. HECT型需要ATP，RING型不需要","B. HECT型先形成共价E3-泛素中间体，RING型不形成共价中间体","C. RING型只能催化单泛素化，HECT型只能催化多聚泛素化","D. 两者均需先形成共价E3-泛素中间体"],"answer":"B。HECT型先与泛素形成共价E3~Ub中间体再转移给底物（两步）；RING型促使泛素从E2~Ub直接转移到底物（一步），不形成共价中间体。","analysis":"A、C、D均不符合两类E3的机制描述；核心区别在于是否形成共价E3-Ub中间体。","pages":[42]},{"id":"L8-E09","type":"单选题","stem":"底物蛋白被26S蛋白酶体识别并降解，其多聚泛素链至少需要包含几个泛素？","options":["A. 1个","B. 2个","C. 4个","D. 8个"],"answer":"C。底物需被至少四个泛素（at least four Ubs）组成的多聚泛素链修饰，才能结合19S调节复合物中的内在泛素受体或衔接蛋白。","analysis":"考查底物靶向蛋白酶体的定量要求，“至少4个泛素”是常考数字。","pages":[51]},{"id":"L8-E10","type":"单选题","stem":"关于SUMO化修饰，下列叙述错误的是：","options":["A. SUMO通常连接到共有序列ψ-K-x-E中的赖氨酸上","B. SUMO-2/3含内部SUMO化位点VKTE，可形成K11连接的多聚链","C. SUMO-1在体内主要以多聚链形式存在","D. SUMO化由E1（AOS1-UBA2/SAE1-SAE2）、E2（Ubc9）、E3级联催化"],"answer":"C。SUMO-1在体内仅以单体形式存在，或作为SUMO2/3多聚链的链终止子（capping）；体外虽可形成K7/K16/K17链但生理意义有限。","analysis":"A、B、D均为正确描述；C与“SUMO-1体内不聚合、只作封端”的事实相反。","pages":[53,57,58]},{"id":"L8-E11","type":"单选题","stem":"NEDD8与泛素相比，下列叙述正确的是：","options":["A. NEDD8含76个氨基酸，与泛素100%相同","B. NEDD8含81个氨基酸，与泛素59%相同、80%同源","C. NEDDylation与泛素化一样必然导致蛋白酶体降解","D. NEDD8的E2酶有数十种，与泛素化类似"],"answer":"B。NEDD8含81 aa，与泛素59%相同、80%同源；NEDDylation不导致蛋白酶体降解而作为活化信号；其E2目前只发现UBC12一种。","analysis":"A错在氨基酸数与同源比例；C错在NEDDylation不降解；D错在E2仅UBC12一种。","pages":[63,65,68,69]},{"id":"L8-E12","type":"多选题","stem":"下列蛋白质中，以翻译后转运机制运输的有：","options":["A. 线粒体基质蛋白","B. 叶绿体类囊体腔蛋白","C. 免疫球蛋白","D. 过氧化物酶体蛋白"],"answer":"A、B、D。细胞器蛋白（核、叶绿体、线粒体、乙醛酸循环体、过氧化物酶体中的蛋白质）在游离核糖体上合成后以翻译后机制运输；免疫球蛋白属分泌型蛋白，走翻译同步（共翻译）途径。","analysis":"考查三类蛋白与两种转运机制的对应关系；C为分泌蛋白，属共翻译转运。","pages":[7]},{"id":"L8-E13","type":"多选题","stem":"关于前导肽（leader peptide）的性质，正确的有：","options":["A. 富含带正电荷的碱性氨基酸（特别是精氨酸）","B. 缺少带负电荷的酸性氨基酸","C. 羟基氨基酸（Ser等）含量较高","D. 能形成两亲α-螺旋结构"],"answer":"A、B、C、D。前导肽四条性质全部正确：富碱性氨基酸、缺酸性氨基酸、羟基氨基酸含量高、可形成两亲α-螺旋。","analysis":"四项均为前导肽的经典性质，常以多选形式整体考查。","pages":[21]},{"id":"L8-E14","type":"填空题","stem":"经典单分型NLS的共有序列为______，典型例子为SV40-NLS（______）；经典双分型NLS的共有序列为______，例子有Nucleoplasmin（KR-10aa-KKKL171）和P53（KR-12aa-KKK321）。","options":[],"answer":"K(K/R)X(K/R)；126PKKKRKV132；R/K(X)10-12RRKK。","analysis":"考查NLS两类共有序列与SV40实例的精确记忆，数字上标（126与132）不可省略。","pages":[28]},{"id":"L8-E15","type":"判断题","stem":"信号序列的切除是蛋白质跨膜运转所必需的。","options":[],"answer":"错误。信号序列的切除并不是运转所必需的；完整的信号肽是运转的必要条件，但切除与否不影响运转本身。","analysis":"考查信号肽在运输中作用的四点限定之一，是典型易错判断。","pages":[16]},{"id":"L8-E16","type":"名词解释","stem":"信号肽假说（signal peptide hypothesis）","options":[],"answer":"蛋白质的定位信息存在于其自身结构（信号序列）中，通过与膜上特殊受体的相互作用得以表达，即蛋白质通过其信号序列与膜或其他结构结合。其基础是：蛋白质自身结构中含有定位信息，且该信息通过与受体的相互作用实现功能；蛋白质跨膜运转信号也是由mRNA编码的。","analysis":"答题须包含“定位信息在自身结构”“与膜上受体相互作用”两个核心，并指出信号由mRNA编码。","pages":[9,10]},{"id":"L8-E17","type":"简答题","stem":"简述新生分泌蛋白通过共翻译（同步）转运途径进入内质网腔的主要过程及关键组分。","options":[],"answer":"①核糖体在mRNA上翻译，新生肽N端信号肽露出，被信号识别颗粒SRP识别并结合；②SRP与新生肽链结合后翻译暂停（新生肽约70个残基）；③SRP-核糖体-新生肽复合物结合到内质网膜上的SRP受体（DP，停靠蛋白）；④SRP释放，核糖体与易位子（translocon/多肽运转复合物）结合，GTP水解为GDP+Pi；⑤SRP循环回细胞质重复使用；⑥新生肽链穿过膜进入ER腔，信号肽被信号肽酶（signal peptidase）切除；⑦信号肽降解；⑧翻译完成，核糖体亚基解离回细胞质循环。关键组分：信号肽、SRP（7S RNA+6种蛋白）、SRP受体/DP、易位子、信号肽酶、GTP。","analysis":"按顺序答出八个步骤并点明关键组分即可得满分；易漏点为“翻译暂停时约70残基”“GTP水解”“信号肽酶位于ER腔面”。","pages":[15,17]},{"id":"L8-E18","type":"简答题","stem":"比较线粒体蛋白与叶绿体蛋白翻译后跨膜转运的异同。","options":[],"answer":"相同点：均为翻译后转运，蛋白在胞质游离核糖体上合成后转运；均依赖N端信号序列（前导肽/转运肽）引导；信号序列转运后均被切除；均需膜上受体与转运通道，并消耗能量。不同点：①线粒体前体蛋白由胞质Hsp70/MSF维持未折叠（伸展）状态，经外膜Tom受体复合物与内膜Tim复合物通道进入基质，基质mHsp70以ATP水解驱动，并依赖内膜两侧膜电位；前导肽不同区段可决定膜间空间滞留（止运入肽段）或基质定位。②叶绿体多肽合成后脱离核糖体并折叠成具三级结构的蛋白，与叶绿体膜上特异受体结合；信号肽分两部分，第一部分决定进入基质（STROMA），第二部分决定进入类囊体（lumen）；第一部分信号肽在基质中被可溶性蛋白水解酶切除，跨类囊体膜后第二部分信号肽被切除。","analysis":"答题框架为“共同点+分点差异”；叶绿体“折叠后转运、两段信号肽、两次切除”与线粒体“伸展状态、Tom/Tim、膜电位”是区分要点。","pages":[19,22,23,24]},{"id":"L8-E19","type":"实验设计题","stem":"你克隆了一个新蛋白X，生物信息学提示其含一段富含亮氨酸与异亮氨酸的疏水序列。请设计实验判定：(1) 蛋白X是否经CRM1/NES途径出核；(2) 该疏水序列是否为功能性NES。请写出实验思路、预期结果与对照设置。","options":[],"answer":"实验思路：(1) 用Leptomycine-B（LMB）处理表达带荧光标签（如GFP）的蛋白X的细胞，检测其亚细胞定位；若LMB处理后蛋白X在核内蓄积，提示其出核依赖CRM1/NES途径。(2) 将候选疏水序列与报告蛋白融合（或对候选序列中的关键疏水残基/符合ΦXnΦXnΦXΦ模式的残基做点突变），比较野生型与突变体在LMB处理前后的定位差异。预期结果：野生型蛋白X（或含候选序列的融合蛋白）在LMB处理后核内蓄积；缺失或突变候选NES后，蛋白在核内蓄积且不再受LMB影响（或组成型核内定位）。对照设置：①空载体/仅GFP对照（应无核蓄积）；②已知NES蛋白（如PKI、HIV-1 Rev）阳性对照；③已知NES关键残基突变体阴性对照；④未处理组与LMB处理组配对。","analysis":"考查LMB抑制实验的原理与NES功能验证逻辑：LMB抑制CRM1依赖出核→含NES蛋白核内蓄积；功能验证需“融合/突变+定位检测+阳性与阴性对照”。","pages":[30]},{"id":"L8-E20","type":"计算题","stem":"根据N端法则，某蛋白N端为精氨酸时半衰期约2 min，N端为甲硫氨酸时半衰期>20 h。若仅考虑N端残基的影响，精氨酸型蛋白的半衰期至多约为甲硫氨酸型蛋白的多少分之一？（以20 h=1200 min计，给出倍数关系）","options":[],"answer":"甲硫氨酸型半衰期>20 h=1200 min，精氨酸型约2 min，1200/2=600，即精氨酸型半衰期至多约为甲硫氨酸型的1/600（相差约600倍以上）。","analysis":"考查N端法则的定量关系：稳定型残基>20 h与最不稳定的精氨酸～2 min相差约600倍以上，注意“至多/以上”的表述。","pages":[70,71]},{"id":"L8-E21","type":"分析题","stem":"砷剂（As2O3）处理细胞后，PML蛋白先发生SUMO化增强，随后被蛋白酶体降解。请结合PML的SUMO化位点、RNF4与PML核体（PML NB），解释这一“先修饰、后降解”的分子机制，并说明该过程体现了SUMO化与泛素化之间怎样的关系。","options":[],"answer":"机制：砷剂处理<1 h，PML在细胞质中被SUMO化（位点K65连接SUMO-1，K160与K490连接SUMO-2/3），SUMO化使修饰后的PML进入核质并被“固定”于PML核体（PML NB）；处理>1 h，含SIM（SUMO-interacting motif）的泛素连接酶RNF4通过SIM识别多聚SUMO链被招募到PML NB，对PML加上多聚泛素链，最终由核体相关蛋白酶体（20S）识别并降解PML。关系：该过程是“SUMO靶向泛素化”的典型范例——SUMO化本身先改变底物的亚细胞定位（把PML固定在核体），随后SUMO链作为平台招募RNF4完成泛素化，由泛素链最终导向蛋白酶体降解；即SUMO化与泛素化并非彼此独立，而是可以级联偶联，SUMO化可先于并促进泛素化降解。","analysis":"答题须包含：SUMO化位点K65/K160/K490、SUMO化改变定位并固定于PML NB、RNF4经SIM识别SUMO链、RNF4催化泛素化、核体相关蛋白酶体降解，以及“SUMO化→招募泛素化→降解”的级联关系。","pages":[60,61]}]},{"lecture":9,"title":"分子生物学研究法：模式生物与DNA、RNA及蛋白质操作技术","source_file":"2026_autumn-molecular_biology-09技术1.pdf","pages":126,"overview":"本章解决的核心问题是：分子生物学如何通过选择合适的实验系统与操作技术来研究基因与蛋白质的功能。逻辑主线有三条：第一，模式生物（大肠杆菌、酿酒酵母、拟南芥、果蝇、海胆、非洲爪蟾、线虫、斑马鱼、小鼠）为回答普遍性生命规律提供了可操作、遗传背景清楚的实验系统，其选择标准是代表大类群、无害易养、世代短子代多、易于遗传操作；第二，核酸操作与分析技术构成从'切—连—转—扩—测—杂交—定量'的完整工具链，包括限制性核酸内切酶、DNA连接酶、载体、细菌转化与转染、PCR与实时定量PCR、凝胶电泳、Southern/Northern杂交、基因芯片、原位杂交、高通量测序、RNAi、定点突变与基因敲除/基因编辑；第三，蛋白质与核酸的分离检测依赖电泳、标记、杂交与放射自显影等共同原理。本章与前面章节的关系是：前章讲述DNA复制、转录、翻译与基因调控的机制，本章提供验证这些机制、操纵基因表达、构建疾病模型与工程产品的实验手段；工具酶的发现史（1957—1973）与模式生物研究史（海胆1891、线虫1960s、小鼠ES细胞1981）共同说明分子生物学是'机制+技术+模式系统'三位一体的学科。","outline":[{"section":"1","title":"模式生物","points":["模式生物定义与四条共性：代表大类群、无害易养、世代短子代多遗传背景清楚、易遗传操作与表型分析","模式动物与动物模型的四组区别：基本生命现象/特殊、固有/创造、基础/应用、简单/复杂","大肠杆菌与噬菌体：单染色体约460万核苷酸、编码4300多种蛋白、质粒作克隆载体","酿酒酵母：单细胞真核、90 min繁殖、单倍体与双倍体便于遗传分析、细胞周期研究","拟南芥：30万种植物中选出、基因组最小且已全测序、8-10周产生大量后代","果蝇：第一个基因图谱、4条染色体、P因子转基因、与人类同源基因相似","海胆：Driesch 1891年2细胞期分离实验证明调整发育","非洲爪蟾：卵母细胞大而多、显微操作与生化分析、水通道蛋白研究","线虫：959个体细胞、12 h胚胎发育、40 h成虫、细胞凋亡与RNAi发现","斑马鱼：与人类基因相似度87%、胚胎透明可活体观察、心脏再生","小鼠：与人类99%同源、85%以上基因一一对应、同源重组实现基因敲除"]},{"section":"2","title":"核酸操作与重组DNA技术","points":["基因操作、基因工程、DNA克隆、载体、插入DNA的定义与区别","重组DNA技术史：1869 Miescher分离DNA至2000拟南芥全测序","工具酶四类：切割连接、合成、末端修饰、外切降解","限制性核酸内切酶：识别回文序列、错位切产生黏性末端、平切产生平末端","切割频率与识别序列长度相关：Sau3A1 0.25 kb、EcoRI 4 kb、NotI 65 kb","DNA连接酶：E. coli酶只连黏性末端、T4酶可连黏性与平末端","载体条件：MCS、ori、筛选标记、约3 kb、对受体无害","pUC质粒与蓝白斑筛选；pET系列T7启动子表达；pEGFP-N3与pcDNA3.1真核表达","无缝克隆：15-20 bp同源臂、无需酶连、阳性率90%以上","细菌转化：CaCl2法与电转化法、感受态细胞","哺乳动物细胞转染：磷酸钙法、脂质体法、显微注射、电穿孔、基因枪、病毒转染","PCR原理与三步曲：95℃变性、55℃退火、72℃延伸；理论2^n、实得1.8^n","实时定量PCR：SYBR Green I染料法与TaqMan探针法、Ct值与标准曲线","凝胶电泳：迁移率与电荷成正比、与片段大小成反比；琼脂糖与聚丙烯酰胺","分子杂交：Southern检测DNA、Northern检测RNA、Western检测蛋白质","基因芯片、原位杂交、FISH、mFISH、高通量测序与RNA-Seq","RNAi：Dicer、siRNA、RISC、AGO；siRNA与miRNA比较；脱靶效应与对照","基因定点突变：重叠延伸诱变法与大引物诱变法","基因敲除：完全敲除与条件型敲除、Cre/LoxP、诱导性敲除、基因编辑ZFN/TALEN/CRISPR"]}],"concepts":[{"id":"L9-C01","cn":"模式生物","en":"model organism","abbr":"","definition":"为揭示具有普遍规律的生命现象而选定进行科学研究的生物物种；其研究结论可外推到同类群其他生物。","detail":"四条共性：①能代表生物界某一大类群；②对人体和环境无害，容易获得并易于在实验室内饲养和繁殖；③世代短、子代多、遗传背景清楚；④容易进行实验操作，特别具有遗传操作手段和表型分析方法。分子生物学著名说法：基础问题可以在最简单和最容易获得的系统中得以回答。","note":"关键词是'普遍规律'，不是任何实验动物都是模式生物。","pages":[3,4]},{"id":"L9-C02","cn":"动物模型","en":"animal model","abbr":"","definition":"为研究特定问题（如人类疾病）而人工构建或创造的动物系统。","detail":"与模式动物四组对照：模式动物研究基本生命现象、是固有的、用于基础研究、结构简单；动物模型针对特殊问题、是创造的、用于应用研究、结构复杂。","note":"最本质差别在于'创造的'而非'固有的'，且服务于应用研究。","pages":[4]},{"id":"L9-C03","cn":"质粒","en":"plasmid","abbr":"","definition":"细菌中独立于染色体外、能自主复制的环状双链DNA分子，是常用的克隆载体。","detail":"裸露、结构简单、独立于细菌拟核DNA或细胞核之外自我复制的小型双链环状DNA。作为载体的前提是'自主复制'。","note":"质粒是载体的一种，载体还包括λ噬菌体衍生物、动植物病毒等。","pages":[6,33,34]},{"id":"L9-C04","cn":"基因操作","en":"gene manipulation","abbr":"","definition":"主要包括DNA分子的切割与连接、细胞转化、核酸序列分析以及基因人工合成、表达、定点突变和PCR扩增等，是分子生物学研究的核心技术。","detail":"范围最广，涵盖一切核酸操作。","note":"与基因工程的区别在于基因工程强调跨寄主表达。","pages":[20]},{"id":"L9-C05","cn":"基因工程","en":"genetic engineering","abbr":"","definition":"在体外将核酸分子插入病毒、质粒或其它载体分子，构成遗传物质的新组合，使之进入原先没有这类分子的寄主细胞内并进行持续稳定的繁殖和表达。","detail":"跨越物种屏障、把来自其它生物的基因置于新的寄主生物细胞之中的能力，是基因工程技术区别于其它生命科学技术的根本特征。","note":"基因工程是基因操作中强调外源核酸在异种寄主细胞中繁衍与性状表达的部分。","pages":[20,21]},{"id":"L9-C06","cn":"DNA克隆","en":"DNA cloning","abbr":"","definition":"构建重组DNA分子并在细胞中保存和扩增这些分子。","detail":"涉及载体（vector）与插入DNA（insert DNA）两部分。","note":"插入DNA即目的基因片段，随载体一起在宿主细胞中扩增。","pages":[20]},{"id":"L9-C07","cn":"载体","en":"vector","abbr":"","definition":"具备自主复制能力的DNA分子，可作为分子克隆的载体，将目的基因导入受体细胞并在其中大量复制。","detail":"两大功能：运载工具与在受体细胞内大量复制；两大类：①细菌的质粒；②病毒（λ噬菌体衍生物、动植物病毒等）。表达载体需具备：一至多个限制酶切点（MCS）、复制起始点（ori）、筛选标记、大小适中（约3 kb）、对受体细胞无害。","note":"核心限定是必须具有自主复制能力。","pages":[20,33,34]},{"id":"L9-C08","cn":"多克隆位点","en":"multiple cloning site","abbr":"MCS","definition":"载体上人工设计的一段含多个不同限制酶识别位点的短序列，供外源基因插入。","detail":"MCS中酶切位点应尽量不与其他功能元件重叠。","note":"外源基因插入pUC的MCS会破坏lacZ'，是蓝白斑筛选的分子基础。","pages":[34,35]},{"id":"L9-C09","cn":"限制性核酸内切酶","en":"restriction endonuclease","abbr":"","definition":"能够识别DNA上的特定碱基序列并从这个位点切开DNA分子的酶，化学本质是蛋白质。","detail":"主要从原核生物中分离纯化；具有特异性；错位切产生两个相同的黏性末端，平切形成平末端。已从约300种微生物中分离出约4000种。命名规则：属名首字母大写+种名首、二字母小写+菌株字母+罗马数字（如EcoR I、Sma I）。1970年Smith、Wilcox和Kelley分离出第一种。","note":"EcoR I是第一个核酸内切酶；识别序列均为回文序列。","pages":[24,25,26,27]},{"id":"L9-C10","cn":"回文序列","en":"palindrome","abbr":"","definition":"在切割部位，一条链正向读的碱基顺序与另一条链反向读的顺序完全一致。","detail":"能被限制性内切酶特异性识别的切割部位都具有回文序列。例：EcoRI G-A-A-T-T-C / C-T-T-A-A-G；HindIII A-A-G-C-T-T；BamHI G-G-A-T-C-C；TaqI T-C-G-A。","note":"回文序列是限制酶识别的基础，不是所有回文序列都被同一种酶识别。","pages":[27]},{"id":"L9-C11","cn":"DNA连接酶","en":"DNA ligase","abbr":"","definition":"通过形成磷酸二酯键把两个或多个DNA片段连接成一个DNA分子的酶。","detail":"恢复被限制酶切开的两个核苷酸之间的磷酸二酯键。种类：E. coli DNA连接酶（只能连接黏性末端）与T4 DNA连接酶（能连接黏性末端和平末端）。1967年首次发现。","note":"平末端连接需选用T4 DNA连接酶。","pages":[24,29,31]},{"id":"L9-C12","cn":"反转录酶","en":"reverse transcriptase","abbr":"","definition":"以RNA为模板、按碱基互补原则合成DNA链的酶。","detail":"1970年Temin和Baltimore从RNA肿瘤病毒中发现。","note":"与DNA聚合酶I不同：后者以DNA为模板补平缺口。","pages":[24]},{"id":"L9-C13","cn":"碱性磷酸酯酶","en":"alkaline phosphatase","abbr":"","definition":"切除位于DNA链末端的磷酸基团的酶。","detail":"常用于防止载体自连（补充背景）。","note":"作用于末端磷酸基团，不是外切酶。","pages":[24]},{"id":"L9-C14","cn":"末端转移酶","en":"terminal transferase","abbr":"","definition":"在双链核酸的3'末端加上多聚或单核苷酸的酶。","detail":"作用末端为3'。","note":"与碱性磷酸酯酶作用相反：一个加尾、一个去磷酸。","pages":[24]},{"id":"L9-C15","cn":"蓝白斑筛选","en":"blue-white screening","abbr":"","definition":"利用lacZ'编码的α-肽链与宿主ω片段互补形成有活性的β-半乳糖苷酶，水解X-gal产生蓝色产物；外源基因插入MCS破坏lacZ'，不能产生蓝色，从而区分重组与非重组质粒的筛选方法。","detail":"pUC质粒载体包括四部分：ori、amp^r、lacZ'、位于lacZ' 5'-端的MCS。含X-gal培养基中非重组菌落呈蓝色，含重组DNA分子的菌落为白色。","note":"X-gal（5-bromo-4-chloro-3-indolyl-β-D-galactopyranoside）是β-半乳糖苷酶的显色底物。","pages":[35]},{"id":"L9-C16","cn":"T7 RNA聚合酶","en":"T7 RNA polymerase","abbr":"","definition":"由噬菌体T7基因1编码的RNA聚合酶，专一识别T7启动子并高效转录下游基因。","detail":"pET系统中该酶由宿主细胞提供（如BL21(DE3)）。pET系统是有史以来在E. coli中克隆表达重组蛋白功能最强大的系统；充分诱导时几乎所有的细胞资源都用于表达目的蛋白。","note":"pET载体常用筛选标记为Amp^r（pET-14b，4671 bp）和Kan^r（pET-28a(+)，5369 bp）。","pages":[36,37]},{"id":"L9-C17","cn":"增强型绿色荧光蛋白","en":"enhanced green fluorescent protein","abbr":"EGFP","definition":"经改造的绿色荧光蛋白，荧光更强，可作为报告基因/融合标签用于活细胞定位。","detail":"pEGFP-N3（4.7 kb）以CMV IE启动子驱动EGFP融合表达，可确定外源基因在细胞内的表达和/或组织中的定位。","note":"改造细节幻灯片未展开（补充背景）。","pages":[38]},{"id":"L9-C18","cn":"无缝克隆","en":"Seamless Cloning / In-Fusion Cloning","abbr":"","definition":"载体末端与引物末端具有15-20个同源碱基，PCR产物两端带上与载体同源的序列，依靠碱基间作用力互补配对成环，无需酶连即可直接转化宿主菌的克隆方法。","detail":"特点：位点选择灵活、快速简便（约1 h完成载体构建）、精确、克隆效率高（阳性克隆高达90%以上）、一次可进行1-5个片段的重组；重组效率为传统酶切连接技术的5-10倍；15分钟实现载体和片段的快速重组。","note":"区别于传统PCR产物克隆的唯一差异在于载体末端和引物末端应具有15-20个同源碱基。","pages":[39,40]},{"id":"L9-C19","cn":"细菌转化","en":"bacterial transformation","abbr":"","definition":"一种细菌菌株由于捕获了来自供体菌株的DNA而导致性状特征发生遗传改变的过程。","detail":"重组目标DNA分子必须通过细菌转化重新导入寄主细胞才能增殖。抗药基因可作为选择标记。","note":"此处的转化指遗传学意义上的摄取外源DNA，与细胞分化中的转化不同。","pages":[41]},{"id":"L9-C20","cn":"感受态细胞","en":"competent cells","abbr":"","definition":"经过物理或化学处理、获取DNA能力增强的受体菌细胞。","detail":"感受态是细菌容易吸收外源DNA的生理状态。转化方法：CaCl2转化法（化学转化法）与电转化法（电击法）。","note":"感受态是生理状态，不是某一种具体方法。","pages":[42]},{"id":"L9-C21","cn":"转染","en":"transfection","abbr":"","definition":"指真核细胞由于外源DNA掺入而获得新的遗传标志的过程。","detail":"与细菌转化（transformation）对应，用于真核细胞导入外源DNA。方法包括磷酸钙共沉淀法、人工脂质体法、显微注射、电穿孔、基因枪、病毒转染。","note":"原核细胞导入核酸通常称转化（补充背景）。","pages":[44,49]},{"id":"L9-C22","cn":"瞬时转染","en":"transient transfection","abbr":"","definition":"外源DNA/RNA不整合到宿主染色体中，一个宿主细胞中可存在多个拷贝数，产生高水平表达，但通常只持续几天的转染方式。","detail":"多用于启动子和其它调控元件的分析；超螺旋质粒DNA转染效率较高，转染后24-72小时内分析结果。","note":"与稳定转染相对；稳定转染整合概率约1/10^4转染细胞。","pages":[45]},{"id":"L9-C23","cn":"稳定转染","en":"stable transfection","abbr":"","definition":"外源DNA既可整合到宿主染色体中，也可能作为游离体存在，需通过选择性标记反复筛选得到稳定转染同源细胞系的转染方式。","detail":"线性DNA比超螺旋DNA转入量低但整合率高；整合概率很小，大约1/10^4转染细胞能整合。常用选择性标记：来氨丙基转移酶（APH；新霉素抗性基因）、潮霉素B磷酸转移酶（HPH）、胸苷激酶（TK）等。","note":"又称永久转染。","pages":[45]},{"id":"L9-C24","cn":"慢病毒","en":"Lentivirus","abbr":"","definition":"以HIV-1为基础发展起来的病毒载体，区别于一般逆转录病毒载体，对分裂细胞和非分裂细胞均具有感染能力。","detail":"包装成分由HIV-1基因组去除包装、逆转录和整合所需的顺式作用序列而构建，能反式提供病毒颗粒所需蛋白；载体成分含包装、逆转录和整合所需的顺式作用序列，并具有异源启动子控制下的MCS及目的基因。需与包装质粒共转染细胞产生高滴度假病毒颗粒。","note":"慢病毒整合入基因组、效率<30%，可感染不分裂细胞；逆转录病毒只能感染分裂细胞。","pages":[50,51]},{"id":"L9-C25","cn":"聚合酶链式反应","en":"polymerase chain reaction","abbr":"PCR","definition":"快速扩增DNA序列最常用的方法，通过变性、引物退火、延伸的循环实现DNA指数扩增。","detail":"需要4种物质：模板DNA、引物（20个左右碱基的短DNA单链，与目的基因两条链各自5'端序列互补）、Taq DNA聚合酶（或pfu DNA聚合酶）、dNTP（dATP、dTTP、dGTP和dCTP）；需合适Mg2+浓度。理论最高拷贝数2^n，实得1.8^n。1983年Mullis发明，1988年Saiki等引入耐热Taq，1993年Mullis获诺贝尔化学奖。","note":"Taq等聚合酶无3'→5'校对活性，有一定程度单核苷酸碱基错误掺入。","pages":[62,69,70,71,72]},{"id":"L9-C26","cn":"引物","en":"primer","abbr":"","definition":"20个左右碱基的短DNA单链，与目的基因两条链各自5'端序列相互补，决定扩增区段的两端边界。","detail":"引物序列及其与模板结合的特异性是决定PCR反应结果的关键；引物设计的最大原则是最大限度地提高扩增效率和特异性，同时尽可能减少非特异性扩增。","note":"两条引物分别结合于两条模板链的5'端序列互补位置。","pages":[70,72]},{"id":"L9-C27","cn":"Taq DNA聚合酶","en":"Taq DNA polymerase","abbr":"","definition":"来自嗜热菌Thermus aquaticus的耐热DNA聚合酶，用于PCR延伸步骤。","detail":"替代选择为pfu DNA聚合酶（Pfu DNA polymerase）。TaqMan探针法中利用Taq DNA聚合酶的5'→3'外切酶活性切割探针。","note":"无3'→5'校对活性，错误掺入率高于Pfu。","pages":[70,79]},{"id":"L9-C28","cn":"荧光实时定量PCR","en":"real time quantitative PCR","abbr":"qRT-PCR","definition":"利用荧光检测PCR仪，在PCR指数扩增期间连续监测荧光信号强弱变化，实时测定特异性产物量，并通过标准曲线对未知模板进行定量分析的方法。","detail":"出现于90年代末期；绘制DNA扩增过程中累积速率的动态变化图。优点：特异性更强、灵敏度高、可直接对产物定量、解决PCR污染问题、自动化程度高、操作简单。","note":"常规PCR终点定量变异系数大；qRT-PCR基本消除该问题。","pages":[74,75]},{"id":"L9-C29","cn":"Ct值","en":"Ct value (threshold cycle)","abbr":"Ct","definition":"产物荧光强度首次超过设定阈值时PCR反应所需的循环数，即threshold横线与扩增曲线相交所得交点对应的循环数。","detail":"Ct值与该模板起始拷贝数的对数存在线性关系，是实时定量PCR定量的基础；起始拷贝数越多，Ct值越小。","note":"扩增曲线分基线期、指数期、线性期、平台期；Ct取阈值线与指数期交点。","pages":[76,77]},{"id":"L9-C30","cn":"SYBR Green I","en":"SYBR Green I","abbr":"","definition":"非序列特异性荧光染料，激发光波长520 nm，只与双链DNA结合，游离未结合时不产生荧光。","detail":"结合双链DNA后产生绿色荧光，信号强度与DNA分子总数目成正比。灵敏度为EB的25-30倍，诱变能力大大降低，无须脱色或冲洗。","note":"不能区分特异与非特异产物；与TaqMan探针法的序列特异性相对。","pages":[58,78]},{"id":"L9-C31","cn":"TaqMan探针","en":"TaqMan probe","abbr":"","definition":"一段与靶DNA序列中间部位结合的单链DNA，长度50-150 bp，其5'和3'端带有两个不同荧光基团，彼此距离靠近时在荧光共振能量转移作用下发生荧光淬灭。","detail":"PCR中探针结合到目的DNA后被具有外切酶活性的Taq DNA聚合酶逐个切除降解，荧光基团解除淬灭束缚发出荧光；每产生一条DNA链就切断一条探针，每切断一条探针产生一个单位信号。优点：高特异性、设计简单、重复性好。","note":"5'端为荧光基团，3'端为淬灭基团。","pages":[79]},{"id":"L9-C32","cn":"电泳迁移率","en":"electrophoretic mobility","abbr":"","definition":"电泳分子在电场作用下的迁移速度。","detail":"与电场强度和分子所带净电荷数成正比，与片段大小成反比。同等分子量不同构型：超螺旋最快、开环松弛型最慢、线性居中。","note":"不能仅凭迁移位置判断分子量，还受构型影响。","pages":[55,56]},{"id":"L9-C33","cn":"琼脂糖凝胶","en":"agarose gel","abbr":"","definition":"以琼脂糖为基质的凝胶，分辨力不如聚丙烯酰胺凝胶，但能够区分几十至几百Kb大小的DNA片段。","detail":"浓度越低可分离的DNA片段越大：0.3%分离50 000~1 000 bp、0.7%分离20 000~1 000 bp、1.4%分离6 000~300 bp。凝胶浓度越高，孔隙越小，分辨能力越强。","note":"与聚丙烯酰胺凝胶相对：后者分辨力高但范围窄（1~1000 bp）。","pages":[57]},{"id":"L9-C34","cn":"聚丙烯酰胺凝胶","en":"polyacrylamide gel","abbr":"","definition":"由丙烯酰胺与交联剂聚合形成的凝胶基质，分辨力高，但可区分DNA的大小范围窄，分辨范围为1到1000个碱基对之间。","detail":"4.0%分离1 000~100 bp、10.0%分离500~25 bp、20.0%分离50~1 bp。","note":"适合小片段DNA的高分辨分离。","pages":[57]},{"id":"L9-C35","cn":"溴化乙锭","en":"ethidium bromide","abbr":"EB","definition":"一种嵌入DNA堆积碱基之间的三环平面基团荧光染料，在紫外光下观察DNA条带。","detail":"属于嵌入型染料，具有诱变能力。","note":"SYBR Green I灵敏度为EB的25-30倍且诱变能力大大降低。","pages":[58]},{"id":"L9-C36","cn":"核酸的分子杂交","en":"nucleic acid molecular hybridization","abbr":"","definition":"两个不同来源的互补单链多聚核苷酸之间的碱基配对过程。","detail":"强调'不同来源'与'互补单链'。复性指变性的两条单链重新结合为双链；杂交指来源不同的两条单链结合为双链分子。","note":"复性与杂交的区别在于两条链是否同源。","pages":[83,87]},{"id":"L9-C37","cn":"核酸探针","en":"nucleic acid probe","abbr":"","definition":"序列或功能特性已知的标记分子，为双链或单链，长度通常为几十至几百bp，包括DNA探针、RNA探针和cDNA探针。","detail":"用于Southern、Northern、原位杂交等检测。","note":"探针必须带有可检测标记（放射性同位素或非放射性标记）。","pages":[87]},{"id":"L9-C38","cn":"Southern杂交","en":"Southern hybridization / Southern blot","abbr":"","definition":"将DNA分子从电泳凝胶转移至杂交滤膜上，然后与核酸探针进行杂交的方法。","detail":"由E.M.Southern于1975年创立。流程：DNA限制酶消化→凝胶电泳分离→碱变性→毛细作用转印至硝酸纤维薄膜→与放射性单链DNA探针杂交→洗脱未结合探针→放射自显影。可有效分析基因结构或检测待测DNA样本中是否含有特定序列。","note":"检测对象为DNA，探针为DNA或RNA。","pages":[86,88,89]},{"id":"L9-C39","cn":"Northern杂交","en":"Northern hybridization / Northern blot","abbr":"","definition":"将RNA分子从电泳凝胶转移至杂交滤膜上，然后与核酸探针进行杂交的方法。","detail":"用于确定一个样品中特定mRNA的含量，即基因的表达水平；探针为放射性RNA探针。不同组织样品间条带的有无与强弱反映组织特异性表达。","note":"检测对象为RNA，不是DNA。","pages":[86,90,91]},{"id":"L9-C40","cn":"Western杂交","en":"Western hybridization / Western blot","abbr":"","definition":"将蛋白质从电泳凝胶中转移到杂交滤膜上，然后同放射性同位素125I标记的特定蛋白质进行反应的方法。","detail":"检测对象为蛋白质，探针为蛋白质。","note":"与Southern/Northern不同，Western检测的是蛋白质而非核酸。","pages":[86]},{"id":"L9-C41","cn":"基因芯片","en":"DNA chip / DNA microarray","abbr":"","definition":"将大量探针分子固定于支持物上，与标记的样品分子杂交，通过检测每个探针分子的杂交信号强度获取样品分子的数量和序列信息的技术。","detail":"能同时监测大量靶基因表达，在基因组水平上阐述不同生物组织或细胞中各种转录本的变化规律。应用于基因表达检测、突变检测、基因组多态性分析、基因文库作图、杂交测序、疾病诊断和治疗、药物筛选、农作物优育优选、司法鉴定、食品卫生监督、环境检测、国防、航天等。","note":"又称DNA微阵列（DNA microarray）。","pages":[92]},{"id":"L9-C42","cn":"原位杂交","en":"In Situ Hybridization","abbr":"ISH","definition":"用标记的核酸探针，经放射自显影或非放射检测体系，在组织、细胞、间期核及染色体上对核酸进行定位和相对定量研究的手段。","detail":"分为RNA原位杂交和染色体原位杂交两大类。探针设计：用mRNA的互补链为探针；负对照用mRNA的同义链，无杂交信号。","note":"互补链（反义链）能与mRNA杂交产生信号；同义链不能杂交，用作负对照。","pages":[93,94]},{"id":"L9-C43","cn":"荧光原位杂交","en":"Fluorescence In Situ Hybridization","abbr":"FISH","definition":"用荧光染料标记的DNA探针与变性的染色体DNA杂交，在荧光显微镜下直接观察探针在染色体上的定位的方法。","detail":"优点：不需要放射性同位素、实验周期短、检测灵敏度高、可同时观察几种DNA探针的定位，得到相应位置和排列顺序的综合信息。","note":"多彩色荧光原位杂交（mFISH）是FISH的多靶标、多色升级形式。","pages":[95,96]},{"id":"L9-C44","cn":"高通量测序","en":"high-throughput sequencing","abbr":"NGS","definition":"又称二代测序或深度测序，可一次性并行测序几十万甚至几百万条DNA分子，读长一般较短，通过读取多个短DNA片段拼接成完整序列信息。","detail":"与Sanger测序（第一代，读长可达1000 bp）相对。传统测序完成一个人类基因组需3年，二代测序仅需1周。","note":"NGS以'大规模并行+短读长'为标志。","pages":[97]},{"id":"L9-C45","cn":"RNA-Seq","en":"RNA sequencing","abbr":"","definition":"利用高通量测序技术对转录组进行测序分析，对得到的原始读长进行过滤、组装及后续生物信息学分析的方法。","detail":"特点：数字化信号（单核苷酸分辨率，可检测单个碱基差异、相似基因及可变剪接）、高灵敏度（可检测几个拷贝的稀有转录本）、任意物种全基因组分析（无需预先设计探针）、动态检测范围高于6个数量级、重复性好、起始样品少。缺陷：生物信息学分析软件开发不彻底、费用。","note":"与微阵列芯片相比，芯片为荧光模拟信号、存在交叉反应与背景噪音、动态范围小。","pages":[97,98,99]},{"id":"L9-C46","cn":"RNA干扰","en":"RNA interference","abbr":"RNAi","definition":"利用双链小RNA高效、特异性地降解细胞内同源mRNA，从而阻断靶基因表达，使细胞出现靶基因缺失的表型。","detail":"命名来源于Andrew Z. Fire；2006年诺贝尔生理学或医学奖授予Andrew Z. Fire与Craig C. Mello，原始文献Nature 1998, 391:806-811。线虫中注射dsRNA可高效、特异地阻断相应基因表达，dsRNA效率高于反义单链RNA。","note":"RNAi是转录后基因沉默，不是基因组水平的基因敲除。","pages":[16,82,100]},{"id":"L9-C47","cn":"Dicer","en":"Dicer","abbr":"","definition":"一种具有RNase III活性的核酸酶，可将细胞中较长的双链RNA（30个核苷酸以上）降解加工成21～25个核苷酸的小分子干扰RNA。","detail":"果蝇的Dicer-2能够剪切长的双链RNA，而Dicer-1对miRNA的加工有重要作用。","note":"Drosha负责核内pri-miRNA→pre-miRNA的加工，Dicer负责细胞质中dsRNA/pre-miRNA→siRNA/miRNA的加工。","pages":[101,106]},{"id":"L9-C48","cn":"小分子干扰核糖核酸","en":"short interfering RNA","abbr":"siRNA","definition":"由Dicer加工长双链RNA产生的21～25个核苷酸的小RNA，能有效定位目标mRNA。","detail":"3'端有两个碱基游离，可激活RNA干扰，通过与目标mRNA互补结合序列特异性地实现mRNA降解。来源为外源；一条siRNA只针对一个靶基因；主要存在于低等生物，可通过人为设计合成导入高等生物细胞。","note":"与miRNA相对：siRNA为外源、精准靶向、完全互补降解mRNA。","pages":[101,102,106]},{"id":"L9-C49","cn":"RNA诱导的沉默复合体","en":"RNA-induced silencing complex","abbr":"RISC","definition":"由siRNA中的反义链参与指导合成的核蛋白体，介导切割目的mRNA中与siRNA反义链互补的区域，实现干扰靶基因表达的功能。","detail":"最小RISC包含Argonaute蛋白和相关的siRNA，也可能包含PACT、TRBP和Dicer；RISC的组成尚未能得到确切的描述。","note":"核心组分包括AGO（Argonaute）蛋白。","pages":[101,106]},{"id":"L9-C50","cn":"Argonaute家族蛋白","en":"Argonaute family of proteins","abbr":"AGO","definition":"和单链的RNA（siRNA）共同组装形成RISC的蛋白家族，绑定21-35个核苷酸的RNA，包括miRNA和siRNA以及相关的靶mRNA，然后通过其内切核酸酶功能发挥剪切作用。","detail":"剪切作用发生在反义链（引导链）RNA的第10th和第11th个核苷酸之间。","note":"剪切位点位于引导链第10-11位核苷酸之间，是判断Argonaute催化活性的关键位点。","pages":[106]},{"id":"L9-C51","cn":"短发夹RNA","en":"short hairpin RNA","abbr":"shRNA","definition":"由正义链和反义链通过环状序列隔开共同组成的RNA分子，包含一个环结构，可加工成siRNA。","detail":"在细胞核表达后被Drosha加工，由Exportin-5转运到细胞质，与Dicer结合去除环状序列，再与RISC结合并去掉其中一条RNA链，识别互补mRNA并导致其降解。可通过病毒载体转染，克服某些细胞不能转染的难题，可用诱导型启动子控制表达。","note":"shRNA经病毒介导的转导保持稳定；siRNA在细胞中瞬时表达。","pages":[103,106]},{"id":"L9-C52","cn":"脱靶效应","en":"off-target effect","abbr":"","definition":"siRNA/shRNA与非靶基因mRNA部分序列互补而引起的非特异性基因抑制。","detail":"最少7个核苷酸与非靶mRNA部分序列互补就能造成脱靶抑制；高浓度siRNA与非靶基因结合概率增大。可通过对siRNA进行化学修饰减少脱靶效应，如在siRNA的第二个碱基2'位的核糖环添加甲基基团。","note":"严格的RNAi敲低实验需设转染试剂对照、nonsense siRNA对照、positive siRNA对照、重复对照（off-target对照）、rescue对照。","pages":[104,105]},{"id":"L9-C53","cn":"基因定点突变","en":"site-directed mutagenesis","abbr":"","definition":"通过改变基因特定位点核苷酸序列来改变所编码的氨基酸序列的技术。","detail":"用于研究某个（些）氨基酸残基对蛋白质的结构、催化活性以及结合配体能力的影响，也可用于改造DNA调控元件特征序列、修饰表达载体、引入新的酶切位点等。主要采用两种PCR方法：重叠延伸技术（overlap extension）与大引物诱变法（megaprimer method）。","note":"PCR介导的定点突变优点：突变体回收率高、能用双链DNA作模板、可在任何位点引入突变、可在同一试管完成所有反应、快速简便。","pages":[107,108,109]},{"id":"L9-C54","cn":"基因敲除","en":"gene knock-out","abbr":"","definition":"又称基因打靶，通过外源DNA与染色体DNA之间的同源重组，进行精确的定点修饰和基因改造，具有专一性强、染色体DNA可与目的片段共同稳定遗传等特点。","detail":"分为完全基因敲除与条件型基因敲除（Conditional gene knock-out，又称不完全基因敲除）。基本步骤：基因载体的构建、ES细胞的获得、目的基因导入、选择筛选已击中的细胞、得到纯合体并进行表型研究。同源重组自然发生率极低：动物10^-2～10^-5，植物10^-4～10^-5。","note":"1987年Smithies与Capecchi在小鼠中实现基因敲除。","pages":[112,113,114]},{"id":"L9-C55","cn":"胚胎干细胞","en":"embryonic stem cell","abbr":"ES cell","definition":"来源于早期胚胎内细胞团、可体外培养并保持多能性、能贡献到生殖系的干细胞，是基因打靶载体导入的受体细胞。","detail":"本页使用129、c57BL/6遗传背景的ES细胞进行基因打靶。2007年诺贝尔生理学或医学奖授予Mario R. Capecchi、Sir Martin J. Evans、Oliver Smithies，表彰他们发现利用胚胎干细胞在小鼠中引入特定基因修饰的原理。","note":"ES细胞需为同源细胞，才能与打靶载体发生同源重组。","pages":[19,114]},{"id":"L9-C56","cn":"正负筛选法","en":"positive-negative selection","abbr":"PNS","definition":"同时利用正向选择标记与负向选择标记富集发生同源重组的细胞的筛选方法。","detail":"常用正选择标记为新霉素抗性基因（Neo），负选择标记为白喉毒素A亚基（DTA）或HSV-tk。幻灯片列出PNS法、标记基因的特异位点表达法、PCR法三种筛选方法。","note":"DTA位于载体同源臂外侧，随机整合时DTA保留并杀死细胞。","pages":[114,122]},{"id":"L9-C57","cn":"条件性基因打靶","en":"conditional gene targeting","abbr":"","definition":"将某个基因的修饰限制于小鼠某些特定类型的细胞或发育的某一特定阶段的一种特殊的基因打靶方法。","detail":"在常规基因打靶基础上，利用重组酶介导的位点特异性重组技术，对基因修饰的时空范围设置可调控的'按钮'。","note":"与完全基因敲除相对。","pages":[116]},{"id":"L9-C58","cn":"Cre/LoxP系统","en":"Cre/LoxP system","abbr":"","definition":"来源于噬菌体的位点特异性重组系统，是四种条件型定位重组系统中应用最广泛的一种。","detail":"其余三种为Gin/Gix系统、酵母细胞的FLP/FRT系统、酵母细胞的R/RS系统。loxP位点为一个34 bp的特定DNA序列，来源于P1噬菌体，由两个13 bp的反向重复序列和一个8 bp的非对称间隔序列组成，Cre重组酶能够识别并与之结合。Cre的表达特性决定了靶基因的修饰（切除）特性。","note":"34 bp = 13 bp + 8 bp + 13 bp。","pages":[116,117,118]},{"id":"L9-C59","cn":"诱导性基因敲除","en":"inducible knockout","abbr":"","definition":"以Cre/loxP系统为基础，利用控制Cre表达的启动子活性或所表达Cre酶活性具有可诱导的特点，通过对诱导剂给予时间的控制，在loxP动物的一定发育阶段和一定组织细胞中实现对特定基因进行遗传修饰的基因敲除技术。","detail":"常见诱导性类型：四环素诱导型、干扰素诱导型、激素诱导型、腺病毒介导型。优点：①诱导基因突变的时间可人为控制；②可避免因基因突变而致死胎的问题；③在2个loxP位点之间的重组率较高；④如用病毒或配体/DNA复合物等基因转移系统来介导Cre的表达，则可省去建立携带Cre的转基因动物的过程。","note":"与组织特异性敲除的区别在于：诱导性敲除的控制变量是'给药时间'，而非仅由启动子决定。","pages":[119,121]},{"id":"L9-C60","cn":"CreERT2","en":"inducible Cre recombinase (CreERT2)","abbr":"","definition":"含有雌激素受体的配体结合区突变体与Cre重组酶的融合蛋白，在表达该融合蛋白的小鼠中实现他莫昔芬诱导的Cre活性。","detail":"不加他莫昔芬时，Cre-ERT融合蛋白分布于细胞质中并结合Hsp90，处于失活状态；加入他莫昔芬时，Hsp90从ER中转移出来，ER受体转变为活性状态，暴露出核定位信号，在核定位信号引导下Cre重组酶进入核中并行使功能。","note":"'ERT2'指雌激素受体配体结合区的突变体形式，使其只对他莫昔芬响应而不被内源雌激素激活。","pages":[120]},{"id":"L9-C61","cn":"基因编辑","en":"Genome Editing","abbr":"","definition":"利用人工核酸酶在基因组特定位点产生双链断裂，通过细胞修复机制实现基因敲除、敲入或替换的技术。","detail":"三代人工核酸酶：ZFN（1996）、TALE & TALENs（2010）、CRISPR/Cas system（2013）。ZFN由锌指DNA结合结构域和FokI核酸酶切割结构域融合而成；TALEN由TALE蛋白的DNA结合结构域与FokI核酸酶切割结构域融合而成；CRISPR/Cas9由向导RNA（gRNA）引导Cas9核酸酶在靶DNA特定位点切割。","note":"FokI核酸酶结构域需二聚化才能切割DNA，因此ZFN和TALEN需要两个单体结合在相邻位点形成二聚体。","pages":[123]},{"id":"L9-C62","cn":"功能冗余","en":"functional redundancy","abbr":"","definition":"基因家族中多个成员具有相同或相似的功能，单个基因敲除后其他成员可代偿其功能，导致无明显表型。","detail":"是基因敲除技术的主要局限之一：敲掉一个在功能上冗余的基因并不能造成容易识别的表型。","note":"另一局限是必需基因敲除后造成致死性。","pages":[125]},{"id":"L9-C63","cn":"必需基因","en":"essential gene","abbr":"","definition":"细胞或生物体生存所必需的基因，敲除后导致细胞死亡或生物体致死。","detail":"无法通过常规基因敲除研究其功能。","note":"与功能冗余共同构成基因敲除技术难以克服的缺点。","pages":[125]}],"processes":[{"id":"L9-P01","name":"利用EcoRI构建重组DNA分子","en":"construction of recombinant DNA with EcoRI","overview":"两个含EcoRI识别位点的DNA分子分别用EcoRI切割，产生带互补黏性末端的片段，退火后由DNA连接酶封闭缺口。","steps":[{"n":1,"name":"EcoRI切割","detail":"两个DNA分子（蓝色与红色）各含G-A-A-T-T-C / C-T-T-A-A-G序列，分别切割，蓝色片段留下G与C-T-T-A-A突出端，红色片段留下A-A-T-T-C与G突出端。"},{"n":2,"name":"形成互补末端片段","detail":"两片段具有互补黏性末端。"},{"n":3,"name":"退火","detail":"靠互补碱基配对形成重组DNA分子，但两条链之间仍有缺口（shaded gaps），未共价结合。"},{"n":4,"name":"DNA连接酶封闭缺口","detail":"DNA连接酶形成磷酸二酯键，共价连接两条链，得到完整重组DNA分子。"}],"key_points":["限制酶产生互补黏性末端使两片段可定向配对","退火只是氢键配对，必须由DNA连接酶形成磷酸二酯键才能得到稳定的共价重组分子"],"regulation":[],"figures":["切割→互补末端片段→退火→连接酶封闭缺口流程图"],"pages":[30]},{"id":"L9-P02","name":"PCR循环三步曲","en":"denaturation–annealing–extension cycle","overview":"每一轮循环包括变性、退火、延伸三个步骤，图中标注温度为95℃、55℃、72℃。","steps":[{"n":1,"name":"变性（denaturation）","detail":"双链DNA解链成为单链DNA，95℃。"},{"n":2,"name":"退火（annealing）","detail":"部分引物与模板单链DNA的特定互补部位相配对和结合，55℃。"},{"n":3,"name":"延伸（extension）","detail":"以目的基因为模板，合成互补的新DNA链，72℃。"}],"key_points":["理论最高拷贝数=2^n，实际得到1.8^n","引物序列及其与模板结合的特异性是决定PCR反应结果的关键","Taq等聚合酶无3'→5'校对活性，有一定程度单核苷酸碱基错误掺入"],"regulation":["Mg2+浓度是DNA聚合酶活性所必需的条件"],"figures":["PCR第一轮循环示意图：95℃变性、55℃引物退火、72℃延伸"],"pages":[71]},{"id":"L9-P03","name":"绝对定量实时PCR","en":"absolute quantification by real-time PCR","overview":"以已知起始拷贝数的标准品系列建立Ct对起始拷贝数对数的标准曲线，再根据未知样品的Ct值从标准曲线上读出其绝对含量。","steps":[{"n":1,"name":"配制梯度标准品","detail":"已知起始拷贝数的标准品系列（10^0～10^6）。"},{"n":2,"name":"同批扩增","detail":"标准品与未知样品同批进行实时定量PCR。"},{"n":3,"name":"绘制标准曲线","detail":"以Ct对log拷贝数拟合直线。"},{"n":4,"name":"反推绝对拷贝数","detail":"由未知样品Ct值从标准曲线上读出其绝对含量。"}],"key_points":["Ct值与起始模板拷贝数的对数呈线性关系","起始拷贝数越多，Ct值越小","依赖标准品的准确性"],"regulation":[],"figures":["A扩增曲线；B标准曲线（10^0～10^6，星号标出未知样品Ct位置）"],"pages":[77]},{"id":"L9-P04","name":"相对定量实时PCR（比较Ct法）","en":"relative quantification by real-time PCR (comparative Ct method)","overview":"两样品Ct之差△Ct与起始模板量比值呈指数关系，相对比值=扩增效率^△Ct。","steps":[{"n":1,"name":"三次重复","detail":"各样品做三次重复。"},{"n":2,"name":"持家基因均一化","detail":"用拟南芥持家基因UBQ10进行均一化处理。"},{"n":3,"name":"计算平均Ct","detail":"WT为31.23±0.32，突变体Mu为21.92±0.13。"},{"n":4,"name":"求△Ct","detail":"△Ct=AvgCt_WT−AvgCt_Mu=9.31±0.19。"},{"n":5,"name":"计算相对比值","detail":"按1.8^△Ct计算得239±26.25，即突变体中Wus目的cDNA相对含量约为野生型的239倍。"}],"key_points":["不需已知拷贝数的标准品","扩增效率此处取1.8（每循环扩增1.8倍）"],"regulation":[],"figures":["WT与bard1-3突变体扩增曲线，Ct分别为31.23±0.32与21.92±0.13"],"pages":[80]},{"id":"L9-P05","name":"SYBR Green I实时定量PCR检测","en":"SYBR Green I real-time quantitative PCR","overview":"染料在游离状态不发光，只有结合到双链DNA上才产生荧光信号，信号强度与DNA分子总数目成正比。","steps":[{"n":1,"name":"游离染料不发光","detail":"未结合的SYBR Green I不能产生荧光。"},{"n":2,"name":"引物退火与PCR","detail":"引物与目的DNA退火，进行PCR。"},{"n":3,"name":"延伸后染料结合","detail":"延伸后形成新的DNA双链，SYBR Green I结合到新DNA分子中，产生绿色荧光。"},{"n":4,"name":"信号累积","detail":"每形成一个DNA双链就有一定数量染料结合，信号强度与DNA分子总数目成正比。"}],"key_points":["非序列特异性染料，任何双链产物均发光","不能区分特异与非特异产物"],"regulation":[],"figures":["SYBR Green I结合双链DNA发光示意图"],"pages":[78]},{"id":"L9-P06","name":"TaqMan探针实时定量PCR","en":"TaqMan probe real-time quantitative PCR","overview":"探针结合到目的DNA序列上后被具有外切酶活性的Taq DNA聚合酶逐个切除而降解，荧光基团解除淬灭束缚，荧光强度直接反映所扩增靶DNA的总量。","steps":[{"n":1,"name":"探针完整时荧光淬灭","detail":"5'荧光基团与3'淬灭基团靠近，荧光共振能量转移导致荧光淬灭，检测不到荧光。"},{"n":2,"name":"探针结合靶DNA","detail":"PCR进行中，TaqMan探针结合到目的DNA序列中间部位。"},{"n":3,"name":"Taq酶切除探针","detail":"Taq DNA聚合酶沿模板延伸，利用其外切酶活性将探针逐个切除降解。"},{"n":4,"name":"荧光释放","detail":"被切下的荧光基团解除淬灭束缚，在激发光下发出绿色荧光；每产生一条DNA链就切断一条探针，每切断一条探针产生一个单位信号。"}],"key_points":["高特异性、设计简单、重复性好","信号强度与结合探针的DNA分子数成正比"],"regulation":[],"figures":["TaqMan探针工作原理图：5'荧光基团、3'淬灭基团、Taq酶延伸切除探针"],"pages":[79]},{"id":"L9-P07","name":"Southern印迹杂交","en":"Southern blot","overview":"DNA经限制酶消化、凝胶电泳分离、碱变性后，通过毛细作用转印至硝酸纤维薄膜，与放射性单链DNA探针杂交，洗脱未结合探针后放射自显影。","steps":[{"n":1,"name":"DNA降解成片段","detail":"Digest DNA to make fragments。"},{"n":2,"name":"凝胶电泳分离","detail":"Separate fragments by gel electrophoresis。"},{"n":3,"name":"碱液中变性","detail":"Soak gel in alkali to separate (denature) DNA。"},{"n":4,"name":"转印至硝酸纤维薄膜","detail":"Blot gel onto nitrocellulose filter，DNA moves to filter by capillary action。"},{"n":5,"name":"加入放射性探针并杂交","detail":"Add radioactive ssDNA probe, which hybridizes with sequences of interest。"},{"n":6,"name":"洗脱未杂交探针","detail":"Wash away unbound probe。"},{"n":7,"name":"放射显影，研究结果","detail":"Make autoradiogram and study results。"}],"key_points":["可有效地分析基因结构或检测待测DNA样本中是否含有特定的序列","用只和DNA分子一个特定序列同源的DNA片段作探针杂交，能看见单一条带"],"regulation":[],"figures":["Southern印迹（DNA）操作流程图，分7步展示从DNA酶切到放射自显影的全过程"],"pages":[88,89]},{"id":"L9-P08","name":"Northern印迹杂交","en":"Northern blot","overview":"RNA经凝胶电泳分离后转印至硝酸纤维素薄膜，与放射性RNA探针杂交，经放射自显影检测特定mRNA。","steps":[{"n":1,"name":"凝胶电泳分离RNA","detail":"Separate RNA molecules by gel electrophoresis。"},{"n":2,"name":"转印至硝酸纤维薄膜","detail":"Blot gel onto nitrocellulose filter，RNA moves to filter by capillary action。"},{"n":3,"name":"加入RNA探针并杂交","detail":"Add radioactive RNA probe, which hybridizes with sequences of interest。"},{"n":4,"name":"洗脱未杂交探针","detail":"Wash away unbound probe。"},{"n":5,"name":"放射显影，研究结果","detail":"Make autoradiogram and study the results。"}],"key_points":["确定一个样品中特定mRNA的含量，即基因的表达水平","不同组织样品间条带的有无与强弱反映组织特异性表达"],"regulation":[],"figures":["Northern Blot（RNA）流程示意图；多组织样品放射自显影结果（心脏、肾脏、肝脏、胎盘有信号）"],"pages":[90,91]},{"id":"L9-P09","name":"RNAi（siRNA通路）作用机制","en":"RNA interference pathway","overview":"长双链RNA被Dicer加工为siRNA，siRNA装载入RISC，反义链引导RISC切割互补的靶mRNA。","steps":[{"n":1,"name":"Dicer加工长双链RNA","detail":"细胞中较长的双链RNA（30个核苷酸以上）被Dicer（具RNase III活性）加工。"},{"n":2,"name":"生成siRNA","detail":"降解形成21～25个核苷酸的小分子干扰RNA（siRNA）。"},{"n":3,"name":"组装RISC","detail":"siRNA中的反义链参与指导合成RISC核蛋白体。"},{"n":4,"name":"切割靶mRNA","detail":"RISC介导切割目的mRNA中与siRNA反义链互补的区域，实现干扰靶基因表达的功能。"}],"key_points":["siRNA 3'端有两个碱基游离","Argonaute剪切作用发生在反义链（引导链）RNA的第10th和第11th个核苷酸之间"],"regulation":["miRNA通路：pri-miRNA经Drosha加工为pre-miRNA，Exportin 5出核，Dicer加工为miRNA，与靶mRNA 3'UTR不完全互补结合导致翻译抑制"],"figures":["miRNA与siRNA两条通路的加工与作用示意图"],"pages":[101]},{"id":"L9-P10","name":"shRNA介导的基因沉默","en":"shRNA-mediated gene silencing","overview":"shRNA在细胞核表达后被Drosha加工，由Exportin-5转运到细胞质，与Dicer结合去除环状序列，再与RISC结合并去掉其中一条RNA链，识别具有互补序列的mRNA并导致其降解。","steps":[{"n":1,"name":"核内表达pre-shRNA","detail":"细胞核内表达pre-shRNA。"},{"n":2,"name":"Drosha加工","detail":"DGCR8、Drosha加工。"},{"n":3,"name":"Exportin-5出核","detail":"Exp5转运至细胞质。"},{"n":4,"name":"Dicer去除环状序列","detail":"生成siRNA。"},{"n":5,"name":"装载RISC并去除一条链","detail":"识别互补mRNA并降解。"}],"key_points":["shRNA可通过病毒载体转染，克服某些细胞不能转染的难题","可用诱导型启动子控制表达，能与报告基因共表达，经病毒介导的转导保持稳定"],"regulation":["外源siRNA可直接转染进入细胞质，二者最终都装载RISC降解互补mRNA"],"figures":["shRNA与siRNA结构对比及shRNA细胞内加工通路图"],"pages":[103]},{"id":"L9-P11","name":"重叠延伸诱变法","en":"overlap extension mutagenesis","overview":"以模板DNA为模板，用两对引物分别扩增出两个带有突变位点重叠区的PCR产物，再通过重叠区退火延伸获得含突变的全长产物。","steps":[{"n":1,"name":"第一轮PCR","detail":"引物1与引物2扩增出PCR产物1；引物3与引物4扩增出PCR产物2；引物2与引物3含互补的突变序列（图中黑点标示突变位点）。"},{"n":2,"name":"重叠延伸","detail":"PCR产物1与PCR产物2在重叠区（含突变位点）退火，互为引物延伸，形成全长双链。"},{"n":3,"name":"获得突变产物","detail":"全长突变双链DNA产物。"}],"key_points":["引物2和引物3是含突变碱基的互补引物","PCR介导的定点突变优点：突变体回收率高、能用双链DNA作模板、可在任何位点引入突变、可在同一试管完成所有反应、快速简便"],"regulation":[],"figures":["重叠延伸诱变法示意图，展示两轮PCR与重叠延伸得到突变产物的流程"],"pages":[108,109]},{"id":"L9-P12","name":"真核生物基因敲除技术路线","en":"eukaryotic gene knockout technical route","overview":"构建重组基因载体，用电穿孔、显微注射等方法把重组DNA导入胚胎干细胞纯系中，使外源 导入细菌。","steps":[{"n":1,"name":"制备感受态","detail":"将快速生长期大肠杆菌置于经0℃预处理的低渗CaCl2溶液中，细胞膨胀、膜通透性改变，易与外源DNA相粘附。"},{"n":2,"name":"热刺激","detail":"将该体系转移到42℃下做短暂的热刺激，外源DNA就可能被细胞吸收。"},{"n":3,"name":"筛选阳性克隆","detail":"将转化后细胞置于含抗生素的选择性培养基上筛选。"}],"key_points":["关键条件：0℃预处理、低渗CaCl2溶液、快速生长期大肠杆菌、42℃短暂热刺激","转化效率可达到5×10^6~2×10^7个转化子/µg超螺旋质粒DNA"],"regulation":[],"figures":[],"pages":[43]},{"id":"L9-P16","name":"磷酸钙共沉淀法","en":"calcium phosphate co-precipitation","overview":"先将DNA和氯化钙混合，然后加入到PBS中慢慢形成DNA磷酸钙沉淀，把含有沉淀的混悬液加到培养的细胞上，通过细胞胞膜的内吞作用摄入DNA。","steps":[{"n":1,"name":"混合","detail":"DNA与氯化钙混合。"},{"n":2,"name":"形成沉淀","detail":"加入PBS缓慢形成DNA磷酸钙沉淀。"},{"n":3,"name":"加到细胞上","detail":"沉淀混悬液加到培养细胞上。"},{"n":4,"name":"内吞摄入","detail":"细胞膜内吞摄入DNA。"}],"key_points":["由Graham等人于1973年首先建立","试剂易取得、价格便宜，广泛用于瞬时转染和稳定转染研究","转染效率取决于沉积反应和形成颗粒的大小","目前仅用于体外培养细胞的基因转移"],"regulation":["磷酸钙似乎还通过抑制血清中和细胞内的核酸酶活性而保护外源DNA免受降解"],"figures":[],"pages":[47]},{"id":"L9-P17","name":"人工脂质体法","en":"artificial liposome method (cationic liposome transfection)","overview":"采用阳离子脂质体，与带负电荷的核酸结合后形成复合物，复合物接近细胞膜时被内吞成为内体进入细胞质，随后DNA复合物被释放进入细胞核内。","steps":[{"n":1,"name":"形成复合物","detail":"阳离子脂质体与带负电核酸结合形成复合物。"},{"n":2,"name":"内吞成内体","detail":"复合物接近细胞膜被内吞成为内体。"},{"n":3,"name":"进入细胞质","detail":"进入细胞质。"},{"n":4,"name":"释放入核","detail":"DNA复合物释放进入细胞核。"}],"key_points":["转染效率较高，可转染其他化学方法不易转染的细胞系","还能转染从寡核苷酸到人工酵母染色体不同长度的DNA以及RNA和蛋白质","同时适用于瞬时表达和稳定表达，可介导DNA和RNA转入动物和人的体内用于基因治疗"],"regulation":[],"figures":["阳离子脂质体介导基因导入细胞的示意图：脂复合物颗粒→早期内体→晚期内体→细胞核"],"pages":[48]},{"id":"L9-P18","name":"总RNA提取","en":"total RNA extraction","overview":"从组织研磨到获得总RNA的流程。","steps":[{"n":1,"name":"液氮研磨","detail":"组织液氮研磨。"},{"n":2,"name":"加入Trizol","detail":"加入Trizol。"},{"n":3,"name":"氯仿抽提","detail":"氯仿抽提，分水相与有机相。"},{"n":4,"name":"异丙醇沉淀","detail":"收集水相，用异丙醇沉淀RNA。"},{"n":5,"name":"溶解","detail":"晾干，无酶水溶解。"}],"key_points":["28S和18S特征性条带是电泳鉴定总RNA纯度和完整性的重要参数","OD260为1时相当于RNA浓度40 μg/ml；OD260/OD280在1.8-2.0之间表示纯度较好"],"regulation":[],"figures":["（a）总RNA提取流程图；（b）总RNA的甲醛变性电泳结果图（28S、18S、5S）"],"pages":[60,61]},{"id":"L9-P19","name":"RNA变性凝胶电泳","en":"RNA denaturing gel electrophoresis","overview":"上样前用变性剂处理RNA，防止碱基对形成，使RNA保持单链状态，从而按分子大小分离。","steps":[{"n":1,"name":"变性剂处理","detail":"上样前使用变性剂处理RNA。"},{"n":2,"name":"防止碱基配对","detail":"变性剂（如甲醛、乙二醛、羟甲基汞）与RNA分子反应，防止碱基对的形成。"},{"n":3,"name":"变性电泳","detail":"在变性条件下进行琼脂糖凝胶电泳。"},{"n":4,"name":"染色","detail":"用30 μg/ml吖啶橙浸胶染色。"}],"key_points":["RNA单链可自身折叠形成局部双链结构，若不进行变性处理会影响按分子大小分离的准确性"],"regulation":[],"figures":["RNA单链局部折叠形成二级/三级结构的示意图"],"pages":[59]},{"id":"L9-P20","name":"基因芯片实验流程","en":"DNA microarray workflow","overview":"从细胞培养出发，经探针制备与固定、样品标记、杂交、反应、测量、成像、分析到数据输出。","steps":[{"n":1,"name":"细胞培养取材","detail":"cell culture。"},{"n":2,"name":"提取与标记","detail":"cell extraction、PCR amplification、fluorophore labelling。"},{"n":3,"name":"探针制备与固定","detail":"probe preparation、probe immobilization、chip preparation。"},{"n":4,"name":"杂交","detail":"hybridization。"},{"n":5,"name":"反应、测量、成像","detail":"reaction、measurement、image。"},{"n":6,"name":"数据分析","detail":"analysis、data。"}],"key_points":["芯片上密集排列的探针与荧光标记样品杂交后，逐点读取信号强度，经分析得到基因表达谱数据"],"regulation":[],"figures":["基因芯片从样品制备到数据分析的全流程图"],"pages":[92]},{"id":"L9-P21","name":"海胆胚胎分离实验（Driesch 1891）","en":"Driesch's sea urchin embryo separation experiment","overview":"在2细胞期将两个卵裂球分开，各自培养，结果每个细胞都发育为一个完整的幼虫，而非半个胚胎。","steps":[{"n":1,"name":"2细胞期胚胎","detail":"2-cell stage。"},{"n":2,"name":"机械分离两个卵裂球","detail":"Isolation at 2 cell stage。"},{"n":3,"name":"各自单独培养","detail":"经16细胞期（16 blastomeres）、半囊胚（Half-Blastula）。"},{"n":4,"name":"形成完整幼虫","detail":"最终各自形成完整的棱柱幼虫（Quasinormal plutei）。"}],"key_points":["证明早期胚胎细胞具有全能性/调整发育能力","为现代发育生物学奠定了第一块观念里程碑"],"regulation":[],"figures":["海胆胚胎分离实验示意图：2细胞期分离→16个卵裂球→半囊胚→近乎正常的棱柱幼虫"],"pages":[12]}],"distinctions":[{"id":"L9-D01","title":"模式动物与动物模型","a":"模式动物（model animal）","b":"动物模型（animal model）","difference":["模式动物研究基本生命现象；动物模型针对特殊（特定疾病/特定问题）","模式动物是固有的（自然界选定）；动物模型是创造的（人工构建）","模式动物用于基础研究；动物模型用于应用研究","模式动物结构简单；动物模型复杂"],"easy_mistake":"把人工构建的疾病模型称作模式动物；最本质差别在于'创造的'而非'固有的'。","pages":[4]},{"id":"L9-D02","title":"基因操作与基因工程","a":"基因操作（gene manipulation）","b":"基因工程（genetic engineering）","difference":["基因操作是涵盖切割连接、转化、测序、人工合成、表达、定点突变、PCR等的总称","基因工程特指构建载体—插入片段的重组分子并导入新寄主稳定繁殖表达","基因工程强调跨越物种屏障、外源核酸在异种寄主细胞中繁衍与性状表达"],"easy_mistake":"把任何DNA操作都称为基因工程；基因工程只是基因操作中强调跨寄主表达的部分。","pages":[20,21]},{"id":"L9-D03","title":"错位切与平切","a":"错位切","b":"平切","difference":["错位切产生两个相同的黏性末端（sticky end）","平切形成平末端（blunt end）","HpaI在识别序列中央对称切割形成平末端；EcoRI、HindIII、PstI错位切割形成黏性末端"],"easy_mistake":"认为所有限制酶都产生黏性末端；平末端连接需选用T4 DNA连接酶。","pages":[26,28,31]},{"id":"L9-D04","title":"E. coli DNA连接酶与T4 DNA连接酶","a":"E. coli DNA连接酶","b":"T4 DNA连接酶","difference":["来源分别为大肠杆菌与T4噬菌体","相同点是均恢复磷酸二酯键","E. coli酶只能连接黏性末端；T4酶可连接黏性末端和平末端"],"easy_mistake":"用E. coli连接酶做平末端连接；平末端连接必须选用T4 DNA连接酶。","pages":[31]},{"id":"L9-D05","title":"DNA聚合酶与DNA连接酶","a":"DNA聚合酶","b":"DNA连接酶","difference":["DNA聚合酶只能将单个核苷酸连接到已有的核酸片段上，形成磷酸二酯键","DNA聚合酶以一条DNA链为模板，将单个核苷酸通过磷酸二酯键连接成一条互补的DNA链","DNA连接酶在两个DNA片段之间形成磷酸二酯键","DNA连接酶将DNA双链上的两个缺口同时连接起来，不需要模板","相同点：都形成磷酸二酯键"],"easy_mistake":"认为连接酶也需要模板；连接酶是'缝合酶'，不需模板。","pages":[32]},{"id":"L9-D06","title":"退火与连接","a":"退火（annealing）","b":"连接（ligation）","difference":["退火仅靠互补碱基配对形成氢键，两条链并未共价结合（图中shaded gaps）","连接由DNA连接酶催化形成磷酸二酯键，实现共价封闭"],"easy_mistake":"以为互补末端配对后即形成稳定重组分子；必须经连接酶封闭缺口。","pages":[30]},{"id":"L9-D07","title":"聚丙烯酰胺凝胶与琼脂糖凝胶","a":"聚丙烯酰胺凝胶","b":"琼脂糖凝胶","difference":["聚丙烯酰胺凝胶分辨力高、分离范围窄（1~1000 bp）","琼脂糖凝胶分辨力较低、分离范围宽（几十至几百Kb）","浓度越高孔隙越小、分辨能力越强"],"easy_mistake":"用琼脂糖凝胶分离1 bp级别的小片段；小片段高分辨应选高浓度聚丙烯酰胺凝胶。","pages":[57]},{"id":"L9-D08","title":"超螺旋DNA与开环/线性DNA","a":"超螺旋DNA（supercoiled DNA）","b":"开环/线性DNA（open circular / linear DNA）","difference":["同等分子量时超螺旋构型紧密、迁移率最快","开环松弛型最慢","线性DNA居中"],"easy_mistake":"仅凭迁移位置判断分子量；电泳条带位置还反映拓扑构型。","pages":[56]},{"id":"L9-D09","title":"Southern杂交与Northern杂交","a":"Southern杂交","b":"Northern杂交","difference":["Southern检测DNA，探针为DNA或RNA","Northern检测RNA（mRNA含量/基因表达水平），探针为放射性RNA探针","Southern由E.M.Southern于1975年创立"],"easy_mistake":"把检测RNA的杂交写成Southern；Western检测的是蛋白质。","pages":[86,88,90]},{"id":"L9-D10","title":"常规PCR与实时定量PCR","a":"常规PCR","b":"实时定量PCR（qRT-PCR）","difference":["常规PCR对PCR扩增反应的终产物进行定性和定量分析","实时定量PCR对PCR扩增反应中的每一个循环的产物进行定量分析","实时定量PCR特异性更强、灵敏度高、可直接对产物定量、解决PCR污染问题、自动化程度高、操作简单"],"easy_mistake":"认为常规PCR终点定量准确；其变异系数大，终点定量不准确。","pages":[74,75]},{"id":"L9-D11","title":"SYBR Green I染料法与TaqMan探针法","a":"SYBR Green I染料法","b":"TaqMan探针法","difference":["SYBR Green I为非序列特异性染料，只与双链DNA结合，任何双链产物均发光","TaqMan探针与靶序列特异结合，具有序列特异性","TaqMan探针5'端为荧光基团、3'端为淬灭基团，依赖Taq酶外切酶活性切割探针"],"easy_mistake":"认为SYBR Green I可区分特异与非特异产物；它不能。","pages":[78,79]},{"id":"L9-D12","title":"siRNA与miRNA","a":"siRNA（精准靶向工具）","b":"miRNA（宏观调控官）","difference":["起源：siRNA外源；miRNA内源，一种非编码RNA","成熟过程：siRNA直接来源是长链dsRNA，经Dicer（Dicer2和R2D2）切割形成双链siRNA；miRNA在细胞核中转录为pri-miRNA，经Drosha和Pasha加工成单链pre-miRNA，再在细胞质中被Dicer（Dicer1和loqs）切割形成miRNA，具时序性、保守性和组织特异性","功能：siRNA与RISC（利用AGO2）结合，与序列互补的靶标mRNA结合降解mRNA，用于沉默外源病毒、转座子活性；miRNA与RISC（利用AGO1）形成复合体后与靶标mRNA 3'UTR不完全结合，抑制mRNA翻译，调节与生长发育相关的基因","靶基因特异性：一条siRNA只针对一个靶基因；一条miRNA可以有多个靶基因","分布：siRNA主要存在于低等生物，可通过人为设计合成导入高等生物细胞；miRNA低等和高等生物都存在"],"easy_mistake":"混淆二者与AGO蛋白的配对（siRNA-AGO2，miRNA-AGO1）及互补程度（完全互补vs不完全互补）。","pages":[102]},{"id":"L9-D13","title":"shRNA与siRNA","a":"shRNA","b":"siRNA","difference":["shRNA可通过病毒载体转染，克服某些细胞不能转染的难题","shRNA可用诱导型启动子控制表达，能与报告基因共表达，经病毒介导的转导保持稳定","siRNA在细胞中瞬时表达","shRNA为发夹结构，需经Drosha加工、Exportin-5出核、Dicer去除环状序列；siRNA为平端双链、3'端有两个碱基突出"],"easy_mistake":"认为shRNA与siRNA一样直接转染进入细胞质；shRNA需在核内表达并加工。","pages":[103]},{"id":"L9-D14","title":"完全基因敲除与条件型基因敲除","a":"完全基因敲除","b":"条件型基因敲除（Conditional gene knock-out）","difference":["完全基因敲除通过同源重组法完全消除细胞或者动植物个体中的靶基因活性","条件型基因敲除又称不完全基因敲除，通过定位重组系统实现特定时间和空间的基因敲除"],"easy_mistake":"把条件型敲除等同于普通敲除；条件型敲除的时空范围可控。","pages":[112]},{"id":"L9-D15","title":"诱导性基因敲除与传统组成型基因敲除","a":"诱导性基因敲除","b":"传统组成型基因敲除","difference":["诱导性敲除可控制突变发生的时间（如成年期），避免致死胎","传统敲除从胚胎期即发生，若基因是发育必需的则导致致死","诱导性敲除在2个loxP位点之间的重组率较高"],"easy_mistake":"把诱导性敲除与组织特异性敲除混为一谈；诱导性敲除的控制变量是'给药时间'。","pages":[121]},{"id":"L9-D16","title":"RNA-Seq与微阵列芯片","a":"RNA-Seq","b":"微阵列芯片（microarray）","difference":["RNA-Seq为数字化信号、单核苷酸分辨率、动态范围高于6个数量级、无需设计探针","芯片为荧光模拟信号，存在交叉反应与背景噪音","芯片对过低或过高表达基因缺乏敏感性，动态范围小"],"easy_mistake":"认为芯片也能检测几个拷贝的稀有转录本；高灵敏度是RNA-Seq的优势。","pages":[98]},{"id":"L9-D17","title":"地高辛标记与同位素标记","a":"地高辛标记（非放射性）","b":"同位素标记（放射性）","difference":["地高辛标记通过酶促免疫显色检测，呈有色沉淀","同位素标记通过放射自显影检测，呈黑色银粒","两者均可用于组织原位杂交定位"],"easy_mistake":"认为非放射性标记不能用于原位杂交；地高辛标记同样可定位。","pages":[94]},{"id":"L9-D18","title":"mRNA互补链探针与同义链探针","a":"mRNA互补链探针（反义链）","b":"mRNA同义链探针","difference":["互补链（反义链）能与mRNA杂交产生信号","同义链不能杂交，用作负对照，应无信号"],"easy_mistake":"把同义链当作检测探针；同义链是负对照。","pages":[93]},{"id":"L9-D19","title":"DNA外切酶III与λ噬菌体DNA外切酶","a":"DNA外切酶III（exonuclease III）","b":"λ噬菌体DNA外切酶（λ exonuclease）","difference":["DNA外切酶III从DNA链的3'末端逐个切除单核苷酸","λ噬菌体DNA外切酶从5'末端逐个切除单核苷酸","两者作用方向相反"],"easy_mistake":"记反两种外切酶的作用方向。","pages":[24]},{"id":"L9-D20","title":"DNA聚合酶I与反转录酶","a":"DNA聚合酶I（大肠杆菌）","b":"反转录酶","difference":["DNA聚合酶I按5'→3'方向加入新核苷酸、补平DNA双链中的缺口，模板为DNA","反转录酶以RNA为模板、按碱基互补合成DNA链"],"easy_mistake":"认为反转录酶以DNA为模板；其模板是RNA。","pages":[24]},{"id":"L9-D21","title":"pET-14b与pET-28a(+)","a":"pET-14b","b":"pET-28a(+)","difference":["pET-14b大小4671 bp，筛选标记为Ap（Amp^r）","pET-28a(+)大小5369 bp，筛选标记为Kan（Kan^r），且含lacI与f1 origin"],"easy_mistake":"混淆两种载体的抗性标记。","pages":[37]},{"id":"L9-D22","title":"慢病毒与逆转录病毒","a":"慢病毒（Lentivirus）","b":"逆转录病毒（Retrovirus）","difference":["两者均整合入基因组、效率<30%","慢病毒可感染不分裂细胞","逆转录病毒只能感染分裂细胞"],"easy_mistake":"认为逆转录病毒也能感染不分裂细胞；只有慢病毒可以。","pages":[51]},{"id":"L9-D23","title":"重组腺病毒与腺相关病毒","a":"重组腺病毒（Recombinant adenovirus）","b":"腺相关病毒（Adeno-associated virus, AAV）","difference":["腺病毒效率100%、容量8 kb、不整合、工作量大","AAV效率低、不致病、不整合、需高效价"],"easy_mistake":"把AAV当作高转运效率载体；AAV效率低但安全性好。","pages":[51]},{"id":"L9-D24","title":"PCR介导的定点突变与传统定点突变","a":"PCR介导的定点突变","b":"传统基于单链模板/限制性片段替换的定点突变","difference":["PCR法可直接用双链DNA作模板","PCR法可在任何位点引入突变","PCR法可在同一试管完成全部反应","PCR法突变体回收率高、快速简便"],"easy_mistake":"认为定点突变必须使用单链模板；PCR法可用双链DNA。","pages":[109]},{"id":"L9-D25","title":"利用基因同源重组进行基因敲除与利用随机插入突变进行基因敲除","a":"同源重组介导的基因敲除","b":"随机插入突变（基因捕获法）","difference":["前者为定向打靶（含基本步骤、条件性敲除、诱导性敲除）","后者为随机插入（基因捕获法）"],"easy_mistake":"把基因捕获法当作定向敲除；它是随机插入突变策略。","pages":[115]}],"facts":[{"id":"L9-F01","text":"模式动物四条共性：能代表生物界某一大类群；对人体和环境无害、易获得并易在实验室饲养繁殖；世代短、子代多、遗传背景清楚；容易进行实验操作，特别具有遗传操作手段和表型分析方法。","note":"常考简答/多选题；注意与动物模型的区别（固有 vs 创造、基础 vs 应用）。","pages":[3,4]},{"id":"L9-F02","text":"大肠杆菌只有一条染色体，约460万核苷酸，编码4300多种蛋白质；单细胞，DNA、RNA和蛋白质合成机器在同一空间；具备易于遗传交换的系统，质粒可自主复制并用作克隆载体。","note":"定量数据常考填空；质粒“自主复制”是作为载体的前提。","pages":[6]},{"id":"L9-F03","text":"酿酒酵母可快速繁殖（90 min），单倍体与双倍体细胞并存促进遗传分析；在转录与基因调控、DNA复制、重组、翻译、剪接研究中重要。","note":"90 min 为常考数字；单倍/双倍体交替是酵母遗传学优势。","pages":[7]},{"id":"L9-F04","text":"2001年诺贝尔生理学或医学奖授予 Leland H. Hartwell（美国）、Tim Hunt（英国）、Paul M. Nurse（英国），表彰发现细胞周期关键分子调节机制——CDK与cyclin驱动细胞周期阶段转换。","note":"人名、国别、年份与“CDK/cyclin”对应关系常考选择/填空。","pages":[8]},{"id":"L9-F05","text":"拟南芥从约30万种植物中选出，8-10个星期内可产生大量后代；基因组为已知植物基因组中最小且已完成全序列测定；易得代谢缺陷型。","note":"“30万种”“8-10周”“基因组最小且已测序”为常考细节。","pages":[9]},{"id":"L9-F06","text":"果蝇有4条染色体，第一个基因图谱在果蝇中产生；P因子（P element）为果蝇转座子，可作载体把重组DNA引入正常果蝇株制备转基因果蝇；果蝇基因与人类同源基因非常相似。","note":"“4条染色体”“第一个遗传图谱”“P因子转基因”常考。","pages":[10]},{"id":"L9-F07","text":"2004年诺贝尔生理学或医学奖授予 Richard Axel 与 Linda B. Buck，表彰气味受体和嗅觉系统研究；他们发现果蝇嗅觉功能有特定大脑区域，阐明人类嗅觉系统工作方式。","note":"与果蝇模式生物价值结合考。","pages":[11]},{"id":"L9-F08","text":"1891年 Hans Driesch 将海胆2细胞期胚胎两个卵裂球机械分开、各自培养，每个细胞均发育为完整棱柱幼虫（quasinormal plutei），证明胚胎具有调整发育能力。","note":"经典实验，常考“调整发育/全能性”与实验结论。","pages":[12]},{"id":"L9-F09","text":"1991年 Peter Agre 发现第一个水通道蛋白 CHIP28；2003年诺贝尔化学奖授予 Peter Agre 与 Roderick MacKinnon；爪蟾卵母细胞作为表达系统用于膜蛋白功能研究。","note":"年份、CHIP28、奖项与爪蟾表达系统常考。","pages":[13]},{"id":"L9-F10","text":"秀丽隐杆线虫：12 h内胚胎完成发育，40 h内成为性成熟成虫（共959个体细胞）；雌雄同体成虫4 d可产生300个自身后代；基因组9700万对核苷酸，编码约19000个基因。","note":"959、300、9700万、19000 等数字为高频填空。","pages":[14]},{"id":"L9-F11","text":"2002年诺贝尔生理学或医学奖授予 Sydney Brenner、H. Robert Horvitz、John E. Sulston，表彰以线虫为模式生物发现器官发育和程序性细胞死亡的基因规则。","note":"与线虫模式生物地位对应。","pages":[15]},{"id":"L9-F12","text":"2006年诺贝尔生理学或医学奖授予 Andrew Z. Fire 与 Craig C. Mello，表彰发现RNA干扰；原始文献 Nature 1998, 391:806-811；dsRNA较反义单链RNA更高效特异地阻断基因表达。","note":"年份、期刊卷页、dsRNA优于反义RNA为常考细节。","pages":[16]},{"id":"L9-F13","text":"斑马鱼基因与人类基因相似度达87%；胚胎透明可活体观察细胞运动；细胞标记、突变、转基因、基因活性抑制技术成熟。","note":"87%为常考数字。","pages":[17]},{"id":"L9-F14","text":"小鼠基因组与人类99%同源，85%以上基因一一对应（直系同源），存在大量同线性；同源重组为单个基因选择性去除（基因敲除）提供机会。","note":"99%、85%、synteny、orthologous 为高频考点。","pages":[18]},{"id":"L9-F15","text":"2007年诺贝尔生理学或医学奖授予 Mario R. Capecchi、Sir Martin J. Evans、Oliver Smithies，表彰发现利用胚胎干细胞在小鼠中引入特定基因修饰的原理。","note":"与ES细胞基因打靶技术对应。","pages":[19]},{"id":"L9-F16","text":"重组DNA技术史关键节点：1869 Miescher从鲑鱼精子分离DNA；1957 Kornberg发现DNA聚合酶I；1967首次发现DNA连接酶；1970 Smith等分离第一种限制性核酸内切酶、Temin和Baltimore发现反转录酶；1972-1973 Boyer、Berg等获第一个重组DNA分子并完成第一例细菌基因克隆；1977完成φ174（5387 bp）全序列测定；1978在大肠杆菌中表达人脑激素和人胰岛素；1981获转基因小鼠和转基因果蝇；1996完成酵母基因组（1.25×10⁷ bp）；2000完成拟南芥（1.2×10⁸ bp）。","note":"年份—事件配对是经典填空题来源；注意“入噬菌体”为λ噬菌体误排。","pages":[22]},{"id":"L9-F17","text":"限制性内切酶已从约300种微生物中分离出约4000种；命名规则：属名首字母大写+种名首、二字母小写+菌株字母+罗马数字（如 EcoR I、Sma I）；EcoR I 是第一个核酸内切酶。","note":"300/4000、命名规则、EcoR I 地位常考。","pages":[27]},{"id":"L9-F18","text":"切割频率与识别序列长度相关：Sau3A1（5'-GATC-3'）平均0.25 kb；EcoRI（5'-GAATTC-3'）4 kb；NotI（5'-GCGGCCGC-3'）65 kb。","note":"可出计算/排序题：识别序列越短，切点越密。","pages":[28]},{"id":"L9-F19","text":"E·coli DNA连接酶只能连接黏性末端；T4 DNA连接酶既能连接黏性末端也能连接平末端；两者均恢复磷酸二酯键。","note":"平末端连接必须选T4连接酶，常考选择。","pages":[31]},{"id":"L9-F20","text":"DNA聚合酶只能将单个核苷酸加到已有核酸片段上并以一条DNA链为模板；DNA连接酶在两个DNA片段之间形成磷酸二酯键、同时连接双链上两个缺口且不需模板；两者相同点是均形成磷酸二酯键。","note":"经典比较题。","pages":[32]},{"id":"L9-F21","text":"表达载体五个条件：含一至多个限制酶切点（MCS）；含复制起始点（ori）能自主复制并稳定保存；有筛选标记便于抗生素筛选；载体DNA大小适中（约3 kb）；对受体细胞无害。","note":"五条件常考简答；3 kb 为数字考点。","pages":[34]},{"id":"L9-F22","text":"pUC质粒载体由四部分构成：来自pBR322的ori、氨苄青霉素抗性基因（amp^r）、lacZ'（含lac启动子及编码α-肽链序列）、位于lacZ' 5'-端的MCS；外源基因插入MCS破坏lacZ'，是蓝白斑筛选的分子基础。","note":"蓝白斑筛选原理常考：重组为白色、非重组为蓝色。","pages":[35]},{"id":"L9-F23","text":"pET系统受噬菌体T7强转录及翻译信号控制，表达由宿主细胞提供的T7 RNA聚合酶诱导；pET-14b为4671 bp、Ap抗性，pET-28a(+)为5369 bp、Kan抗性并含lacI与f1 origin。","note":"T7启动子/T7 RNA聚合酶、两种抗性标记为常考细节。","pages":[36,37]},{"id":"L9-F24","text":"无缝克隆要求载体末端与引物末端具有15-20个同源碱基，无需酶连即可转化宿主菌；约1 h完成载体构建，阳性克隆高达90%以上，重组效率为传统酶切连接技术的5-10倍，15分钟实现快速重组，一步可实现1-5个片段定向重组。","note":"15-20 bp、90%、5-10倍、1-5片段为数字考点。","pages":[39,40]},{"id":"L9-F25","text":"CaCl2转化法：快速生长期大肠杆菌置于0℃预处理的低渗CaCl2溶液，42℃短暂热刺激，转化效率可达5×10^6~2×10^7个转化子/µg超螺旋质粒DNA。","note":"温度步骤与转化效率数字常考。","pages":[43]},{"id":"L9-F26","text":"稳定转染中外源DNA整合概率约1/10^4转染细胞；瞬时转染外源DNA不整合、可多拷贝高水平表达、通常持续几天，转染后24-72 h分析；线性DNA比超螺旋DNA转入量低但整合率高。","note":"1/10^4、24-72 h、线性vs超螺旋为常考细节。","pages":[45]},{"id":"L9-F27","text":"病毒载体比较：重组腺病毒转运效率100%、可容纳8 kb插入片段、不整合、工作量大；慢病毒与逆转录病毒效率<30%且整合，慢病毒可感染不分裂细胞而逆转录病毒不能；腺相关病毒效率低、不致病、不整合、需高效价。","note":"表格型选择题高发区。","pages":[51]},{"id":"L9-F28","text":"1978年胰岛素基因在大肠杆菌中表达：胰岛素为51肽；传统法8000吨胰脏→1 kg胰岛素→1000名患者用一年；基因工程法2吨发酵液相当于650吨动物胰脏，即25升发酵液/每名患者/每年。","note":"可出计算题：换算发酵液与胰脏用量。","pages":[52]},{"id":"L9-F29","text":"1979年人生长素基因在大肠杆菌中表达：人生长素为191肽，由脑垂体分泌，治疗侏儒症；传统法需50个人脑垂体供1名患者用一年，基因工程法1升发酵液即可达到。","note":"191肽、50个垂体、1升发酵液为常考数字。","pages":[53]},{"id":"L9-F30","text":"电泳迁移率与电场强度和分子所带净电荷数成正比，与片段大小成反比；同等分子量时超螺旋DNA迁移最快，开环松弛型最慢，线性居中。","note":"构型影响迁移率是易错点：不能仅凭位置判断分子量。","pages":[55,56]},{"id":"L9-F31","text":"聚丙烯酰胺凝胶分辨力高但分离范围窄（1~1000 bp）；琼脂糖凝胶分辨力较低但可分离几十至几百Kb；凝胶浓度越高孔隙越小、分辨力越强。0.3%琼脂糖可分离50000~1000 bp，20.0%聚丙烯酰胺可分离50~1 bp。","note":"凝胶选择与浓度—范围对应表常考。","pages":[57]},{"id":"L9-F32","text":"RNA电泳须在变性条件下进行（变性剂如甲醛、乙二醛、羟甲基汞），染色最好用30 μg/ml吖啶橙；总RNA经甲醛变性电泳可见28S、18S、5S rRNA特征条带，是鉴定纯度和完整性的重要参数。","note":"变性原因（RNA二级/三级结构）与28S/18S为常考。","pages":[59,60]},{"id":"L9-F33","text":"RNA浓度与纯度：OD260为1相当于RNA浓度40 μg/ml；OD260/OD280在1.8-2.0表示纯度较好，明显低于1.8表明有蛋白质或酚污染。","note":"可出计算题（由OD260求浓度）。","pages":[61]},{"id":"L9-F34","text":"PCR每循环拷贝数理论倍增为2^n，实际约1.8^n；30个周期理论可达1 073 741 824 拷贝。","note":"计算题核心公式；注意实际扩增效率1.8。","pages":[62,71]},{"id":"L9-F35","text":"PCR历史：Khorana（1971）提出设想；1983年Mullis发明PCR；1988年Saiki等引入耐热Taq DNA聚合酶；1989年Science列PCR为十余项重大科学发明之首；Mullis获1993年诺贝尔化学奖；1989年12月Science将PCR及其聚合酶命名为第一个“年度分子”。","note":"年份—人物配对常考；1985年首篇PCR论文发表但Mullis论文被拒。","pages":[63,64,65]},{"id":"L9-F36","text":"PCR四组分：模板DNA、引物（约20个碱基短DNA单链，与目的基因两条链各自5'端序列互补）、Taq DNA聚合酶（或pfu DNA聚合酶）、dNTP（dATP、dTTP、dGTP、dCTP）；需合适Mg2+浓度。","note":"四组分与引物长度/方向为常考填空。","pages":[69,70]},{"id":"L9-F37","text":"PCR三步曲温度：变性95℃、退火55℃、延伸72℃；引物序列及其与模板结合的特异性是决定PCR结果的关键。","note":"三个温度值必记。","pages":[71,72]},{"id":"L9-F38","text":"qRT-PCR中Ct值是产物荧光强度首次超过设定阈值所需的循环数，Ct值与模板起始拷贝数的对数存在线性关系；起始拷贝数越多，Ct值越小。","note":"定量原理核心；常出计算/分析题。","pages":[76,77]},{"id":"L9-F39","text":"相对定量计算：△Ct = AvgCt_WT − AvgCt_Mu，相对比值 = 1.8^△Ct；拟南芥WT与bard1-3突变体Wus的Ct均值分别为31.23±0.32与21.92±0.13，△Ct=9.31±0.19，相对比值=239±26.25（以持家基因UBQ10均一化）。","note":"可原样出计算题。","pages":[80]},{"id":"L9-F40","text":"TaqMan探针长度50-150 bp，5'端带荧光基团、3'端带淬灭基团，完整时因荧光共振能量转移而淬灭；Taq DNA聚合酶利用外切酶活性逐个切除探针，每产生一条DNA链切断一条探针、产生一个单位信号。","note":"与SYBR Green I（非序列特异性）对比常考。","pages":[78,79]},{"id":"L9-F41","text":"放射性同位素半衰期：3H 12.1年、14C 5700年、32P 14.3天、35S 87.1天、60Co 5.8年。","note":"半衰期数字可出选择/填空；32P最短、14C最长。","pages":[84]},{"id":"L9-F42","text":"标记DNA两法：合成新DNA时在某一种核苷酸的α-磷酸基团中掺入32P或35S；末端标记用多聚核苷酸激酶将ATP的γ-磷酸基团加到DNA的5'-OH末端。","note":"α/γ磷酸基团区分是易错点。","pages":[85]},{"id":"L9-F43","text":"三种杂交检测对象：Southern检测DNA（探针DNA或RNA，1975年E.M.Southern创立）、Northern检测RNA（探针DNA或RNA）、Western检测蛋白质（探针为125I标记的特定蛋白质）。","note":"表格型选择题必考。","pages":[86,88,90]},{"id":"L9-F44","text":"高通量测序（NGS）可一次并行测序几十万至几百万条DNA分子，读长较短需拼接；传统测序完成一个人类基因组需3年，二代测序仅需1周；Sanger测序读长约1000 bp。","note":"3年vs1周、1000 bp为常考数字。","pages":[97]},{"id":"L9-F45","text":"RNA-Seq特点：数字化信号（单核苷酸分辨率）、高灵敏度（可检测几个拷贝的稀有转录本）、无需预先设计探针可分析任意物种、动态检测范围高于6个数量级、重复性好、起始样品少。","note":"与芯片对比常考；6个数量级为数字考点。","pages":[98]},{"id":"L9-F46","text":"RNAi核心参数：Dicer将30个核苷酸以上的长dsRNA加工为21~25个核苷酸siRNA；siRNA 3'端有两个碱基游离；Argonaute剪切位点位于反义链（引导链）第10与第11个核苷酸之间；RISC最小组成含Argonaute蛋白和siRNA。","note":"21-25 nt、30 nt、第10-11位为高频填空。","pages":[101,106]},{"id":"L9-F47","text":"siRNA与miRNA比较：siRNA外源、由长链dsRNA经Dicer（Dicer2和R2D2）切割成双链、用AGO2、与靶mRNA完全互补降解mRNA、一条siRNA只针对一个靶基因、主要存在于低等生物并可人工导入高等生物细胞；miRNA内源非编码RNA、pri-miRNA经Drosha和Pasha加工为pre-miRNA再经Dicer（Dicer1和loqs）切割、用AGO1、与3'UTR不完全互补抑制翻译、一条miRNA可有多个靶基因、低等和高等生物均存在。","note":"对比表是简答/选择高发点。","pages":[102]},{"id":"L9-F48","text":"脱靶效应：siRNA/shRNA与非靶基因mRNA部分序列互补引起非特异性抑制，最少7个核苷酸互补即可造成脱靶；高浓度siRNA增加脱靶概率；可在siRNA第二个碱基2'位核糖环添加甲基减少脱靶。","note":"7个核苷酸、2'位甲基化为常考细节。","pages":[104]},{"id":"L9-F49","text":"严格RNAi敲低实验至少需五类对照：转染试剂对照、nonsense siRNA对照、positive siRNA对照、重复对照（off-target对照，至少2个靶点siRNA互为对照）、rescue对照。","note":"实验设计题必用；各对照监控目的需能对应。","pages":[105]},{"id":"L9-F50","text":"PCR介导定点突变优点：突变体回收率高；能用双链DNA作模板、可在任何位点引入突变；可在同一试管完成所有反应；快速简便。主要方法为重叠延伸技术（overlap extension）与大引物诱变法（megaprimer method）。","note":"重叠延伸两轮PCR的引物设计是实验设计题热点。","pages":[107,108,109]},{"id":"L9-F51","text":"基因敲除发展史关键节点：1952首次核移植成功；1981转基因技术与胚胎干细胞技术诞生；1985同源重组技术开始应用；1987 Smithies与Capecchi在小鼠中实现基因敲除；1997体细胞克隆绵羊与转基因克隆绵羊诞生；2000基因打靶绵羊与体细胞克隆家猪诞生；2002基因打靶家猪诞生。","note":"年份—事件配对常考。","pages":[111]},{"id":"L9-F52","text":"基因敲除同源重组自然发生率极低：动物为10^-2~10^-5，植物为10^-4~10^-5；筛选方法常用正负筛选法（PNS法）、标记基因特异位点表达法、PCR法；ES细胞常用129、c57BL/6遗传背景。","note":"概率数量级与筛选方法为常考填空。","pages":[114]},{"id":"L9-F53","text":"loxP位点长34 bp，来源于P1噬菌体，由两个13 bp反向重复序列和一个8 bp非对称间隔序列组成；Cre作用于两个同向loxP时切除其间DNA片段并保留一个loxP。","note":"34=13+8+13 为经典填空。","pages":[117,118]},{"id":"L9-F54","text":"条件型定位重组系统四种：Cre/LoxP（噬菌体，应用最广泛）、Gin/Gix、FLP/FRT（酵母）、R/RS（酵母）。","note":"来源配对常考。","pages":[116]},{"id":"L9-F55","text":"他莫昔芬诱导Cre-ERT2系统：无他莫昔芬时Cre-ERT与Hsp90结合滞留细胞质、失活；加入他莫昔芬后Hsp90解离、ER受体活化暴露核定位信号，Cre入核切除loxP间靶基因。","note":"诱导性敲除的分子机制常考简答。","pages":[120]},{"id":"L9-F56","text":"诱导性基因敲除优点：诱导基因突变时间可人为控制；可避免基因突变致死胎；两个loxP位点间重组率较高；用病毒或配体/DNA复合物介导Cre表达可省去建立Cre转基因动物。","note":"与组成型敲除对比常考。","pages":[121]},{"id":"L9-F57","text":"基因编辑三代人工核酸酶时间线：ZFN（1996，锌指结构域+FokI）→ TALE & TALENs（2010，TALE DNA结合结构域+FokI）→ CRISPR/Cas（2013应用于真核细胞，gRNA引导Cas9切割）；FokI需二聚化才能切割DNA。","note":"年份与结构域组成常考。","pages":[123]},{"id":"L9-F58","text":"基因敲除技术两大缺陷：功能冗余（基因家族其他成员代偿，无明显表型）与必需基因敲除致死（lethality）导致无法研究。","note":"简答“为什么敲掉一个基因不一定知道其功能”的标准答案。","pages":[125]}],"methods":[{"id":"L9-M01","cn":"蓝白斑筛选","en":"blue-white screening","principle":"lacZ'编码的α-肽链与宿主编码的ω片段互补形成有活性β-半乳糖苷酶，水解X-gal产生蓝色产物；外源基因插入MCS破坏lacZ'，不能产生蓝色。","steps":"将转化菌涂布于含X-gal的培养基，观察菌落颜色：非重组质粒为蓝色菌落，含重组DNA分子者为白色菌落。","applications":"区分重组质粒与非重组质粒（pUC系列载体）。","limitations":"需宿主具备ω片段互补；插入片段必须破坏lacZ'阅读框；可能出现假阴性/假阳性。","pages":[35]},{"id":"L9-M02","cn":"无缝克隆","en":"Seamless Cloning / In-Fusion Cloning","principle":"载体末端与引物末端具有15-20个同源碱基，PCR产物两端带上与载体同源序列，依靠碱基间作用力互补配对成环，无需酶连即可直接转化宿主菌，进入宿主后由自身酶系修复缺口。","steps":"①设计5'端带15-20 bp载体同源序列的特异性引物，PCR扩增目的基因；②酶切或PCR扩增获得线性化载体；③PCR产物与线性化载体混合，靠末端同源序列互补配对成环；④转化宿主菌，宿主酶系修复缺口。","applications":"载体任意位置的无缝基因克隆，避免引入额外酶切位点；一步实现1-5个片段定向重组；高通量载体构建。","limitations":"需精确设计同源臂；约1 h完成构建，阳性克隆90%以上，重组效率为传统酶切连接技术的5-10倍。","pages":[39,40]},{"id":"L9-M03","cn":"CaCl2转化法","en":"CaCl2 transformation (chemical transformation)","principle":"钙离子遮蔽DNA上的负电荷，使DNA能穿过细胞膜。","steps":"快速生长期大肠杆菌置于0℃预处理的低渗CaCl2溶液→细胞膨胀、膜通透性改变→42℃短暂热刺激→含抗生素选择性培养基筛选阳性克隆。","applications":"细菌化学转化。","limitations":"转化效率5×10^6~2×10^7个转化子/µg超螺旋质粒DNA；受菌株状态与操作条件影响。","pages":[43]},{"id":"L9-M04","cn":"磷酸钙共沉淀法","en":"calcium phosphate co-precipitation","principle":"DNA与氯化钙混合后加入PBS缓慢形成DNA磷酸钙沉淀，沉淀混悬液加到培养细胞上，通过细胞膜内吞作用摄入DNA；磷酸钙还可能通过抑制血清中和细胞内核酸酶活性保护外源DNA。","steps":"DNA与氯化钙混合→加入PBS缓慢形成沉淀→沉淀混悬液加到培养细胞→内吞摄入DNA。","applications":"Graham等1973年建立；试剂易得、价格便宜，广泛用于瞬时转染和稳定转染研究。","limitations":"转染效率取决于沉积反应和颗粒大小，不同类型细胞效率不同；目前仅用于体外培养细胞的基因转移。","pages":[47]},{"id":"L9-M05","cn":"人工脂质体法","en":"artificial liposome method (cationic liposome transfection)","principle":"阳离子脂质体与带负电核酸结合形成复合物，接近细胞膜被内吞成为内体进入细胞质，随后DNA复合物释放进入细胞核。","steps":"阳离子脂质体与核酸结合→复合物被内吞成内体→进入细胞质→DNA复合物释放入核。","applications":"转染效率较高，可转染其他化学方法不易转染的细胞系；可转染寡核苷酸到人工酵母染色体不同长度DNA及RNA、蛋白质；适用于瞬时与稳定表达，可介导DNA/RNA转入动物和人体内用于基因治疗。","limitations":"需优化DNA与转染试剂比例、细胞数量、培养及检测时间。","pages":[48]},{"id":"L9-M06","cn":"显微注射","en":"microinjection","principle":"用显微操作针将核酸直接注入细胞质或细胞核内。","steps":"显微镜下用毛细针穿刺细胞膜/核膜，注入核酸溶液。","applications":"非常有效，常用于制备转基因动物。","limitations":"费力，不适用于需要大量转染细胞的研究。","pages":[49]},{"id":"L9-M07","cn":"电穿孔","en":"electroporation","principle":"依靠脉冲电流在细胞膜上打孔，使核酸进入细胞内。","steps":"细胞与核酸混合后施加电脉冲，脉冲强度与持续时间决定导入效率。","applications":"常用于植物原生质体等常规方法不易转染的细胞；已应用于活体基因转移。","limitations":"细胞死亡率很高，需要大量优化。","pages":[49,51]},{"id":"L9-M08","cn":"基因枪（微粒子轰击法）","en":"gene gun / biolistic particle bombardment","principle":"将核酸包被在高速金属微粒上，轰击进入细胞。","steps":"核酸包被微粒→高压加速→射入靶细胞。","applications":"操作简捷、安全、有效、不损伤靶细胞原有结构；适用于培养细胞和在体细胞。","limitations":"设备依赖；对组织深度有限。","pages":[49]},{"id":"L9-M09","cn":"慢病毒转染","en":"lentiviral transduction","principle":"以HIV-1为基础改造的病毒载体，包装成分反式提供病毒颗粒所需蛋白，载体成分含包装/逆转录/整合所需顺式序列及目的基因；病毒RNA进入胞质反转录为DNA，形成整合前复合体入核整合到宿主基因组并高水平表达。","steps":"构建载体→与包装质粒共转染细胞包装提纯病毒→离心取上清感染靶细胞→筛选稳转细胞株。","applications":"对分裂和非分裂细胞均能感染；用于难转染细胞系、稳转细胞株构建、活体动物模型。","limitations":"整合导致突变可能；改造后能感染人细胞，需小心对待；效率<30%。","pages":[50,51]},{"id":"L9-M10","cn":"核酸凝胶电泳","en":"gel electrophoresis of nucleic acids","principle":"带负电荷的核苷酸链在电场中从负极移向正极，依分子大小与构型不同而分离；迁移率与电场强度和净电荷数成正比、与片段大小成反比。","steps":"核酸样品加样→缓冲液（1×TAE/TBE/TPE）中施加电场→大片段低电压长时间、小片段高电压短时间→EB或SYBR Green I染色、紫外观察。","applications":"分析鉴定重组DNA分子及蛋白质与核酸相互作用。","limitations":"构型影响迁移率（超螺旋最快、开环最慢），不能仅凭位置判断分子量；EB有诱变能力。","pages":[55,56,58]},{"id":"L9-M11","cn":"RNA变性凝胶电泳","en":"RNA denaturing gel electrophoresis","principle":"变性剂与RNA反应防止碱基对形成，使RNA保持单链，按分子大小分离。","steps":"上样前用变性剂（甲醛、乙二醛、羟甲基汞）处理RNA→变性条件下琼脂糖凝胶电泳→30 μg/ml吖啶橙浸胶染色。","applications":"测定RNA较准确的分子大小；总RNA经甲醛变性电泳观察28S、18S、5S rRNA条带以鉴定纯度与完整性。","limitations":"不经变性处理则二级/三级结构影响迁移率。","pages":[59,60]},{"id":"L9-M12","cn":"聚合酶链式反应","en":"polymerase chain reaction (PCR)","principle":"双链DNA在临近沸点温度变性为单链，引物与模板互补结合，DNA聚合酶以单链DNA为模板、利用四种dNTP和合适Mg2+浓度延伸合成新链，循环实现指数扩增。","steps":"变性95℃→退火55℃→延伸72℃；反应体系含模板DNA、引物（约20个碱基，与目的基因两条链各自5'端序列互补）、Taq（或pfu）DNA聚合酶、dNTP。","applications":"基因诊断、基因治疗、基因工程产品、法医学检测、人类学研究等。","limitations":"有一定程度单核苷酸碱基错误掺入（Taq无3'→5'校对活性）；常规PCR终点定量变异系数大。","pages":[62,69,70,71,72,73]},{"id":"L9-M13","cn":"荧光实时定量PCR","en":"real time quantitative PCR (qRT-PCR)","principle":"在PCR指数扩增期间连续监测荧光信号强弱变化，实时测定特异性产物量；Ct值与模板起始拷贝数的对数存在线性关系。","steps":"配制已知起始拷贝数的梯度标准品→与未知样品同批扩增→绘制标准曲线（Ct对log拷贝数）→由未知样品Ct值反推绝对拷贝数；相对定量用△Ct=AvgCt_WT−AvgCt_Mu，相对比值=1.8^△Ct，并以持家基因（如UBQ10）均一化。","applications":"绝对定量测定靶DNA含量；相对定量比较不同样品目的cDNA含量；临床疾病诊断、动物疾病检测、食品安全检测。","limitations":"依赖标准品准确性；染料法（SYBR Green I）不能区分特异与非特异产物。","pages":[74,76,77,80,81]},{"id":"L9-M14","cn":"TaqMan探针实时定量PCR","en":"TaqMan probe real-time quantitative PCR","principle":"探针5'端荧光基团与3'端淬灭基团靠近时因荧光共振能量转移而淬灭；探针结合靶DNA后被具外切酶活性的Taq DNA聚合酶逐个切除降解，荧光基团解除淬灭发出荧光，信号强度与扩增靶DNA总量成正比。","steps":"探针完整时无荧光→PCR中探针结合目的DNA中间部位→Taq酶延伸时利用外切酶活性降解探针→释放荧光基团发光→实时读取信号。","applications":"高特异性定量检测靶DNA。","limitations":"探针长度50-150 bp，设计较复杂；仅能与目的DNA特异结合。","pages":[79]},{"id":"L9-M15","cn":"Southern杂交","en":"Southern blot / Southern hybridization","principle":"DNA经限制酶消化、凝胶电泳分离、碱变性后，通过毛细作用转印至硝酸纤维薄膜，与放射性单链DNA探针杂交，洗脱未结合探针后放射自显影。","steps":"DNA酶切成片段→凝胶电泳分离→碱液中变性→转印至硝酸纤维薄膜→加放射性ssDNA探针杂交→洗脱未杂交探针→放射自显影。","applications":"分析基因结构或检测待测DNA样本中是否含特定序列；鉴定含目的基因的限制性片段长度。","limitations":"需放射性探针与放射自显影；操作步骤多、周期较长。","pages":[86,87,88,89]},{"id":"L9-M16","cn":"Northern杂交","en":"Northern blot / Northern hybridization","principle":"RNA经凝胶电泳分离后转印至硝酸纤维素薄膜，与放射性RNA探针杂交，经放射自显影检测特定mRNA。","steps":"凝胶电泳分离RNA→毛细作用转印至硝酸纤维素薄膜→加放射性RNA探针杂交→洗脱未杂交探针→放射自显影。","applications":"确定样品中特定mRNA的含量，即基因表达水平；不同组织条带反映组织特异性表达。","limitations":"RNA易降解，需防RNase；需变性电泳。","pages":[86,90,91]},{"id":"L9-M17","cn":"Western杂交","en":"Western blot / Western hybridization","principle":"蛋白质经电泳分离后从凝胶转移到杂交滤膜上，与放射性同位素125I标记的特定蛋白质进行反应。","steps":"蛋白质电泳→转移至杂交滤膜→与125I标记的特定蛋白质反应→显影检测。","applications":"检测蛋白质表达与分子量。","limitations":"依赖抗体特异性；需合适上样对照（如TNAP、H3）。","pages":[86,122]},{"id":"L9-M18","cn":"荧光原位杂交","en":"Fluorescence In Situ Hybridization (FISH)","principle":"用荧光染料标记的DNA探针与变性的染色体DNA杂交，在荧光显微镜下直接观察探针在染色体上的定位。","steps":"探针DNA用荧光染料标记→染色体DNA变性→杂交→荧光显微镜观察。","applications":"染色体定位；不需要放射性同位素、实验周期短、灵敏度高，可同时观察几种DNA探针的定位与排列顺序。","limitations":"需荧光显微镜；探针特异性决定信号可靠性。","pages":[95]},{"id":"L9-M19","cn":"多彩色荧光原位杂交","en":"Multicolor fluorescence in situ hybridization (mFISH)","principle":"用几种不同颜色的荧光素单独或混合标记探针进行原位杂交，同时检测多个靶位，各靶位颜色不同。","steps":"不同荧光素标记多种探针→与同一切片/染色体杂交→荧光显微镜成像并区分颜色。","applications":"同一切片上多个靶位同时检测，如肺癌组织中CD4、Foxp3、CD8、CD19、CD163与DAPI核染色。","limitations":"探针数量与荧光通道有限；需多色成像与拆分分析。","pages":[96]},{"id":"L9-M20","cn":"基因芯片","en":"DNA chip / DNA microarray","principle":"将大量探针分子固定于支持物上，与标记样品分子杂交，通过检测每个探针的杂交信号强度获取样品分子数量和序列信息。","steps":"细胞培养取材→提取核酸、PCR扩增、荧光标记→探针制备并固定于芯片→杂交→反应、测量、成像→数据分析。","applications":"基因表达检测、突变检测、基因组多态性分析、基因文库作图、杂交测序、疾病诊断与治疗、药物筛选、农作物优育、司法鉴定、食品卫生监督、环境检测等。","limitations":"荧光模拟信号存在交叉反应与背景噪音；对过低或过高表达基因缺乏敏感性，动态范围小。","pages":[92,98]},{"id":"L9-M21","cn":"RNA-Seq","en":"RNA sequencing","principle":"利用高通量测序对转录组测序，对原始reads进行过滤、组装及生物信息学分析。","steps":"提取RNA→建库→高通量测序→reads过滤与组装→生物信息学分析。","applications":"发现新转录本、了解基因表达量、挖掘SNP、选择性剪接和结构性变异；非模式生物转录组分析。","limitations":"生物信息学分析软件开发不彻底；费用较高（但越来越便宜）。","pages":[97,98,99]},{"id":"L9-M22","cn":"RNAi（dsRNA注射）","en":"RNA interference (RNAi) / dsRNA injection assay","principle":"双链RNA被Dicer加工为21~25 nt siRNA，siRNA反义链引导RISC切割互补靶mRNA，序列特异性阻断基因表达。","steps":"合成双链RNA→注射入线虫→观察子代/胚胎表型；设阴性对照与未注射对照。","applications":"基因功能研究（基因敲低）。","limitations":"存在脱靶效应；高浓度siRNA增加脱靶概率。","pages":[16,100,101]},{"id":"L9-M23","cn":"重叠延伸诱变法","en":"overlap extension mutagenesis","principle":"用两对引物分别扩增出两个带突变位点重叠区的PCR产物，再通过重叠区退火延伸获得含突变的全长产物。","steps":"第一轮PCR：引物1+引物2扩增PCR产物1，引物3+引物4扩增PCR产物2（引物2与引物3含互补突变序列）→PCR产物1与2在重叠区退火、互为引物延伸→获得全长突变双链DNA。","applications":"基因定点突变，研究氨基酸残基对蛋白结构、催化活性及配体结合的影响；改造DNA调控元件、修饰表达载体、引入新酶切位点。","limitations":"需设计含突变碱基的互补引物；需两轮PCR。","pages":[107,108]},{"id":"L9-M24","cn":"基因敲除小鼠制备","en":"gene knockout mouse generation","principle":"利用同源重组将选择标记基因（Neo）插入目的基因以破坏其功能，通过ES细胞筛选和囊胚注射获得嵌合体小鼠。","steps":"构建含Neo和DTA的敲除载体→电穿孔导入ES细胞→药物筛选同源重组克隆→Southern blot鉴定→注射入E3.5宿主囊胚→移植入假孕代孕母鼠获得嵌合体→交配获得生殖系传递与纯合敲除鼠。","applications":"研究基因功能；建立人类疾病小鼠模型（如IAP基因敲除加速小鼠肥胖）。","limitations":"同源重组自然发生率极低（动物10^-2~10^-5）；功能冗余与必需基因致死限制表型分析。","pages":[114,122]},{"id":"L9-M25","cn":"条件性基因敲除（Cre/loxP）","en":"conditional gene knockout (Cre/loxP system)","principle":"将正向选择基因neo置于靶基因内含子中，靶位点两侧内含子装两个同向loxP，获得loxP floxed小鼠；与Cre转基因鼠杂交后Cre重组酶介导loxP间切除，切除一个loxP和靶基因。","steps":"构建打靶载体（neo+两个同向loxP）→同源重组获得loxP floxed ES细胞→产生loxP floxed小鼠（表型同野生型）→与Cre转基因鼠杂交→Cre表达切除loxP间序列→产生条件性突变小鼠。","applications":"组织特异性敲除（Cre置于细胞类型特异性启动子下）；避免致死胎。","limitations":"需建立Cre转基因动物；Cre表达特性决定修饰特性。","pages":[116,117,118]},{"id":"L9-M26","cn":"诱导性基因敲除（他莫昔芬诱导Cre-ERT2）","en":"inducible knockout (tamoxifen-inducible Cre-loxP system)","principle":"Cre-ERT2融合蛋白在无他莫昔芬时与Hsp90结合滞留细胞质、失活；加入他莫昔芬后Hsp90解离、ER受体活化暴露核定位信号，Cre入核切除loxP间靶基因。","steps":"设计诱导剂给予时间→给药后Cre入核→切除loxP间靶基因→在特定发育阶段和特定组织细胞实现遗传修饰。","applications":"时间可控的基因敲除；避免死胎或出生后不久死亡；四环素诱导型、干扰素诱导型、激素诱导型、腺病毒介导型。","limitations":"需建立Cre-ERT2转基因动物；诱导剂可能有副作用。","pages":[119,120,121]},{"id":"L9-M27","cn":"CRISPR/Cas9基因编辑","en":"CRISPR/Cas9 genome editing","principle":"由向导RNA（gRNA）引导Cas9核酸酶在靶DNA特定位点切割，通过细胞修复机制实现基因敲除、敲入或替换。","steps":"设计gRNA→与Cas9共表达→gRNA与靶DNA互补配对→Cas9在靶位点切割双链→细胞修复。","applications":"真核细胞基因编辑（2013年起）；基因敲除、敲入、替换。","limitations":"需考虑脱靶切割；与ZFN、TALEN相比出现最晚但应用最广。","pages":[123]}],"exam_points":[{"id":"L9-X01","point":"模式动物与动物模型的区别","detail":"简答/多选题：从研究目的（基本生命现象vs特殊问题）、来源（固有vs创造）、研究性质（基础vs应用）、结构（简单vs复杂）四方面作答；并列举模式动物四条共性。"},{"id":"L9-X02","point":"各模式生物的核心数据与贡献","detail":"填空/选择：大肠杆菌460万核苷酸、4300种蛋白；酵母90 min繁殖；拟南芥30万种中选出、8-10周、基因组最小；果蝇4条染色体、第一个遗传图谱、P因子；线虫959个体细胞、9700万bp、19000基因；斑马鱼87%相似度；小鼠99%同源、85%直系同源。对应诺奖年份与人物需能配对。"},{"id":"L9-X03","point":"限制性内切酶的性质、命名与切割方式","detail":"简答：来源（原核生物）、本质（蛋白质）、作用（切割获取目的基因与载体）、特点（特异性识别回文序列）、切割方式（错位切产生黏性末端、平切产生平末端）；命名规则与EcoR I、Sma I示例；切割频率与识别序列长度关系（Sau3A1 0.25 kb、EcoRI 4 kb、NotI 65 kb）。"},{"id":"L9-X04","point":"DNA连接酶与DNA聚合酶的比较","detail":"表格型简答：DNA聚合酶加单个核苷酸、需模板；DNA连接酶连接两个片段/两个缺口、不需模板；相同点为均形成磷酸二酯键。E·coli连接酶只连黏性末端，T4连接酶可连黏性末端和平末端。"},{"id":"L9-X05","point":"表达载体/克隆载体的必备条件与pUC、pET载体结构","detail":"简答：五条件（MCS、ori、筛选标记、约3 kb、对受体无害）；pUC四部分与蓝白斑筛选原理；pET受T7启动子与T7 RNA聚合酶控制，pET-14b（4671 bp，Ap）、pET-28a(+)（5369 bp，Kan）。"},{"id":"L9-X06","point":"细菌转化与真核转染方法及效率比较","detail":"选择/简答：CaCl2法原理（钙离子遮蔽负电荷）与0℃/42℃关键条件、转化效率5×10^6~2×10^7/µg；瞬时vs稳定转染（整合概率1/10^4、24-72 h分析）；腺病毒100%、8 kb、不整合；慢病毒<30%可感染不分裂细胞；逆转录病毒<30%只感染分裂细胞；AAV低效不致病不整合。"},{"id":"L9-X07","point":"核酸电泳的迁移率规律与凝胶选择","detail":"简答/计算：迁移率与电场强度、净电荷数成正比，与片段大小成反比；构型影响（超螺旋最快、开环最慢、线性居中）；聚丙烯酰胺1~1000 bp、琼脂糖几十至几百Kb；浓度越高孔隙越小分辨力越强；根据待分离片段大小选择凝胶类型与浓度。"},{"id":"L9-X08","point":"PCR原理、组分、温度程序与定量公式","detail":"简答/计算：四组分、三步温度95℃/55℃/72℃、理论2^n与实际1.8^n；qRT-PCR的Ct值与起始拷贝数对数线性关系；△Ct与1.8^△Ct相对定量计算；TaqMan探针与SYBR Green I的区别。"},{"id":"L9-X09","point":"Southern、Northern、Western杂交的检测对象与流程","detail":"选择/简答：Southern检测DNA（1975年E.M.Southern）、Northern检测RNA（基因表达水平）、Western检测蛋白质（125I标记探针）；三者均需电泳分离、转膜、杂交、显影；探针类型对应。"},{"id":"L9-X10","point":"RNAi机制与siRNA/miRNA比较","detail":"简答：Dicer加工30 nt以上dsRNA为21~25 nt siRNA；RISC含Argonaute，剪切位点在引导链第10-11位核苷酸之间；siRNA外源、AGO2、完全互补降解、一对一；miRNA内源、AGO1、3'UTR不完全互补抑制翻译、一对多；Drosha/Pasha、Exportin-5参与miRNA与shRNA加工。"},{"id":"L9-X11","point":"RNAi实验对照设计与脱靶控制","detail":"实验设计题：至少五类对照（转染试剂、nonsense siRNA、positive siRNA、重复/off-target、rescue）及其监控目的；脱靶最少7个核苷酸互补即可发生；2'位甲基化修饰减少脱靶；BLAST比对筛选特异性靶点。"},{"id":"L9-X12","point":"基因定点突变（重叠延伸法）的引物设计与流程","detail":"实验设计/简答：两对引物、引物2与3含互补突变序列；第一轮分别扩增左右片段，第二轮重叠区退火互为引物延伸；优点为回收率高、双链模板、任意位点、同一试管完成、快速简便。"},{"id":"L9-X13","point":"基因敲除原理、基本步骤与筛选","detail":"简答：同源重组定义（基因打靶）；基本步骤（载体构建、ES细胞获得、目的基因导入、筛选已击中细胞、获纯合体并表型研究）；同源重组概率动物10^-2~10^-5、植物10^-4~10^-5；PNS法、标记基因特异位点表达法、PCR法。"},{"id":"L9-X14","point":"条件性/诱导性基因敲除的Cre/loxP机制","detail":"简答/实验设计：loxP 34 bp=13+8+13、来源于P1噬菌体；Cre切除两个同向loxP间序列并保留一个loxP；组织特异性敲除靠细胞类型特异性启动子驱动Cre；诱导性敲除靠他莫昔芬诱导Cre-ERT2核转位；优点为时间可控、避免致死胎、重组率高、可省去Cre转基因动物。"},{"id":"L9-X15","point":"基因编辑三代技术","detail":"填空/选择：ZFN（1996，锌指+FokI）、TALENs（2010，TALE+FokI）、CRISPR/Cas9（2013，gRNA引导Cas9）；FokI需二聚化才能切割DNA。"},{"id":"L9-X16","point":"基因敲除技术的局限","detail":"简答：功能冗余导致无明显表型；必需基因敲除致死无法研究；因此敲掉一个基因不一定能获知该基因功能。"}],"exercises":[{"id":"L9-E01","type":"单选题","stem":"下列哪一项不是模式动物应具备的共性？","options":["A. 能代表生物界的某一大类群","B. 世代短、子代多、遗传背景清楚","C. 为研究特定人类疾病而人工构建","D. 容易进行实验操作，具有遗传操作手段和表型分析方法"],"answer":"C","analysis":"C描述的是动物模型（人工创造、针对特定问题、应用研究），而非模式动物（固有、基础研究）。A、B、D均为模式动物四条共性之一。","pages":[3,4]},{"id":"L9-E02","type":"单选题","stem":"关于大肠杆菌作为模式生物的描述，错误的是：","options":["A. 只有一条染色体，约460万核苷酸","B. 能编码4300多种不同的蛋白质","C. 为多细胞生物，DNA、RNA和蛋白质合成机器分区进行","D. 具备易于进行遗传交换的系统，质粒可自主复制并用作克隆载体"],"answer":"C","analysis":"大肠杆菌为单细胞生物，所有DNA、RNA和蛋白质合成机器都包含在同一空间，故C错。A、B、D均为课件原文数据。","pages":[6]},{"id":"L9-E03","type":"单选题","stem":"1891年Hans Driesch的海胆2细胞期胚胎分离实验证明：","options":["A. 胚胎细胞自始至终只有半个胚胎的发育命运","B. 早期胚胎细胞具有调整发育能力，单个卵裂球可形成完整个体","C. 海胆卵裂球不能单独培养","D. 胚胎发育由母源mRNA决定"],"answer":"B","analysis":"Driesch将2细胞期两个卵裂球机械分开、各自培养，每个细胞都发育为完整棱柱幼虫（quasinormal plutei），证明调整发育能力，为现代发育生物学奠定观念里程碑。","pages":[12]},{"id":"L9-E04","type":"单选题","stem":"下列限制酶识别序列与平均切割频率的对应关系，正确的是：","options":["A. Sau3A1（5'-GATC-3'）约0.25 kb","B. EcoRI（5'-GAATTC-3'）约65 kb","C. NotI（5'-GCGGCCGC-3'）约4 kb","D. 识别序列越长，切割频率越高"],"answer":"A","analysis":"Sau3A1识别4 bp，平均0.25 kb切一次；EcoRI识别6 bp，约4 kb；NotI识别8 bp，约65 kb。识别序列越短切点越密、频率越高，故D错。","pages":[28]},{"id":"L9-E05","type":"单选题","stem":"需要连接平末端DNA片段时，应选用：","options":["A. E·coli DNA连接酶","B. T4 DNA连接酶","C. DNA聚合酶I","D. 碱性磷酸酯酶"],"answer":"B","analysis":"E·coli DNA连接酶只能连接黏性末端；T4 DNA连接酶既能连接黏性末端也能连接平末端。DNA聚合酶I用于补平缺口，碱性磷酸酯酶用于切除末端磷酸基团。","pages":[31]},{"id":"L9-E06","type":"单选题","stem":"pUC质粒载体蓝白斑筛选中，含重组质粒的菌落颜色及原因是：","options":["A. 蓝色，因为lacZ'完整表达α-肽链","B. 白色，因为外源基因插入MCS破坏了lacZ'","C. 蓝色，因为氨苄青霉素抗性基因被破坏","D. 白色，因为ori被破坏不能复制"],"answer":"B","analysis":"lacZ'编码α-肽链与宿主ω片段互补形成有活性β-半乳糖苷酶，水解X-gal呈蓝色；外源基因插入MCS破坏lacZ'，不能产生蓝色，故重组菌落为白色。","pages":[35]},{"id":"L9-E07","type":"单选题","stem":"关于CaCl2转化法，下列描述错误的是：","options":["A. 钙离子可遮蔽DNA上的负电荷，使DNA能穿过细胞膜","B. 使用快速生长期大肠杆菌，经0℃预处理的低渗CaCl2溶液处理","C. 42℃短暂热刺激促进外源DNA被细胞吸收","D. 转化效率可达5×10^6~2×10^7个转化子/µg超螺旋质粒DNA，且与温度无关"],"answer":"D","analysis":"0℃预处理与42℃短暂热刺激是CaCl2法的关键条件，转化效率5×10^6~2×10^7个转化子/µg超螺旋质粒DNA，与操作条件密切相关，故D错。","pages":[43]},{"id":"L9-E08","type":"单选题","stem":"下列病毒载体中，转运效率最高且可容纳约8 kb插入片段、不整合入基因组的是：","options":["A. 慢病毒","B. 逆转录病毒","C. 重组腺病毒","D. 腺相关病毒"],"answer":"C","analysis":"重组腺病毒转运效率100%、可处理8 kb插入片段、不整合、工作量大；慢病毒与逆转录病毒整合且效率<30%；
