AAV效率低、不整合、需高效价。","pages":[51]},{"id":"L9-E09","type":"单选题","stem":"同等分子量的DNA分子在凝胶电泳中迁移率由快到慢的顺序是：","options":["A. 开环松弛型 > 线性 > 超螺旋","B. 超螺旋 > 线性 > 开环松弛型","C. 线性 > 超螺旋 > 开环松弛型","D. 超螺旋 > 开环松弛型 > 线性"],"answer":"B","analysis":"构型越紧密迁移越快：超螺旋最紧密、迁移最快；开环松弛型最慢；线性居中。因此不能仅凭迁移位置判断分子量。","pages":[56]},{"id":"L9-E10","type":"单选题","stem":"关于TaqMan探针实时定量PCR，正确的是：","options":["A. 探针5'端为淬灭基团、3'端为荧光基团","B. 探针完整时因荧光共振能量转移而淬灭，被Taq DNA聚合酶外切酶活性降解后发光","C. 探针长度通常为5-10 bp","D. 荧光信号与总双链DNA量成正比，不能区分特异产物"],"answer":"B","analysis":"TaqMan探针5'端荧光基团、3'端淬灭基团，长度50-150 bp；完整时荧光共振能量转移淬灭，Taq酶外切酶活性逐个切除探针后发光，具序列特异性。D描述的是SYBR Green I染料法。","pages":[78,79]},{"id":"L9-E11","type":"单选题","stem":"关于siRNA与miRNA的比较，错误的是：","options":["A. siRNA为外源，miRNA为内源非编码RNA","B. siRNA利用AGO2，miRNA利用AGO1","C. siRNA与靶mRNA完全互补降解mRNA，miRNA与3'UTR不完全互补抑制翻译","D. 一条miRNA只针对一个靶基因，一条siRNA可有多个靶基因"],"answer":"D","analysis":"恰好相反：一条siRNA只针对一个靶基因，一条miRNA可以有多个靶基因。A、B、C均正确。","pages":[102]},{"id":"L9-E12","type":"单选题","stem":"loxP位点的结构组成是：","options":["A. 两个8 bp反向重复序列夹一个13 bp间隔序列，共29 bp","B. 两个13 bp反向重复序列夹一个8 bp非对称间隔序列，共34 bp","C. 两个13 bp正向重复序列夹一个8 bp间隔序列，共34 bp","D. 一个34 bp回文序列，无间隔序列"],"answer":"B","analysis":"loxP长34 bp，来源于P1噬菌体，由两个13 bp反向重复序列和一个8 bp非对称间隔序列组成（13+8+13=34）。","pages":[117,118]},{"id":"L9-E13","type":"多选题","stem":"下列属于诱导性基因敲除优点的是：","options":["A. 诱导基因突变的时间可人为控制","B. 可避免因基因突变而致死胎的问题","C. 两个loxP位点之间的重组率较高","D. 用病毒或配体/DNA复合物介导Cre表达可省去建立携带Cre的转基因动物"],"answer":"A、B、C、D","analysis":"四项均为课件列出的诱导性基因敲除优点；其核心是时间可控、避免致死胎、重组率高、可省去Cre转基因动物。","pages":[121]},{"id":"L9-E14","type":"多选题","stem":"严格的RNAi敲低实验应设置的对照包括：","options":["A. 转染试剂对照","B. nonsense siRNA对照","C. positive siRNA对照","D. 重复对照（off-target对照）与rescue对照"],"answer":"A、B、C、D","analysis":"五类对照分别监控转染及培养条件、外源核酸本身、假阴性、脱靶效应以及性状改变是否与靶基因相关，缺一不可。","pages":[105]},{"id":"L9-E15","type":"填空题","stem":"PCR三步曲的温度分别为：变性______℃、退火______℃、延伸______℃；n个循环后理论最高拷贝数为______，实际约为______。","options":[],"answer":"95；55；72；2^n；1.8^n","analysis":"温度程序与扩增公式为PCR核心考点；实际扩增效率因酶效率、引物耗尽等低于理论值，约1.8倍/轮。","pages":[71]},{"id":"L9-E16","type":"填空题","stem":"Southern杂交检测______，由______于1975年创立；Northern杂交检测______，用于确定样品中特定mRNA含量即______；Western杂交检测______，探针为______标记的特定蛋白质。","options":[],"answer":"DNA；E.M.Southern；RNA；基因表达水平；蛋白质；放射性同位素125I","analysis":"三种杂交的检测对象与探针类型是高频填空题；注意Western的“探针”是标记蛋白质而非核酸。","pages":[86,88,90]},{"id":"L9-E17","type":"判断题","stem":"无缝克隆需要载体末端与引物末端具有15-20个同源碱基，依靠互补配对成环，无需DNA连接酶即可转化宿主菌，进入宿主后由宿主酶系修复缺口。","options":[],"answer":"正确","analysis":"无缝克隆的核心即15-20 bp同源臂互补成环、无需酶连；其阳性克隆可达90%以上，重组效率为传统酶切连接技术的5-10倍。","pages":[39,40]},{"id":"L9-E18","type":"判断题","stem":"基因敲除后若小鼠无明显表型，即可断定该基因没有功能。","options":[],"answer":"错误","analysis":"可能因功能冗余（基因家族其他成员代偿）或该基因为必需基因（敲除致死）而无法观察到表型；这正是基因敲除技术难以克服的缺点。","pages":[125]},{"id":"L9-E19","type":"名词解释","stem":"基因敲除（gene knockout）与条件性基因敲除（conditional gene knockout）","options":[],"answer":"基因敲除又称基因打靶（gene targeting），通过外源DNA与染色体DNA之间的同源重组进行精确的定点修饰和基因改造，具有专一性强、染色体DNA可与目的片段共同稳定遗传等特点；完全基因敲除指通过同源重组完全消除细胞或动植物个体中的靶基因活性。条件型基因敲除（不完全基因敲除）指通过定位重组系统（如Cre/loxP）实现特定时间和空间的基因敲除。","analysis":"答题需点出“同源重组”“定点修饰”“完全vs条件型（时空可控）”三个要素，并可补充Cre/loxP机制。","pages":[112,116]},{"id":"L9-E20","type":"简答题","stem":"简述利用Cre/loxP系统实现组织特异性基因敲除的原理与流程。","options":[],"answer":"要点：①构建打靶载体，将正向选择基因neo置于靶基因内含子中，在靶位点两侧内含子中装两个同向排列的loxP（34 bp，来源于P1噬菌体，13 bp反向重复+8 bp间隔+13 bp反向重复）；②同源重组获得loxP floxed ES细胞，由此产生loxP floxed小鼠，表型同野生型；③将loxP floxed小鼠与Cre转基因鼠杂交，Cre基因表达产生Cre重组酶，介导两个同向loxP间切除反应，切除一个loxP和靶基因；④若将Cre置于细胞类型特异性启动子下，则仅在特定细胞类型中切除靶基因，其他细胞中靶基因保持完整，实现组织特异性敲除。Cre的表达特性决定靶基因的修饰特性。","analysis":"评分点：loxP结构、floxed小鼠、Cre切除、组织特异性启动子；可补充诱导性敲除（Cre-ERT2+他莫昔芬）作为时间控制手段。","pages":[116,117,118]},{"id":"L9-E21","type":"简答题","stem":"简述RNAi的作用机制，并比较siRNA与miRNA在起源、成熟加工、功能与靶基因特异性上的差异。","options":[],"answer":"机制要点：细胞中30个核苷酸以上的长双链RNA被具RNase III活性的Dicer加工为21~25个核苷酸、3'端有两个碱基游离的siRNA；siRNA反义链（引导链）装载入RISC（最小组成含Argonaute蛋白），引导RISC切割与反义链互补的靶mRNA，Argonaute剪切位点位于引导链第10与第11个核苷酸之间，实现序列特异性基因沉默。比较：①起源：siRNA外源，miRNA内源非编码RNA；②成熟：siRNA直接来自长链dsRNA经Dicer（Dicer2和R2D2）切割成双链siRNA；miRNA由核内pri-miRNA经Drosha和Pasha加工为pre-miRNA，出核后在细胞质经Dicer（Dicer1和loqs）切割，具时序性、保守性和组织特异性；③功能：siRNA与RISC（AGO2）结合、完全互补降解mRNA，用于沉默外源病毒与转座子活性；miRNA与RISC（AGO1）结合、与靶mRNA 3'UTR不完全互补抑制翻译，调节生长发育相关基因；④靶基因特异性：一条siRNA只针对一个靶基因，一条miRNA可有多个靶基因；⑤分布：siRNA主要存在于低等生物、可人工设计导入高等生物细胞，miRNA低等和高等生物均存在。","analysis":"评分点：Dicer、21-25 nt、RISC/Argonaute、第10-11位剪切；比较需覆盖起源、成熟、功能、靶向四方面。","pages":[101,102,106]},{"id":"L9-E22","type":"计算题","stem":"某实时定量PCR实验中，以拟南芥持家基因UBQ10均一化后，野生型（WT）Wus基因三次重复Ct均值为31.23±0.32，突变体（Mu）为21.92±0.13。已知每循环实际扩增效率取1.8。(1) 计算△Ct；(2) 按相对比值=1.8^△Ct计算突变体中Wus目的cDNA相对野生型的含量倍数；(3) 若另一未知样品Ct值为25，标准曲线方程为Ct=−3.32×log(起始拷贝数)+40，求其起始拷贝数（保留两位有效数字）。","options":[],"answer":"(1) △Ct = AvgCt_WT − AvgCt_Mu = 31.23 − 21.92 = 9.31（误差±0.19）。(2) 相对比值 = 1.8^9.31 ≈ 239（即突变体中Wus目的cDNA相对含量约为野生型的239倍，误差±26.25）。(3) 25 = −3.32×log N + 40 → log N = (40−25)/3.32 ≈ 4.518 → N ≈ 3.3×10^4 拷贝。","analysis":"考查Ct值与起始拷贝数对数的线性关系、△Ct相对定量公式与标准曲线换算；注意起始拷贝数越多Ct越小。","pages":[76,77,80]},{"id":"L9-E23","type":"实验设计题","stem":"某研究生拟用RNAi技术研究基因X在HeLa细胞有丝分裂中的作用，并计划用qRT-PCR和Western blot验证敲低效率。请设计实验方案，说明：(1) 如何设计并筛选特异性siRNA以减少脱靶；(2) 必须设置哪些对照及其监控目的；(3) 如何用qRT-PCR和Western blot验证敲低效果并排除脱靶造成的表型；(4) 若观察到细胞有丝分裂异常，如何进一步证明该表型确由基因X敲低引起。","options":[],"answer":"要点：(1) 在网站设计多条19-29 nt干扰靶点，挑选高评分、位置分散的靶点，经BLAST比对特异性后构建；必要时对siRNA第二个碱基2'位核糖环添加甲基以减少脱靶；避免过高浓度siRNA。(2) 至少五类对照：转染试剂对照（监控转染及培养条件）、nonsense siRNA对照（监控外源核酸本身影响）、positive siRNA对照（针对GAPDH/ACTB等管家基因，监控转染效率与RNAi通路活性、排除假阴性）、重复对照/off-target对照（至少2个靶点siRNA互为对照，两者表型相同才可能是特异性敲低）、rescue对照（回补基因X观察表型是否逆转）。(3) qRT-PCR：提取RNA、反转录，以持家基因均一化，比较对照与敲低组基因X mRNA相对含量（可用△Ct与1.8^△Ct计算）；Western blot：SDS-PAGE后转膜、抗X抗体检测蛋白水平，设上样对照（如actin/H3）。(4) 用2个不同靶点siRNA均得到相同表型；rescue实验回补基因X后表型逆转；结合qRT-PCR与Western blot证明mRNA与蛋白均下降，从而排除脱靶效应。","analysis":"评分点：siRNA设计流程（19-29 nt、评分、位置分散、BLAST、2'位甲基化）、五类对照及目的、两种验证方法的原理与均一化/上样对照、用重复对照与rescue对照排除脱靶。","pages":[80,104,105,122]}]},{"lecture":10,"title":"蛋白质研究的技术方法：分离纯化、鉴定与相互作用分析","source_file":"2026_autumn-molecular_biology-10技术2.pdf","pages":70,"overview":"本章解决的核心问题是：如何从复杂生物样品中获得足够纯、足够量且保持活性的目标蛋白，并如何鉴定其理化性质与相互作用伙伴。逻辑主线分三大板块：①蛋白质的分离纯化与鉴定——先按分子大小、形状、电荷、溶解性、配体亲和等理化差异选择方法（透析、超滤、凝胶过滤、离子交换、亲和层析、盐析、离心、电泳），再按“前处理—粗分级—细分级”组织流程，最后用SDS-PAGE、IEF、双向电泳、Western blot、CD谱、X射线晶体学、NMR、cryo-EM及含量/纯度测定完成鉴定；②蛋白质—核酸相互作用技术——从体外EMSA、DNase I足迹等到体内ChIP，解决染色质环境下真实结合位点问题；③寻找并验证相互作用的蛋白质——从Y2H、Co-IP、TAP、AP-MS等筛选到GST pull-down、FRET等验证，并强调各方法的假阳性与直接/间接结合辨析。本章是技术方法模块（技术2）的核心，承接前面章节的基因克隆与表达，为后续研究基因表达调控、复合体组装与疾病机制提供实验手段。","outline":[{"section":"1","title":"蛋白质分离纯化的原理与依据","points":["依据大小、形状、电荷、溶解性、配体亲和、吸附、变性复性等理化特性选择方法","分子大小：透析、超滤、凝胶过滤、离心","分子形状：梯度离心、电泳","电荷：离子交换层析、电泳；pH 7.0时Asp/Glu占优为酸性蛋白，Lys/Arg占优为碱性蛋白","配体特异结合：亲和层析（免疫亲和、生物亲和、金属螯合）","变性复性：尿素溶解包涵体后复性"]},{"section":"2","title":"分离纯化的一般流程","points":["前处理：材料选择与细胞破碎（机械剪碎、研磨、反复冻融、超声、高压匀浆、酶解）","提取：合适pH、离子强度、比例，0–4℃，加还原剂、蛋白酶抑制剂、金属螯合剂、去污剂","粗分级：硫酸铵分级沉淀、有机溶剂沉淀、超速离心、等电点沉淀、透析、超滤","细分级：层析与电泳"]},{"section":"3","title":"层析与电泳技术","points":["离子交换层析：pH<pI选阳离子交换剂，pH>pI选阴离子交换剂","分子筛层析：大分子被排阻先出，洗脱体积与分子大小反比","亲和层析：配体专一可逆结合，选择性最高；金属螯合层析用Ni与His标签、咪唑洗脱","疏水作用层析：高盐上样、降盐洗脱","SDS-PAGE按分子量、IEF按pI、双向电泳正交分离"]},{"section":"4","title":"蛋白质鉴定与定量","points":["分子量与pI测定：SDS-PAGE、PAGE、IEF","Western blot：转膜、封闭、一抗、酶标二抗、DAB显色或自显影","含量测定：凯氏定氮（16%）、A280/A260经验公式、显色法标准曲线","纯度：色谱纯、电泳纯、结晶纯，需互相验证","结构：CD谱二级结构、X射线晶体学、NMR、cryo-EM"]},{"section":"5","title":"蛋白质—核酸相互作用技术","points":["体外：EMSA、DNase I足迹、甲基化干扰、体内足迹、酵母单杂交、核酸适配体、噬菌体展示、蛋白芯片","EMSA：探针标记、结合、非变性电泳、自显影；supershift确认蛋白身份","体内：ChIP，甲醛交联、超声打断、抗体沉淀、解交联、PCR鉴定","体外方法局限：脱离染色质结构、难捕捉瞬时结合"]},{"section":"6","title":"寻找与验证蛋白质相互作用","points":["方法分类：生物物理、高通量、标准技术、体内成像","Y2H：BD-诱饵与AD-猎物重组装转录因子激活报告基因；假阳性近50%，仅3%被两种以上实验验证","Co-IP：非变性裂解、抗体沉淀诱饵及结合伙伴；不能区分直接与桥接结合","AP-MS/IP-MS：标签或抗体富集复合物，SDS-PAGE切胶胰蛋白酶酶解后MS/MS鉴定","体外验证：GST pull-down、His pull-down、Far Western、SPR、FRET/BRET"]}],"concepts":[{"id":"L10-C01","cn":"蛋白质分离纯化","en":"protein separation and purification","abbr":"","definition":"利用蛋白质在大小、电荷、形状、溶解性、亲和性等理化性质上的差异，将其从混合物中分离并纯化的过程。","detail":"没有一套统一方法适用于所有蛋白质，但每种蛋白质可能都有一套适合的纯化程序，所用主要技术手段基本相同。","note":"方法选择依据是目标蛋白与杂质在某一理化性质上的差异。","pages":[2,3,10]},{"id":"L10-C02","cn":"透析","en":"dialysis","abbr":"","definition":"利用半透膜将蛋白质溶液与大量缓冲液隔开，只允许盐离子等小分子通过而截留蛋白质，从而去除小分子杂质的膜分离方法。","detail":"驱动力为膜内外浓度差；磁力搅拌可加快交换达到平衡；透析开始时袋内小分子浓度高，平衡时膜两侧均匀分布而蛋白质始终留在袋内。","note":"与超滤同属膜分离，但透析以浓度梯度驱动、主要用于脱盐；超滤以压力驱动、可同时浓缩和分级。","pages":[4,5,10]},{"id":"L10-C03","cn":"超滤","en":"ultrafiltration","abbr":"","definition":"在压力驱动下使溶剂与小分子穿过滤膜、大分子被截留，从而实现浓缩或分离的膜分离技术。","detail":"与透析同属按分子大小分离的膜分离技术，但超滤有外加压力驱动。","note":"截留分子量（MWCO）决定截留范围（补充）。","pages":[4,10]},{"id":"L10-C04","cn":"凝胶过滤（分子筛层析）","en":"gel filtration / size-exclusion chromatography","abbr":"","definition":"以多孔性凝胶为支持物，分子大小不同的蛋白质受到的阻滞作用不同而先后流出，从而分离纯化的层析方法。","detail":"大分子不能进入凝胶孔内，被排阻而先流出；小分子可进入孔内，路径延长而滞后流出。常用介质：葡聚糖、琼脂糖、聚丙烯酰胺、纤维素。介质应亲水、不与蛋白自发结合、化学物理性质稳定、刚性足以允许高线性流速。洗脱体积与分子大小呈反比：250,000 Da 蛋白在床体积处最先洗脱，125,000 Da 次之，75,000 Da 最后流出。","note":"又称凝胶过滤、分子排阻层析；洗脱顺序按分子量从大到小，不要与离子交换混淆。","pages":[3,4,17,18,22,23]},{"id":"L10-C05","cn":"离子交换层析","en":"ion-exchange chromatography","abbr":"","definition":"利用蛋白质与带电凝胶颗粒间静电相互作用力的差别，把蛋白质分开的层析方法。","detail":"分离基础是不同蛋白质在给定pH下所带电荷的种类和数量不同。惰性支持物如琼脂糖、葡聚糖；羧甲基（CM）带负电为阳离子交换剂，二乙基氨基乙基（DEAE）带正电为阴离子交换剂。负电基团的平衡离子为H⁺或Na⁺，正电基团为OH⁻或Cl⁻。以DEAE-纤维素柱分离带正负电荷蛋白混合物时，带负电蛋白结合滞留、较晚洗脱，带正电蛋白先流出，洗脱曲线出现两个峰。","note":"介质电荷与蛋白电荷相反才结合；命名以被交换的离子（蛋白）为准。","pages":[3,17,18,20]},{"id":"L10-C06","cn":"等电点","en":"isoelectric point","abbr":"pI","definition":"使蛋白质（或氨基酸）净电荷为零时的pH值。","detail":"pH<pI时蛋白带正电，应选带负电的阳离子交换剂；pH>pI时蛋白带负电，应选带正电的阴离子交换剂；pI处净电荷为零，既不结合阳离子交换剂也不结合阴离子交换剂，且溶解度最低易沉淀。","note":"缓冲液pH应避开目标蛋白pI以防沉淀，但等电聚焦恰利用pI处净电荷为零使蛋白聚焦。","pages":[7,21,29,34]},{"id":"L10-C07","cn":"亲和层析","en":"affinity chromatography","abbr":"","definition":"利用生物大分子与配体之间特异、可逆的结合能力进行分离纯化的层析技术。","detail":"将配体固定于不溶性基质（如琼脂糖珠），目标蛋白专一结合、杂蛋白流穿，洗涤后改变条件（竞争配体、改变pH/离子强度）洗脱。分类：免疫亲和层析、生物亲和层析、金属螯合亲和层析。示例配体胰岛素、目标蛋白胰岛素受体。","note":"选择性最高，依赖专一性生物学识别；与离子交换（电荷）、分子筛（大小）等非专一物理化学分离不同。","pages":[3,8,17,18,24,25]},{"id":"L10-C08","cn":"金属螯合亲和层析","en":"immobilized metal affinity chromatography","abbr":"IMAC","definition":"利用固相载体上螯合的金属离子（如Ni²⁺）与蛋白质表面组氨酸残基等的配位结合进行纯化的亲和层析。","detail":"固相载体通过亚氨基二乙酸类多齿螯合配基固定Ni；Ni与His标签（His-His-His）配位结合；用咪唑竞争性取代His与Ni的配位而洗脱。常用于带His标签重组蛋白的快速纯化。","note":"洗脱需高浓度咪唑，可能影响蛋白活性。","pages":[8,25]},{"id":"L10-C09","cn":"盐析法","en":"salting out","abbr":"","definition":"通过加入高浓度中性盐降低蛋白质溶解度使其沉淀的方法。","detail":"硫酸铵因溶解度大、对蛋白变性作用小而常用；逐步提高硫酸铵饱和度可使不同溶解度的蛋白依次沉淀，即硫酸铵分级沉淀。","note":"属按溶解特性分离，归入粗分级手段。","pages":[3,10,15]},{"id":"L10-C10","cn":"梯度离心","en":"gradient centrifugation / density gradient centrifugation","abbr":"","definition":"在密度梯度介质中离心，使蛋白质按沉降系数（与大小和形状相关）不同而分层的分离方法。","detail":"形状越偏离球形，摩擦阻力越大，沉降越慢；形状的不同会影响蛋白质在离心通过溶液、通过膜、凝胶过滤填料颗粒或电泳凝胶小孔时的运动。","note":"沉降系数s取决于颗粒质量与形状（补充）。","pages":[6]},{"id":"L10-C11","cn":"变性","en":"denaturation","abbr":"","definition":"蛋白质在一定的理化条件下失去原有的空间结构、生物学功能及部分理化特性。","detail":"一级结构（肽键）不断裂，破坏的是维持高级结构的非共价键与二硫键等作用力。","note":"变性不等于水解；去除变性条件后可复性。","pages":[9]},{"id":"L10-C12","cn":"复性","en":"renaturation","abbr":"","definition":"变性条件去除后，蛋白质恢复原有的空间结构及生物学功能。","detail":"复性依赖于氨基酸序列本身包含的全部折叠信息（Anfinsen原理，补充）。原核表达蛋白常以无活性包涵体形式存在，先用高浓度尿素等变性剂溶解，再去除变性剂使目的蛋白重新折叠复性。","note":"复性效率不一定高，可能形成错误折叠或聚集体。","pages":[9]},{"id":"L10-C13","cn":"粗分级","en":"crude fractionation","abbr":"","definition":"用提取缓冲液提取材料后，采取简单方法使目标蛋白浓缩、同时去除大量杂质的纯化步骤。","detail":"常用方法：硫酸铵分级沉淀、有机溶剂分级沉淀、超速离心、等电点沉淀、透析、超过滤。分辨率不高，为细分级做准备。","note":"目标是“浓缩+去大量杂质”，不要与细分级的高分辨率分离混淆。","pages":[11,15,16]},{"id":"L10-C14","cn":"细分级","en":"fine fractionation","abbr":"","definition":"在粗分级浓缩和初步纯化基础上，根据蛋白质分子大小、分子形状、分子表面特征或分子带电状况进一步纯化的步骤。","detail":"常用技术为层析和电泳，分离依据是分子本身的理化性质差异，分辨率高于粗分级。","note":"粗分级靠沉淀/透析，细分级靠层析/电泳。","pages":[11,16]},{"id":"L10-C15","cn":"蛋白酶抑制剂","en":"protease inhibitor","abbr":"","definition":"抑制蛋白酶活性的化合物，防止提取过程中目的蛋白被降解。","detail":"常用EDTA、PMSF、TPCK、TLCK；PMSF抑制丝氨酸蛋白酶，TPCK、TLCK为特异性丝氨酸蛋白酶抑制剂，EDTA既是金属离子螯合剂又是金属蛋白酶抑制剂。","note":"提取全过程温度控制在0–4℃以降低蛋白酶活性。","pages":[14,34]},{"id":"L10-C16","cn":"还原剂","en":"reducing agent","abbr":"","definition":"用于还原二硫键、防止蛋白氧化聚集的试剂，如DTT与2-巯基乙醇。","detail":"DTT（二硫苏糖醇，dithiothreitol）与2-巯基乙醇（2-mercaptoethanol）；与变性剂配合使用可打开二硫键，是包涵体溶解的常用组分。缓冲液中常加0.1~1 mmol/L DTT或β-巯基乙醇。","note":"还原剂防氧化，与蛋白酶抑制剂功能不同。","pages":[14,34]},{"id":"L10-C17","cn":"离子强度","en":"ionic strength","abbr":"","definition":"溶液中离子浓度及其电荷数的度量，影响蛋白质的溶解度与聚集状态。","detail":"提取时需选择合适离子强度，动物用NaCl、植物用KCl；过高或过低都可能降低目的蛋白溶解度或促使其变性。","note":"提取液还需含pH缓冲液（Tris-HCl、Tris-Gly、Gly-HCl、柠檬酸-柠檬酸钠）、金属离子螯合剂（EDTA、EGTA）、去污剂（SDS、CHAPS、Triton X-100、Tween-20）、甘油等。","pages":[13,14]},{"id":"L10-C18","cn":"电泳","en":"electrophoresis","abbr":"","definition":"带电颗粒在电场作用下向着与其电性相反的电极移动的现象。","detail":"分离效果取决于电荷量、分子大小与形状的综合差异。垂直板电泳装置上端为负极、下端为正极，带负电蛋白向下迁移。","note":"电泳既是分析手段也是细分级纯化手段。","pages":[3,26]},{"id":"L10-C19","cn":"SDS-聚丙烯酰胺凝胶电泳","en":"SDS-polyacrylamide gel electrophoresis","abbr":"SDS-PAGE","definition":"在SDS存在下进行的变性聚丙烯酰胺凝胶电泳，主要按分子量分离蛋白质。","detail":"SDS为阴离子去污剂（Na⁺ ⁻O-SO₂-O-(CH₂)₁₁CH₃），使多肽表面覆盖的负电荷远超过蛋白质原有电荷，消除不同蛋白间电荷差异；SDS改变蛋白构象，不同蛋白的SDS复合物短轴长度相同、长轴长度与分子量成正比。电泳迁移速度与距离只取决于分子量，可用于估算分子量。","note":"不能反映天然构象与活性；分子量标准常用66,000、45,000、36,000、29,000、24,000、20,000、14,000。","pages":[27,28,35]},{"id":"L10-C20","cn":"等电聚焦电泳","en":"isoelectric focusing","abbr":"IEF","definition":"在pH梯度中电泳，使蛋白质迁移至净电荷为零的pH处（即其pI）并聚焦成窄带的电泳技术。","detail":"利用两性电解质（ampholyte）在凝胶内建立pH梯度（如pH 9至pH 3），施加电场后各蛋白聚焦于其pI位置；分辨率高，常作为双向电泳第一向，也用于测定pI。","note":"与等电聚集层析不同：IEF靠电场驱动属电泳，后者属层析。","pages":[10,27,29,35]},{"id":"L10-C21","cn":"双向电泳","en":"two dimensional electrophoresis","abbr":"2-DE","definition":"第一向按等电点进行等电聚焦、第二向按分子量进行SDS-PAGE的二维电泳技术。","detail":"IEF凝胶条平放于SDS聚丙烯酰胺凝胶上作第二向，得到二维斑点图谱；是蛋白质组学中蛋白质分离纯化和鉴定的主要技术之一。大肠杆菌蛋白双向电泳图谱中可视化蛋白超过2,000种。","note":"正交性：第一向按电荷（pI）、第二向按分子量。","pages":[27,30,31]},{"id":"L10-C22","cn":"蛋白质免疫印迹","en":"Western blotting (immunoblotting)","abbr":"","definition":"在蛋白质凝胶电泳和固相免疫测定基础上发展起来的技术，为检测样品中是否存在蛋白抗原提供可靠方法。","detail":"被测蛋白只与标记的特异性抗体结合，结合不改变其在凝胶电泳中的相对分子质量。流程：样品制备→SDS-PAGE→转膜并封闭→一抗→酶促偶联或放射性同位素标记的二抗→显色或放射自显影。用途：测定抗原相对丰度、确定与其他已知抗原的关系、评价新抗体特异性；高效、简便、灵敏。","note":"与单纯SDS-PAGE不同：Western只显示被抗体识别的目标抗原，具有特异性。","pages":[35,38,39]},{"id":"L10-C23","cn":"一抗与二抗","en":"primary antibody / secondary antibody","abbr":"","definition":"一抗是与目的蛋白特异性结合的非标记抗体；二抗是识别一抗、带酶促偶联（如HRP）或放射性同位素标记的抗体。","detail":"二抗提供信号放大，是一抗不能直接显色的替代方案；HRP催化DAB氧化生成有色沉淀，沉积在目的蛋白位置。","note":"转膜后需封闭膜上未反应位点以减少非特异性吸附（常用脱脂奶粉或BSA，补充）。","pages":[39]},{"id":"L10-C24","cn":"圆二色谱法","en":"circular dichroism spectroscopy","abbr":"CD","definition":"在溶液状态下测定蛋白质对左、右旋圆偏振光吸收差异，用于分析蛋白质二级结构的方法。","detail":"测定190–260 nm区间CD谱，用算法（如最小二乘法）拟合α螺旋、β折叠、无规卷曲含量；α螺旋特征为220 nm和208 nm负峰、190 nm正峰。方法快速简便、对构象变化灵敏、较接近生理状态。","note":"不能给出原子分辨率三维结构；三维结构需X射线晶体学、NMR或cryo-EM。","pages":[40]},{"id":"L10-C25","cn":"X射线晶体衍射法","en":"X-ray crystallography","abbr":"","definition":"以蛋白质晶体为样品，通过衍射图谱解析原子级三维结构的方法。","detail":"前提是获得高质量晶体，与“结晶纯”纯度判据相呼应；纯度95–99%即可用于X射线晶体学及多数理化表征。","note":"需结晶，难用于难结晶蛋白与柔性复合物。","pages":[33,40]},{"id":"L10-C26","cn":"核磁共振与冷冻电镜","en":"nuclear magnetic resonance / cryo-electron microscopy","abbr":"NMR / cryo-EM","definition":"NMR在溶液状态下测定蛋白质三维结构；cryo-EM将样品快速冷冻后用电镜成像并重建三维结构。","detail":"NMR适合较小蛋白、能反映溶液构象；cryo-EM适合大分子复合物（补充）。","note":"与X射线晶体学并列为三维结构分析三大方法。","pages":[40]},{"id":"L10-C27","cn":"凯氏定氮法","en":"Kjeldahl nitrogen determination","abbr":"","definition":"基于蛋白质平均含氮量为16%，先测定样品氮含量再换算蛋白质含量的经典定量方法。","detail":"测氮→按16%换算蛋白质含量；需假定样品蛋白含氮量接近16%。","note":"经典总量测定法，非特异于某一种蛋白。","pages":[36]},{"id":"L10-C28","cn":"紫外吸收法","en":"UV absorbance method","abbr":"","definition":"利用芳香族氨基酸在280 nm附近有最大光吸收、核酸在260 nm附近有最大光吸收，用双波长校正核酸干扰的蛋白定量方法。","detail":"经验公式：蛋白质含量(mg/mL) = 1.45 × A280nm − 0.74 × A260nm。快速、无损，但受核酸与芳香族氨基酸组成影响。","note":"与显色法（如考马斯亮蓝Bradford法）不同：后者依赖显色剂反应产物与标准曲线，灵敏度更高但受蛋白种类影响。","pages":[36]},{"id":"L10-C29","cn":"纯度判据：色谱纯、电泳纯、结晶纯","en":"chromatographic / electrophoretic / crystallographic purity","abbr":"","definition":"色谱纯指层析图谱中只有一个洗脱峰；电泳纯指电泳图谱中只有一条条带；结晶纯指能够获得蛋白质晶体。","detail":"单一峰不代表绝对均一，可能共洗脱杂质；分子量相近杂质可能共迁移；能结晶常提示样品较均一，结晶本身也是纯化手段。","note":"相互验证原则：一种方法下均一的蛋白在另一种方法下可能不均一，需互相验证。","pages":[37]},{"id":"L10-C30","cn":"凝胶阻滞实验","en":"electrophoretic mobility shift assay","abbr":"EMSA","definition":"用于体外研究DNA/RNA与蛋白质相互作用的特殊凝胶电泳技术，蛋白结合后核酸探针迁移率下降形成滞后带。","detail":"又称gel retardation assay、DNA mobility shift assay。步骤：P32标记核酸探针→与蛋白温育结合→非变性聚丙烯酰胺凝胶电泳→放射自显影。可检测DNA结合蛋白与RNA结合蛋白，并研究结合所依赖的精确DNA序列特异性。加入特异性抗体形成三元复合物使条带进一步滞后，称supershift，用于鉴定未知蛋白。","note":"shift是蛋白结合导致的滞后；supershift是加抗体后的进一步滞后。","pages":[41,42,43]},{"id":"L10-C31","cn":"染色质免疫沉淀技术","en":"chromatin immunoprecipitation","abbr":"ChIP","definition":"在生理状态下将细胞内DNA与蛋白质交联，超声打碎染色质后用目的蛋白特异性抗体沉淀交联复合体，只有与目的蛋白结合的DNA片段被沉淀下来的技术。","detail":"步骤：甲醛固定→超声波断裂染色质→氯化铯等密度离心纯化交联染色质→免疫沉淀及复合体纯化→解交联与DNA纯化→PCR分析鉴定结合位点→进一步验证。可检测体内转录因子与DNA的动态作用（定性或定量），并研究组蛋白共价修饰与基因表达的关系。","note":"规范名称为染色质免疫沉淀，幻灯片写作“染色体免疫沉淀”；需设抗体阴性对照与input对照。","pages":[41,45,46]},{"id":"L10-C32","cn":"酵母双杂交","en":"yeast two-hybrid system","abbr":"Y2H","definition":"利用真核转录因子DNA结合结构域（BD）与转录激活结构域（AD）分离后重组装激活报告基因的原理，检测两种蛋白质之间是否存在相互作用的技术。","detail":"由Fields和Song于1989年建立（Nature, 1989, 340(6230): 245~246）。目标蛋白X与BD融合为诱饵（bait），候选蛋白Y与AD融合为猎物（prey），共转入酵母；若X与Y互作，BD与AD空间靠近形成完整转录因子，结合转录激活子结合位点启动报告基因转录。优点：接近体内环境，可检测瞬时、不稳定互作，与内源蛋白表达无关；结合Gateway载体构建广泛用于大规模研究。局限：不能研究自激活蛋白；只能检测两两互作；互作需发生在细胞核内；近50%假阳性率，推测的互作仅3%在两种以上实验中得到验证。","note":"自激活（autoactivation）指诱饵自身即能激活报告基因，导致假阳性。","pages":[48,49,50,51]},{"id":"L10-C33","cn":"免疫共沉淀","en":"co-immunoprecipitation","abbr":"Co-IP","definition":"以抗体和抗原之间的专一性作用为基础，在非变性条件下裂解细胞，用蛋白X的抗体沉淀X，与X在体内结合的蛋白Y也被共沉淀，用于研究完整细胞内生理性蛋白质相互作用的经典方法。","detail":"可用于测定两种目标蛋白是否在体内结合，也可确定一种蛋白的新的结合蛋白。局限：可能检测不到低亲和力和瞬间互作；不能区分直接结合与第三者桥接；需预先预测目的蛋白并有好抗体；灵敏度低于亲和色谱。","note":"只有非变性裂解才能保留原有互作；变性条件会破坏互作使Co-IP无法检出伙伴。","pages":[48,52,58,59,60,63]},{"id":"L10-C34","cn":"免疫沉淀","en":"immunoprecipitation","abbr":"IP","definition":"利用特异性抗体与抗原决定簇结合，通过Protein A/G珠子将抗原-抗体复合物从混合液中沉淀下来的技术。","detail":"抗体以可变区特异识别抗原、以Fc区被Protein A/G珠子捕获。优点：特异性高、假阳性少、适用于多蛋白复合物。灵敏度取决于Protein A（或G）与IgG的Kd、IgG与抗原的Kd；提高灵敏度可增加抗原或抗体浓度，或使用与抗体直接共价偶联的珠子。","note":"IP与Co-IP区别：Co-IP强调共沉淀的伙伴蛋白，用于研究相互作用。","pages":[49,53,55]},{"id":"L10-C35","cn":"串联亲和纯化","en":"tandem affinity purification","abbr":"TAP","definition":"在目标蛋白上融合串联双标签（如Protein A与钙调蛋白结合肽），经两步亲和纯化获得高纯度蛋白复合物的方法。","detail":"两步亲和纯化降低非特异背景，用于复合物组分鉴定。","note":"与AP-MS思路一致，均以标签诱饵富集复合物。","pages":[49]},{"id":"L10-C36","cn":"免疫沉淀-质谱联用","en":"immunoprecipitation coupled with mass spectrometry","abbr":"IP-MS","definition":"用抗体特异富集目标蛋白复合物，经凝胶分离与胰蛋白酶酶解后用质谱鉴定共沉淀蛋白的方法。","detail":"流程：收集裂解细胞/组织→与偶联特异性抗体的珠子孵育→洗涤去除非结合蛋白→洗脱复合物→SDS-PAGE→切胶、胰蛋白酶胶内酶解→MS/MS鉴定。示例：Flag-USP38免疫沉淀产物中鉴定到USP38（85个肽段，覆盖率72%）及HDAC1（6个肽段，覆盖率19%）等候选互作蛋白。","note":"只能给出候选名单，需另行验证；肽段数与覆盖率越高可信度越高。","pages":[54,57]},{"id":"L10-C37","cn":"亲和纯化-质谱","en":"affinity purification & mass spectrometry","abbr":"AP-MS","definition":"以带标签的诱饵蛋白从裂解液中分离蛋白复合物，经亲和柱纯化、SDS-PAGE、切胶胰蛋白酶酶解后用质谱与生物信息学分析鉴定复合物组分的方法。","detail":"采用原因：抗体问题、过表达可增加产率。缺点：过表达可能引起非特异相互作用；标签可能影响相互作用。","note":"与IP-MS原理相通，区别在富集手段为标签亲和而非抗体。","pages":[56]},{"id":"L10-C38","cn":"GST下拉实验","en":"GST pull-down","abbr":"","definition":"以细菌表达的谷胱甘肽S-转移酶（GST）融合蛋白为探针，与溶液中特异性搭档蛋白结合后，用谷胱甘肽琼脂糖球珠沉淀GST融合蛋白并把结合蛋白一起沉淀下来的体外方法。","detail":"步骤：构建并细菌表达GST融合诱饵→结合到谷胱甘肽琼脂糖球珠→加入候选搭档蛋白孵育→离心洗涤去非特异→洗脱并检测（SDS-PAGE、MALDI-TOF质谱或Western blot）。适用时机：得到目标蛋白抗体前，或抗体干扰蛋白互作时。两种应用：确定新的相互作用、证实已知可能的相互作用。只用于确定体外相互作用。","note":"需设GST单独对照，反应在4℃进行；需要纯化大量蛋白；不适用于需第三者介导或蛋白修饰介导的互作。","pages":[48,66,67,68,69]},{"id":"L10-C39","cn":"荧光共振能量转移","en":"fluorescence resonance energy transfer","abbr":"FRET","definition":"两个荧光探针（给体与受体）在近距离内发生非辐射能量转移的现象，用于检测分子间相互作用。","detail":"发生三条件：给体与受体距离1～10 nm；给体发射光谱与受体吸收光谱重叠；偶极具有一定空间取向。示例：CFP受440 nm激发发480 nm荧光，与YFP靠近后发生FRET，检测到YFP发射535 nm荧光。可在活细胞内定时、定量、定位检测蛋白激酶活性，并用于膜蛋白横向扩散、定位修饰、受体间相互作用研究。","note":"优于亚细胞共定位：共定位只说明同一区域，FRET依赖纳米级距离可报告相互作用。","pages":[48,58,64,65]},{"id":"L10-C40","cn":"表面等离子共振","en":"surface plasmon resonance","abbr":"SPR","definition":"将配体固定在传感芯片表面，实时监测流经表面的分析物结合所引起的折射率变化，从而测定结合动力学与亲和力的生物物理技术。","detail":"商品化仪器如Biacore；实时、无标记。","note":"属生物物理技术，给出动力学参数而非仅“是否结合”。","pages":[48,66]},{"id":"L10-C41","cn":"Far Western 印迹与蛋白芯片","en":"Far Western blotting / protein microarray","abbr":"","definition":"Far Western是将蛋白经SDS-PAGE转膜后用标记的探针蛋白（而非抗体）孵育，检测膜上与之直接结合的蛋白；蛋白芯片是将大量蛋白以阵列形式固定，用标记样品孵育进行高通量互作筛查。","detail":"Far Western的探针是蛋白质而非抗体，与普通Western不同；蛋白芯片用于高通量筛查。","note":"两者均属体外互作技术。","pages":[66]},{"id":"L10-C42","cn":"解离常数","en":"dissociation constant","abbr":"Kd","definition":"衡量两分子结合亲和力的平衡常数，Kd越小亲和力越强。","detail":"IP灵敏度受Protein A/G与IgG的Kd、IgG与抗原的Kd共同限制；抗体直接共价偶联于珠子可省去前者平衡，提高灵敏度。","note":"两步结合体系的总灵敏度由较弱的结合步骤主导。","pages":[55]}],"processes":[{"id":"L10-P01","name":"透析脱盐","en":"dialysis","overview":"用半透膜袋将蛋白质溶液与大量缓冲液隔开，小分子盐离子扩散出去而蛋白质被截留。","steps":[{"n":1,"name":"装袋封口","detail":"将待纯化蛋白质溶液装入半透膜袋（透析袋）并封口。"},{"n":2,"name":"浸入缓冲液","detail":"把透析袋浸入大量缓冲液中，袋内小分子浓度高于外液。"},{"n":3,"name":"扩散交换","detail":"盐离子等小分子经半透膜扩散至外液，蛋白质被截留在袋内。"},{"n":4,"name":"更换缓冲液至平衡","detail":"更换缓冲液直至达到平衡，除去盐杂质；磁力搅拌加快交换。"}],"key_points":["驱动力为膜内外浓度差","半透膜只允许小分子通过","搅拌加快达到平衡"],"regulation":[],"figures":["透析开始时袋内小分子浓度高、外液低；平衡时小分子两侧均匀分布，蛋白质始终在袋内"],"pages":[5]},{"id":"L10-P02","name":"亲和层析分离","en":"affinity chromatography procedure","overview":"将配体固定于不溶性基质，利用特异可逆结合捕获目标蛋白再洗脱。","steps":[{"n":1,"name":"固定配体","detail":"把配体（或目标蛋白）固定在不溶性基质（如琼脂糖珠）上。"},{"n":2,"name":"上样结合","detail":"混合样品上柱，目标分子与固定化配体特异结合，杂质流穿。"},{"n":3,"name":"洗涤","detail":"用结合缓冲液洗去非特异结合的杂蛋白。"},{"n":4,"name":"洗脱","detail":"改变条件（竞争配体、改变pH/离子强度）使结合可逆解离，洗脱目标分子。"}],"key_points":["特异性与可逆性是能洗脱回收的前提","选择性最高","示例：胰岛素配体捕获胰岛素受体"],"regulation":[],"figures":["琼脂糖珠表面固定配体，目标蛋白专一结合；杂蛋白先洗出，目标蛋白改变条件后洗脱"],"pages":[8,24]},{"id":"L10-P03","name":"金属螯合亲和层析","en":"metal chelate affinity chromatography","overview":"固相载体螯合Ni，Ni与His标签配位结合目标蛋白，咪唑竞争洗脱。","steps":[{"n":1,"name":"固定Ni","detail":"固相载体通过亚氨基二乙酸类螯合配基固定Ni²⁺。"},{"n":2,"name":"上柱结合","detail":"样品上柱，蛋白表面的多聚组氨酸标签（His-His-His）与Ni配位结合。"},{"n":3,"name":"咪唑洗脱","detail":"用咪唑竞争性取代His与Ni的配位，使蛋白从柱上脱落。"}],"key_points":["His标签与固定化Ni的特异配位是吸附基础","咪唑为竞争性配体，洗脱较温和","高浓度咪唑可能影响蛋白活性"],"regulation":[],"figures":["固相载体—螯合臂—Ni—三个His残基虚线配位；imidazole向下箭头表示洗脱"],"pages":[25]},{"id":"L10-P04","name":"蛋白质分离纯化一般流程","en":"general workflow of protein separation and purification","overview":"从生物组织或重组表达细胞裂解液出发，经前处理、粗分级、细分级获得纯化蛋白。","steps":[{"n":1,"name":"前处理","detail":"材料选择与处理、细胞破碎（机械破碎、溶涨和自溶、酶解、化学处理），得到无细胞提取液。"},{"n":2,"name":"粗分级","detail":"盐析（硫酸铵盐析）、等电点沉淀、有机溶剂沉淀、透析，得到粗产品。"},{"n":3,"name":"细分级","detail":"层析法、电泳法、超离心法、超滤，获得纯化蛋白。"}],"key_points":["前处理核心是细胞破碎","粗分级以沉淀/透析为主","细分级以层析、电泳、超离心、超滤为主","全程0–4℃减少降解"],"regulation":["提取液需含pH缓冲液、合适离子强度、还原剂、蛋白酶抑制剂、金属螯合剂、去污剂"],"figures":["生物组织→无细胞提取液→粗产品→细分级；括号注明重组表达蛋白细胞裂解液"],"pages":[11,12,13,14]},{"id":"L10-P05","name":"SDS-PAGE分离与分子量测定","en":"SDS-PAGE","overview":"SDS使蛋白变性并带上均匀负电荷，电泳迁移距离只取决于分子量。","steps":[{"n":1,"name":"样品处理","detail":"蛋白与SDS结合，多肽表面覆盖大量负电荷，消除电荷差异并改变构象。"},{"n":2,"name":"加样电泳","detail":"样品加入凝胶加样孔，上端负极、下端正极，蛋白向下迁移。"},{"n":3,"name":"染色与分子量估算","detail":"对照分子量标准（66,000、45,000、36,000、29,000、24,000、20,000、14,000）估算目标蛋白Mr。"}],"key_points":["SDS复合物短轴长度相同、长轴与分子量成正比","迁移速度与距离只取决于分子量","不能反映天然构象与活性"],"regulation":[],"figures":["从粗细胞提取物（未诱导/诱导）经阴离子交换、凝胶排阻到纯化蛋白，目标条带逐渐富集"],"pages":[28,35]},{"id":"L10-P06","name":"等电聚焦电泳","en":"isoelectric focusing","overview":"在凝胶内建立pH梯度，使各蛋白迁移并聚焦于其pI位置。","steps":[{"n":1,"name":"掺入两性电解质","detail":"将两性电解质溶液掺入凝胶（常用聚丙烯酰胺凝胶）。"},{"n":2,"name":"建立pH梯度","detail":"施加电场，建立稳定pH梯度（如pH 9至pH 3）。"},{"n":3,"name":"加样并重新电泳","detail":"加入蛋白质样品并重新施加电场。"},{"n":4,"name":"聚焦与染色","detail":"各蛋白聚焦于其pI对应位置，染色后可见沿pH梯度分布的窄带。"}],"key_points":["pI处净电荷为零，蛋白不再迁移","分辨率高","常作双向电泳第一向"],"regulation":[],"figures":["三支管式凝胶：建立pH梯度→加样电泳→染色后按pI分布成多条窄带"],"pages":[29]},{"id":"L10-P07","name":"双向电泳","en":"two dimensional electrophoresis","overview":"第一向按pI、第二向按分子量正交分离蛋白质。","steps":[{"n":1,"name":"第一向IEF","detail":"管式凝胶等电聚焦，按pI分离。"},{"n":2,"name":"转移凝胶条","detail":"将IEF凝胶条平放在SDS聚丙烯酰胺凝胶上。"},{"n":3,"name":"第二向SDS-PAGE","detail":"按分子量Mr分离，得到二维斑点图谱。"}],"key_points":["正交性：电荷与分子量两个独立维度","蛋白质组学主要分离技术之一","大肠杆菌图谱可视化蛋白超过2,000种"],"regulation":[],"figures":["横轴Decreasing pI、纵轴Decreasing Mr的二维斑点图"],"pages":[30,31]},{"id":"L10-P08","name":"Western blotting","en":"Western blotting procedure","overview":"SDS-PAGE分离后转膜，用特异抗体识别目标抗原并显色或自显影。","steps":[{"n":1,"name":"样品制备","detail":"制备蛋白样品。"},{"n":2,"name":"SDS-PAGE分离","detail":"按分子量分离蛋白。"},{"n":3,"name":"转膜与封闭","detail":"转至硝酸纤维素膜，封闭膜上未反应位点减少非特异吸附。"},{"n":4,"name":"一抗孵育与洗涤","detail":"与相应非标记一抗反应，洗去多余一抗。"},{"n":5,"name":"二抗孵育与检测","detail":"加酶促偶联（HRP）或放射性同位素标记的二抗，DAB显色或放射自显影检测。"}],"key_points":["一抗不标记，信号由二抗提供并放大","只显示被抗体识别的目标抗原","高效、简便、灵敏"],"regulation":[],"figures":["SDS-PAGE→转膜→一抗→二抗→Autoradiogram；HRP催化DAB显色"],"pages":[39]},{"id":"L10-P09","name":"EMSA","en":"electrophoretic mobility shift assay procedure","overview":"蛋白与标记核酸探针结合后在非变性凝胶中迁移变慢，形成滞后带。","steps":[{"n":1,"name":"探针制备","detail":"制备DNA或RNA探针，用P32放射性同位素标记。"},{"n":2,"name":"温育结合","detail":"与细胞蛋白质提取物一道温育，形成核酸-蛋白质复合物。"},{"n":3,"name":"非变性电泳","detail":"加样到非变性聚丙烯酰胺凝胶中电泳分离。"},{"n":4,"name":"放射自显影","detail":"显现放射性标记核酸条带位置；复合物条带相对游离探针滞后。"}],"key_points":["体外方法","可检测DNA结合蛋白与RNA结合蛋白","加特异性抗体可supershift确认蛋白身份","可研究结合所依赖的精确DNA序列特异性"],"regulation":[],"figures":["随[p20]浓度升高，游离探针条带减弱、复合物滞后带增强；C59(9,15)出现多条复合物带，TAR主要一条"],"pages":[42,43]},{"id":"L10-P10","name":"ChIP","en":"chromatin immunoprecipitation procedure","overview":"体内交联固定蛋白-DNA相互作用，打断染色质后用特异抗体沉淀并鉴定结合DNA。","steps":[{"n":1,"name":"甲醛固定","detail":"活细胞加甲醛，可逆交联蛋白质与DNA。"},{"n":2,"name":"打断染色质","detail":"超声波将染色质打碎。"},{"n":3,"name":"纯化交联染色质","detail":"氯化铯等密度离心纯化交联的染色质。"},{"n":4,"name":"免疫沉淀","detail":"用目的蛋白特异性抗体沉淀交联复合体，只有与目的蛋白结合的DNA片段被沉淀；与Protein A/G共沉淀并纯化。"},{"n":5,"name":"解交联与DNA纯化","detail":"逆转交联反应，纯化DNA。"},{"n":6,"name":"分析与验证","detail":"PCR检测目标DNA片段，鉴定结合位点并进一步验证；设抗体阴性对照与input对照。"}],"key_points":["反映生理/染色质状态下的真实结合","可定性或定量检测转录因子与DNA的动态作用","可研究组蛋白共价修饰与基因表达关系"],"regulation":[],"figures":["细胞甲醛交联→染色质打断→背景洗脱→加抗体→Protein A/G共沉淀→解交联→PCR；LPL启动子结果中PPARγ与Pol 2有富集信号而ICAM-1无"],"pages":[45,46]},{"id":"L10-P11","name":"酵母双杂交检测","en":"yeast two-hybrid assay","overview":"BD-诱饵与AD-猎物在酵母内互作使转录因子重组装，激活报告基因。","steps":[{"n":1,"name":"构建诱饵","detail":"目标蛋白X与DNA结合结构域BD融合。"},{"n":2,"name":"构建猎物","detail":"候选蛋白Y与转录激活结构域AD融合（常来自cDNA文库）。"},{"n":3,"name":"共转入酵母","detail":"把分别编码诱饵和猎物的重组基因引入酵母细胞。"},{"n":4,"name":"重组装转录因子","detail":"若X与Y互作，BD与AD空间靠近形成完整活性转录因子。"},{"n":5,"name":"报告基因表达与检测","detail":"转录因子结合转录激活子结合位点启动报告基因转录，检测报告蛋白判断互作。"}],"key_points":["接近体内环境，可检测瞬时、不稳定互作","与内源蛋白表达无关","不能研究自激活蛋白","只能检测两两互作，互作需在细胞核内","近50%假阳性率，仅3%被两种以上实验验证"],"regulation":["改进：选不同功能不同大小诱饵；两轮杂交（8个混合诱饵初筛后一对一复筛）；pull-down与Co-IP验证；生物信息学系统分析"],"figures":["BD-诱饵与AD-猎物通过X-Y互作桥接，激活报告基因转录"],"pages":[50,51,52]},{"id":"L10-P12","name":"免疫共沉淀","en":"co-immunoprecipitation procedure","overview":"非变性裂解细胞保留互作，用蛋白X抗体沉淀X及其结合伙伴Y。","steps":[{"n":1,"name":"非变性裂解","detail":"非变性条件下裂解细胞，保留蛋白-蛋白相互作用。"},{"n":2,"name":"抗体结合","detail":"加入针对蛋白X的特异性抗体进行免疫沉淀；抗体Fc区被Protein A/G珠子捕获。"},{"n":3,"name":"共沉淀","detail":"与X在体内结合的蛋白Y一同被沉淀；低离心力沉淀或微膜过滤收集复合物。"},{"n":4,"name":"检测","detail":"SDS-PAGE后Western blot检测沉淀物中是否存在Y；同时保留WCL输入对照。"}],"key_points":["反映完整细胞内生理性互作","不能区分直接结合与第三者桥接","可能检测不到低亲和力、瞬间互作","需高亲和力、特异性好的抗体","灵敏度低于亲和色谱"],"regulation":["提高灵敏度：增加抗原或抗体浓度；抗体直接共价偶联于珠子"],"figures":["IP: Myc组仅ACS2泳道检出HA-CDPK（约95 kDa），RNF8与vector无；WCL显示三组表达量一致"],"pages":[59,60,62,63]},{"id":"L10-P13","name":"IP-MS/AP-MS鉴定复合物","en":"immunoprecipitation / affinity purification followed by mass spectrometry","overview":"抗体或标签诱饵富集蛋白复合物，经凝胶分离、胰蛋白酶酶解后质谱鉴定组分。","steps":[{"n":1,"name":"裂解与富集","detail":"收集并裂解细胞/组织，与偶联特异性抗体的珠子（或亲和柱）孵育，诱饵结合目标蛋白及复合物。"},{"n":2,"name":"洗涤","detail":"洗涤去除非结合蛋白，保留复合物。"},{"n":3,"name":"洗脱与SDS-PAGE","detail":"从珠子洗脱复合物，进行SDS-PAGE分离各亚基。"},{"n":4,"name":"切胶酶解","detail":"切取条带，胰蛋白酶胶内酶解。"},{"n":5,"name":"MS/MS与生物信息学分析","detail":"质谱鉴定肽段，生物信息学分析确定Protein 1–5等组分。"}],"key_points":["可鉴定未知互作伙伴","过表达提高产率但可能引入非特异互作","标签可能影响相互作用","需另行验证候选名单"],"regulation":[],"figures":["Bait-Tag→亲和柱→SDS-PAGE→切胶酶解→质谱鉴定Protein 1–5"],"pages":[54,56,57]},{"id":"L10-P14","name":"GST pull-down","en":"GST pull-down","overview":"GST融合诱饵结合谷胱甘肽珠，从溶液中捕获搭档蛋白并沉淀检测。","steps":[{"n":1,"name":"表达诱饵","detail":"构建并细菌表达GST融合诱饵蛋白。"},{"n":2,"name":"固定珠上","detail":"GST融合蛋白结合到谷胱甘肽琼脂糖球珠上。"},{"n":3,"name":"孵育结合","detail":"加入含候选搭档蛋白的溶液，4℃孵育使特异结合。"},{"n":4,"name":"洗涤","detail":"离心/洗涤去除非特异结合蛋白。"},{"n":5,"name":"洗脱检测","detail":"洗脱后SDS-PAGE、Western blot或MALDI-TOF质谱检测；设GST单独对照。"}],"key_points":["只反映体外直接结合","需纯化大量蛋白","不适用于需第三者介导或蛋白修饰介导的互作","GST对照与4℃操作减少非特异","正反双向pull-down（GST/His）可互相印证直接结合"],"regulation":[],"figures":["GST-hCINAP（约55 kDa）与His-LDHA（约34 kDa）双向均能互相捕获，GST单独对照（约26 kDa）为阴性"],"pages":[67,68,69]}],"distinctions":[{"id":"L10-D01","title":"透析与超滤","a":"透析 dialysis","b":"超滤 ultrafiltration","difference":["透析以膜内外浓度梯度为驱动力，超滤以压力为驱动力","透析主要用于去除小分子盐，超滤可同时浓缩和分级","两者都靠半透膜按分子大小截留"],"easy_mistake":"把超滤也当作仅靠浓度差被动扩散。","pages":[4,5]},{"id":"L10-D02","title":"阳离子交换与阴离子交换","a":"阳离子交换 cation exchange","b":"阴离子交换 anion exchange","difference":["阳离子交换凝胶带负电荷，结合带正电蛋白，条件为缓冲液pH<pI","阴离子交换凝胶带正电荷，结合带负电蛋白，条件为缓冲液pH>pI","命名以被交换的离子（蛋白）为准"],"easy_mistake":"误以为介质与蛋白带同种电荷才结合；实际必须相反。","pages":[21]},{"id":"L10-D03","title":"等电聚焦与等电聚集层析","a":"等电聚焦 isoelectric focusing（电学法）","b":"等电聚集层析 isoelectric focusing chromatography（层析法）","difference":["两者都利用pI分离","前者在pH梯度中靠电场驱动，属电泳技术","后者属层析技术，幻灯片分列于不同大类"],"easy_mistake":"把两者当作同一技术。","pages":[10]},{"id":"L10-D04","title":"粗分级与细分级","a":"粗分级 crude fractionation","b":"细分级 fine fractionation","difference":["粗分级以浓缩和去除大量杂质为目的，手段简单（盐析、有机溶剂沉淀、超速离心、等电点沉淀、透析、超滤）","细分级按分子大小、形状、表面特征或电荷精细分离，主要靠层析和电泳","粗分级分辨率低，细分级分辨率高"],"easy_mistake":"把透析、超滤归入细分级。","pages":[15,16]},{"id":"L10-D05","title":"SDS-PAGE与Western blotting","a":"SDS-PAGE","b":"Western blotting","difference":["SDS-PAGE只按分子量分离并显示总蛋白条带","Western blotting在分离后经转膜与特异抗体结合，只显示被抗体识别的目标抗原","Western具有免疫特异性，可半定量抗原丰度"],"easy_mistake":"认为Western blot的分子量信息与SDS-PAGE不同；实际上抗体结合不改变相对分子质量。","pages":[38]},{"id":"L10-D06","title":"紫外吸收法与显色法","a":"紫外吸收法 A280/A260","b":"分光光度显色法（如考马斯亮蓝Bradford法）","difference":["前者直接测蛋白自身芳香族氨基酸吸收，需双波长校正核酸","后者依赖显色剂反应产物，需标准曲线","显色法灵敏度更高但受蛋白种类影响"],"easy_mistake":"忽略核酸在260 nm的干扰而直接用A280定量。","pages":[36]},{"id":"L10-D07","title":"EMSA的shift与supershift","a":"shift 迁移率变动","b":"supershift 超迁移","difference":["shift是蛋白与探针结合导致复合物滞后","supershift是在此基础上再加入特异性抗体形成三元复合物导致进一步滞后","supershift用于确认蛋白身份"],"easy_mistake":"把supershift当作另一种独立实验。","pages":[42]},{"id":"L10-D08","title":"体外结合实验与体内真实结合状态","a":"体外结合实验（EMSA、足迹等）","b":"体内真实结合状态（如ChIP）","difference":["体外实验脱离染色质环境，无法反映染色质结构、组蛋白遮蔽","高等生物基因组具染色质结构，体外结合的DNA在生理状态下可能并不结合对应因子","染色质上DNA与非组蛋白的互作常是瞬时的，体外方法难以捕捉"],"easy_mistake":"把EMSA阳性直接等同于细胞内该位点被占据。","pages":[44]},{"id":"L10-D09","title":"Co-IP检出的结合与直接相互作用","a":"Co-IP检出的结合","b":"直接相互作用","difference":["Co-IP只能说明两蛋白在同一复合物中","不能区分直接结合与由第三者桥接的间接结合","需体外实验（如GST/His pull-down）进一步判断"],"easy_mistake":"把Co-IP阳性直接写成“直接结合”。","pages":[63,68]},{"id":"L10-D10","title":"Protein A/G珠子非共价捕获与抗体共价偶联珠子","a":"Protein A/G珠子非共价捕获抗体","b":"抗体直接共价偶联于珠子","difference":["前者多一步Protein A/G–IgG的Kd平衡，洗脱时抗体可能脱落、灵敏度受限","后者省去该平衡，灵敏度更高，洗脱条件更温和","两者均受IgG与抗原Kd限制"],"easy_mistake":"忽略Protein A/G–IgG这一步平衡对IP灵敏度的影响。","pages":[55]},{"id":"L10-D11","title":"酵母双杂交与免疫共沉淀","a":"酵母双杂交 Y2H","b":"免疫共沉淀 Co-IP","difference":["Y2H在活细胞内、可遗传筛选、适合未知互作与文库筛选，但假阳性高且互作需核内定位","Co-IP反映天然细胞环境与内源蛋白，但需好抗体、无法证明直接结合、难高通量","Y2H不能研究自激活蛋白；Co-IP可能检测不到低亲和力瞬间互作"],"easy_mistake":"认为Y2H阳性即证明体内真实互作；或认为Co-IP能证明直接结合。","pages":[51,63,70]},{"id":"L10-D12","title":"体外pull-down与细胞内互作检测","a":"体外pull-down（in vitro binding）","b":"细胞内检测（Co-IP、Y2H）","difference":["pull-down只反映体外直接结合","无法体现细胞内第三因子介导或翻译后修饰依赖的互作","pull-down需纯化大量蛋白，设GST对照、4℃进行"],"easy_mistake":"用pull-down阴性否定细胞内存在互作。","pages":[69]},{"id":"L10-D13","title":"FRET与亚细胞共定位","a":"FRET","b":"亚细胞共定位 subcellular co-localization","difference":["共定位只说明两分子处于同一区域，不能证明直接相互作用","FRET依赖分子间1–10 nm距离与偶极取向，可报告相互作用","FRET可在活细胞内实时检测"],"easy_mistake":"把荧光共定位图像当作互作证据。","pages":[65]},{"id":"L10-D14","title":"EDTA与EGTA","a":"EDTA","b":"EGTA","difference":["两者均为金属离子螯合剂","EGTA对Ca²⁺选择性更强（补充）","EDTA同时是金属蛋白酶抑制剂"],"easy_mistake":"认为两者可完全互换而不影响Ca²⁺相关实验。","pages":[14]}],"facts":[{"id":"L10-F01","text":"蛋白质分子量范围约为几百至百万道尔顿（Dalton, Da）；其大小主要取决于肽链数目及每条肽链的氨基酸残基数目。","note":"定量基础，常作为选择分离方法（透析/超滤/凝胶过滤/离心）的依据出选择题。","pages":[4]},{"id":"L10-F02","text":"在 pH 7.0 时，若 Asp、Glu 残基占优势则蛋白质带净负电荷，称酸性蛋白质（acidic protein）；若 Lys、Arg 占优势则带净正电荷，称碱性蛋白质（basic protein）。","note":"离子交换介质选择的直接依据；常与 pI 关系联合出题。","pages":[7]},{"id":"L10-F03","text":"透析（dialysis）的驱动力是膜内外浓度差；蛋白质不能通过半透膜，盐离子等小分子可自由通过，故用于脱盐；磁力搅拌可加快达到平衡。","note":"与超滤（压力驱动）对比是经典辨析题。","pages":[5]},{"id":"L10-F04","text":"亲和层析（affinity chromatography）依赖生物大分子与配体间特异（specific）且可逆（reversible）的结合；分类包括免疫亲和层析、生物亲和层析、金属螯合亲和层析（IMAC）。","note":"“特异性+可逆性”两个关键词是洗脱回收的前提，名词解释高频。","pages":[8,24,25]},{"id":"L10-F05","text":"金属螯合亲和层析中，固相载体经亚氨基二乙酸类螯合配基固定 Ni²⁺，Ni²⁺ 与蛋白表面多聚组氨酸标签（His-tag）配位结合；用咪唑（imidazole）竞争性取代 His 完成洗脱。","note":"His 标签蛋白纯化的标准流程，常考“为什么用咪唑洗脱”。","pages":[25]},{"id":"L10-F06","text":"蛋白质分离纯化一般流程：生物组织（或重组表达细胞裂解液）→无细胞提取液→粗产品→细分级；分前处理（细胞破碎）、粗分级（盐析、等电点沉淀、有机溶剂沉淀、透析）、细分级（层析、电泳、超离心、超滤）三阶段。","note":"流程框架题必考；注意各阶段手段归属。","pages":[11]},{"id":"L10-F07","text":"细胞破碎方法共 6 种：机械剪碎、研磨、反复冻融法、超声破碎法、高压匀浆法、酶解法。","note":"填空/多选题常考列举。","pages":[12]},{"id":"L10-F08","text":"提取液需含：pH 缓冲液（Tris-HCl、Tris-Gly、Gly-HCl、柠檬酸-柠檬酸钠）；离子强度（动物用 NaCl，植物用 KCl）；还原剂（DTT、2-巯基乙醇）；蛋白酶抑制剂（EDTA、PMSF、TPCK、TLCK）；金属离子螯合剂（EDTA、EGTA）；去污剂（SDS、CHAPS、Triton X-100、Tween-20）；其他（甘油）。提取全过程温度控制在 0–4℃。","note":"试剂-功能配对题高频；EDTA 兼具螯合与抑制金属蛋白酶双重身份。","pages":[14]},{"id":"L10-F09","text":"纯化注意事项：冰上或冷室操作；蛋白浓度维持在 μg/mL～mg/mL；缓冲液 pH 应避开目标蛋白 pI（聚焦层析除外）；加蛋白酶抑制剂与 DNase；避免反复冻融与剧烈搅动；加 0.1~1 mmol/L DTT 或 β-巯基乙醇防氧化；加 1~10 mmol/L EDTA 防重金属破坏；使用灭菌溶液。","note":"“为什么缓冲液 pH 要避开 pI”与“IEF 恰利用 pI”构成一对易错点。","pages":[34]},{"id":"L10-F10","text":"纯化总得率 =（每步得率）^n；每步 90% 经 8 步后总得率约降至 40%，每步 75% 时下降更快。","note":"计算题来源；结论是“尽量减少纯化步骤”。","pages":[32]},{"id":"L10-F11","text":"纯度要求分三档：极高 >99%（治疗用途、in vivo 研究）；高 95–99%（X 射线晶体学及多数理化表征）；中等 <95%（抗体制备用抗原、N 端测序）。","note":"纯度-用途匹配表，选择题常考错配。","pages":[33]},{"id":"L10-F12","text":"离子交换介质选择规则：缓冲液 pH < pI 时蛋白带正电，选带负电的阳离子交换剂（cation exchanger，如羧甲基 CM）；pH > pI 时蛋白带负电，选带正电的阴离子交换剂（anion exchanger，如 DEAE）；pH = pI 时净电荷为零，不宜使用。","note":"命名以被交换离子（蛋白）为准，介质电荷与蛋白电荷相反才结合——最易错点。","pages":[20,21]},{"id":"L10-F13","text":"分子筛层析（gel filtration / size-exclusion chromatography）洗脱顺序按分子量从大到小：250,000 Da 的蛋白完全被排阻，在床体积（bed volume）处最先洗脱；125,000 Da 次之；75,000 Da 最后流出。","note":"洗脱体积与分子大小成反比，常出排序题或读图题。","pages":[22,23]},{"id":"L10-F14","text":"SDS 为阴离子去污剂，使多肽表面覆盖的负电荷远超过蛋白质原有电荷，消除不同蛋白间的电荷差异；不同蛋白的 SDS 复合物短轴长度相同，长轴长度与分子量成正比，故 SDS-PAGE 主要按分子量分离。","note":"SDS-PAGE 原理核心句，简答题必背。","pages":[28]},{"id":"L10-F15","text":"SDS-PAGE 分子量标准（Molecular mass markers）数值依次为 66,000、45,000、36,000、29,000、24,000、20,000、14,000。","note":"读图估算分子量的数据来源。","pages":[28]},{"id":"L10-F16","text":"等电聚焦（IEF）中先由两性电解质（ampholyte）在凝胶内建立稳定 pH 梯度（示例上端 pH 9、下端 pH 3），蛋白质迁移至净电荷为零的 pH 处聚焦成窄带。","note":"与双向电泳第一向衔接；注意 pH 梯度方向与电极极性。","pages":[29]},{"id":"L10-F17","text":"双向电泳（2-DE）第一向按等电点（IEF）分离，第二向按分子量（SDS-PAGE）分离；是蛋白质组学中分离纯化和鉴定多肽链的主要技术之一。","note":"正交性原理与蛋白质组学应用常考。","pages":[30]},{"id":"L10-F18","text":"大肠杆菌蛋白质双向电泳图谱中可视化（visualized）的蛋白质超过 2,000 种。","note":"定量事实，可作选择/填空。","pages":[31]},{"id":"L10-F19","text":"凯氏定氮法（Kjeldahl）原理：蛋白质平均含氮量为 16%，测氮后换算蛋白含量。","note":"“16%”是唯一必须记住的数字。","pages":[36]},{"id":"L10-F20","text":"紫外吸收法经验公式：蛋白质含量(mg/mL) = 1.45 × A280nm − 0.74 × A260nm；依据是芳香族氨基酸在 280 nm、核酸在 260 nm 附近有最大吸收。","note":"计算题直接套用；需说明双波长校正核酸干扰的理由。","pages":[36]},{"id":"L10-F21","text":"纯度鉴定三判据：色谱纯（层析图谱单一洗脱峰）、电泳纯（电泳单一区带）、结晶纯（能获得蛋白质晶体）；一种方法下均一的蛋白在另一种方法下可能不均一，需相互验证。","note":"“相互验证原则”是简答题得分点。","pages":[37]},{"id":"L10-F22","text":"Western blotting 原理：被测蛋白只与标记的特异性抗体结合，且该结合不改变其在凝胶电泳中的相对分子质量；流程为样品制备→SDS-PAGE→转膜并封闭→一抗→洗二抗（酶偶联或放射性同位素标记）→显色或放射自显影。","note":"一抗不标记、二抗带信号是流程关键；与单纯 SDS-PAGE 的辨析常考。","pages":[38,39]},{"id":"L10-F23","text":"圆二色谱（CD）典型 α 螺旋特征：220 nm 与 208 nm 处呈负峰，190 nm 处呈正峰；测定区间 190–260 nm，用算法拟合 α 螺旋、β 折叠、无规卷曲含量。","note":"波长数字必记；CD 只给二级结构，不给原子分辨率三维结构。","pages":[40]},{"id":"L10-F24","text":"EMSA 原理：蛋白与末端标记核酸探针结合后，复合物在非变性凝胶中泳动速度比游离探针慢，表现为滞后（shift）；再加入特异性抗体形成三元复合物使条带进一步滞后，称 supershift，用于鉴定蛋白身份。","note":"shift 与 supershift 的辨析是高频考点。","pages":[42]},{"id":"L10-F25","text":"EMSA 四步：P32 放射性同位素标记制备 DNA/RNA 探针→与细胞蛋白提取物温育形成复合物→非变性聚丙烯酰胺凝胶电泳→放射自显影显示条带位置。","note":"“非变性凝胶”是关键条件，写成 SDS-PAGE 即错。","pages":[43]},{"id":"L10-F26","text":"ChIP 核心：生理状态下甲醛交联 DNA 与蛋白质→超声波打碎染色质→用目的蛋白特异性抗体沉淀交联复合体→只有与目的蛋白结合的 DNA 片段被沉淀；可检测体内转录因子与 DNA 的动态作用，也可研究组蛋白共价修饰与基因表达的关系。","note":"与 EMSA 的“体外 vs 体内”对比是核心考点。","pages":[45,46]},{"id":"L10-F27","text":"酵母双杂交由 Fields 和 Song 在研究真核基因转录调控时建立，文献为 Fields S, Song O K. Nature, 1989, 340(6230): 245~246。","note":"人名+年份+期刊是经典填空点。","pages":[50]},{"id":"L10-F28","text":"酵母双杂交局限：不能研究具自激活特性的蛋白；只能检测两两互作；互作须发生在细胞核内；约 50% 假阳性率，且推测的互作仅约 3% 能在两种以上实验中得到验证。","note":"数字 50% 与 3% 必记；与 Co-IP 优缺点比较常作简答。","pages":[51]},{"id":"L10-F29","text":"免疫沉淀灵敏度取决于 Protein A（或 G）与 IgG 的 Kd、IgG 与抗原的 Kd；提高灵敏度可增加抗原或抗体浓度，或使用与抗体直接共价偶联的珠子（减少一步平衡限制）。","note":"“两个 Kd”与“共价偶联少一个 Kd”是理解型考点。","pages":[55]},{"id":"L10-F30","text":"Co-IP 必须在非变性条件下裂解细胞以保留细胞内原有的蛋白-蛋白相互作用；其局限包括检测不到低亲和力与瞬时互作、无法区分直接结合与第三者桥接、需预先预测目的蛋白、灵敏度低于亲和色谱、需高亲和力特异性抗体。","note":"五条局限常作简答或多选。","pages":[59,63]},{"id":"L10-F31","text":"FRET 发生三条件：给体与受体距离 1～10 nm；给体发射光谱与受体吸收光谱重叠；给体与受体偶极具有一定空间取向。示例：CFP 受 440 nm 激发发 480 nm 荧光，与 YFP 靠近后发生 FRET，检测到 YFP 发射的 535 nm 荧光。","note":"三个条件与三个波长数字是必背点。","pages":[64]},{"id":"L10-F32","text":"GST pull-down 中 GST 约 26 kDa、His-LDHA 约 34 kDa、GST-hCINAP 约 55 kDa；正反双向 pull-down 均能互相捕获且 GST 单独对照为阴性，说明 hCINAP 与 LDHA 体外直接结合。实验设 GST 对照，反应均在 4℃ 进行。","note":"对照设置与温度是实验设计题得分点。","pages":[68,69]}],"methods":[{"id":"L10-M01","cn":"透析","en":"dialysis","principle":"利用半透膜只允许溶剂和小分子溶质通过、截留蛋白质，以膜内外浓度差为驱动力进行物质交换。","steps":"蛋白溶液装入透析袋并封口→浸入大量缓冲液→小分子盐离子扩散至外液、蛋白被截留→更换缓冲液至平衡；磁力搅拌加速。","applications":"脱盐、更换缓冲液、去除小分子杂质。","limitations":"无外加压力、速度慢；不能浓缩；截留分子量（MWCO）选择不当会丢失目的蛋白或除盐不彻底。","pages":[5,10]},{"id":"L10-M02","cn":"超滤","en":"ultrafiltration","principle":"在压力驱动下使溶剂与小分子穿过滤膜、大分子被截留。","steps":"选择合适截留分子量的滤膜→加压过滤→收集截留液或滤液。","applications":"浓缩、分级、缓冲液置换。","limitations":"易发生膜污染与浓差极化；剪切力可能使蛋白失活。","pages":[4,10]},{"id":"L10-M03","cn":"离子交换层析","en":"ion-exchange chromatography","principle":"蛋白质为两性分子，在给定 pH 下所带电荷种类与数量不同，与带相反电荷的介质（惰性支持物如琼脂糖、葡聚糖连接 CM 或 DEAE 基团）发生可逆静电吸附的强弱不同而分离。","steps":"选介质（pH<pI 用阳离子交换剂；pH>pI 用阴离子交换剂）→平衡→上样→洗涤→改变盐浓度或 pH 梯度洗脱→分管收集。","applications":"按电荷差异纯化蛋白，常作纯化中间步骤。","limitations":"缓冲液 pH 不能等于 pI；高盐样品需先脱盐；分辨率受电荷差异大小限制。","pages":[20,21]},{"id":"L10-M04","cn":"分子筛层析（凝胶过滤）","en":"gel filtration chromatography / size-exclusion chromatography","principle":"多孔凝胶中，大分子不能进入孔内被排阻而先流出，小分子进入孔内路径延长而滞后流出。","steps":"装柱→平衡→上样→用缓冲液洗脱→按洗脱体积分管收集；洗脱体积与分子大小成反比。","applications":"按分子大小分离、测定分子量、脱盐与缓冲液置换。","limitations":"上样体积受限（一般不超过床体积的百分之几）；分辨率有限；介质需亲水、不与蛋白自发结合、化学物理稳定且刚性足以承受高流速。","pages":[22,23]},{"id":"L10-M05","cn":"亲和层析","en":"affinity chromatography","principle":"利用蛋白质与固定化配体之间特异且可逆的结合进行分离，选择性最高。","steps":"配体固定于不溶性基质（如琼脂糖珠）→上样，目标蛋白特异结合、杂质流穿→洗涤去非特异结合→改变 pH/离子强度或加竞争配体洗脱目标蛋白。","applications":"一步高效纯化；免疫亲和层析、生物亲和层析、金属螯合亲和层析（His-tag/Ni²⁺，咪唑洗脱）。","limitations":"配体可能脱落或失活；洗脱条件可能影响蛋白活性；单克隆抗体配体成本高。","pages":[8,24,25]},{"id":"L10-M06","cn":"疏水作用层析","en":"hydrophobic interaction chromatography","principle":"依据蛋白质表面疏水区域与固定相疏水基团间疏水作用力差异分离。","steps":"高盐条件下上样促进疏水结合→降低盐浓度梯度洗脱。","applications":"纯化中度疏水蛋白，常与离子交换、分子筛组合。","limitations":"高盐上样可能使部分蛋白沉淀；分辨率中等。","pages":[17,18]},{"id":"L10-M07","cn":"SDS-聚丙烯酰胺凝胶电泳","en":"SDS-PAGE","principle":"SDS 使蛋白变性并覆盖均匀负电荷，消除电荷差异，迁移距离只取决于分子量。","steps":"样品加 SDS 与还原剂煮沸变性→上样→垂直板电泳（上端负极、下端正极）→染色或转膜；与分子量标准比较估算 Mᵣ。","applications":"测定分子量、纯度鉴定、Western blot 的第一步。","limitations":"变性条件，不能反映天然构象与活性；分子量相近的杂质可能共迁移。","pages":[26,27,28,35]},{"id":"L10-M08","cn":"等电聚焦电泳","en":"isoelectric focusing (IEF)","principle":"两性电解质在凝胶中建立 pH 梯度，蛋白质迁移至净电荷为零的 pH（即 pI）处聚焦成窄带。","steps":"两性电解质掺入凝胶→加电场建立稳定 pH 梯度→加样并重新加电场→聚焦→染色。","applications":"测定 pI、按等电点分离、双向电泳第一向。","limitations":"在 pI 处蛋白溶解度最低易沉淀；不能给出分子量信息。","pages":[29,35]},{"id":"L10-M09","cn":"双向电泳","en":"two-dimensional electrophoresis (2-DE)","principle":"第一向 IEF 按 pI 分离，第二向 SDS-PAGE 按分子量分离，两向正交。","steps":"IEF 管式凝胶聚焦→凝胶条平放于 SDS 聚丙烯酰胺凝胶上→第二向电泳→染色得二维斑点图谱。","applications":"蛋白质组学分离与鉴定，如大肠杆菌图谱可视化超过 2,000 种蛋白。","limitations":"对极碱、极大、极疏水及低丰度蛋白分辨不佳；重复性受操作影响。","pages":[30,31]},{"id":"L10-M10","cn":"蛋白质免疫印迹","en":"Western blotting (immunoblotting)","principle":"蛋白经 SDS-PAGE 分离后转膜，用特异性一抗识别目的抗原，再由带酶或放射性标记的二抗提供可检测信号。","steps":"样品制备→SDS-PAGE→转膜（硝酸纤维素膜）→封闭→一抗孵育洗涤→二抗（HRP 等）孵育洗涤→DAB 显色或放射自显影。","applications":"检测样品中是否存在某抗原、测定相对丰度、评价抗体特异性。","limitations":"需特异性抗体；变性电泳不能反映天然构象；半定量。","pages":[38,39]},{"id":"L10-M11","cn":"免疫沉淀-质谱","en":"immunoprecipitation coupled with mass spectrometry (IP-MS)","principle":"抗体特异富集目标蛋白及其复合物，经凝胶分离与胰蛋白酶胶内酶解后用质谱鉴定共沉淀组分。","steps":"收集并裂解细胞/组织→与偶联特异性抗体的珠子孵育→洗涤去非结合蛋白→洗脱复合物→SDS-PAGE→切胶、胰蛋白酶酶解→MS/MS 鉴定。","applications":"筛选与特定蛋白结合的新伙伴（如 Flag-USP38 拉下 HDAC1 等候选）。","limitations":"只给候选名单需另行验证；需特异性抗体；可能共沉淀非特异蛋白。","pages":[54,57]},{"id":"L10-M12","cn":"免疫共沉淀","en":"co-immunoprecipitation (Co-IP)","principle":"非变性条件下裂解细胞保留体内蛋白互作，用蛋白 X 的抗体沉淀 X，与 X 结合的蛋白 Y 被共沉淀。","steps":"非变性裂解→抗体（或抗体-固相基质）免疫沉淀→低离心力沉淀或微膜过滤收集复合物→SDS-PAGE 与 Western blot 检测 Y；设 WCL（input）对照。","applications":"验证细胞内生理性相互作用、寻找已知蛋白的新伙伴。","limitations":"检测不到低亲和力与瞬时互作；不能区分直接与桥接结合；需预测目的蛋白与高质量抗体；灵敏度低于亲和色谱。","pages":[59,60,62,63]},{"id":"L10-M13","cn":"凝胶阻滞实验","en":"electrophoretic mobility shift assay (EMSA) / gel retardation assay","principle":"蛋白与标记核酸探针结合后复合物在非变性凝胶中迁移率下降（shift）；加特异性抗体形成三元复合物进一步滞后（supershift）。","steps":"P32 标记探针→与蛋白提取物温育→非变性聚丙烯酰胺凝胶电泳→放射自显影。","applications":"体外检测 DNA/RNA 结合蛋白、研究结合序列特异性、鉴定未知蛋白（supershift）。","limitations":"体外体系，脱离染色质环境；需放射性操作；不能反映体内瞬时动态结合。","pages":[42,43,44]},{"id":"L10-M14","cn":"染色质免疫沉淀","en":"chromatin immunoprecipitation (ChIP)","principle":"生理状态下甲醛交联蛋白与 DNA，打碎染色质后用目的蛋白特异性抗体沉淀交联复合体，仅与目的蛋白结合的 DNA 片段被沉淀。","steps":"细胞甲醛固定→超声波断裂染色质→氯化铯等密度离心纯化交联染色质→免疫沉淀及复合体纯化→逆转交联并纯化 DNA→PCR/测序分析结合位点→进一步验证。","applications":"检测体内转录因子与 DNA 的动态作用（定性/定量）、研究组蛋白共价修饰与基因表达关系。","limitations":"需高质量特异性抗体；交联效率与超声片段大小影响结果；需 input 与阴性对照排除非特异。","pages":[45,46]},{"id":"L10-M15","cn":"酵母双杂交","en":"yeast two-hybrid system (Y2H)","principle":"转录因子的 DNA 结合结构域（BD）与转录激活结构域（AD）分离后，若分别融合的诱饵 X 与猎物 Y 相互作用，则 BD 与 AD 空间靠近重组装为完整转录因子，激活报告基因。","steps":"构建 BD-X（诱饵）与 AD-Y（猎物）重组基因→共转入酵母→表达→检测报告基因产物。","applications":"文库筛选未知互作蛋白、大规模 PPI 研究（可结合 Gateway 克隆）。","limitations":"不能研究自激活蛋白；只能检测两两互作；互作须在核内；约 50% 假阳性，仅约 3% 获两种以上实验验证。","pages":[50,51,52]},{"id":"L10-M16","cn":"GST pull-down","en":"GST pull-down (in vitro binding assay)","principle":"细菌表达的 GST 融合诱饵蛋白结合于谷胱甘肽琼脂糖珠，从溶液中捕获特异搭档蛋白并一起沉淀。","steps":"构建并表达 GST 融合诱饵→结合谷胱甘肽珠→与含候选蛋白溶液孵育→洗涤去非特异→洗脱→SDS-PAGE/Western blot 或 MALDI-TOF 质谱；设 GST 单独对照，4℃ 操作。","applications":"确定体外直接相互作用、发现新搭档、抗体干扰互作时的替代方案。","limitations":"需纯化大量蛋白；不适用于需第三者介导或翻译后修饰介导的互作；仅反映体外结合。","pages":[67,68,69]},{"id":"L10-M17","cn":"荧光共振能量转移","en":"fluorescence resonance energy transfer (FRET)","principle":"给体与受体距离 1～10 nm、给体发射光谱与受体吸收光谱重叠且偶极取向合适时，发生非辐射能量转移。","steps":"构建 CFP/YFP 融合蛋白→共表达于细胞→440 nm 激发→检测 480 nm（给体）与 535 nm（受体）发射。","applications":"活细胞内实时检测蛋白互作、检测蛋白激酶活性（定时定量定位）、膜蛋白横向扩散与受体互作研究。","limitations":"需融合荧光蛋白；对距离与取向要求严格；可能干扰蛋白功能。","pages":[64,65]},{"id":"L10-M18","cn":"圆二色谱","en":"circular dichroism (CD) spectroscopy","principle":"手性分子对左、右旋圆偏振光吸收不同；不同二级结构在 190–260 nm 有特征谱形，可拟合各结构含量。","steps":"溶液状态测定 190–260 nm CD 谱→用最小二乘法等算法拟合 α 螺旋、β 折叠、无规卷曲比例。","applications":"二级结构分析、构象变化与热变性监测。","limitations":"不能给出原子分辨率三维结构；对缓冲液与浓度有要求。","pages":[40]}],"exam_points":[{"id":"L10-X01","point":"分离纯化方法按理化性质的分类","detail":"常考表格匹配：分子大小—透析/超滤/凝胶过滤/离心；分子形状—梯度离心；带电特性—离子交换层析/电泳；溶解特性—盐析/沉淀；配体特异结合—亲和层析。作答时须点明“依据目标蛋白与杂质在某性质上的差异”。"},{"id":"L10-X02","point":"透析与超滤的比较","detail":"简答或选择：透析以浓度差为驱动力、主要脱盐；超滤以压力为驱动力、可浓缩与分级。两者同属膜分离。"},{"id":"L10-X03","point":"离子交换介质的选择与命名","detail":"给出蛋白 pI 与缓冲液 pH，判断应选阳离子还是阴离子交换剂。要点：pH<pI 蛋白带正电→选带负电的阳离子交换剂（CM）；pH>pI 蛋白带负电→选带正电的阴离子交换剂（DEAE）；pH=pI 不可用。命名以被交换的蛋白离子为准。"},{"id":"L10-X04","point":"分子筛层析的洗脱规律","detail":"读图或排序题：分子越大洗脱体积越小、越接近床体积、越先流出；分子越小越后流出。需能解释“排阻”与“进入孔道滞留”两种命运。"},{"id":"L10-X05","point":"SDS-PAGE 与 Western blotting 的原理与区别","detail":"简答：SDS 消除电荷差异、按分子量分离；Western blotting 在分离后转膜、用特异抗体识别目标抗原，具有特异性，可测相对丰度。注意一抗不标记、二抗带信号。"},{"id":"L10-X06","point":"双向电泳的正交原理与应用","detail":"第一向 IEF 按 pI、第二向 SDS-PAGE 按分子量；用于蛋白质组学。常问“为什么两向能提高分辨率”。"},{"id":"L10-X07","point":"纯化策略与得率计算","detail":"计算题：总得率=（每步得率）^n；据此论证应减少步骤。另需结合纯度三档（>99%、95–99%、<95%）与用途匹配作答。"},{"id":"L10-X08","point":"蛋白质含量测定方法","detail":"凯氏定氮（含氮 16%）、紫外吸收法（A280/A260 及经验公式 1.45A280−0.74A260）、显色法（考马斯亮蓝，需标准曲线）。常考三法原理与优缺点比较。"},{"id":"L10-X09","point":"纯度鉴定的三种判据与相互验证原则","detail":"色谱纯、电泳纯、结晶纯；强调单一方法均一不等于绝对均一，需多方法互证。"},{"id":"L10-X10","point":"EMSA 原理、步骤与 supershift","detail":"简答：非变性凝胶、探针标记、迁移滞后；supershift 用于鉴定蛋白身份。易错：写成变性凝胶或 SDS-PAGE。"},{"id":"L10-X11","point":"体外方法与体内方法的局限对比（EMSA/足迹 vs ChIP）","detail":"分析题：体外方法脱离染色质结构，无法反映组蛋白遮蔽与瞬时动态结合，故需 ChIP 等体内方法。"},{"id":"L10-X12","point":"酵母双杂交原理、优缺点与改进","detail":"简答：BD-X 与 AD-Y 重组装激活报告基因；优点为接近体内、可检测瞬时弱互作、与内源表达无关；局限为自激活、仅两两、须核内、高假阳性（约 50%，仅约 3% 被验证）。改进：多诱饵两轮杂交、pull-down/Co-IP 验证、生物信息学分析。"},{"id":"L10-X13","point":"Co-IP 原理、流程与局限","detail":"简答：非变性裂解保留互作，抗体沉淀 X 时 Y 共沉淀；WCL/input 对照排除表达量差异。局限五条（低亲和/瞬时检不出、不能区分直接与桥接、需预测目的蛋白、灵敏度低于亲和色谱、需好抗体）。"},{"id":"L10-X14","point":"FRET 三条件与活细胞应用","detail":"简答/选择：距离 1～10 nm、光谱重叠、偶极取向；CFP/YFP 体系 440/480/535 nm。优于共定位之处在于报告纳米级距离而非同一区域。"},{"id":"L10-X15","point":"GST pull-down 原理、对照与适用边界","detail":"实验设计题：GST 融合诱饵结合谷胱甘肽珠捕获搭档；必设 GST 单独对照、4℃ 操作；只证明体外结合，不适用于需第三者或修饰介导的互作。"}],"exercises":[{"id":"L10-E01","type":"单选题","stem":"某蛋白的等电点 pI 为 6.0，若在 pH 8.0 的缓冲液中进行离子交换层析，应选用下列哪种介质？","options":["A. 带负电的羧甲基（CM）阳离子交换剂","B. 带正电的二乙基氨基乙基（DEAE）阴离子交换剂","C. 多孔葡聚糖凝胶（分子筛介质）","D. 固定化 Ni²⁺ 的金属螯合介质"],"answer":"B. 带正电的二乙基氨基乙基（DEAE）阴离子交换剂","analysis":"pH 8.0 > pI 6.0，蛋白带净负电荷，应选带正电的阴离子交换剂结合。A 用于 pH<pI 的情形；C、D 分别按大小与亲和性分离，不依据电荷。","pages":[21]},{"id":"L10-E02","type":"单选题","stem":"关于 SDS-PAGE，下列说法正确的是：","options":["A. 分离主要取决于蛋白质原有的净电荷","B. SDS 使不同蛋白的 SDS 复合物短轴长度相同、长轴长度与分子量成正比","C. 电泳时加样孔一端接正极","D. 可在非变性条件下保留蛋白天然活性"],"answer":"B. SDS 使不同蛋白的 SDS 复合物短轴长度相同、长轴长度与分子量成正比","analysis":"SDS 覆盖的负电荷远超蛋白原有电荷，消除电荷差异（故 A 错）；上端为负极、蛋白向下（正极）迁移（C 错）；SDS-PAGE 为变性电泳（D 错）。","pages":[26,28]},{"id":"L10-E03","type":"单选题","stem":"在凝胶过滤层析中，三种蛋白（250,000 Da、125,000 Da、75,000 Da）的洗脱顺序是：","options":["A. 75,000→125,000→250,000","B. 250,000→125,000→75,000","C. 125,000→250,000→75,000","D. 三者同时洗出"],"answer":"B. 250,000→125,000→75,000","analysis":"大分子被排阻不能进入孔内，在床体积处最先洗脱；小分子进入孔道路径最长、最后流出。洗脱体积与分子大小成反比。","pages":[23]},{"id":"L10-E04","type":"单选题","stem":"Western blotting 中二抗的作用是：","options":["A. 直接识别并结合目的抗原","B. 识别一抗并提供酶或放射性标记信号","C. 封闭膜上的未反应位点","D. 将蛋白从凝胶转移到膜上"],"answer":"B. 识别一抗并提供酶或放射性标记信号","analysis":"一抗非标记、特异识别目的蛋白；二抗识别一抗并携带 HRP 或同位素，实现信号放大与检测。封闭由封闭剂完成，转膜由电转移完成。","pages":[39]},{"id":"L10-E05","type":"单选题","stem":"酵母双杂交系统由谁首先建立？","options":["A. Southern 与 Northern","B. Fields 与 Song（1989 年发表于 Nature）","C. Anfinsen","D. Edman"],"answer":"B. Fields 与 Song（1989 年发表于 Nature）","analysis":"Fields S, Song O K. Nature, 1989, 340(6230): 245~246。Anfinsen 提出折叠信息原理，Edman 为 N 端测序方法。","pages":[50]},{"id":"L10-E06","type":"多选题","stem":"下列属于蛋白质粗分级常用手段的有：","options":["A. 硫酸铵分级沉淀","B. 有机溶剂分级沉淀","C. 等电点沉淀","D. 透析与超滤","E. 双向电泳"],"answer":"A、B、C、D","analysis":"粗分级以浓缩和去除大量杂质为目的，手段简单；双向电泳属细分级（层析与电泳）。","pages":[15,16]},{"id":"L10-E07","type":"多选题","stem":"关于 FRET，下列条件正确的有：","options":["A. 给体与受体距离在 1～10 nm","B. 给体发射光谱与受体吸收光谱有重叠","C. 给体与受体偶极具有一定空间取向","D. 给体与受体必须共价连接在同一条肽链上","E. 给体发射光谱与受体发射光谱必须完全重叠"],"answer":"A、B、C","analysis":"FRET 三条件为距离、光谱重叠（给体发射与受体吸收）、偶极取向。给体与受体可分别融合在两个蛋白上，无需共价连接；与受体发射光谱应尽量不重叠。","pages":[64]},{"id":"L10-E08","type":"多选题","stem":"免疫共沉淀（Co-IP）的局限包括：","options":["A. 可能检测不到低亲和力和瞬间的相互作用","B. 无法区分直接结合与第三者桥接的间接结合","C. 必须在实验前预测目的蛋白以选择检测抗体","D. 灵敏度没有亲和色谱高","E. 必须获得高亲和力、特异性好的抗体"],"answer":"A、B、C、D、E","analysis":"五条均为课件列出的 Co-IP 局限；其中 B 需用体外 pull-down 等手段进一步判断直接性。","pages":[63]},{"id":"L10-E09","type":"填空题","stem":"紫外吸收法测定蛋白质含量的经验公式为：蛋白质含量(mg/mL) = ______ × A280nm − ______ × A260nm；其依据是芳香族氨基酸在 ______ nm、核酸在 ______ nm 附近有最大光吸收。","options":[],"answer":"1.45；0.74；280；260","analysis":"双波长校正用于扣除核酸对 A280 的贡献；该法快速无损但受芳香族氨基酸组成影响。","pages":[36]},{"id":"L10-E10","type":"填空题","stem":"EMSA 中，蛋白与核酸探针结合导致条带滞后称为 ______；再加入特异性抗体形成三元复合物使条带进一步滞后称为 ______，可用于鉴定未知蛋白。","options":[],"answer":"shift（迁移率变动）；supershift（超迁移）","analysis":"两者区别在于是否加入特异性抗体；EMSA 必须使用非变性凝胶电泳。","pages":[42]},{"id":"L10-E11","type":"判断题","stem":"纯化蛋白质时，缓冲液的 pH 应尽量调节到与目标蛋白等电点相同，以保持蛋白稳定。","options":["A. 正确","B. 错误"],"answer":"B. 错误","analysis":"在 pI 处蛋白净电荷为零、溶解度最低、易沉淀，故缓冲液 pH 应避开 pI；只有等电聚焦（IEF）才利用 pI 处净电荷为零使蛋白聚焦成带。","pages":[29,34]},{"id":"L10-E12","type":"判断题","stem":"酵母双杂交中，若诱饵蛋白自身具有转录激活能力，无需与猎物相互作用即可激活报告基因，产生假阳性。","options":["A. 正确","B. 错误"],"answer":"A. 正确","analysis":"此即“自激活”，是 Y2H 的典型局限之一，故不能研究具自激活特性的蛋白。","pages":[51]},{"id":"L10-E13","type":"名词解释","stem":"等电点（isoelectric point, pI）","options":[],"answer":"使蛋白质（或氨基酸）净电荷为零时的溶液 pH 值。此时蛋白质在电场中不再迁移，溶解度最低；离子交换层析中 pH=pI 不宜使用，而等电聚焦恰利用该性质使蛋白聚焦成窄带。","analysis":"需同时答出“净电荷为零”“对应 pH”“电场不迁移”三要素，并联系两项技术应用。","pages":[21,29,34]},{"id":"L10-E14","type":"名词解释","stem":"染色质免疫沉淀（ChIP）","options":[],"answer":"在生理状态下用甲醛将细胞内 DNA 与蛋白质交联，超声打碎染色质后，用目的蛋白特异性抗体沉淀交联复合体，只有与目的蛋白结合的 DNA 片段被沉淀下来，再解交联、纯化 DNA 并鉴定结合位点。可检测体内转录因子与 DNA 的动态作用，也可研究组蛋白共价修饰与基因表达的关系。","analysis":"关键词：体内、甲醛交联、超声打断、特异抗体沉淀、解交联后鉴定。","pages":[45,46]},{"id":"L10-E15","type":"简答题","stem":"简述蛋白质分离纯化的一般流程，并说明粗分级与细分级的目的与常用手段。","options":[],"answer":"流程：生物组织（或重组表达细胞裂解液）→无细胞提取液→粗产品→细分级纯化，分三阶段。①前处理：材料选择与处理、细胞破碎（机械剪碎、研磨、反复冻融、超声、高压匀浆、酶解）；②粗分级：目的是浓缩目标蛋白并去除大量杂质，手段有硫酸铵分级沉淀、有机溶剂分级沉淀、超速离心、等电点沉淀、透析、超滤；③细分级：依据分子大小、形状、表面特征或带电状况精细分离，主要靠层析（离子交换、分子筛、疏水作用、亲和）与电泳。全过程 0–4℃、加蛋白酶抑制剂。","analysis":"按“三阶段+目的+手段”结构作答；漏写温度与抑制剂会失分。","pages":[11,12,15,16]},{"id":"L10-E16","type":"简答题","stem":"比较酵母双杂交技术与免疫共沉淀技术在研究蛋白质相互作用方面的优缺点。","options":[],"answer":"酵母双杂交：优点为接近体内环境、可检测瞬时与不稳定互作、与内源蛋白表达无关、可结合 Gateway 克隆用于大规模文库筛选；缺点为不能研究自激活蛋白、只能检测两两互作、互作须发生在细胞核内、约 50% 假阳性且仅约 3% 能在两种以上实验中验证。免疫共沉淀：优点为反映完整细胞内生理性互作、可信度高（特异性高、假阳性少）、适用于多蛋白复合物；缺点为检测不到低亲和力与瞬时互作、不能区分直接结合与第三者桥接、需预先预测目的蛋白、灵敏度低于亲和色谱、需高亲和力特异性抗体。二者均需用 pull-down 等体外实验进一步验证直接性。","analysis":"按“技术—优点—缺点”逐项对照，数字（50%、3%）与“核内定位”是得分点。","pages":[51,59,63]},{"id":"L10-E17","type":"简答题","stem":"说明凝胶阻滞实验（EMSA）的原理、主要步骤与应用。","options":[],"answer":"原理：蛋白与末端标记的核酸探针结合后，复合物在非变性凝胶中泳动速度比游离探针慢，表现为滞后（shift）；加特异性抗体形成三元复合物进一步滞后（supershift）。步骤：P32 标记制备 DNA/RNA 探针→与细胞蛋白提取物温育形成复合物→非变性聚丙烯酰胺凝胶电泳→放射自显影显示条带。应用：检测 DNA 结合蛋白与 RNA 结合蛋白、研究结合所依赖的精确序列特异性、鉴定未知蛋白。","analysis":"必须强调“非变性凝胶”与“体外”；与 ChIP 的体内属性形成对比。","pages":[42,43]},{"id":"L10-E18","type":"计算题","stem":"某蛋白纯化方案共 6 步，若每步得率均为 85%，问总得率约为多少？若将步骤压缩为 4 步、每步得率不变，总得率提高多少？由此可得什么结论？","options":[],"answer":"总得率 =（每步得率）^n。6 步：0.85^6 ≈ 0.377，即约 37.7%；4 步：0.85^4 ≈ 0.522，即约 52.2%。提高约 14.5 个百分点。结论：总得率随步骤数呈指数衰减，应尽量减少纯化步骤并合理组合步骤，以降低得率损失、缩短时间。","analysis":"套用公式并说明指数衰减规律；注意百分数换算与有效数字。","pages":[32]},{"id":"L10-E19","type":"实验设计题","stem":"已知蛋白 A 与蛋白 B 在细胞内可能存在相互作用。请设计实验方案：(1) 验证二者在细胞内是否存在相互作用；(2) 判断该相互作用是否为直接结合。要求写明关键步骤、对照设置与结果判读。","options":[],"answer":"(1) 细胞内验证用 Co-IP：非变性条件裂解细胞（加蛋白酶抑制剂、全程低温）→用抗 A 抗体免疫沉淀→SDS-PAGE→以抗 B 抗体做 Western blot 检测是否共沉淀；设无关 IgG 对照与 WCL（input）对照，input 证明两蛋白均表达且量一致，无关 IgG 排除非特异沉淀。若 A 沉淀物中检出 B 而对照无，则细胞内存在相互作用。也可用 FRET（CFP/YFP 融合，440 nm 激发检测 535 nm 信号）在活细胞内实时验证。(2) 直接性判断用体外 GST pull-down：表达纯化 GST-A 与 His-B，GST-A 结合谷胱甘肽珠后与 His-B 孵育、洗涤、洗脱，Western blot 检测 His-B；设 GST 单独 + His-B 对照，4℃ 操作；并做正反双向（His-B 沉降检测 GST-A）。双向均能互相捕获且 GST 对照阴性，说明为直接结合；若仅 Co-IP 阳性而 pull-down 阴性，提示可能由第三者桥接或依赖翻译后修饰。","analysis":"评分点：非变性裂解、对照（IgG、input、GST 单独）、双向验证、4℃、结论边界（Co-IP 不能证明直接性）。","pages":[59,62,63,64,67,68,69]},{"id":"L10-E20","type":"分析题","stem":"某研究者用 EMSA 证明转录因子 T 与启动子片段 P 在体外结合，但 ChIP 实验在活细胞中未检测到 T 在 P 上的富集。请分析可能原因。","options":[],"answer":"①体外 EMSA 脱离染色质环境，活细胞中 P 可能被核小体/组蛋白遮蔽或处于关闭染色质状态，T 无法接近；②染色质结构动态变化，T 与 DNA 的结合可能是瞬时事件，交联捕获效率低；③活细胞中可能存在竞争性结合蛋白或辅因子缺失；④ChIP 技术因素：甲醛交联效率不足、超声片段不适宜、抗体不能识别交联状态的 T、PCR 引物设计未覆盖真实结合位点、缺乏 input 与阴性对照导致判读错误。故体外结合不等于体内结合，需结合 ChIP、体内足迹等方法判断生理状态下的占据。","analysis":"从“染色质环境—动态性—技术因素”三层作答；体现体外与体内方法的互补与局限。","pages":[44,45,46]}]}],"comprehensive_exercises":[{"id":"Z01","type":"单选题","stem":"关于DNA复制与转录的异同，下列叙述正确的是：","options":["两者均需要引物，且新链合成方向均为5'→3'","复制需要引物，转录不需要引物；两者均使用DNA模板，但转录只以一条链为模板","复制和转录的产物均与模板链互补，且均需RNA聚合酶参与","复制和转录的错误率相同，均具有3'→5'外切酶校读功能"],"answer":"B","analysis":"复制需要RNA引物，转录不需要引物（从头合成）；转录只以一条链为模板，复制以两条链为模板。A错在转录不需引物；C错在复制由DNA聚合酶催化；D错在转录错误率较高且RNA聚合酶无校读功能。涉及第3讲与第4讲。","chapters":["第3讲","第4讲"]},{"id":"Z02","type":"单选题","stem":"真核mRNA的5'帽子结构在翻译起始中的作用，与下列哪一原核翻译起始元件在功能上最相似？","options":["SD序列","起始密码子AUG","P位点","释放因子"],"answer":"A","analysis":"5'帽子通过帽子结合复合物（eIF4F）被核糖体识别，引导起始；原核SD序列通过碱基配对与30S亚基16S rRNA结合，定位起始密码子。两者均作为核糖体招募/定位元件。B是起始密码子本身；C是核糖体位点；D参与终止。涉及第5讲与第7讲。","chapters":["第5讲","第7讲"]},{"id":"Z03","type":"单选题","stem":"下列哪种RNA聚合酶负责转录真核生物mRNA的前体，并且其最大亚基的CTD在转录延伸时发生磷酸化？","options":["RNA聚合酶I","RNA聚合酶II","RNA聚合酶III","线粒体RNA聚合酶"],"answer":"B","analysis":"RNA聚合酶II转录mRNA前体，其CTD磷酸化募集加帽、加尾和剪接因子。RNA聚合酶I转录rRNA前体；RNA聚合酶III转录tRNA等小RNA；线粒体RNA聚合酶转录线粒体基因。涉及第4讲与第5讲。","chapters":["第4讲","第5讲"]},{"id":"Z04","type":"单选题","stem":"关于蛋白质的共翻译转运，下列叙述错误的是：","options":["信号肽位于新生肽链的N端，引导核糖体到内质网膜","SRP与信号肽结合后，翻译暂停，直至SRP与SRP受体结合","易位子（translocon）在翻译过程中将肽链穿入内质网腔","信号肽酶在肽链完全合成后切除信号肽，该过程属于翻译后修饰"],"answer":"D","analysis":"信号肽酶在肽链进入内质网腔的过程中切除信号肽，属于共翻译修饰，而非翻译后。A、B、C均为共翻译转运的正确描述。涉及第7讲与第8讲。","chapters":["第7讲","第8讲"]},{"id":"Z05","type":"单选题","stem":"在分子生物学研究中，要检测某转录因子是否在活细胞中与特定基因启动子结合，最合适的技术是：","options":["EMSA","DNase I足迹分析","ChIP","Western blot"],"answer":"C","analysis":"ChIP可在活细胞中交联固定蛋白质-DNA复合物，免疫沉淀后检测特定DNA序列，反映体内结合。EMSA和DNase I足迹为体外实验；Western blot检测蛋白质本身。涉及第9讲与第10讲。","chapters":["第9讲","第10讲"]},{"id":"Z06","type":"单选题","stem":"关于原核与真核基因组的结构特点，下列叙述正确的是：","options":["原核基因组多为单顺反子，真核基因组多为多顺反子","真核基因组含有大量重复序列和断裂基因，原核基因组基因密度高且少有内含子","原核基因组具有核小体结构，真核基因组没有","真核基因组中基因与基因之间没有间隔序列"],"answer":"B","analysis":"真核基因组有重复序列、断裂基因、基因间间隔；原核基因组基因密度高、多顺反子、少内含子。A反了；C反了；D错误。涉及第2讲与第5讲。","chapters":["第2讲","第5讲"]},{"id":"Z07","type":"单选题","stem":"下列哪一过程直接依赖于RNA聚合酶II的CTD磷酸化？","options":["DNA复制起始","mRNA的5'加帽","核糖体组装","蛋白质泛素化"],"answer":"B","analysis":"RNA聚合酶II CTD磷酸化募集加帽酶、加尾因子和剪接因子，直接促进5'加帽。DNA复制、核糖体组装和泛素化不依赖CTD。涉及第4讲与第5讲。","chapters":["第4讲","第5讲"]},{"id":"Z08","type":"单选题","stem":"关于遗传密码的摆动假说，下列叙述正确的是：","options":["反密码子第一碱基与密码子第三碱基配对时存在摆动","反密码子第三碱基与密码子第一碱基配对时存在摆动","摆动配对增加了密码子的简并性，使一种tRNA可识别多种密码子","摆动配对仅发生在起始密码子AUG"],"answer":"C","analysis":"摆动假说指反密码子5'端碱基（第一碱基）与密码子3'端碱基（第三碱基）配对灵活性，使一种tRNA识别多种同义密码子，增加简并性。A描述位置正确但未点明功能；B位置错误；D错误。涉及第6讲与第7讲。","chapters":["第6讲","第7讲"]},{"id":"Z09","type":"多选题","stem":"下列哪些机制参与保证遗传信息传递的保真性？（多选）","options":["DNA聚合酶的3'→5'外切酶校读功能","错配修复（MMR）","氨酰-tRNA合成酶的校对功能","核糖体对密码子-反密码子配对的校对"],"answer":"A,B,C,D","analysis":"DNA复制保真性依赖碱基选择、校读和MMR；翻译保真性依赖氨酰-tRNA合成酶校对和核糖体对配对的校对。涉及第3讲、第6讲、第7讲。","chapters":["第3讲","第6讲","第7讲"]},{"id":"Z10","type":"多选题","stem":"关于真核mRNA加工与翻译的时空关系，下列叙述正确的有：（多选）","options":["加帽、加尾和剪接在细胞核内完成","成熟mRNA通过核孔进入细胞质翻译","原核生物转录和翻译可偶联进行","真核mRNA的剪接与转录同步进行，由RNA聚合酶II CTD协调"],"answer":"A,B,C,D","analysis":"真核mRNA加工在核内，与转录偶联（CTD协调），成熟后出核翻译；原核无核膜，转录翻译偶联。涉及第4讲、第5讲、第7讲。","chapters":["第4讲","第5讲","第7讲"]},{"id":"Z11","type":"简答题","stem":"简述中心法则中“DNA→RNA→蛋白质”信息流在真核细胞中的区室化分布及其生物学意义。","options":[],"answer":"真核细胞中，DNA复制和转录在细胞核内进行，mRNA前体在核内加工为成熟mRNA，然后通过核孔进入细胞质，由核糖体翻译为蛋白质。这种区室化使转录与翻译在时间和空间上分离，有利于转录后加工（加帽、加尾、剪接）和基因表达的多级调控，也避免了转录与翻译机器相互干扰。原核细胞无核膜，转录与翻译偶联。","analysis":"考查第4讲（转录）、第5讲（加工）、第7讲（翻译）及第1讲中心法则。易错点：忽略加工步骤或认为真核转录翻译偶联。","chapters":["第1讲","第4讲","第5讲","第7讲"]},{"id":"Z12","type":"简答题","stem":"从分子结构角度解释：为什么DNA适合作为遗传信息的长期储存者，而RNA更适合作为信息传递和功能执行者？","options":[],"answer":"DNA：双螺旋结构，碱基内藏，氢键配对，两条链互补，复制精确；脱氧核糖2'-H使DNA化学性质稳定，不易水解；可高度压缩为染色质。RNA：核糖2'-OH使其化学性质较活泼，易降解，适合短期存在；单链可折叠成复杂二级/三级结构，具有催化功能（核酶）；可被快速合成和降解，便于调控。","analysis":"涉及第2讲DNA结构、第4讲RNA结构、第5讲核酶。易错点：只答“DNA双链RNA单链”，未从化学稳定性与功能角度展开。","chapters":["第2讲","第4讲","第5讲"]},{"id":"Z13","type":"简答题","stem":"比较原核与真核翻译起始过程中核糖体小亚基定位起始密码子的机制差异。","options":[],"answer":"原核：30S小亚基通过16S rRNA与mRNA的SD序列（富含嘌呤，位于起始密码子上游）碱基配对，直接定位起始密码子AUG，起始tRNA为fMet-tRNAfMet。真核：40S小亚基与Met-tRNAiMet及起始因子形成43S前起始复合体，通过eIF4F识别mRNA 5'帽子，沿mRNA扫描至第一个AUG（Kozak序列上下文最佳），起始tRNA为Met-tRNAiMet。","analysis":"涉及第6讲（密码子、SD序列）与第7讲（起始机制）。易错点：混淆起始tRNA类型或忽略扫描机制。","chapters":["第6讲","第7讲"]},{"id":"Z14","type":"简答题","stem":"简述泛素-蛋白酶体途径降解蛋白质的基本步骤，并说明该途径与转录调控的关联（举一例）。","options":[],"answer":"步骤：①泛素激活酶E1消耗ATP激活泛素；②泛素结合酶E2承接泛素；③泛素连接酶E3识别底物并催化泛素转移至底物赖氨酸；④多泛素链标记的底物被26S蛋白酶体识别并降解，泛素被去泛素化酶回收。关联：p53转录因子由Mdm2（E3）泛素化后经蛋白酶体降解，控制p53的稳定性与转录活性。","analysis":"涉及第8讲（泛素-蛋白酶体）与第4/5讲（转录调控）。易错点：遗漏E1-E2-E3级联或不能举例。","chapters":["第8讲","第4讲","第5讲"]},{"id":"Z15","type":"简答题","stem":"在分子生物学实验中，为什么常用模式生物？请列举至少三种模式生物并说明其在研究中心法则信息流中的典型贡献。","options":[],"answer":"模式生物具有代表性强、易于培养、世代短、遗传操作方便等优点。例：大肠杆菌——证明半保留复制、破译遗传密码、发现操纵子；酿酒酵母——研究真核细胞周期、基因敲除；果蝇——染色体遗传理论、发育基因调控；小鼠——基因敲除与疾病模型。","analysis":"涉及第9讲（模式生物）与第1讲（历史）、第3讲（复制）、第6讲（密码）。易错点：只列名称不说明贡献。","chapters":["第1讲","第3讲","第6讲","第9讲"]},{"id":"Z16","type":"分析/实验设计","stem":"某研究者发现一种新蛋白X，推测其可能作为转录因子调控基因Y的表达。请设计实验方案，从亚细胞定位、DNA结合和功能验证三个层次证明该假设，并说明所用技术原理。","options":[],"answer":"①亚细胞定位：构建GFP-X融合表达载体，转染细胞，荧光显微镜观察X是否定位于细胞核。②DNA结合：用ChIP实验，交联后超声打断染色质，用抗X抗体免疫沉淀，PCR检测Y基因启动子是否富集；或用EMSA体外验证X蛋白与Y启动子DNA探针结合。③功能验证：过表达/敲低X，用RT-qPCR和Western blot检测Y的mRNA和蛋白水平；若Y表达随X变化，则支持调控。","analysis":"涉及第9讲（转染、PCR、RNAi）、第10讲（ChIP、EMSA、Western）、第4/5讲（转录调控）。易错点：混淆体外与体内实验，缺少功能验证。","chapters":["第9讲","第10讲","第4讲","第5讲"]},{"id":"Z17","type":"分析/实验设计","stem":"已知某真核基因的mRNA前体含有内含子，请设计实验证明该内含子的剪接依赖于剪接体，并确定剪接位点。","options":[],"answer":"①构建含该基因（含内含子）及报告基因的质粒，转染细胞，提取RNA进行RT-PCR，比较野生型与突变剪接位点（GU-AG突变）的产物差异。②体外剪接：制备核提取物，加入32P标记的mRNA前体，保温后电泳检测剪接产物；加入抗snRNP抗体或去除snRNP，剪接受抑制，证明剪接体依赖。③确定位点：对RT-PCR产物测序，比对基因组序列确定外显子-外显子连接。","analysis":"涉及第5讲（剪接体、GU-AG）、第9讲（RT-PCR、突变）、第10讲（免疫去除）。易错点：忽略体外剪接实验或未设突变对照。","chapters":["第5讲","第9讲","第10讲"]},{"id":"Z18","type":"分析/实验设计","stem":"为研究某蛋白质的N端信号肽是否决定其进入内质网，请设计实验方案并预测结果。","options":[],"answer":"①构建融合基因：将候选信号肽编码序列与报告蛋白（如GFP）融合，转染细胞，用共聚焦显微镜观察GFP是否与内质网标记物共定位；同时用Western blot检测GFP是否发生信号肽切除（分子量变化）。②体外翻译：在体外翻译系统中加入微粒体膜，比较有无信号肽时产物是否进入膜内并被糖基化（若报告蛋白含糖基化位点）。③突变信号肽关键残基，重复实验，若转运受阻则证明信号肽必要性。","analysis":"涉及第8讲（信号肽、共翻译转运）、第9讲（转染、Western）、第10讲（亚细胞定位）。易错点：未设突变对照或混淆共翻译与翻译后转运。","chapters":["第8讲","第9讲","第10讲"]},{"id":"Z19","type":"分析/实验设计","stem":"某研究者用CRISPR/Cas9敲除某基因后，发现目标蛋白表达量下降但mRNA水平不变。请设计实验探究其可能机制（从翻译调控和蛋白质降解两个层面）。","options":[],"answer":"①翻译调控：用多聚核糖体图谱分析（polysome profiling）比较敲除前后目标mRNA在核糖体上的分布，判断翻译效率是否改变；用嘌呤霉素掺入实验检测新蛋白合成速率。②蛋白质降解：用蛋白酶体抑制剂（如MG132）处理细胞，检测目标蛋白是否积累；用泛素化实验（IP+抗泛素抗体）检测目标蛋白泛素化水平；用CHX追踪实验测定蛋白半衰期。","analysis":"涉及第7讲（翻译）、第8讲（降解）、第10讲（蛋白检测）。易错点：只测mRNA或只测蛋白，未区分合成与降解。","chapters":["第7讲","第8讲","第10讲"]},{"id":"Z20","type":"计算题","stem":"某双链DNA片段长1000 bp，其中A占30%。计算该片段中G的数量和Tm值（粗略估算，设Tm=2(A+T)+4(G+C)）。","options":[],"answer":"A=30%，T=30%，A+T=60%，G+C=40%，G=C=20%。G数量=1000×20%=200个。Tm=2×60+4×40=120+160=280？注意公式单位：Tm=2(A+T)%+4(G+C)%，此处A+T=60%，G+C=40%，Tm=2×60+4×40=280？实际常用Tm=2(A+T)+4(G+C)（当长度较短时以碱基数计），但此处百分比代入得280℃不合理。正确粗略公式：Tm=2(A+T)+4(G+C)，其中A+T和G+C为碱基对数目。1000 bp中A+T=600，G+C=400，Tm=2×600+4×400=1200+1600=2800？仍不合理。通常公式为Tm=2(A+T)+4(G+C)，其中A、T、G、C为碱基数目，对于短于25 bp的寡核苷酸。对于1000 bp长DNA，Tm接近90℃。本题意图考查碱基组成计算。简化：G=200个。Tm估算可用公式Tm=69.3+0.41×(G+C)% =69.3+0.41×40=85.7℃。","analysis":"涉及第2讲（Chargaff规则、Tm值）。易错点：混淆公式适用条件或碱基数量计算。","chapters":["第2讲"]},{"id":"Z21","type":"计算题","stem":"某mRNA编码区有300个核苷酸（不含终止密码子），翻译时每个氨基酸添加消耗2个GTP，起始消耗1个GTP，终止不消耗GTP。计算合成该多肽链所需GTP分子数（不考虑校正和能量浪费）。","options":[],"answer":"300个核苷酸编码100个氨基酸（300/3=100）。延伸阶段：每个氨基酸消耗2个GTP（EF-Tu和EF-G各1个），共100×2=200个GTP。起始消耗1个GTP，总计201个GTP。","analysis":"涉及第6讲（密码子三联体）与第7讲（翻译能量消耗）。易错点：忘记起始GTP或误算氨基酸数目。","chapters":["第6讲","第7讲"]},{"id":"Z22","type":"计算题","stem":"某蛋白质由两条相同的多肽链组成，每条链含200个氨基酸。若该蛋白质的mRNA前体含有2个内含子，每个内含子平均500 nt，5'UTR和3'UTR共300 nt，计算该成熟mRNA的核苷酸长度（不考虑poly(A)尾巴）。","options":[],"answer":"每条链200个氨基酸需200×3=600 nt编码区（不含终止密码子，若加终止密码子则+3）。两条相同链由同一mRNA翻译，故编码区为600 nt（若加终止密码子为603 nt）。mRNA前体总长=编码区+内含子+UTR=600+2×500+300=1900 nt。成熟mRNA去除内含子=1900-1000=900 nt（若加终止密码子为903 nt）。","analysis":"涉及第5讲（mRNA加工、内含子）与第6讲（密码子）。易错点：误认为两条链由两个mRNA编码，或忘记去除内含子。","chapters":["第5讲","第6讲"]},{"id":"Z23","type":"名词辨析","stem":"辨析：复制子（replicon）与转录单元（transcription unit）。","options":[],"answer":"复制子：DNA复制时从一个复制起点开始复制的一段DNA，包含复制起点和复制终点，是独立复制的单位。转录单元：从一个启动子开始转录到终止子结束的一段DNA，是独立转录的单位，可包含多个基因（多顺反子）。两者均为功能单位，但复制子以复制起点为界，转录单元以启动子和终止子为界；原核中复制子可能包含多个转录单元。","analysis":"涉及第3讲（复制子）与第4讲（转录单元）。易错点：混淆复制起点与启动子。","chapters":["第3讲","第4讲"]},{"id":"Z24","type":"名词辨析","stem":"辨析：SD序列与Kozak序列。","options":[],"answer":"SD序列：原核mRNA起始密码子上游富含嘌呤的序列，与16S rRNA互补配对，引导30S亚基定位起始密码子。Kozak序列：真核mRNA起始密码子AUG周围的共有序列（如GCCRCCAUGG），影响40S亚基扫描时对起始密码子的识别效率。两者均为翻译起始调控元件，但SD序列通过碱基配对直接定位，Kozak序列通过影响扫描效率间接增强起始。","analysis":"涉及第6讲（SD序列）与第7讲（Kozak序列）。易错点：混淆原核与真核机制。","chapters":["第6讲","第7讲"]},{"id":"Z25","type":"名词辨析","stem":"辨析：半保留复制与半不连续复制。","options":[],"answer":"半保留复制：DNA复制时，亲代双链解开，每条链作为模板合成新链，子代DNA含一条亲代链和一条新链，由Meselson-Stahl实验证明。半不连续复制：DNA复制时，前导链连续合成，后随链不连续合成（形成冈崎片段），因DNA聚合酶只能5'→3'合成。两者描述复制不同方面：半保留复制说明链的分配方式，半不连续复制说明链的合成方式。","analysis":"涉及第3讲（复制机制）。易错点：混淆两个概念或认为半不连续复制等同于半保留复制。","chapters":["第3讲"]}],"glossary":[{"cn":"AlphaFold","en":"AlphaFold","abbr":"","definition":"DeepMind开发的蛋白质结构预测人工智能模型，后续版本AlphaFold3可预测蛋白质、DNA、RNA及配体的结构及相互作用。","lectures":[1],"id":"G001"},{"cn":"CRISPR-Cas9基因剪刀","en":"CRISPR-Cas9 genetic scissors","abbr":"","definition":"由向导RNA引导Cas9核酸酶在特定位点切割DNA的基因编辑系统。","lectures":[1],"id":"G002"},{"cn":"Chargaff碱基配对原则","en":"Chargaff's base-pairing rules","abbr":"","definition":"DNA中腺嘌呤（A）与胸腺嘧啶（T）配对、鸟嘌呤（G）与胞嘧啶（C）配对的规律。","lectures":[1],"id":"G003"},{"cn":"DNA修复","en":"DNA repair","abbr":"","definition":"细胞识别并修复DNA损伤、保护遗传信息完整性的机制。","lectures":[1],"id":"G004"},{"cn":"DNA双螺旋尺寸","en":"DNA double helix dimensions","abbr":"","definition":"DNA双螺旋直径2.0 nm，每个碱基对（base pair, bp）沿轴上升0.34 nm。","lectures":[1],"id":"G005"},{"cn":"DNA连接酶","en":"DNA ligase","abbr":"","definition":"通过形成磷酸二酯键把两个或多个DNA片段连接成一个DNA分子的酶。","lectures":[1,9],"id":"G006"},{"cn":"DNA重组技术","en":"DNA recombinant technology / genetic engineering","abbr":"","definition":"20世纪70年代初兴起的技术，能将不同DNA片段按照设计定向连接，在特定受体细胞中复制并表达，产生影响受体细胞的新的遗传性状。","lectures":[1],"id":"G007"},{"cn":"Dicer","en":"Dicer","abbr":"","definition":"一种具有RNase III活性的核酸酶，可将细胞中较长的双链RNA（30个核苷酸以上）降解加工成21～25个核苷酸的小分子干扰RNA。","lectures":[1,9],"id":"G008"},{"cn":"II型RNA聚合酶","en":"RNA polymerase II","abbr":"Pol II","definition":"真核生物中负责转录蛋白质编码基因（mRNA前体）的RNA聚合酶，由12个亚基组成。","lectures":[1],"id":"G009"},{"cn":"PD-1","en":"programmed cell death protein 1","abbr":"PD-1","definition":"活化T淋巴细胞上的诱导型基因/受体，属免疫检查点分子，阻断后可增强抗肿瘤免疫。","lectures":[1],"id":"G010"},{"cn":"RNA剪接","en":"RNA splicing","abbr":"","definition":"去除内含子并连接外显子的过程（removal of introns and joining of exons）。","lectures":[1,5],"id":"G011"},{"cn":"RNA加工控制","en":"RNA processing control","abbr":"","definition":"在初级转录本→成熟mRNA步骤（如剪接、加帽加尾）上进行的调控。","lectures":[1],"id":"G012"},{"cn":"RNA干扰","en":"RNA interference","abbr":"RNAi","definition":"利用双链小RNA高效、特异性地降解细胞内同源mRNA，从而阻断靶基因表达，使细胞出现靶基因缺失的表型。","lectures":[1,9],"id":"G013"},{"cn":"R型肺炎链球菌","en":"R strain of Streptococcus pneumoniae","abbr":"","definition":"具有粗糙（rough）外表的肺炎链球菌，无荚膜，没有致病力。","lectures":[1],"id":"G014"},{"cn":"S型肺炎链球菌","en":"S strain of Streptococcus pneumoniae","abbr":"","definition":"具有光滑（smooth）荚膜外表的肺炎链球菌，能使小鼠发病致死。","lectures":[1],"id":"G015"},{"cn":"X射线衍射晶体学","en":"X-ray crystallography / protein crystallography","abbr":"","definition":"利用X射线在蛋白质晶体中的衍射图样解析生物大分子三维原子结构的方法。","lectures":[1],"id":"G016"},{"cn":"X射线衍射法","en":"X-ray diffraction","abbr":"","definition":"利用X射线照射晶体样品，通过衍射图谱解析分子三维结构的方法。","lectures":[1],"id":"G017"},{"cn":"pBR322质粒","en":"pBR322 plasmid","abbr":"","definition":"含ampR、tetR抗性基因和ori复制起点的经典克隆载体。","lectures":[1],"id":"G018"},{"cn":"三方二锌猪胰岛素","en":"2Zn porcine insulin","abbr":"","definition":"含两个锌离子的猪胰岛素三方晶型，是胰岛素晶体学研究的经典材料。","lectures":[1],"id":"G019"},{"cn":"中心法则","en":"Central Dogma","abbr":"","definition":"Crick于1954年提出的遗传信息传递规律，描述DNA、RNA、蛋白质之间信息流动的方向。","lectures":[1],"id":"G020"},{"cn":"人乳头状瘤病毒","en":"human papillomavirus","abbr":"HPV","definition":"导致子宫颈癌的致病病毒。","lectures":[1],"id":"G021"},{"cn":"人类免疫缺陷病毒","en":"human immunodeficiency virus","abbr":"HIV","definition":"即艾滋病病毒，是引起艾滋病的病原体。","lectures":[1],"id":"G022"},{"cn":"人类基因组计划","en":"Human Genome Project","abbr":"HGP","definition":"90年代提出并于2000年基本完成的人类全基因组测序工作，被称为二十世纪科技发展史上的三大创举之一。","lectures":[1],"id":"G023"},{"cn":"低氧应答元件","en":"hypoxia response element","abbr":"HRE","definition":"低氧诱导因子复合物结合的DNA顺式作用元件，位于低氧应答基因的调控区。","lectures":[1],"id":"G024"},{"cn":"低氧诱导因子1α","en":"hypoxia-inducible factor 1α","abbr":"HIF-1α","definition":"介导细胞低氧应答的转录因子亚基，其蛋白稳定性受氧浓度调控。","lectures":[1],"id":"G025"},{"cn":"体外受精","en":"in vitro fertilization","abbr":"IVF","definition":"在体外使卵子与精子结合形成受精卵，再将胚胎移植回母体发育的技术。","lectures":[1],"id":"G026"},{"cn":"体细胞克隆","en":"somatic cell cloning / somatic cell nuclear transfer","abbr":"SCNT","definition":"将体细胞核移植入去核卵母细胞，使其重编程并发育为个体的技术。","lectures":[1],"id":"G027"},{"cn":"光学衍射极限","en":"optical diffraction limit","abbr":"","definition":"传统光学显微镜因光的衍射而无法分辨小于约0.2微米（200 nm）结构的极限。","lectures":[1],"id":"G028"},{"cn":"免疫检查点","en":"immune checkpoint","abbr":"","definition":"抑制T细胞过度活化的负调控机制，肿瘤可利用其逃避免疫攻击。","lectures":[1],"id":"G029"},{"cn":"内含子","en":"intron","abbr":"","definition":"基因中位于外显子之间、在剪接中被去除的间隔序列（the intervening sequences）。","lectures":[1,5],"id":"G030"},{"cn":"冷冻电镜","en":"Cryo-Electron Microscopy","abbr":"Cryo-EM","definition":"低温冷冻制样后用电子显微镜成像并重建生物大分子结构的技术。","lectures":[1],"id":"G031"},{"cn":"分子生物学","en":"Molecular Biology","abbr":"","definition":"研究核酸（DNA、RNA）、蛋白质等生物大分子的形态、结构特征及其重要性、规律性和相互关系的科学。","lectures":[1],"id":"G032"},{"cn":"分离规律","en":"The Law of Segregation","abbr":"","definition":"一对遗传因子在杂合状态下互不融合，形成配子时彼此分离。","lectures":[1],"id":"G033"},{"cn":"功能基因组学","en":"functional genomics","abbr":"","definition":"以基因功能鉴定为目标的基因组学研究方向，又被称为后基因组（postgenome）。","lectures":[1],"id":"G034"},{"cn":"半不连续复制","en":"semi-discontinuous replication","abbr":"","definition":"DNA复制时前导链连续合成，而后随链以冈崎片段形式不连续合成，整体表现为半不连续的复制模式。","lectures":[1,3],"id":"G035"},{"cn":"半保留复制","en":"semi-conservative replication","abbr":"","definition":"DNA复制时每条链分别作为模板合成新链，每个子代DNA分子由一条亲代旧链和一条新合成链组成，碱基序列与亲代完全一致。","lectures":[1,3],"id":"G036"},{"cn":"单体","en":"monomer","abbr":"","definition":"构成生物大分子的基本重复单元，如氨基酸、核苷酸、单糖。","lectures":[1],"id":"G037"},{"cn":"单克隆抗体","en":"monoclonal antibody","abbr":"","definition":"由单一B细胞克隆产生的、针对单一抗原表位的均一抗体。","lectures":[1],"id":"G038"},{"cn":"双脱氧链终止法","en":"dideoxy chain termination method","abbr":"","definition":"利用2',3'-双脱氧核苷酸（ddNTP）掺入后无法继续延伸链的特性，终止DNA合成并读出序列的测序方法。","lectures":[1],"id":"G039"},{"cn":"双螺旋","en":"double helix","abbr":"","definition":"DNA的结构模型，两条链相互缠绕形成螺旋，可以'unzip'（解开拉链）进行自我复制。","lectures":[1],"id":"G040"},{"cn":"古基因组学","en":"paleogenomics","abbr":"","definition":"研究已灭绝生物（如古人类）基因组序列的学科，通过从古代样本中提取并测序DNA来重建进化历史。","lectures":[1],"id":"G041"},{"cn":"可移动遗传因子","en":"jumping gene / mobile element (transposable element)","abbr":"","definition":"可在基因组内改变位置的DNA序列。","lectures":[1],"id":"G042"},{"cn":"噬菌体呈现技术","en":"phage display","abbr":"","definition":"将外源多肽或抗体片段与噬菌体外壳蛋白融合表达并展示于噬菌体表面，从而通过亲和筛选获得特异性结合分子的技术。","lectures":[1],"id":"G043"},{"cn":"基因","en":"gene","abbr":"","definition":"产生一条功能性多肽或RNA分子所必需的全部核苷酸序列（The entire nucleic acid sequence that is necessary for the synthesis of a functional polypeptide or RNA molecule）。","lectures":[1,5],"id":"G044"},{"cn":"基因定点突变","en":"site-directed mutagenesis","abbr":"","definition":"通过改变基因特定位点核苷酸序列来改变所编码的氨基酸序列的技术。","lectures":[1,9],"id":"G045"},{"cn":"基因打靶","en":"gene targeting","abbr":"","definition":"通过同源重组等方法对小鼠基因组特定位点进行定向修饰，使特定基因失活或改变的技术。","lectures":[1],"id":"G046"},{"cn":"基因敲除小鼠","en":"gene knockout mouse","abbr":"","definition":"通过基因打靶技术使体内特定基因失去活性（敲除）而培育出的小鼠。","lectures":[1],"id":"G047"},{"cn":"基因组","en":"genome","abbr":"GENOME","definition":"生物体内遗传信息的集合，是某个特定物种细胞内全部DNA分子的总和；用于描述生物的全部基因和染色体组成。","lectures":[1,2],"id":"G048"},{"cn":"基因组学","en":"Genomics","abbr":"","definition":"对所有基因进行基因组作图（包括遗传图谱、物理图谱、转录本图谱）、核苷酸序列分析、基因定位和基因功能分析的一门科学。","lectures":[1],"id":"G049"},{"cn":"基因编辑","en":"genome editing","abbr":"","definition":"利用人工核酸酶在基因组特定位点造成双链断裂，进而通过修复途径实现基因敲除、替换或插入的技术。","lectures":[1,9],"id":"G050"},{"cn":"基因表达","en":"gene expression","abbr":"","definition":"遗传信息经转录和翻译转变为蛋白质等功能产物的过程。","lectures":[1],"id":"G051"},{"cn":"外显子","en":"exon","abbr":"","definition":"基因中最终保留在成熟mRNA中的编码序列（the coding sequences）。","lectures":[1,5],"id":"G052"},{"cn":"序列图","en":"sequence map","abbr":"","definition":"基因组全部DNA的核苷酸排列顺序图谱。","lectures":[1],"id":"G053"},{"cn":"引物延伸","en":"primer extension","abbr":"","definition":"在已定位的引物3'-OH端，由DNA聚合酶延伸合成新的带标记DNA链的过程。","lectures":[1],"id":"G054"},{"cn":"微小RNA","en":"microRNA","abbr":"miRNA","definition":"一类长度约21–23 nt的内源非编码小RNA，通过与靶mRNA互补配对在转录后水平抑制基因表达。","lectures":[1],"id":"G055"},{"cn":"操纵子","en":"operon","abbr":"","definition":"原核生物中基因表达调控的功能单位，由启动子、操纵基因及结构基因等组成。","lectures":[1],"id":"G056"},{"cn":"断裂基因","en":"split gene","abbr":"","definition":"由外显子与内含子交替组成、转录后需剪接去除内含子的基因。","lectures":[1,2],"id":"G057"},{"cn":"昼夜节律","en":"circadian rhythm","abbr":"","definition":"生物体内约24小时周期的内源性节律，由分子机制控制。","lectures":[1],"id":"G058"},{"cn":"朊病毒","en":"prion","abbr":"","definition":"幻灯片表述为'PrPc蛋白质病毒，受DNA序列控制，是细胞内蛋白质在分子水平的病变'。","lectures":[1],"id":"G059"},{"cn":"染色体—基因遗传理论","en":"chromosome–gene theory of inheritance","abbr":"","definition":"将基因定位于染色体上、把性状与基因相耦联的遗传理论。","lectures":[1],"id":"G060"},{"cn":"核小体","en":"nucleosome","abbr":"","definition":"染色质的基本结构单位，由核心组蛋白八聚体与缠绕其上的DNA组成，包含约200个核苷酸对的DNA。","lectures":[1,2,3,4],"id":"G061"},{"cn":"核磁共振法","en":"Nuclear Magnetic Resonance spectroscopy","abbr":"NMR","definition":"二维和多维核磁共振用于测定溶液中生物大分子的液相结构。","lectures":[1],"id":"G062"},{"cn":"核糖体","en":"ribosome","abbr":"","definition":"由rRNA与多种蛋白质组成的核糖核蛋白复合物，是蛋白质合成的机器。","lectures":[1,6],"id":"G063"},{"cn":"核苷碱基修饰","en":"nucleoside base modification","abbr":"","definition":"在核苷酸的碱基上引入化学修饰（如甲基化），改变其结构。","lectures":[1],"id":"G064"},{"cn":"核酶","en":"ribozyme (catalytic RNA)","abbr":"","definition":"具有催化活性的RNA分子。","lectures":[1],"id":"G065"},{"cn":"氢键","en":"hydrogen bond","abbr":"","definition":"DNA分子中碱基配对之间的非共价相互作用，被比喻为DNA的'分子胶'（molecular glue）。","lectures":[1],"id":"G066"},{"cn":"物理图","en":"physical map","abbr":"","definition":"以实际物理距离（如碱基对bp）为标尺，表示DNA片段或标记在染色体上实际位置的图谱。","lectures":[1],"id":"G067"},{"cn":"生物信息学","en":"bioinformatics","abbr":"","definition":"依靠计算机快速高效运算，对基因组学产生的庞大数据进行统计分类和结构功能预测的学科。","lectures":[1],"id":"G068"},{"cn":"生物大分子","en":"biological macromolecule","abbr":"","definition":"细胞内相对分子质量很大的有机分子，主要包括核酸、蛋白质、多糖。","lectures":[1],"id":"G069"},{"cn":"电镜三维重组","en":"electron microscopy 3D reconstruction","abbr":"","definition":"通过电子显微镜成像并进行三维重建获得生物大分子空间结构的方法。","lectures":[1],"id":"G070"},{"cn":"端粒","en":"telomere","abbr":"","definition":"染色体末端的特殊结构，保护染色体不被降解、融合，并解决染色体末端复制问题。","lectures":[1,2],"id":"G071"},{"cn":"端粒酶","en":"telomerase","abbr":"","definition":"一种特殊的逆转录酶，携带自身的RNA模板，以RNA为模板在染色体3'端延伸端粒重复序列，补偿末端缩短。","lectures":[1,3],"id":"G072"},{"cn":"细胞核重编程","en":"nuclear reprogramming","abbr":"","definition":"将成年体细胞重新诱导回早期干细胞状态，以用于形成各种类型的细胞，应用于临床医学。","lectures":[1],"id":"G073"},{"cn":"细胞程序化凋亡","en":"programmed cell death / apoptosis","abbr":"","definition":"由遗传调控的、细胞主动有序走向死亡的生理过程，在器官发育等过程中起重要作用。","lectures":[1],"id":"G074"},{"cn":"结构分子生物学","en":"structural molecular biology","abbr":"","definition":"研究生物大分子特定的空间结构及结构的运动变化与其生物学功能关系的科学。","lectures":[1],"id":"G075"},{"cn":"结构基因组学","en":"structural genomics","abbr":"","definition":"以全基因组测序为目标的基因组学研究方向。","lectures":[1],"id":"G076"},{"cn":"翻译后控制","en":"Post-translation control","abbr":"","definition":"蛋白质合成之后对其修饰、折叠、定位等环节的调控。","lectures":[1],"id":"G077"},{"cn":"聚合酶链式反应","en":"polymerase chain reaction","abbr":"PCR","definition":"快速扩增DNA序列最常用的方法，通过变性、引物退火、延伸的循环实现DNA指数扩增。","lectures":[1,9],"id":"G078"},{"cn":"胸腺嘧啶核苷激酶","en":"thymidine kinase","abbr":"TK","definition":"由TK基因编码的酶，缺乏该酶的细胞在缺乏胸腺嘧啶的条件下不能存活。","lectures":[1],"id":"G079"},{"cn":"脯氨酰羟化","en":"prolyl hydroxylation","abbr":"","definition":"在HIF-1α特定脯氨酸残基上加羟基的翻译后修饰，依赖氧，是氧感知的关键步骤。","lectures":[1],"id":"G080"},{"cn":"脱靶效应","en":"off-target effect","abbr":"","definition":"siRNA/shRNA与非靶基因mRNA部分序列互补而引起的非特异性基因抑制。","lectures":[1,9],"id":"G081"},{"cn":"自由组合规律","en":"The Law of Independent Assortment","abbr":"","definition":"两对及以上遗传因子在形成配子时自由组合。","lectures":[1],"id":"G082"},{"cn":"蛋白质变性理论","en":"protein denaturation theory","abbr":"","definition":"解释蛋白质在理化因素作用下空间构象破坏、生物活性丧失的理论。","lectures":[1],"id":"G083"},{"cn":"血红蛋白","en":"hemoglobin","abbr":"","definition":"红细胞中运输氧的四聚体蛋白，含血红素辅基。","lectures":[1],"id":"G084"},{"cn":"转化","en":"transformation","abbr":"","definition":"一种细菌的遗传性状被另一种细菌的遗传物质改变的现象。","lectures":[1],"id":"G085"},{"cn":"转录后基因调控","en":"post-transcriptional gene regulation","abbr":"","definition":"在转录完成后对mRNA稳定性、翻译效率等环节进行的调控。","lectures":[1],"id":"G086"},{"cn":"转录因子","en":"transcription factor","abbr":"","definition":"与DNA特定序列结合以激活或抑制转录的蛋白质。","lectures":[1],"id":"G087"},{"cn":"转录图","en":"transcription map","abbr":"","definition":"标示基因组中可转录区域（表达序列）及其表达情况的图谱。","lectures":[1],"id":"G088"},{"cn":"转录水平控制","en":"Transcriptional control","abbr":"","definition":"在DNA→初级转录本步骤上对基因表达进行的调控。","lectures":[1],"id":"G089"},{"cn":"转录激活因子样效应物核酸酶","en":"transcription activator-like effector nuclease","abbr":"TALEN","definition":"由TALE的DNA结合结构域与FokI核酸酶结构域融合而成的人工核酸酶，需左右两个单体二聚化才能切割。","lectures":[1],"id":"G090"},{"cn":"辣椒素","en":"capsaicin","abbr":"","definition":"辣椒中的活性成分，可特异性激活对热敏感的伤害感受器。","lectures":[1],"id":"G091"},{"cn":"连锁遗传规律","en":"law of linkage inheritance","abbr":"","definition":"位于同一染色体上的基因倾向于共同遗传的规律。","lectures":[1],"id":"G092"},{"cn":"逆转录酶","en":"reverse transcriptase","abbr":"","definition":"以RNA为模板合成DNA的酶，存在于RNA肿瘤病毒中。","lectures":[1],"id":"G093"},{"cn":"遗传图（连锁图）","en":"genetic map (linkage map)","abbr":"","definition":"以遗传标记间的重组率（连锁关系）为标尺，表示基因或标记在染色体上相对位置的图谱。","lectures":[1],"id":"G094"},{"cn":"酵母丙氨酸转移核糖核酸","en":"yeast alanine transfer RNA","abbr":"tRNA^Ala","definition":"酵母中携带丙氨酸的转移RNA，是首个被人工全合成的具有生物活性的RNA分子。","lectures":[1],"id":"G095"},{"cn":"酶的定向演化","en":"directed evolution of enzymes","abbr":"","definition":"通过反复的随机突变与定向筛选，在实验室中人为改造酶的性质（活性、稳定性、底物特异性等）的技术。","lectures":[1],"id":"G096"},{"cn":"钙调蛋白","en":"calmodulin","abbr":"","definition":"一种钙离子结合蛋白，介导钙信号传递。","lectures":[1],"id":"G097"},{"cn":"锌指核酸酶","en":"zinc finger nuclease","abbr":"ZFN","definition":"由锌指DNA结合结构域与FokI核酸酶结构域融合而成的人工核酸酶。","lectures":[1],"id":"G098"},{"cn":"限制性内切酶","en":"restriction endonuclease","abbr":"","definition":"识别特定DNA序列并切割双链的酶，是基因克隆的关键工具酶。","lectures":[1],"id":"G099"},{"cn":"青蒿素","en":"Artemisinin","abbr":"","definition":"从黄花蒿（Artemisia annua）中提取的含过氧桥的倍半萜内酯类抗疟药物。","lectures":[1],"id":"G100"},{"cn":"A型DNA","en":"A-DNA","abbr":"","definition":"右手螺旋DNA构象，对基因表达有重要意义，存在于DNA-RNA杂交双链（转录状态的DNA）及RNA-RNA双链中。","lectures":[2],"id":"G101"},{"cn":"B型DNA","en":"B-DNA","abbr":"","definition":"最常见的DNA构象，右手螺旋，主要见于A-T丰富的DNA片段。","lectures":[2],"id":"G102"},{"cn":"DNA一级结构","en":"primary structure of DNA","abbr":"","definition":"指4种核苷酸的连接方式及其排列顺序，表示该DNA分子的化学构成。","lectures":[2],"id":"G103"},{"cn":"DNA二级结构","en":"secondary structure of DNA","abbr":"","definition":"两条多核苷酸链反向平行盘绕所生成的双螺旋结构。","lectures":[2],"id":"G104"},{"cn":"DNA双螺旋结构","en":"DNA double helix","abbr":"","definition":"两条多核苷酸链反向平行盘绕形成的规则螺旋结构，由Watson和Crick于1953年提出。","lectures":[2],"id":"G105"},{"cn":"DNA甲基化","en":"DNA methylation","abbr":"","definition":"DNA甲基转移酶以S-腺苷甲硫氨酸为甲基供体，将甲基加到胞嘧啶第5位碳原子上生成5-甲基胞嘧啶的过程。","lectures":[2],"id":"G106"},{"cn":"G-四链体","en":"G-quadruplex","abbr":"G4","definition":"富含鸟嘌呤的DNA区域中，通过四个鸟嘌呤间的环状Hoogsteen氢键层层堆积形成的含四条螺旋链的高级结构。","lectures":[2],"id":"G107"},{"cn":"HMG蛋白","en":"High mobility group protein","abbr":"HMG","definition":"高迁移率族蛋白，能与DNA结合但不牢固，也能与H1组蛋白作用，可能与DNA超螺旋结构有关。","lectures":[2],"id":"G108"},{"cn":"Hoogsteen碱基对","en":"Hoogsteen base pair","abbr":"","definition":"嘌呤碱基旋转为syn构象后，通过不同于Watson-Crick面的氢键供体/受体与嘧啶配对的碱基对形式。","lectures":[2],"id":"G109"},{"cn":"Tm值（解链温度/熔点）","en":"melting temperature","abbr":"Tm","definition":"DNA在260 nm吸光度增加到最大值一半时的温度，称为DNA的解链温度或熔点。","lectures":[2],"id":"G110"},{"cn":"Z型DNA","en":"Z-DNA","abbr":"","definition":"左手螺旋DNA构象，1979年由Rich提出，是右手螺旋结构模型的补充和发展。","lectures":[2],"id":"G111"},{"cn":"三链DNA","en":"triple-stranded DNA / triplex DNA","abbr":"H-DNA","definition":"在特定条件下形成的DNA特异性结构，由第三条寡核苷酸链通过Hoogsteen氢键结合于双螺旋大沟中形成。","lectures":[2],"id":"G112"},{"cn":"共价闭合超螺旋DNA","en":"covalently closed circular supercoiled DNA","abbr":"cccDNA","definition":"两条链均完整闭合、且以负超螺旋形式缠绕的环状DNA分子。","lectures":[2],"id":"G113"},{"cn":"单链DNA结合蛋白","en":"single-stranded DNA-binding protein","abbr":"SSB","definition":"一类与单链DNA亲和力极大的DNA结合蛋白，又称螺旋失稳蛋白、DNA解链蛋白。","lectures":[2],"id":"G114"},{"cn":"卫星DNA","en":"satellite DNA","abbr":"","definition":"高度重复序列，碱基组成简单（6—100），重复次数达数百万次，占DNA总量10%—60%。","lectures":[2],"id":"G115"},{"cn":"反向平行","en":"antiparallel","abbr":"","definition":"DNA两条链走向相反，一条为5′→3′，另一条为3′→5′，共同盘绕成双螺旋。","lectures":[2],"id":"G116"},{"cn":"嘌呤","en":"purine","abbr":"","definition":"双环含氮碱基，包括腺嘌呤（A）和鸟嘌呤（G）。","lectures":[2],"id":"G117"},{"cn":"嘧啶","en":"pyrimidine","abbr":"","definition":"单环含氮碱基，包括胞嘧啶（C）、胸腺嘧啶（T）和尿嘧啶（U）。","lectures":[2],"id":"G118"},{"cn":"基因密度","en":"gene density","abbr":"","definition":"每兆碱基对基因组DNA平均所含基因数，单位genes/Mb。","lectures":[2],"id":"G119"},{"cn":"多顺反子mRNA","en":"polycistronic mRNA","abbr":"","definition":"一个mRNA分子上携带多个基因（顺反子）编码信息的转录产物。","lectures":[2,5],"id":"G120"},{"cn":"开环DNA","en":"open circular DNA","abbr":"ocDNA","definition":"双链环状DNA中一条链出现缺口后，超螺旋张力释放而形成的松弛环状结构。","lectures":[2],"id":"G121"},{"cn":"拓扑异构酶","en":"topoisomerase","abbr":"","definition":"能够改变DNA拓扑状态（超螺旋程度）的酶，可使超螺旋DNA松弛。","lectures":[2],"id":"G122"},{"cn":"接头组蛋白H1","en":"linker histone H1","abbr":"","definition":"结合在核小体核心颗粒外侧、DNA进出位点处连接DNA上的组蛋白，分子量24 kD，不属于核心八聚体。","lectures":[2],"id":"G123"},{"cn":"染色体","en":"chromosome","abbr":"","definition":"由DNA与组蛋白等蛋白质组成的、承载遗传信息的核蛋白复合体结构，是遗传物质的主要载体。","lectures":[2],"id":"G124"},{"cn":"染色小体","en":"chromatosome","abbr":"","definition":"核小体核心加上H1后形成的结构，含166 bp DNA。","lectures":[2],"id":"G125"},{"cn":"染色质","en":"chromatin","abbr":"","definition":"由DNA与组蛋白（histone）及非组蛋白（non-histone protein）结合形成的复合物，是染色体在间期的存在形式。","lectures":[2,3],"id":"G126"},{"cn":"查加夫规则","en":"Chargaff's Rules","abbr":"","definition":"双链DNA中A的摩尔数等于T、G的摩尔数等于C，即A=T、G=C，由此嘌呤总数等于嘧啶总数。","lectures":[2],"id":"G127"},{"cn":"核小体核心","en":"nucleosome core","abbr":"","definition":"146 bp DNA缠绕在组蛋白八聚体上形成的颗粒结构，不含连接DNA与H1。","lectures":[2],"id":"G128"},{"cn":"核小体重复长度","en":"Nucleosome Repeat Length","abbr":"NRL","definition":"相邻两个核小体核心之间重复出现的DNA长度，等于146 bp核心DNA加连接DNA长度。","lectures":[2],"id":"G129"},{"cn":"核心组蛋白","en":"core histone","abbr":"","definition":"H2A、H2B、H3、H4四种组成核小体核心的组蛋白。","lectures":[2],"id":"G130"},{"cn":"核苷","en":"nucleoside","abbr":"","definition":"碱基与糖（核糖或脱氧核糖）通过糖苷键结合形成的化合物。","lectures":[2],"id":"G131"},{"cn":"核苷酸","en":"nucleotide","abbr":"","definition":"由磷酸基团、五碳糖（核糖或脱氧核糖）和含氮碱基共价连接而成的基本结构单位。","lectures":[2],"id":"G132"},{"cn":"核酸","en":"nucleic acid","abbr":"","definition":"由核苷酸聚合而成的生物大分子，包括DNA与RNA，是遗传信息的载体。","lectures":[2],"id":"G133"},{"cn":"磷酸二酯键","en":"phosphodiester bond","abbr":"","definition":"一个脱氧核苷酸戊糖的3′-OH与下一个脱氧核苷酸5′-磷酸基团脱水缩合形成的共价键，是连接DNA链中相邻核苷酸的键。","lectures":[2,4],"id":"G134"},{"cn":"组蛋白","en":"histone","abbr":"","definition":"真核生物中保守的DNA结合蛋白，形成核小体，即染色质的基本结构单位。","lectures":[2],"id":"G135"},{"cn":"组蛋白乙酰化","en":"histone acetylation","abbr":"","definition":"在组蛋白赖氨酸残基ε-氨基上添加乙酰基的共价修饰，由HAT催化、HDAC去除，可逆且高度调控。","lectures":[2],"id":"G136"},{"cn":"组蛋白乙酰基转移酶","en":"histone acetyltransferase","abbr":"HAT","definition":"催化组蛋白特定赖氨酸残基乙酰化的酶。","lectures":[2],"id":"G137"},{"cn":"组蛋白修饰","en":"histone modification","abbr":"","definition":"组蛋白（主要在其N端尾部）氨基酸残基上发生的共价化学修饰，包括甲基化、乙酰化、磷酸化、泛素化等。","lectures":[2],"id":"G138"},{"cn":"组蛋白八聚体","en":"histone octamer","abbr":"","definition":"由H2A、H2B、H3、H4四种核心组蛋白各两个分子组成的八聚体，是DNA缠绕的核心。","lectures":[2],"id":"G139"},{"cn":"组蛋白去乙酰化酶","en":"Histone Deacetylase","abbr":"HDAC","definition":"催化组蛋白赖氨酸残基上乙酰基去除的酶，使组蛋白带正电、与DNA结合更紧密，通常与转录抑制相关。","lectures":[2],"id":"G140"},{"cn":"组蛋白密码","en":"Histone code","abbr":"","definition":"多种组蛋白修饰方式组合形成的、可被专一识别的修饰信息，能更灵活地影响染色质的结构与功能。","lectures":[2],"id":"G141"},{"cn":"组蛋白尾巴","en":"histone tail","abbr":"","definition":"核心组蛋白N端伸出于核小体外的柔性肽段，包括H2A tail、H2B tail、H3 tail、H4 tail。","lectures":[2,3],"id":"G142"},{"cn":"组蛋白折叠","en":"histone fold","abbr":"","definition":"核心组蛋白共有的结构折叠模式，由3个α螺旋和2个环组成。","lectures":[2],"id":"G143"},{"cn":"组蛋白甲基化","en":"histone methylation","abbr":"","definition":"由组蛋白甲基转移酶催化、发生在赖氨酸和精氨酸残基上的甲基化修饰。","lectures":[2],"id":"G144"},{"cn":"表观遗传信息","en":"epigenetic information","abbr":"","definition":"由组蛋白尾部多种共价修饰组合所携带的、不改变DNA序列而影响染色质功能的信息。","lectures":[2],"id":"G145"},{"cn":"表观遗传学","en":"Epigenetics","abbr":"","definition":"研究在不改变DNA序列（基因型）的前提下产生可遗传的表型变化的学科。","lectures":[2],"id":"G146"},{"cn":"质粒","en":"plasmid","abbr":"","definition":"细菌中独立于染色体外、能自主复制的环状双链DNA分子，是常用的克隆载体。","lectures":[2,9],"id":"G147"},{"cn":"赖氨酸甲基转移酶","en":"lysine methyltransferases","abbr":"KMTs","definition":"催化赖氨酸残基甲基化的酶类。","lectures":[2],"id":"G148"},{"cn"
