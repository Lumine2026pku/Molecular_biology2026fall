:"超螺旋结构","en":"supercoil / supercoiled structure","abbr":"","definition":"DNA双螺旋进一步扭曲盘绕形成的高级结构，分为正超螺旋与负超螺旋两大类，特殊情况下可相互转变。","lectures":[2],"id":"G149"},{"cn":"转录单元","en":"transcription unit","abbr":"","definition":"原核生物DNA序列中功能相关的RNA和蛋白质基因丛集在基因组的一个或几个特定部位所形成的、被一起转录的DNA区段。","lectures":[2,4],"id":"G150"},{"cn":"连接DNA","en":"linker DNA","abbr":"","definition":"相邻核小体核心之间未被核心八聚体缠绕的DNA片段，是H1的结合部位。","lectures":[2,3],"id":"G151"},{"cn":"重叠基因","en":"overlapping gene","abbr":"","definition":"同一段DNA序列携带两种不同蛋白质编码信息的基因组织形式。","lectures":[2],"id":"G152"},{"cn":"非组蛋白","en":"Non-histone protein","abbr":"","definition":"细胞核中组蛋白以外的酸性蛋白质。","lectures":[2],"id":"G153"},{"cn":"顺式作用元件","en":"cis-acting element","abbr":"","definition":"位于基因旁侧、调控该基因转录的DNA序列。","lectures":[2],"id":"G154"},{"cn":"ATP依赖的染色质重塑复合物","en":"ATP-dependent chromatin remodeling complex","abbr":"","definition":"利用水解ATP的能量来改变DNA环绕核小体位置的蛋白质机器。","lectures":[3],"id":"G155"},{"cn":"Cdk","en":"cyclin-dependent kinase","abbr":"Cdk","definition":"周期蛋白依赖性激酶，仅在细胞进入S期时被激活，磷酸化pre-RC以启动复制。","lectures":[3],"id":"G156"},{"cn":"DNA拓扑异构酶","en":"DNA topoisomerase","abbr":"","definition":"通过切断和重新连接DNA链来改变DNA拓扑状态、消除复制过程中产生的超螺旋张力的酶。","lectures":[3],"id":"G157"},{"cn":"DNA聚合酶III全酶","en":"DNA Pol III holoenzyme","abbr":"","definition":"大肠杆菌复制叉上的主要复制聚合酶复合物，由两个拷贝的核心酶、γ复合物（夹子装载器）及τ蛋白等组成。","lectures":[3],"id":"G158"},{"cn":"DNA解旋酶","en":"DNA helicase","abbr":"","definition":"利用ATP水解能量解开DNA双螺旋、产生单链模板的酶。","lectures":[3],"id":"G159"},{"cn":"Klenow片段","en":"Klenow fragment","abbr":"","definition":"DNA聚合酶I经蛋白酶切割后的大片段（76 000），保留聚合酶活性和3'→5'外切活性，失去5'→3'外切活性。","lectures":[3],"id":"G160"},{"cn":"Mcm解旋酶","en":"Mcm helicase","abbr":"Mcm2-7","definition":"由Mcm2-7六个亚基组成的DNA解旋酶，被装载到起点形成pre-RC，被Cdk/Ddk磷酸化后激活。","lectures":[3],"id":"G161"},{"cn":"NuRD复合体","en":"NuRD complex","abbr":"","definition":"属于CHD家族的复合体，兼具染色质重塑和组蛋白去乙酰化酶活性，主要参与转录抑制。","lectures":[3],"id":"G162"},{"cn":"SOS系统","en":"SOS response","abbr":"","definition":"细胞在DNA受到损伤时为求生存而产生的一种应急措施，可诱导DNA损伤修复、诱变效应、细胞分裂的抑制以及溶原性细菌释放噬菌体等。","lectures":[3],"id":"G163"},{"cn":"SWI/SNF复合体","en":"SWI/SNF complex","abbr":"","definition":"含8-14个亚基、具同源调节域的ATP依赖染色质重塑复合体，可滑动和驱逐核小体，通常促进转录激活。","lectures":[3],"id":"G164"},{"cn":"θ结构","en":"theta structure","abbr":"θ","definition":"环状DNA从单一原点起始双向复制时形成的、形似希腊字母θ的复制中间体，由环状模板和内部的复制泡组成。","lectures":[3],"id":"G165"},{"cn":"“长号”模型","en":"trombone model","abbr":"","definition":"描述大肠杆菌复制叉上两个DNA聚合酶通过τ蛋白二聚体连接、后随链模板成环以协调前导链与后随链同时合成的模型。","lectures":[3],"id":"G166"},{"cn":"三核苷酸重复扩增","en":"trinucleotide repeat expansion","abbr":"","definition":"基因组中三核苷酸短串联重复序列拷贝数异常增加，属于插入突变，可导致多种神经系统与发育疾病。","lectures":[3],"id":"G167"},{"cn":"冈崎片段","en":"Okazaki fragment","abbr":"","definition":"后随链上不连续合成的短DNA片段，每个片段由RNA引物起始，随后引物被去除、片段连接成完整链。","lectures":[3],"id":"G168"},{"cn":"前复制复合体","en":"prereplicative complex","abbr":"pre-RC","definition":"G1期在复制起点组装、含ORC、Cdc6、Cdt1与Mcm2-7解旋酶的复合体，是起点被使用的前提。","lectures":[3],"id":"G169"},{"cn":"前导链","en":"leading strand","abbr":"","definition":"在复制叉处沿解旋方向连续合成的新链，其合成方向与复制叉移动方向一致。","lectures":[3],"id":"G170"},{"cn":"单链DNA结合蛋白","en":"single-strand DNA-binding protein","abbr":"SSB","definition":"与单链DNA结合的蛋白质，通过协同结合使单链DNA伸展，抑制分子内碱基配对（发夹结构）的形成，防止单链重新退火或被降解。","lectures":[3],"id":"G171"},{"cn":"后随链","en":"lagging strand","abbr":"","definition":"与复制叉移动方向相反、以不连续片段（冈崎片段）形式合成的新链。","lectures":[3],"id":"G172"},{"cn":"复制叉","en":"replication fork","abbr":"","definition":"DNA复制时双链解开、子代链合成的Y形分叉结构，是复制实际进行的部位，随复制向两侧移动。","lectures":[3],"id":"G173"},{"cn":"复制子","en":"replicon","abbr":"","definition":"独立进行复制的一个DNA单位，含复制起点及其所控制的复制区域；一个复制子只含一个复制起点。","lectures":[3],"id":"G174"},{"cn":"复制泡","en":"replication bubble","abbr":"","definition":"正在复制的DNA区域，因双链解开、新链合成而呈泡状结构，两端各有一个复制叉。","lectures":[3],"id":"G175"},{"cn":"复制的精确性","en":"replication fidelity","abbr":"","definition":"DNA复制过程中碱基配对准确的程度，对把遗传信息从一代传递到下一代至关重要。","lectures":[3],"id":"G176"},{"cn":"复制起点","en":"replication origin","abbr":"ori","definition":"DNA复制开始的固定起始位点，起始蛋白识别并局部解开双螺旋，暴露单链模板。","lectures":[3],"id":"G177"},{"cn":"外切酶活性位点","en":"exonuclease site","abbr":"E site","definition":"水解新链3'端核苷酸的活性中心，负责校读切除。","lectures":[3],"id":"G178"},{"cn":"引发酶","en":"primase","abbr":"","definition":"一种RNA聚合酶，合成短的RNA片段作为DNA复制的引物，为DNA聚合酶提供3'-OH末端。","lectures":[3],"id":"G179"},{"cn":"引物","en":"primer","abbr":"","definition":"一段短的核酸序列（通常为RNA），与DNA模板链配对，提供游离的3'-OH末端，供DNA聚合酶起始合成脱氧核糖核苷酸链。","lectures":[3,9],"id":"G180"},{"cn":"抑癌基因","en":"tumor suppressor gene","abbr":"","definition":"其失活或缺失使产物表达下降或缺失，从而失去抑制细胞生长作用、可能使癌基因充分发挥作用而致癌的基因。","lectures":[3],"id":"G181"},{"cn":"持续合成能力","en":"processivity","abbr":"","definition":"作用于多聚底物的酶的一种特性；对DNA聚合酶而言，定义为酶每次结合引物:模板接头后平均加入的核苷酸数。","lectures":[3],"id":"G182"},{"cn":"旁路修复","en":"bypass repair (translesion synthesis)","abbr":"","definition":"由DNA Pol IV、V在损伤位点对面直接掺入核苷酸、越过损伤继续合成的修复方式。","lectures":[3],"id":"G183"},{"cn":"校对","en":"proofreading","abbr":"","definition":"纠正在蛋白质或核酸合成过程中所出现错误的任何机制，这些机制涉及在单个亚基被添加到链上之后对其进行检查和审核。","lectures":[3],"id":"G184"},{"cn":"核苷酸切除修复","en":"nucleotide-excision repair","abbr":"NER","definition":"切除含损伤的一段寡核苷酸、处理大体积加合物、CPD、(6-4)PP等损伤的修复途径。","lectures":[3],"id":"G185"},{"cn":"滑动夹","en":"sliding DNA clamp","abbr":"","definition":"一种环状蛋白，完全环绕新合成的DNA，与DNA聚合酶结合并将其系在模板上，从而大幅提高持续合成能力。","lectures":[3],"id":"G186"},{"cn":"癌基因","en":"oncogene","abbr":"","definition":"其激活（表达异常增高或产物增多）可促进细胞恶性转化、导致癌症的基因。","lectures":[3],"id":"G187"},{"cn":"碱基切除修复","en":"base-excision repair","abbr":"BER","definition":"处理单个受损碱基（如尿嘧啶、无碱基位点、8-氧代鸟嘌呤、单链断裂）的修复途径。","lectures":[3],"id":"G188"},{"cn":"移码突变","en":"frameshift mutation","abbr":"","definition":"因核苷酸插入或缺失（非3的整数倍）改变阅读框，使下游密码子全部改变，产生无功能蛋白质。","lectures":[3],"id":"G189"},{"cn":"突变","en":"mutation","abbr":"","definition":"DNA碱基序列发生的永久性、可遗传的改变（Permanent, heritable alterations in the base sequence of DNA）。","lectures":[3],"id":"G190"},{"cn":"组蛋白变体H2A.Z","en":"histone variant H2A.Z","abbr":"","definition":"由INO80/SWR1家族中的SWR1复合体负责将常规H2A置换而掺入核小体的组蛋白变体。","lectures":[3],"id":"G191"},{"cn":"聚合酶活性位点","en":"polymerase site","abbr":"P site","definition":"催化dNTP与引物3'-OH之间形成磷酸二酯键、延伸新链的活性中心。","lectures":[3],"id":"G192"},{"cn":"自主复制序列","en":"autonomously replicating sequence","abbr":"ARS","definition":"真核生物DNA的复制子，长约150 bp，包括数个复制起始必需的保守区。","lectures":[3],"id":"G193"},{"cn":"起始点识别复合物","en":"origin recognition complex","abbr":"ORC","definition":"由6种蛋白质组成的启动复合物，结合于ARS，参与真核生物DNA复制的起始。","lectures":[3],"id":"G194"},{"cn":"转换","en":"transition","abbr":"","definition":"嘌呤被嘌呤替换，或嘧啶被嘧啶替换的碱基替换方式，即A↔G或C↔T。","lectures":[3,6],"id":"G195"},{"cn":"错配修复","en":"mismatch repair","abbr":"MMR","definition":"识别并切除复制后新链上的错配碱基，由DNA连接酶等补齐缺口的修复系统。","lectures":[3],"id":"G196"},{"cn":"非同源末端连接","en":"non-homologous end joining","abbr":"NHEJ","definition":"不需要任何模板的帮助，修复蛋白可以直接将双股裂断的末端彼此拉近，再藉由DNA ligase将断裂的两股重新接合的修复方式。","lectures":[3],"id":"G197"},{"cn":"颠换","en":"transversion","abbr":"","definition":"嘌呤被嘧啶替换或嘧啶被嘌呤替换的碱基替换方式，即A/G与C/T之间的互换。","lectures":[3,6],"id":"G198"},{"cn":"CAAT盒","en":"CAAT box","abbr":"","definition":"真核启动子中位于起点上游-70～-78（或-70～-80）区的共同序列CCAAT。","lectures":[4],"id":"G199"},{"cn":"C端结构域","en":"C-terminal domain","abbr":"CTD","definition":"Pol II最大亚基RPB1尾部的重复序列结构域，磷酸化后触发启动子逃逸。","lectures":[4],"id":"G200"},{"cn":"G:U碱基配对","en":"G:U base pair","abbr":"","definition":"鸟嘌呤与尿嘧啶之间通过两个氢键形成的非Watson-Crick碱基配对。","lectures":[4],"id":"G201"},{"cn":"GC盒","en":"GC box","abbr":"","definition":"真核启动子中位于-80～-110区、含GCCACACCC或GGGCGGG序列的上游启动子元件。","lectures":[4],"id":"G202"},{"cn":"Hogness区","en":"Hogness box (TATA box)","abbr":"","definition":"真核启动子中位于起点上游-25～-30 bp的TATA区，保守序列TATAAA，功能类似原核Pribnow盒。","lectures":[4],"id":"G203"},{"cn":"Pribnow盒","en":"Pribnow box (-10 region)","abbr":"","definition":"原核启动子-10区由5个核苷酸组成的保守序列TATAAT，是聚合酶结合位点，中央约位于起点上游10 bp。","lectures":[4],"id":"G204"},{"cn":"RNA出口通道","en":"RNA exit channel","abbr":"","definition":"转录产物RNA离开RNA聚合酶的通道。","lectures":[4],"id":"G205"},{"cn":"Sextama盒","en":"Sextama box (-35 region)","abbr":"","definition":"原核启动子-35区保守序列TTGACA，因含6个核苷酸得名。","lectures":[4],"id":"G206"},{"cn":"Srb4","en":"Srb4","abbr":"","definition":"酵母介体复合物的一个亚基，是体内几乎所有RNA聚合酶II基因转录所必需的。","lectures":[4],"id":"G207"},{"cn":"TATA结合蛋白","en":"TATA-binding protein","abbr":"TBP","definition":"TFIID中识别并结合TATA盒的亚基。","lectures":[4],"id":"G208"},{"cn":"TFIIH","en":"transcription factor II H","abbr":"TFIIH","definition":"具有ATP依赖解旋酶活性、负责启动子解链，并具激酶活性磷酸化CTD的通用转录因子。","lectures":[4],"id":"G209"},{"cn":"α-鹅膏蕈碱","en":"α-amanitin","abbr":"","definition":"来自毒鹅膏的环肽毒素，可特异性抑制真核RNA聚合酶II。","lectures":[4],"id":"G210"},{"cn":"ρ因子","en":"rho factor","abbr":"ρ","definition":"大肠杆菌中参与转录终止的蛋白质因子，具有依赖RNA的ATPase活性，与ssRNA特定位点（C丰富、G缺乏）结合。","lectures":[4],"id":"G211"},{"cn":"σ因子","en":"sigma factor","abbr":"σ","definition":"细菌RNA聚合酶的起始特异性亚基，负责启动子识别与模板链选择，起始后释放。","lectures":[4],"id":"G212"},{"cn":"三元复合物","en":"ternary complex","abbr":"","definition":"由DNA、RNA和酶组成的稳定复合物，标志转录起始向延伸阶段转变。","lectures":[4],"id":"G213"},{"cn":"上升突变","en":"up mutation","abbr":"","definition":"增加Pribnow区与共有序列一致性、提高启动子效率的突变。","lectures":[4],"id":"G214"},{"cn":"上游","en":"upstream","abbr":"","definition":"以起点所在链的5′方向为参照、与转录方向相反的序列区域。","lectures":[4],"id":"G215"},{"cn":"上游启动子元件","en":"upstream promoter element","abbr":"UPE","definition":"位于TATA区上游的保守序列，包括CAAT box与GC box等，又称上游激活序列（UAS）。","lectures":[4],"id":"G216"},{"cn":"下降突变","en":"down mutation","abbr":"","definition":"使启动子效率降低的突变。","lectures":[4],"id":"G217"},{"cn":"交叉/多环","en":"junction (multiloop)","abbr":"","definition":"三条或更多条茎在同一节点汇聚形成的二级结构元件。","lectures":[4],"id":"G218"},{"cn":"介体复合物","en":"mediator complex","abbr":"","definition":"由多个亚基组成的大型共激活因子复合物，连接转录激活因子与RNA聚合酶II转录机器。","lectures":[4],"id":"G219"},{"cn":"从头合成","en":"de novo synthesis","abbr":"","definition":"RNA聚合酶起始转录时不需要引物即可直接起始RNA链合成。","lectures":[4],"id":"G220"},{"cn":"假结","en":"pseudoknot","abbr":"","definition":"由环区的碱基与环外区域的碱基配对形成、产生类似“打结”空间结构的RNA三级结构基序。","lectures":[4],"id":"G221"},{"cn":"全酶","en":"holoenzyme","abbr":"","definition":"核心酶与σ亚基结合形成的完整RNA聚合酶（α2ββ′ωσ）。","lectures":[4],"id":"G222"},{"cn":"共有序列","en":"consensus sequence","abbr":"","definition":"对多个同功能序列比对后各位置出现频率最高的碱基组成的序列。","lectures":[4],"id":"G223"},{"cn":"内在终止子","en":"intrinsic terminator","abbr":"","definition":"不依赖于ρ因子的终止子，由一段约20个核苷酸的反向重复序列及其后约8个A:T碱基对组成。","lectures":[4],"id":"G224"},{"cn":"内环","en":"internal loop (interior loop)","abbr":"","definition":"双螺旋区中两条链上均有未配对碱基、形成对称或不对称的环状突起。","lectures":[4],"id":"G225"},{"cn":"凸环","en":"bulge (bulge loop)","abbr":"","definition":"双螺旋区中一条链上出现未配对碱基（一个或数个）而形成的局部突起。","lectures":[4],"id":"G226"},{"cn":"分子内碱基配对","en":"intramolecular base pairing","abbr":"","definition":"同一条RNA分子内部不同区段之间的碱基互补配对，形成局部双螺旋。","lectures":[4],"id":"G227"},{"cn":"前起始复合物","en":"preinitiation complex","abbr":"PIC","definition":"由转录调控因子按特定顺序结合于启动子后、RNA聚合酶与之结合形成的复杂复合物，保证有效起始转录。","lectures":[4],"id":"G228"},{"cn":"动力学校对","en":"kinetic proofreading","abbr":"","definition":"通过聚合反应与逆反应（焦磷酸解）之间的动力学竞争，使错误掺入的核苷酸更易被移除、提高忠实性的机制。","lectures":[4],"id":"G229"},{"cn":"发夹结构","en":"hairpin","abbr":"","definition":"RNA单链回折形成的茎-环结构，茎部为互补碱基配对的双螺旋区，顶端为未配对的环。","lectures":[4],"id":"G230"},{"cn":"叶绿体RNA聚合酶","en":"chloroplast RNA polymerase","abbr":"","definition":"多亚基RNA聚合酶，结构上与细菌RNA聚合酶相似，部分亚基由叶绿体基因编码。","lectures":[4],"id":"G231"},{"cn":"启始子","en":"initiator","abbr":"Inr","definition":"位于转录起始位点附近的元件，参与确定转录起始位点。","lectures":[4],"id":"G232"},{"cn":"增强子","en":"enhancer","abbr":"","definition":"能增强或促进转录起始的序列，不属于启动子的一部分，又称强化子、远上游序列。","lectures":[4],"id":"G233"},{"cn":"复制","en":"replication","abbr":"","definition":"以两条亲代DNA链均为模板合成两条DNA链，实现一个DNA分子倍增为两个DNA分子的过程。","lectures":[4],"id":"G234"},{"cn":"封闭复合物","en":"closed complex","abbr":"","definition":"RNA聚合酶初始结合到启动子上形成的复合物，DNA保持双链状态。","lectures":[4],"id":"G235"},{"cn":"小核RNA","en":"small nuclear RNA","abbr":"snRNA","definition":"真核细胞核内的小分子非编码RNA，参与剪接体组装与pre-mRNA剪接。","lectures":[4],"id":"G236"},{"cn":"小核仁RNA","en":"small nucleolar RNA","abbr":"snoRNA","definition":"真核细胞核仁内的小分子非编码RNA，指导rRNA的甲基化与假尿苷化修饰及加工。","lectures":[4],"id":"G237"},{"cn":"小胞质RNA","en":"small cytoplasmic RNA","abbr":"scRNA","definition":"真核细胞质中的小分子非编码RNA，如7SL RNA（信号识别颗粒组分）。","lectures":[4],"id":"G238"},{"cn":"开放复合物","en":"open complex","abbr":"","definition":"RNA聚合酶与启动子结合后，DNA双链在起始位点附近解开形成的复合物。","lectures":[4],"id":"G239"},{"cn":"放射线素D","en":"actinomycin D","abbr":"","definition":"与DNA结合、阻止转录延伸的模板结合抑制剂。","lectures":[4],"id":"G240"},{"cn":"核内不均一RNA","en":"heterogeneous nuclear RNA","abbr":"hnRNA","definition":"真核细胞核内由RNA聚合酶II转录产生的初级转录本，即前mRNA，经加工后成为成熟mRNA。","lectures":[4],"id":"G241"},{"cn":"核心启动子","en":"core promoter","abbr":"","definition":"真核中足以指导RNA聚合酶II从正确位点起始转录的最小启动子区域，包含BRE、TATA、Inr、DPE等元件。","lectures":[4],"id":"G242"},{"cn":"核心酶","en":"core enzyme","abbr":"","definition":"由α2ββ′ω组成的RNA聚合酶部分，具有催化RNA延伸的活性。","lectures":[4],"id":"G243"},{"cn":"核糖核苷三磷酸","en":"ribonucleoside triphosphates","abbr":"rNTPs","definition":"RNA合成的底物，即ATP、GTP、CTP、UTP。","lectures":[4],"id":"G244"},{"cn":"模板链","en":"template strand (antisense strand)","abbr":"","definition":"根据碱基互补原则指导mRNA合成的DNA链，又称反义链、负链、Watson链。","lectures":[4],"id":"G245"},{"cn":"流产式起始","en":"abortive initiation","abbr":"","definition":"转录起始复合物合成并释放2–9个核苷酸短RNA转录物的过程。","lectures":[4],"id":"G246"},{"cn":"环状RNA","en":"circular RNA","abbr":"circRNA","definition":"由前体mRNA经反向剪接形成的共价闭合环状非编码RNA，无5′帽和3′poly(A)尾。","lectures":[4],"id":"G247"},{"cn":"线粒体RNA聚合酶","en":"mitochondrial RNA polymerase","abbr":"","definition":"单亚基RNA聚合酶，相对分子量<7×10⁴，与T7噬菌体RNA聚合酶同源。","lectures":[4],"id":"G248"},{"cn":"编码链","en":"coding strand (sense strand)","abbr":"","definition":"与mRNA序列相同的那条DNA链，又称有意义链、正链、Crick链。","lectures":[4],"id":"G249"},{"cn":"翻译","en":"translation","abbr":"","definition":"将mRNA链上的核苷酸从一个特定的起始位点开始，按每3个核苷酸代表一个氨基酸的原则，依次合成一条多肽链的过程。","lectures":[4,6,7],"id":"G250"},{"cn":"茎","en":"stem","abbr":"","definition":"RNA二级结构中由互补碱基配对形成的局部双螺旋区。","lectures":[4],"id":"G251"},{"cn":"蟹钳形状","en":"crab claw shape","abbr":"","definition":"RNA聚合酶整体构象，两个大亚基形成钳状结构，中间夹出活性中心裂隙。","lectures":[4],"id":"G252"},{"cn":"触发环","en":"trigger loop","abbr":"","definition":"RNA聚合酶活性位点附近的柔性环状结构，作为NTP选择器和“分子卡尺”，通过感知碱基对几何构象参与核苷酸选择。","lectures":[4],"id":"G253"},{"cn":"诱导契合","en":"induced fit","abbr":"","definition":"正确底物结合诱导酶构象由开放转为封闭，从而稳定底物并正确定位催化残基的机制。","lectures":[4],"id":"G254"},{"cn":"转录","en":"transcription","abbr":"","definition":"以DNA两条链中的一条为模板、按5′→3′方向合成一条RNA单链的过程，产物序列与编码链相同（除T→U外），是基因表达的核心步骤。","lectures":[4],"id":"G255"},{"cn":"转录延伸复合物","en":"transcription elongation complex","abbr":"","definition":"由核心酶、DNA和新生RNA组成的复合物。","lectures":[4],"id":"G256"},{"cn":"转录忠实性","en":"transcriptional fidelity","abbr":"","definition":"RNA聚合酶选择正确核苷酸、避免错误掺入的准确程度，整体错误率约10⁻⁵。","lectures":[4],"id":"G257"},{"cn":"转录泡","en":"transcription bubble","abbr":"","definition":"转录过程中RNA聚合酶使DNA双链局部解开的区域，长度约12–14 bp。","lectures":[4],"id":"G258"},{"cn":"转录起点","en":"transcription start site (startpoint)","abbr":"TSS","definition":"与新生RNA链第一个核苷酸相对应DNA链上的碱基，记为+1。","lectures":[4],"id":"G259"},{"cn":"转移-信使RNA","en":"transfer-messenger RNA","abbr":"tmRNA","definition":"细菌中兼具tRNA与mRNA功能的RNA，参与反式翻译，解救停滞核糖体并标记降解异常蛋白。","lectures":[4],"id":"G260"},{"cn":"1类帽子","en":"cap1","abbr":"","definition":"在cap0基础上，于第二个核苷酸（原mRNA 5'第一位）的2'-OH位再加一个甲基形成的帽子结构，由2'-O-甲基转移酶完成。","lectures":[5],"id":"G261"},{"cn":"2类帽子","en":"cap2","abbr":"","definition":"在cap1基础上，mRNA链上第三个核苷酸的2'-OH位被甲基化形成的帽子结构。","lectures":[5],"id":"G262"},{"cn":"A-to-I编辑","en":"A-to-I editing","abbr":"","definition":"腺苷（adenosine）脱氨基转变为肌苷（inosine），肌苷在翻译时被读成G的RNA编辑类型，由ADAR1/2/3催化。","lectures":[5],"id":"G263"},{"cn":"C-to-U编辑","en":"C-to-U editing","abbr":"","definition":"胞苷（cytidine）转变为尿苷（uridine）的RNA编辑类型，由APOBEC1催化。","lectures":[5],"id":"G264"},{"cn":"C末端结构域","en":"C-terminal domain","abbr":"CTD","definition":"真核生物RNA聚合酶II最大亚基的羧基末端结构域，由七肽重复序列（Y1S2P3T4S5P6S7）组成，其磷酸化状态调控RNA加工因子的募集。","lectures":[5],"id":"G265"},{"cn":"GU-AG法则","en":"GU-AG rule","abbr":"","definition":"内含子5'端（剪接供体位点）以GU开始、3'端（剪接受体位点）以AG结束的边界序列规律。","lectures":[5],"id":"G266"},{"cn":"RNA世界","en":"RNA world","abbr":"","definition":"生命起源早期以RNA同时承担遗传信息储存与催化功能的假说阶段。","lectures":[5],"id":"G267"},{"cn":"RNA编辑","en":"RNA editing","abbr":"","definition":"某些RNA，特别是mRNA的一种加工方式，可以在RNA转录后改变其序列，导致DNA所编码的遗传信息的改变。","lectures":[5],"id":"G268"},{"cn":"SD序列","en":"Shine-Dalgarno sequence","abbr":"SD sequence","definition":"原核生物起始密码子AUG上游的一段保守区，又称核糖体结合位点（RBS），因与16S rRNA 3'端反向互补而在核糖体-mRNA结合中起作用。","lectures":[5],"id":"G269"},{"cn":"SR蛋白","en":"SR protein","abbr":"","definition":"富含丝氨酸（S）和精氨酸（R）的剪接调控蛋白，结合ESE并与剪接体组分互作，引导剪接机器到附近剪接位点。","lectures":[5],"id":"G270"},{"cn":"U2辅助因子","en":"U2 auxiliary factor","abbr":"U2AF","definition":"结合在3'剪接点上游富嘧啶区的蛋白因子，识别3'剪接点并引导U2 snRNP结合分支点。","lectures":[5],"id":"G271"},{"cn":"poly(A)+ RNA","en":"poly(A)+ RNA","abbr":"","definition":"带有3'多聚(A)尾巴的RNA，主要是RNA聚合酶II转录产生的mRNA。","lectures":[5],"id":"G272"},{"cn":"丁型肝炎病毒核酶","en":"Hepatitis delta virus ribozyme","abbr":"HDV ribozyme","definition":"丁型肝炎病毒基因组RNA与反基因组RNA中具有自我剪接活性的核酶结构。","lectures":[5],"id":"G273"},{"cn":"内在指导序列","en":"internal guide sequence","abbr":"IGS","definition":"I类内含子内部的一段序列，通过碱基配对把5'剪接位点与鸟苷结合位点正确对齐，决定剪接位点的选择。","lectures":[5],"id":"G274"},{"cn":"分枝点序列","en":"branch site sequence","abbr":"","definition":"位于内含子3'端上游18–50 nt处的共有序列Py80NPy87Pu75APy95，其中A百分之百保守并具有2'-OH。","lectures":[5],"id":"G275"},{"cn":"切割刺激因子","en":"cleavage stimulation factor","abbr":"CstF","definition":"与CPSF一起结合poly-A信号、促进RNA切割的因子。","lectures":[5],"id":"G276"},{"cn":"切割和聚腺苷酸环化特异性因子","en":"cleavage and polyadenylation specificity factor","abbr":"CPSF","definition":"结合poly-A信号序列、参与RNA切割与多聚腺苷化起始的因子。","lectures":[5],"id":"G277"},{"cn":"剪接体","en":"spliceosome","abbr":"","definition":"由RNA和蛋白质组成的复合物，催化RNA剪接反应。","lectures":[5],"id":"G278"},{"cn":"剪接供体位点","en":"splice donor site","abbr":"","definition":"内含子5'端与外显子交界处的剪接位点，脊椎动物中保守序列为GU。","lectures":[5],"id":"G279"},{"cn":"剪接前体","en":"pre-spliceosome","abbr":"","definition":"由U1 snRNP、U2 snRNP与pre-mRNA组装成的A复合体，是剪接体组装的前体阶段。","lectures":[5],"id":"G280"},{"cn":"剪接受体位点","en":"splice acceptor site","abbr":"","definition":"内含子3'端与外显子交界处的剪接位点，脊椎动物中保守序列为AG。","lectures":[5],"id":"G281"},{"cn":"半衰期","en":"half-life","abbr":"","definition":"mRNA分子浓度降解至初始值一半所需的时间，反映mRNA稳定性。","lectures":[5],"id":"G282"},{"cn":"单顺反子mRNA","en":"monocistronic mRNA","abbr":"","definition":"只编码一个蛋白质（多肽链）的mRNA。","lectures":[5],"id":"G283"},{"cn":"发夹型核酶","en":"hairpin ribozyme","abbr":"","definition":"形成发夹状二级结构、可进行可逆自我剪接的小型核酶。","lectures":[5],"id":"G284"},{"cn":"可变剪接","en":"alternative splicing","abbr":"","definition":"在高等真核生物个体发育或细胞分化过程中，选择性地越过某些外显子或某个剪接点进行剪接，产生出组织或发育阶段特异性mRNA的过程。","lectures":[5],"id":"G285"},{"cn":"启动子逃离","en":"promoter escape","abbr":"","definition":"RNA聚合酶II在转录起始后脱离启动子区域、进入延伸阶段的过渡过程。","lectures":[5],"id":"G286"},{"cn":"外显子剪接增强子","en":"exonic splicing enhancer","abbr":"ESE","definition":"位于外显子内的顺式作用序列，可被SR蛋白结合并增强邻近剪接位点的使用。","lectures":[5],"id":"G287"},{"cn":"外显子连接复合体","en":"exon junction complex","abbr":"EJC","definition":"剪接完成后沉积在外显子-外显子连接处上游约20–24 nt处的蛋白复合体，作为mRNA已成熟的标志。","lectures":[5],"id":"G288"},{"cn":"多聚(A)尾巴","en":"poly(A) tail","abbr":"","definition":"mRNA 3'端由腺苷酸残基构成的多聚尾。","lectures":[5],"id":"G289"},{"cn":"多聚(A)结合蛋白","en":"poly(A)-binding protein","abbr":"PABP","definition":"特异性结合在多聚(A)尾巴上的蛋白质。","lectures":[5],"id":"G290"},{"cn":"多聚(A)聚合酶","en":"poly(A) polymerase","abbr":"PAP","definition":"催化在mRNA 3'端添加腺苷酸残基、形成多聚(A)尾巴的酶。","lectures":[5],"id":"G291"},{"cn":"套索","en":"lariat","abbr":"","definition":"RNA剪接中的中间产物，由5'-2'键形成一个带尾巴的环状结构（a circular structure with a tail is created by a 5'-2' bond）。","lectures":[5],"id":"G292"},{"cn":"小核核糖核蛋白","en":"small nuclear ribonucleoprotein","abbr":"snRNP","definition":"由小核RNA（snRNA）与一组蛋白质组成的复合物，是剪接体的主要组成成分。","lectures":[5],"id":"G293"},{"cn":"帽子结合复合物","en":"cap-binding complex","abbr":"CBC","definition":"结合在mRNA 5'端帽子结构上的蛋白复合物，参与剪接体形成并促进第一个内含子的剪接。","lectures":[5],"id":"G294"},{"cn":"开放阅读框","en":"open reading frame","abbr":"ORF","definition":"推测很可能编码一个蛋白质的阅读框；每条mRNA的蛋白编码区由连续、不重叠的密码子串组成，以起始密码子开始、以终止密码子结束。","lectures":[5,6],"id":"G295"},{"cn":"引导RNA","en":"guide RNA","abbr":"gRNA","definition":"一类小分子RNA，可与mRNA被编辑部分发生非常规互补（含G-U配对），对mRNA前体分子的编辑起指导作用。","lectures":[5],"id":"G296"},{"cn":"无多聚腺苷酸尾巴的mRNA","en":"Poly(A)⁻ mRNA","abbr":"","definition":"细胞内不含poly(A)尾巴的一类真核mRNA，约占细胞mRNA总量的1/3。","lectures":[5],"id":"G297"},{"cn":"核不均一RNA","en":"heterogeneous nuclear RNA","abbr":"hnRNA","definition":"mRNA的前体，即核内转录初产物及其加工中间体。","lectures":[5],"id":"G298"},{"cn":"核仁小RNA","en":"small nucleolar RNA","abbr":"snoRNA","definition":"存在于核仁中的一类小RNA，在rRNA的加工中起作用。","lectures":[5],"id":"G299"},{"cn":"核糖体结合位点","en":"ribosome-binding site","abbr":"RBS","definition":"原核mRNA上起始密码子上游、供核糖体识别并结合的序列。","lectures":[5],"id":"G300"},{"cn":"核酶","en":"ribozyme","abbr":"","definition":"一类具有催化功能的RNA分子，通过催化靶位点RNA链中磷酸二酯键的断裂，特异性地剪切底物RNA分子。","lectures":[5,7],"id":"G301"},{"cn":"细胞核小RNA","en":"small nuclear RNA","abbr":"snRNA","definition":"细胞核中的小分子RNA，参与剪接过程，与其它蛋白一起构成剪接体。","lectures":[5],"id":"G302"},{"cn":"编辑区","en":"editing region","abbr":"","definition":"gRNA中决定U插入位置的片段。","lectures":[5],"id":"G303"},{"cn":"自我剪接","en":"self-splicing","abbr":"","definition":"内含子仅依赖其自身RNA序列的催化作用，将自身从RNA中切除的能力。","lectures":[5],"id":"G304"},{"cn":"起始因子IFⅢ","en":"initiation factor Ⅲ","abbr":"IFⅢ","definition":"幻灯片指出翻译时帽子结构供IFⅢ和核糖体识别，是翻译所必需的。","lectures":[5],"id":"G305"},{"cn":"转酯反应","en":"transesterification","abbr":"","definition":"一种酯交换反应，RNA剪接中羟基作为亲核体攻击磷酸二酯键，断裂旧键同时形成新键，不消耗ATP。","lectures":[5],"id":"G306"},{"cn":"锚定区","en":"anchor","abbr":"","definition":"gRNA中引导gRNA结合到待编辑mRNA区域的片段。","lectures":[5],"id":"G307"},{"cn":"锤头核酶","en":"hammerhead ribozyme","abbr":"","definition":"一类具有锤头状二级结构、能进行位点特异性自我切割的小型RNA催化剂。","lectures":[5],"id":"G308"},{"cn":"零类帽子","en":"cap0","abbr":"","definition":"第一个甲基出现在所有真核细胞mRNA中的帽子结构，甲基加在鸟嘌呤N7位，由鸟苷酸-7甲基转移酶催化。","lectures":[5],"id":"G309"},{"cn":"鸟苷结合口袋","en":"guanine-binding pocket","abbr":"","definition":"I类内含子中部核心结构中容纳游离鸟苷/鸟苷酸的凹槽，为亲核攻击提供定位。","lectures":[5],"id":"G310"},{"cn":"5'TOP mRNA","en":"5' terminal oligopyrimidine mRNA","abbr":"5'TOP mRNA","definition":"5'端带有寡嘧啶序列的一类mRNA，多编码核糖体蛋白与翻译因子，其翻译受p53等调控。","lectures":[6],"id":"G311"},{"cn":"A位点","en":"aminoacyl site","abbr":"A site","definition":"核糖体上新到来的氨酰-tRNA进入并结合的位点，位于大、小亚基交界面。","lectures":[6],"id":"G312"},{"cn":"D臂","en":"D-arm","abbr":"","definition":"根据其含有二氢尿嘧啶（dihydrouracil）而命名的tRNA手臂。","lectures":[6],"id":"G313"},{"cn":"E位点","en":"exit site","abbr":"E site","definition":"核糖体上卸载后的去氨酰-tRNA离开核糖体前所占据的位点。","lectures":[6],"id":"G314"},{"cn":"G-U摆动配对","en":"G-U wobble pairing","abbr":"","definition":"G与U之间形成两对氢键的非标准配对，只发生在密码子第三位（对应反密码子第一位）。","lectures":[6],"id":"G315"},{"cn":"L形三级结构","en":"L-shaped tertiary structure","abbr":"","definition":"tRNA在二级结构基础上折叠形成的L形三维结构，受体臂顶端和反密码子臂套索状结构分别位于L的两个端点。","lectures":[6],"id":"G316"},{"cn":"MDM2","en":"Mouse Double Minute 2 homolog","abbr":"MDM2/HDM2","definition":"E3泛素连接酶，与p53结合并介导p53的泛素化及蛋白酶体降解，是p53的主要负调控因子。","lectures":[6],"id":"G317"},{"cn":"P位点","en":"peptidyl site","abbr":"P site","definition":"核糖体上肽酰-tRNA结合的位点，位于大、小亚基交界面。","lectures":[6],"id":"G318"},{"cn":"TψC臂","en":"TψC arm","abbr":"","definition":"根据3个核苷酸命名的tRNA手臂，其中ψ表示拟尿嘧啶（pseudouridine），由5 bp臂和含有GTψC的环组成。","lectures":[6],"id":"G319"},{"cn":"p53蛋白","en":"tumor protein p53","abbr":"p53","definition":"细胞“守门人”转录因子，感受多种应激后激活靶基因转录，引发细胞周期阻滞、DNA修复、凋亡或衰老。","lectures":[6],"id":"G320"},{"cn":"tRNA","en":"transfer RNA","abbr":"tRNA","definition":"模板mRNA与氨基酸之间的接合体（adaptor），一端结合特定氨基酸，另一端以反密码子与mRNA密码子配对。","lectures":[6],"id":"G321"},{"cn":"三叶草形结构","en":"cloverleaf structure","abbr":"","definition":"tRNA二级结构中由小片段碱基互补配对形成的特征性形态，包含4条手臂和3个环。","lectures":[6],"id":"G322"},{"cn":"反密码子","en":"anticodon","abbr":"","definition":"tRNA 上与 mRNA 密码子互补配对的三核苷酸序列，决定该 tRNA 携带的氨基酸被安放到哪个密码子位置。","lectures":[6,7],"id":"G323"},{"cn":"反密码子臂","en":"anticodon arm","abbr":"","definition":"根据位于套索中央的三联反密码子命名的tRNA手臂，由5 bp的臂和7个核苷的环组成。","lectures":[6],"id":"G324"},{"cn":"可变臂（多余臂）","en":"variable arm (extra arm)","abbr":"","definition":"由3到21个核苷组成的tRNA手臂，可能会形成多达7 bp的臂。","lectures":[6],"id":"G325"},{"cn":"同义密码子","en":"synonymous codon","abbr":"","definition":"对应于同一氨基酸的密码子。","lectures":[6],"id":"G326"},{"cn":"同工tRNA","en":"isoacceptor tRNA","abbr":"","definition":"代表相同氨基酸的不同tRNA。","lectures":[6],"id":"G327"},{"cn":"多聚核糖体","en":"polyribosome (polysome)","abbr":"","definition":"多个核糖体同时结合在同一条mRNA上形成的串珠状结构，可同时翻译产生多条多肽链。","lectures":[6],"id":"G328"},{"cn":"密码子","en":"codon","abbr":"","definition":"代表一个氨基酸或终止信号的三核苷酸。","lectures":[6],"id":"G329"},{"cn":"密码的普遍性","en":"universality of the genetic code","abbr":"","definition":"生物界（从病毒、细菌到真核生物）基本共用同一套遗传密码。","lectures":[6],"id":"G330"},{"cn":"密码的连续性","en":"commaless","abbr":"","definition":"密码子之间无分隔符号，三个核苷酸一组连续阅读。","lectures":[6],"id":"G331"},{"cn":"延伸tRNA","en":"elongator tRNA","abbr":"","definition":"除起始tRNA以外的其他tRNA统称为延伸tRNA。","lectures":[6],"id":"G332"},{"cn":"摆动假说","en":"wobble hypothesis","abbr":"","definition":"1966年Crick提出，认为反密码子5'端第一位碱基与密码子第三位碱基配对时具有较大自由度，可形成非标准碱基配对。","lectures":[6],"id":"G333"},{"cn":"斯维德伯格单位","en":"Svedberg unit","abbr":"S","definition":"用于衡量离心沉降速度的单位。","lectures":[6],"id":"G334"},{"cn":"校正tRNA","en":"suppressor tRNA","abbr":"","definition":"通过改变反密码子区校正无义突变和错义突变的tRNA。","lectures":[6],"id":"G335"},{"cn":"核糖体RNA","en":"ribosomal RNA","abbr":"rRNA","definition":"构成核糖体催化与结构核心的RNA，与几十种蛋白质共同组成核糖体亚细胞颗粒。","lectures":[6],"id":"G336"},{"cn":"核糖体外功能","en":"extraribosomal function","abbr":"","definition":"核糖体蛋白在核糖体翻译机器之外独立发挥的调控功能，如参与信号转导、转录调控、细胞周期与凋亡调控等。","lectures":[6],"id":"G337"},{"cn":"核糖体应激","en":"ribosomal stress (nucleolar stress)","abbr":"","definition":"由rRNA转录与核糖体蛋白表达异常，或pre-rRNA加工、核糖体组装受阻所引起的一类细胞应激。","lectures":[6],"id":"G338"},{"cn":"核糖体异质性","en":"ribosome heterogeneity","abbr":"","definition":"细胞内不同核糖体在rRNA修饰、核糖体蛋白组成及相关因子结合上存在差异，从而具有不同的翻译选择性。","lectures":[6],"id":"G339"},{"cn":"核糖体循环","en":"ribosome cycle","abbr":"","definition":"小亚基与大亚基结合到mRNA上翻译，每轮翻译结束后解离，如此反复的结合—解离序列。","lectures":[6],"id":"G340"},{"cn":"核糖体病","en":"ribosomopathy","abbr":"","definition":"核糖体生物合成或功能相关基因缺陷所导致的一类疾病，常表现为骨髓衰竭、先天畸形等。","lectures":[6],"id":"G341"},{"cn":"氨酰-tRNA合成酶","en":"aminoacyl-tRNA synthetase","abbr":"ARS","definition":"催化特定氨基酸与其对应tRNA共价偶联（装料）的酶，对氨基酸和tRNA两者均具有高度专一性。","lectures":[6],"id":"G342"},{"cn":"硒代半胱氨酸","en":"selenocysteine","abbr":"","definition":"由UGA密码子编码的第21种蛋白质氨基酸，掺入依赖mRNA上下文（SECIS元件）等特殊因子。","lectures":[6],"id":"G343"},{"cn":"第三碱基简并性","en":"third base degeneracy","abbr":"","definition":"密码子第三位核苷酸对密码子含义的影响较小，即第三位碱基改变常不改变或较少改变所编码的氨基酸。","lectures":[6],"id":"G344"},{"cn":"简并性","en":"degeneracy","abbr":"","definition":"由一种以上密码子编码同一个氨基酸的现象。","lectures":[6],"id":"G345"},{"cn":"终止密码子","en":"termination codon (stop codon)","abbr":"","definition":"UAG、UAA、UGA三者之一，使蛋白质合成终止，不编码任何氨基酸。","lectures":[6],"id":"G346"},{"cn":"肽基转移酶中心","en":"peptidyl transferase center","abbr":"","definition":"位于大亚基上、催化肽键形成的活性中心，位于P位与A位之间。","lectures":[6],"id":"G347"},{"cn":"装料（氨基酰化）","en":"charging (aminoacylation)","abbr":"","definition":"氨酰-tRNA合成酶催化氨基酸的羧基与tRNA 3'端腺苷酸核糖的2'-或3'-羟基形成高能酯键的过程。","lectures":[6],"id":"G348"},{"cn":"解码中心","en":"decoding center","abbr":"","definition":"位于小亚基上，负责对mRNA密码子进行序列特异性识别、检验tRNA反密码子配对的区域。","lectures":[6],"id":"G349"},{"cn":"起始tRNA","en":"initiator tRNA","abbr":"","definition":"能特异性识别mRNA模板上起始密码子的tRNA。","lectures":[6],"id":"G350"},{"cn":"起始密码子","en":"initiation codon (start codon)","abbr":"","definition":"用于起始蛋白质合成的特殊密码子，通常为AUG。","lectures":[6],"id":"G351"},{"cn":"遗传密码（三联子密码）","en":"genetic code (triplet code)","abbr":"","definition":"mRNA上每3个核苷酸翻译成多肽链上的一个氨基酸，这3个核苷酸称为一个密码子；遗传密码指DNA或RNA中的三联体与蛋白质中氨基酸之间的对应关系。","lectures":[6],"id":"G352"},{"cn":"阅读框","en":"reading frame","abbr":"","definition":"把核苷酸序列按三联体读取的三种可能方式之一；从起始密码子开始、以三个核苷酸为一组连续划分密码子。","lectures":[6],"id":"G353"},{"cn":"非重叠","en":"non-overlapping","abbr":"","definition":"每个核苷酸只属于一个密码子，相邻密码子不共享核苷酸。","lectures":[6],"id":"G354"},{"cn":"43S 起始前复合体","en":"43S pre-initiation complex","abbr":"","definition":"真核 40S 小亚基在 eIF1、eIF1A、eIF3、eIF2-GTP-Met-tRNAiMet、eIF5B-GTP 参与下组装成的起始前复合体。","lectures":[7],"id":"G355"},{"cn":"EF-G","en":"elongation factor G","abbr":"EF-G","definition":"细菌移位因子，具 GTP 酶活性，结合核糖体后催化 mRNA-tRNA 相对移动一个密码子。","lectures":[7],"id":"G356"},{"cn":"EF-Ts","en":"elongation factor Ts","abbr":"EF-Ts","definition":"鸟苷酸交换因子，促使 EF-Tu 释放 GDP 并重新结合 GTP。","lectures":[7],"id":"G357"},{"cn":"EF-Tu","en":"elongation factor Tu","abbr":"EF-Tu","definition":"细菌延伸因子，与 GTP 及氨酰-tRNA 结合，将其运送至核糖体 A 位；具 GTP 酶活性。","lectures":[7],"id":"G358"},{"cn":"I 类释放因子","en":"class I release factor","abbr":"","definition":"识别终止密码子，并能催化新合成的多肽链从 P 位点的 tRNA 中水解释放出来。","lectures":[7],"id":"G359"},{"cn":"IF1","en":"Initiation factor 1","abbr":"IF1","definition":"结合于 30S 亚基 A 位点的起始因子，防止 tRNA 结合到小亚基未来 A 位点的位置上。","lectures":[7],"id":"G360"},{"cn":"IF2","en":"Initiation factor 2","abbr":"IF2","definition":"GTP 酶，与起始过程的 3 个主要成分相互作用，催化 fMet-tRNAfMet 和小亚基的结合，并阻止其他负载 tRNA 与小亚基结合。","lectures":[7],"id":"G361"},{"cn":"IF3","en":"Initiation factor 3","abbr":"IF3","definition":"结合于小亚基并阻止其与大亚基结合，对新的循环至关重要。","lectures":[7],"id":"G362"},{"cn":"II 类释放因子","en":"class II release factor","abbr":"","definition":"在多肽链释放后刺激 I 类释放因子从核糖体中解离出来。","lectures":[7],"id":"G363"},{"cn":"Kozak 共有序列","en":"Kozak consensus sequence","abbr":"","definition":"起始密码子 AUG 周围的保守序列 GCCACCAUGG，其中 -3 位为嘌呤 G/A、+4 位为 G 时翻译效率最高。","lectures":[7],"id":"G364"},{"cn":"P 位点","en":"P site (peptidyl site)","abbr":"","definition":"核糖体上结合肽基-tRNA 的位点；翻译起始时起始 tRNA 即定位于此。","lectures":[7],"id":"G365"},{"cn":"SD 序列","en":"Shine-Dalgarno sequence","abbr":"SD","definition":"几乎所有原核生物 mRNA 上都有的一个 5'-AGGAGGU-3' 序列，这个富嘌呤区与 30S 亚基上 16S rRNA 3' 末端的富嘧啶区 5'-GAUCACCUCCUUA-3' 相互补。","lectures":[7],"id":"G366"},{"cn":"伴侣素","en":"chaperonin","abbr":"","definition":"包括 HSP60 和 HSP10（原核细胞中的同源物分别为 GroEL 和 GroES），主要是为非自发性折叠蛋白提供能折叠形成天然结构的微环境。","lectures":[7],"id":"G367"},{"cn":"伸长因子","en":"elongation factor","abbr":"EF","definition":"协助氨酰-tRNA 入位（EF-Tu）、催化移位（EF-G）等步骤的可溶性蛋白因子。","lectures":[7],"id":"G368"},{"cn":"入位","en":"accommodation","abbr":"","definition":"氨酰-tRNA 反密码子配对后，其受体端旋转进入大亚基肽基转移酶中心的过程。","lectures":[7],"id":"G369"},{"cn":"分子伴侣","en":"molecular chaperone","abbr":"","definition":"一类序列上没有相关性但有共同功能的保守性蛋白质，它们在细胞内能帮助其他多肽进行正确的折叠、组装、运转和降解。","lectures":[7],"id":"G370"},{"cn":"去氨酰化-tRNA","en":"deacylated tRNA","abbr":"","definition":"失去所携带氨基酸/肽链的空载 tRNA，肽键形成后出现于 P 位，移位后进入 E 位并释放。","lectures":[7],"id":"G371"},{"cn":"嘌呤霉素","en":"puromycin","abbr":"","definition":"AA-tRNA 的结构类似物，通过提前释放肽链来抑制蛋白质合成。","lectures":[7],"id":"G372"},{"cn":"因子结合中心","en":"factor binding center","abbr":"","definition":"核糖体上 EF-Tu 等翻译因子结合的位点；正确配对使 EF-Tu 与之作用并激活其 GTP 酶活性。","lectures":[7],"id":"G373"},{"cn":"多聚核糖体","en":"polysome / polyribosome","abbr":"","definition":"多个核糖体同时结合在同一条 mRNA 上进行翻译的复合体。","lectures":[7],"id":"G374"},{"cn":"帽子结构","en":"cap structure","abbr":"m7GpppNp","definition":"真核 mRNA 5' 端的 m7GpppNp 结构，参与形成翻译起始复合物。","lectures":[7],"id":"G375"},{"cn":"扫描机制","en":"scanning","abbr":"","definition":"真核 40S 小亚基对 mRNA 起始密码子的识别过程，即从 5' 端向 3' 方向滑动寻找起始 AUG。","lectures":[7],"id":"G376"},{"cn":"核糖体灭活蛋白","en":"ribosome-inactivating protein","abbr":"RIP","definition":"能灭活核糖体从而抑制蛋白质合成的蛋白类毒素。","lectures":[7],"id":"G377"},{"cn":"梭链孢酸","en":"fusidic acid","abbr":"","definition":"作用于 EF-G 的抗生素，阻止 EF-G-GDP 从核糖体中释放，从而抑制翻译。","lectures":[7],"id":"G378"},{"cn":"氨酰-tRNA 合成酶","en":"aminoacyl-tRNA synthetase","abbr":"","definition":"催化氨基酸与相应 tRNA 结合、生成氨酰-tRNA（AA-tRNA）的酶。","lectures":[7],"id":"G379"},{"cn":"活化氨基酸（氨酰-tRNA）","en":"activated amino acid / aminoacyl-tRNA","abbr":"AA-tRNA","definition":"氨基酸与 tRNA 共价连接形成的产物，是蛋白质合成中氨基酸的活化形式。","lectures":[7],"id":"G380"},{"cn":"热休克蛋白","en":"heat shock protein","abbr":"HSP","definition":"一类应激反应性蛋白，包括 HSP70、HSP40 和 GrpE 三族，广泛存在于原核及真核细胞中；三者协同作用，促使某些能自发折叠的蛋白质正确折叠形成天然空间构象。","lectures":[7],"id":"G381"},{"cn":"白喉毒素","en":"diphtheria toxin","abbr":"","definition":"对 EF-Tu 进行化学修饰，抑制 EF-Tu 的功能，作用于真核细胞。","lectures":[7],"id":"G382"},{"cn":"磷酸化","en":"phosphorylation","abbr":"","definition":"在蛋白激酶催化下，将 ATP 或 GTP 的 γ-磷酸基团转移至蛋白质特定氨基酸残基上的共价修饰过程。","lectures":[7],"id":"G383"},{"cn":"移位","en":"translocation","abbr":"","definition":"核糖体沿 mRNA 移动一个密码子的距离，使肽酰-tRNA 从 A 位点移至 P 位点，空出 A 位点供下一个 AA-tRNA 进入。","lectures":[7],"id":"G384"},{"cn":"糖基化","en":"glycosylation","abbr":"","definition":"在糖基转移酶作用下将不同类型的糖分子添加至蛋白质侧链特定氨基酸残基上形成糖苷键的翻译后修饰。","lectures":[7],"id":"G385"},{"cn":"终止密码子","en":"stop codon","abbr":"","definition":"mRNA 上不编码氨基酸、信号肽链终止的密码子。","lectures":[7],"id":"G386"},{"cn":"翻译后修饰","en":"post-translational modification","abbr":"PTM","definition":"蛋白质合成后对其氨基酸侧链进行的共价化学修饰，改变蛋白质的活性、定位、稳定性或相互作用。","lectures":[7],"id":"G387"},{"cn":"肽基-tRNA","en":"peptidyl-tRNA","abbr":"","definition":"在 P 位携带正在生长的肽链的 tRNA。","lectures":[7],"id":"G388"},{"cn":"肽基转移酶","en":"peptidyl transferase","abbr":"","definition":"催化肽键形成的活性中心，位于大亚基上，本质由 rRNA 构成（核酶）。","lectures":[7],"id":"G389"},{"cn":"蓖麻毒素","en":"ricin","abbr":"","definition":"蛋白质毒素，在核糖体大亚基的因子结合中心切断 28S rRNA 或 23S rRNA，阻挠翻译因子 GTP 酶的活化。","lectures":[7],"id":"G390"},{"cn":"蛋白激酶","en":"protein kinase","abbr":"PK","definition":"催化蛋白质磷酸化（把磷酸基团转移到底物蛋白氨基酸侧链上）的酶。","lectures":[7],"id":"G391"},{"cn":"蛋白磷酸酶","en":"protein phosphatase","abbr":"PP","definition":"催化蛋白质去磷酸化（水解去除磷酸基团）的酶。","lectures":[7],"id":"G392"},{"cn":"蛋白酶体","en":"proteasome","abbr":"","definition":"由一个中心圆柱及两端塞住的大型蛋白质复合物组成的降解机器，中心圆柱由活性部位面向内腔的蛋白酶形成。","lectures":[7,8],"id":"G393"},{"cn":"起始 tRNA","en":"initiator tRNA","abbr":"","definition":"在翻译起始时进入核糖体 P 位点、携带起始氨基酸的 tRNA。","lectures":[7],"id":"G394"},{"cn":"起始因子","en":"initiation factor","abbr":"IF/eIF","definition":"协助核糖体、mRNA 与起始 tRNA 组装成起始复合物的蛋白质因子。","lectures":[7],"id":"G395"},{"cn":"起始密码子","en":"start codon","abbr":"","definition":"mRNA 上被起始 tRNA 识别、确定翻译阅读框起点的密码子。","lectures":[7],"id":"G396"},{"cn":"释放因子","en":"release factor","abbr":"RF","definition":"识别终止密码子并促使肽链从核糖体释放的蛋白质因子。","lectures":[7],"id":"G397"},{"cn":"链霉素","en":"streptomycin","abbr":"","definition":"一种碱性三糖类抗生素，以多种方式抑制原核生物核糖体。","lectures":[7],"id":"G398"},{"cn":"错读","en":"miscoding / misreading","abbr":"","definition":"翻译过程中氨酰-tRNA 与 mRNA 密码子错误配对，导致掺入错误氨基酸。","lectures":[7],"id":"G399"},{"cn":"COP9信号体","en":"COP9 signalosome","abbr":"CSN","definition":"表中列为Cullin蛋白的去Neddylation酶（内源），可切除Cullin上的NEDD8。","lectures":[8],"id":"G400"},{"cn":"Cullin-RING连接酶","en":"Cullin-RING ligases","abbr":"CRLs","definition":"以cullin蛋白为骨架组装的一类高度多态的E3泛素连接酶复合物。","lectures":[8],"id":"G401"},{"cn":"HECT型E3","en":"HECT E3 ligase","abbr":"HECT","definition":"先与泛素形成共价E3-泛素中间体、再把泛素转移给底物的E3类型。","lectures":[8],"id":"G402"},{"cn":"NEDD8","en":"neural precursor cell-expressed developmentally downregulated 8","abbr":"NEDD8","definition":"一类结构上与泛素相似的类泛素分子，含81 aa，与泛素59%相同、80%同源，参与蛋白质翻译后修饰（NEDDylation）。","lectures":[8],"id":"G403"},{"cn":"NEDDylation","en":"NEDDylation","abbr":"","definition":"NEDD8通过类似泛素化的酶级联反应共价连接到靶蛋白赖氨酸上的翻译后修饰过程。","lectures":[8],"id":"G404"},{"cn":"N端法则","en":"N-end rule","abbr":"","definition":"蛋白质N端第一个氨基酸的种类决定其体内半衰期（稳定性）的规律。","lectures":[8],"id":"G405"},{"cn":"PML核体","en":"PML nuclear body","abbr":"PML NB","definition":"由PML蛋白为核心组装的无膜核内结构域，SUMO化对其组装和动态调控至关重要。","lectures":[8],"id":"G406"},{"cn":"RING型E3","en":"RING E3 ligase","abbr":"RING","definition":"不形成共价中间体、直接促使泛素从E2~Ub转移到底物的E3类型。","lectures":[8],"id":"G407"},{"cn":"RNF4","en":"RING finger protein 4","abbr":"RNF4","definition":"含RING结构域的泛素连接酶（E3），通过其SIM（SUMO-interacting motif）识别多聚SUMO链，对SUMO化蛋白加上泛素链，介导其蛋白酶体降解。","lectures":[8],"id":"G408"},{"cn":"Ran GTP酶","en":"Ran GTPase","abbr":"Ran","definition":"决定核质运输方向的低分子量GTP酶，其GTP/GDP状态在核质间形成梯度。","lectures":[8],"id":"G409"},{"cn":"Rpn11 (POH1)","en":"Rpn11 (POH1)","abbr":"","definition":"19S调节颗粒中的金属蛋白酶，具有去泛素化酶活性。","lectures":[8],"id":"G410"},{"cn":"SUMO化修饰","en":"SUMOylation","abbr":"","definition":"SUMO（small ubiquitin-like modifier）共价连接到赖氨酸残基上的翻译后修饰，该赖氨酸通常位于或邻近共有序列ψ-K-x-E（ψ为疏水氨基酸，x为任意氨基酸，K为赖氨酸，E为谷氨酸）。","lectures":[8],"id":"G411"},{"cn":"SUMO特异性蛋白酶","en":"SUMO-specific protease family","abbr":"SENP","definition":"负责从底物上移除SUMO、使SUMO化修饰可逆的蛋白酶家族。","lectures":[8],"id":"G412"},{"cn":"SUMO蛋白","en":"Small Ubiquitin-related Modifier","abbr":"SUMO","definition":"一类类泛素蛋白（Ubl），通过共价连接到底物蛋白赖氨酸残基上，称为SUMO化。","lectures":[8],"id":"G413"},{"cn":"Tim复合物","en":"translocase of the inner membrane","abbr":"Tim","definition":"线粒体内膜上的转运复合物，介导前体蛋白穿内膜。","lectures":[8],"id":"G414"},{"cn":"Tom复合物","en":"translocase of the outer membrane","abbr":"Tom","definition":"线粒体外膜上的转运复合物，含受体与通道组分，负责识别前体蛋白并穿外膜。","lectures":[8],"id":"G415"},{"cn":"两亲α-螺旋","en":"amphipathic α-helix","abbr":"","definition":"一侧为亲水/带电荷面、另一侧为疏水面，可插入膜或与膜表面相互作用的螺旋结构。","lectures":[8],"id":"G416"},{"cn":"信号肽","en":"signal peptide","abbr":"","definition":"绝大部分被运入内质网内腔的蛋白质所带有的、位于氨基末端（13-36个残基）的引导转运序列。","lectures":[8],"id":"G417"},{"cn":"信号肽假说","en":"signal peptide hypothesis","abbr":"","definition":"蛋白质的定位信息存在于其自身结构（信号序列）中，通过与膜上特殊受体的相互作用得以表达。","lectures":[8],"id":"G418"},{"cn":"信号肽酶","en":"signal peptidase","abbr":"","definition":"位于内质网腔面、切除信号肽的蛋白酶。","lectures":[8],"id":"G419"},{"cn":"信号识别颗粒","en":"signal recognition particle","abbr":"SRP","definition":"帮助信号肽插入粗面内质网膜、识别信号序列并指导核糖体到转运通道的RNA-蛋白质复合体。","lectures":[8],"id":"G420"},{"cn":"停靠蛋白（SRP受体）","en":"Docking Protein","abbr":"DP","definition":"SRP的受体，又称SRP受体蛋白，与SRP-信号肽-多核糖体复合物结合。","lectures":[8],"id":"G421"},{"cn":"出核信号序列","en":"nuclear export sequence","abbr":"NES","definition":"介导蛋白质从细胞核输出到细胞质的信号序列，特征为疏水性氨基酸（尤其亮氨酸和异亮氨酸）富集区域。","lectures":[8],"id":"G422"},{"cn":"前导肽","en":"leader peptide / presequence / transit peptide","abbr":"","definition":"蛋白质N端引导其定向转运的信号序列；狭义常指线粒体蛋白转运信号，被TOM/TIM系统识别导入线粒体后被切除；广义泛指位于蛋白质N端、引导其转运到特定部位的信号序列。","lectures":[8],"id":"G423"},{"cn":"去泛素化酶","en":"deubiquitinating enzymes","abbr":"DUBs","definition":"一类可加工泛素或泛素样基因产物、逆转单个泛素（样）蛋白对蛋白质的修饰并重塑靶蛋白上多聚泛素（样）链的蛋白酶。","lectures":[8],"id":"G424"},{"cn":"周质空间","en":"periplasmic space (periplasm)","abbr":"","definition":"细菌内膜与外膜之间的空间，可容纳周质蛋白。","lectures":[8],"id":"G425"},{"cn":"易位子（多肽运转复合物）","en":"translocon","abbr":"","definition":"内质网膜上形成蛋白传导通道的膜蛋白复合物，新生肽由此穿膜。","lectures":[8],"id":"G426"},{"cn":"核孔复合体","en":"nuclear pore complex","abbr":"NPC","definition":"位于核被膜上、由内外核膜融合形成的大型蛋白复合体通道，介导核质间物质交换。","lectures":[8],"id":"G427"},{"cn":"核定位序列","en":"nuclear localization sequence","abbr":"NLS","definition":"核蛋白中作为入核信号的肽段，被核转运受体识别并携带蛋白进入细胞核。","lectures":[8],"id":"G428"},{"cn":"止运入肽段","en":"stop-transfer peptide","abbr":"","definition":"前导肽中使正在转运的多肽停止穿膜、将蛋白锚定/留在膜间空间或膜内的疏水肽段。","lectures":[8],"id":"G429"},{"cn":"泛素","en":"ubiquitin","abbr":"Ub","definition":"由76个氨基酸组成、8.5 kDa、序列高度保守的小蛋白，作为标签共价标记待降解蛋白。","lectures":[8],"id":"G430"},{"cn":"泛素样蛋白","en":"ubiquitin-like proteins","abbr":"Ubls","definition":"一类小家族蛋白修饰物，特征为具有泛素折叠（球状β-grasp折叠）以及蛋白水解成熟后暴露的C端Gly-Gly基序。","lectures":[8],"id":"G431"},{"cn":"泛素激活酶","en":"ubiquitin-activating enzyme","abbr":"E1","definition":"结合ATP-Mg2+与泛素、催化泛素C端腺苷酰化并把泛素传递给E2的酶。","lectures":[8],"id":"G432"},{"cn":"泛素结合酶","en":"ubiquitin-conjugating enzyme","abbr":"E2","definition":"催化泛素化反应第二步的酶，又称泛素载体酶，接受E1转来的泛素形成E2-泛素硫酯中间体。","lectures":[8],"id":"G433"},{"cn":"泛素连接酶","en":"ubiquitin ligase","abbr":"E3","definition":"识别底物并催化泛素从E2转移到底物赖氨酸ε-氨基、形成异肽键的酶。","lectures":[8],"id":"G434"},{"cn":"翻译后转运","en":"post-translational translocation","abbr":"","definition":"蛋白质从核糖体上释放后才发生的转运方式，发生在游离核糖体上，合成完成后才转运。","lectures":[8],"id":"G435"},{"cn":"翻译运转同步机制（共翻译转运）","en":"co-translational translocation","abbr":"","definition":"某个蛋白质的合成与运转同时发生的转运方式，发生在与内质网膜结合的核糖体上。","lectures":[8],"id":"G436"},{"cn":"蛋白质转运","en":"protein transport / protein targeting","abbr":"","definition":"新合成的蛋白质被定向运送至其发挥功能的亚细胞部位的过程，强调特异性分选（sorting）与准确无误。","lectures":[8],"id":"G437"},{"cn":"转运受体（Importin）","en":"transport receptor / importin","abbr":"","definition":"识别货物蛋白上的定位信号并携带其穿过核孔的载体蛋白。","lectures":[8],"id":"G438"},{"cn":"Argonaute家族蛋白","en":"Argonaute family of proteins","abbr":"AGO","definition":"和单链的RNA（siRNA）共同组装形成RISC的蛋白家族，绑定21-35个核苷酸的RNA，包括miRNA和siRNA以及相关的靶mRNA，然后通过其内切核酸酶功能发挥剪切作用。","lectures":[9],"id":"G439"},{"cn":"Cre/LoxP系统","en":"Cre/LoxP system","abbr":"","definition":"来源于噬菌体的位点特异性重组系统，是四种条件型定位重组系统中应用最广泛的一种。","lectures":[9],"id":"G440"},{"cn":"CreERT2","en":"inducible Cre recombinase (CreERT2)","abbr":"","definition":"含有雌激素受体的配体结合区突变体与Cre重组酶的融合蛋白，在表达该融合蛋白的小鼠中实现他莫昔芬诱导的Cre活性。","lectures":[9],"id":"G441"},{"cn":"Ct值","en":"Ct value (threshold cycle)","abbr":"Ct","definition":"产物荧光强度首次超过设定阈值时PCR反应所需的循环数，即threshold横线与扩增曲线相交所得交点对应的循环数。","lectures":[9],"id":"G442"},{"cn":"DNA克隆","en":"DNA cloning","abbr":"","definition":"构建重组DNA分子并在细胞中保存和扩增这些分子。","lectures":[9],"id":"G443"},{"cn":"Northern杂交","en":"Northern hybridization / Northern blot","abbr":"","definition":"将RNA分子从电泳凝胶转移至杂交滤膜上，然后与核酸探针进行杂交的方法。","lectures":[9],"id":"G444"},{"cn":"RNA-Seq","en":"RNA sequencing","abbr":"","definition":"利用高通量测序技术对转录组进行测序分析，对得到的原始读长进行过滤、组装及后续生物信息学分析的方法。","lectures":[9],"id":"G445"},{"cn":"RNA诱导的沉默复合体","en":"RNA-induced silencing complex","abbr":"RISC","definition":"由siRNA中的反义链参与指导合成的核蛋白体，介导切割目的mRNA中与siRNA反义链互补的区域，实现干扰靶基因表达的功能。","lectures":[9],"id":"G446"},{"cn":"SYBR Green I","en":"SYBR Green I","abbr":"","definition":"非序列特异性荧光染料，激发光波长520 nm，只与双链DNA结合，游离未结合时不产生荧光。","lectures":[9],"id":"G447"},{"cn":"Southern杂交","en":"Southern hybridization / Southern blot","abbr":"","definition":"将DNA分子从电泳凝胶转移至杂交滤膜上，然后与核酸探针进行杂交的方法。","lectures":[9],"id":"G448"},{"cn":"T7 RNA聚合酶","en":"T7 RNA polymerase","abbr":"","definition":"由噬菌体T7基因1编码的RNA聚合酶，专一识别T7启动子并高效转录下游基因。","lectures":[9],"id":"G449"},{"cn":"Taq DNA聚合酶","en":"Taq DNA polymerase","abbr":"","definition":"来自嗜热菌Thermus aquaticus的耐热DNA聚合酶，用于PCR延伸步骤。","lectures":[9],"id":"G450"},{"cn":"TaqMan探针","en":"TaqMan probe","abbr":"","definition":"一段与靶DNA序列中间部位结合的单链DNA，长度50-150 bp，其5'和3'端带有两个不同荧光基团，彼此距离靠近时在荧光共振能量转移作用下发生荧光淬灭。","lectures":[9],"id":"G451"},{"cn":"Western杂交","en":"Western hybridization / Western blot","abbr":"","definition":"将蛋白质从电泳凝胶中转移到杂交滤膜上，然后同放射性同位素125I标记的特定蛋白质进行反应的方法。","lectures":[9],"id":"G452"},{"cn":"功能冗余","en":"functional redundancy","abbr":"","definition":"基因家族中多个成员具有相同或相似的功能，单个基因敲除后其他成员可代偿其功能，导致无明显表型。","lectures":[9],"id":"G453"},{"cn":"动物模型","en":"animal model","abbr":"","definition":"为研究特定问题（如人类疾病）而人工构建或创造的动物系统。","lectures":[9],"id":"G454"},{"cn":"原位杂交","en":"In Situ Hybridization","abbr":"ISH","definition":"用标记的核酸探针，经放射自显影或非放射检测体系，在组织、细胞、间期核及染色体上对核酸进行定位和相对定量研究的手段。","lectures":[9],"id":"G455"},{"cn":"反转录酶","en":"reverse transcriptase","abbr":"","definition":"以RNA为模板、按碱基互补原则合成DNA链的酶。","lectures":[9],"id":"G456"},{"cn":"回文序列","en":"palindrome","abbr":"","definition":"在切割部位，一条链正向读的碱基顺序与另一条链反向读的顺序完全一致。","lectures":[9],"id":"G457"},{"cn":"基因工程","en":"genetic engineering","abbr":"","definition":"在体外将核酸分子插入病毒、质粒或其它载体分子，构成遗传物质的新组合，使之进入原先没有这类分子的寄主细胞内并进行持续稳定的繁殖和表达。","lectures":[9],"id":"G458"},{"cn":"基因操作","en":"gene manipulation","abbr":"","definition":"主要包括DNA分子的切割与连接、细胞转化、核酸序列分析以及基因人工合成、表达、定点突变和PCR扩增等，是分子生物学研究的核心技术。","lectures":[9],"id":"G459"},{"cn":"基因敲除","en":"gene knock-out","abbr":"","definition":"又称基因打靶，通过外源DNA与染色体DNA之间的同源重组，进行精确的定点修饰和基因改造，具有专一性强、染色体DNA可与目的片段共同稳定遗传等特点。","lectures":[9],"id":"G460"},{"cn":"基因芯片","en":"DNA chip / DNA microarray","abbr":"","definition":"将大量探针分子固定于支持物上，与标记的样品分子杂交，通过检测每个探针分子的杂交信号强度获取样品分子的数量和序列信息的技术。","lectures":[9],"id":"G461"},{"cn":"增强型绿色荧光蛋白","en":"enhanced green fluorescent protein","abbr":"EGFP","definition":"经改造的绿色荧光蛋白，荧光更强，可作为报告基因/融合标签用于活细胞定位。","lectures":[9],"id":"G462"},{"cn":"多克隆位点","en":"multiple cloning site","abbr":"MCS","definition":"载体上人工设计的一段含多个不同限制酶识别位点的短序列，供外源基因插入。","lectures":[9],"id":"G463"},{"cn":"小分子干扰核糖核酸","en":"short interfering RNA","abbr":"siRNA","definition":"由Dicer加工长双链RNA产生的21～25个核苷酸的小RNA，能有效定位目标mRNA。","lectures":[9],"id":"G464"},{"cn":"必需基因","en":"essential gene","abbr":"","definition":"细胞或生物体生存所必需的基因，敲除后导致细胞死亡或生物体致死。","lectures":[9],"id":"G465"},{"cn":"感受态细胞","en":"competent cells","abbr":"","definition":"经过物理或化学处理、获取DNA能力增强的受体菌细胞。","lectures":[9],"id":"G466"},{"cn":"慢病毒","en":"Lentivirus","abbr":"","definition":"以HIV-1为基础发展起来的病毒载体，区别于一般逆转录病毒载体，对分裂细胞和非分裂细胞均具有感染能力。","lectures":[9],"id":"G467"},{"cn":"无缝克隆","en":"Seamless Cloning / In-Fusion Cloning","abbr":"","definition":"载体末端与引物末端具有15-20个同源碱基，PCR产物两端带上与载体同源的序列，依靠碱基间作用力互补配对成环，无需酶连即可直接转化宿主菌的克隆方法。","lectures":[9],"id":"G468"},{"cn":"末端转移酶","en":"terminal transferase","abbr":"","definition":"在双链核酸的3'末端加上多聚或单核苷酸的酶。","lectures":[9],"id":"G469"},{"cn":"条件性基因打靶","en":"conditional gene targeting","abbr":"","definition":"将某个基因的修饰限制于小鼠某些特定类型的细胞或发育的某一特定阶段的一种特殊的基因打靶方法。","lectures":[9],"id":"G470"},{"cn":"核酸探针","en":"nucleic acid probe","abbr":"","definition":"序列或功能特性已知的标记分子，为双链或单链，长度通常为几十至几百bp，包括DNA探针、RNA探针和cDNA探针。","lectures":[9],"id":"G471"},{"cn":"核酸的分子杂交","en":"nucleic acid molecular hybridization","abbr":"","definition":"两个不同来源的互补单链多聚核苷酸之间的碱基配对过程。","lectures":[9],"id":"G472"},{"cn":"模式生物","en":"model organism","abbr":"","definition":"为揭示具有普遍规律的生命现象而选定进行科学研究的生物物种；其研究结论可外推到同类群其他生物。","lectures":[9],"id":"G473"},{"cn":"正负筛选法","en":"positive-negative selection","abbr":"PNS","definition":"同时利用正向选择标记与负向选择标记富集发生同源重组的细胞的筛选方法。","lectures":[9],"id":"G474"},{"cn":"溴化乙锭","en":"ethidium bromide","abbr":"EB","definition":"一种嵌入DNA堆积碱基之间的三环平面基团荧光染料，在紫外光下观察DNA条带。","lectures":[9],"id":"G475"},{"cn":"琼脂糖凝胶","en":"agarose gel","abbr":"","definition":"以琼脂糖为基质的凝胶，分辨力不如聚丙烯酰胺凝胶，但能够区分几十至几百Kb大小的DNA片段。","lectures":[9],"id":"G476"},{"cn":"电泳迁移率","en":"electrophoretic mobility","abbr":"","definition":"电泳分子在电场作用下的迁移速度。","lectures":[9],"id":"G477"},{"cn":"瞬时转染","en":"transient transfection","abbr":"","definition":"外源DNA/RNA不整合到宿主染色体中，一个宿主细胞中可存在多个拷贝数，产生高水平表达，但通常只持续几天的转染方式。","lectures":[9],"id":"G478"},{"cn":"短发夹RNA","en":"short hairpin RNA","abbr":"shRNA","definition":"由正义链和反义链通过环状序列隔开共同组成的RNA分子，包含一个环结构，可加工成siRNA。","lectures":[9],"id":"G479"},{"cn":"碱性磷酸酯酶","en":"alkaline phosphatase","abbr":"","definition":"切除位于DNA链末端的磷酸基团的酶。","lectures":[9],"id":"G480"},{"cn":"稳定转染","en":"stable transfection","abbr":"","definition":"外源DNA既可整合到宿主染色体中，也可能作为游离体存在，需通过选择性标记反复筛选得到稳定转染同源细胞系的转染方式。","lectures":[9],"id":"G481"},{"cn":"细菌转化","en":"bacterial transformation","abbr":"","definition":"一种细菌菌株由于捕获了来自供体菌株的DNA而导致性状特征发生遗传改变的过程。","lectures":[9],"id":"G482"},{"cn":"聚丙烯酰胺凝胶","en":"polyacrylamide gel","abbr":"","definition":"由丙烯酰胺与交联剂聚合形成的凝胶基质，分辨力高，但可区分DNA的大小范围窄，分辨范围为1到1000个碱基对之间。","lectures":[9],"id":"G483"},{"cn":"胚胎干细胞","en":"embryonic stem cell","abbr":"ES cell","definition":"来源于早期胚胎内细胞团、可体外培养并保持多能性、能贡献到生殖系的干细胞，是基因打靶载体导入的受体细胞。","lectures":[9],"id":"G484"},{"cn":"荧光原位杂交","en":"Fluorescence In Situ Hybridization","abbr":"FISH","definition":"用荧光染料标记的DNA探针与变性的染色体DNA杂交，在荧光显微镜下直接观察探针在染色体上的定位的方法。","lectures":[9],"id":"G485"},{"cn":"荧光实时定量PCR","en":"real time quantitative PCR","abbr":"qRT-PCR","definition":"利用荧光检测PCR仪，在PCR指数扩增期间连续监测荧光信号强弱变化，实时测定特异性产物量，并通过标准曲线对未知模板进行定量分析的方法。","lectures":[9],"id":"G486"},{"cn":"蓝白斑筛选","en":"blue-white screening","abbr":"","definition":"利用lacZ'编码的α-肽链与宿主ω片段互补形成有活性的β-半乳糖苷酶，水解X-gal产生蓝色产物；外源基因插入MCS破坏lacZ'，不能产生蓝色，从而区分重组与非重组质粒的筛选方法。","lectures":[9],"id":"G487"},{"cn":"诱导性基因敲除","en":"inducible knockout","abbr":"","definition":"以Cre/loxP系统为基础，利用控制Cre表达的启动子活性或所表达Cre酶活性具有可诱导的特点，通过对诱导剂给予时间的控制，在loxP动物的一定发育阶段和一定组织细胞中实现对特定基因进行遗传修饰的基因敲除技术。","lectures":[9],"id":"G488"},{"cn":"转染","en":"transfection","abbr":"","definition":"指真核细胞由于外源DNA掺入而获得新的遗传标志的过程。","lectures":[9],"id":"G489"},{"cn":"载体","en":"vector","abbr":"","definition":"具备自主复制能力的DNA分子，可作为分子克隆的载体，将目的基因导入受体细胞并在其中大量复制。","lectures":[9],"id":"G490"},{"cn":"限制性核酸内切酶","en":"restriction endonuclease","abbr":"","definition":"能够识别DNA上的特定碱基序列并从这个位点切开DNA分子的酶，化学本质是蛋白质。","lectures":[9],"id":"G491"},{"cn":"高通量测序","en":"high-throughput sequencing","abbr":"NGS","definition":"又称二代测序或深度测序，可一次性并行测序几十万甚至几百万条DNA分子，读长一般较短，通过读取多个短DNA片段拼接成完整序列信息。","lectures":[9],"id":"G492"},{"cn":"Far Western 印迹与蛋白芯片","en":"Far Western blotting / protein microarray","abbr":"","definition":"Far Western是将蛋白经SDS-PAGE转膜后用标记的探针蛋白（而非抗体）孵育，检测膜上与之直接结合的蛋白；蛋白芯片是将大量蛋白以阵列形式固定，用标记样品孵育进行高通量互作筛查。","lectures":[10],"id":"G493"},{"cn":"GST下拉实验","en":"GST pull-down","abbr":"","definition":"以细菌表达的谷胱甘肽S-转移酶（GST）融合蛋白为探针，与溶液中特异性搭档蛋白结合后，用谷胱甘肽琼脂糖球珠沉淀GST融合蛋白并把结合蛋白一起沉淀下来的体外方法。","lectures":[10],"id":"G494"},{"cn":"SDS-聚丙烯酰胺凝胶电泳","en":"SDS-polyacrylamide gel electrophoresis","abbr":"SDS-PAGE","definition":"在SDS存在下进行的变性聚丙烯酰胺凝胶电泳，主要按分子量分离蛋白质。","lectures":[10],"id":"G495"},{"cn":"X射线晶体衍射法","en":"X-ray crystallography","abbr":"","definition":"以蛋白质晶体为样品，通过衍射图谱解析原子级三维结构的方法。","lectures":[10],"id":"G496"},{"cn":"一抗与二抗","en":"primary antibody / secondary antibody","abbr":"","definition":"一抗是与目的蛋白特异性结合的非标记抗体；二抗是识别一抗、带酶促偶联（如HRP）或放射性同位素标记的抗体。","lectures":[10],"id":"G497"},{"cn":"串联亲和纯化","en":"tandem affinity purification","abbr":"TAP","definition":"在目标蛋白上融合串联双标签（如Protein A与钙调蛋白结合肽），经两步亲和纯化获得高纯度蛋白复合物的方法。","lectures":[10],"id":"G498"},{"cn":"亲和层析","en":"affinity chromatography","abbr":"","definition":"利用生物大分子与配体之间特异、可逆的结合能力进行分离纯化的层析技术。","lectures":[10],"id":"G499"},{"cn":"亲和纯化-质谱","en":"affinity purification & mass spectrometry","abbr":"AP-MS","definition":"以带标签的诱饵蛋白从裂解液中分离蛋白复合物，经亲和柱纯化、SDS-PAGE、切胶胰蛋白酶酶解后用质谱与生物信息学分析鉴定复合物组分的方法。","lectures":[10],"id":"G500"},{"cn":"免疫共沉淀","en":"co-immunoprecipitation","abbr":"Co-IP","definition":"以抗体和抗原之间的专一性作用为基础，在非变性条件下裂解细胞，用蛋白X的抗体沉淀X，与X在体内结合的蛋白Y也被共沉淀，用于研究完整细胞内生理性蛋白质相互作用的经典方法。","lectures":[10],"id":"G501"},{"cn":"免疫沉淀","en":"immunoprecipitation","abbr":"IP","definition":"利用特异性抗体与抗原决定簇结合，通过Protein A/G珠子将抗原-抗体复合物从混合液中沉淀下来的技术。","lectures":[10],"id":"G502"},{"cn":"免疫沉淀-质谱联用","en":"immunoprecipitation coupled with mass spectrometry","abbr":"IP-MS","definition":"用抗体特异富集目标蛋白复合物，经凝胶分离与胰蛋白酶酶解后用质谱鉴定共沉淀蛋白的方法。","lectures":[10],"id":"G503"},{"cn":"凝胶过滤（分子筛层析）","en":"gel filtration / size-exclusion chromatography","abbr":"","definition":"以多孔性凝胶为支持物，分子大小不同的蛋白质受到的阻滞作用不同而先后流出，从而分离纯化的层析方法。","lectures":[10],"id":"G504"},{"cn":"凝胶阻滞实验","en":"electrophoretic mobility shift assay","abbr":"EMSA","definition":"用于体外研究DNA/RNA与蛋白质相互作用的特殊凝胶电泳技术，蛋白结合后核酸探针迁移率下降形成滞后带。","lectures":[10],"id":"G505"},{"cn":"凯氏定氮法","en":"Kjeldahl nitrogen determination","abbr":"","definition":"基于蛋白质平均含氮量为16%，先测定样品氮含量再换算蛋白质含量的经典定量方法。","lectures":[10],"id":"G506"},{"cn":"双向电泳","en":"two dimensional electrophoresis","abbr":"2-DE","definition":"第一向按等电点进行等电聚焦、第二向按分子量进行SDS-PAGE的二维电泳技术。","lectures":[10],"id":"G507"},{"cn":"变性","en":"denaturation","abbr":"","definition":"蛋白质在一定的理化条件下失去原有的空间结构、生物学功能及部分理化特性。","lectures":[10],"id":"G508"},{"cn":"圆二色谱法","en":"circular dichroism spectroscopy","abbr":"CD","definition":"在溶液状态下测定蛋白质对左、右旋圆偏振光吸收差异，用于分析蛋白质二级结构的方法。","lectures":[10],"id":"G509"},{"cn":"复性","en":"renaturation","abbr":"","definition":"变性条件去除后，蛋白质恢复原有的空间结构及生物学功能。","lectures":[10],"id":"G510"},{"cn":"染色质免疫沉淀技术","en":"chromatin immunoprecipitation","abbr":"ChIP","definition":"在生理状态下将细胞内DNA与蛋白质交联，超声打碎染色质后用目的蛋白特异性抗体沉淀交联复合体，只有与目的蛋白结合的DNA片段被沉淀下来的技术。","lectures":[10],"id":"G511"},{"cn":"核磁共振与冷冻电镜","en":"nuclear magnetic resonance / cryo-electron microscopy","abbr":"NMR / cryo-EM","definition":"NMR在溶液状态下测定蛋白质三维结构；cryo-EM将样品快速冷冻后用电镜成像并重建三维结构。","lectures":[10],"id":"G512"},{"cn":"梯度离心","en":"gradient centrifugation / density gradient centrifugation","abbr":"","definition":"在密度梯度介质中离心，使蛋白质按沉降系数（与大小和形状相关）不同而分层的分离方法。","lectures":[10],"id":"G513"},{"cn":"电泳","en":"electrophoresis","abbr":"","definition":"带电颗粒在电场作用下向着与其电性相反的电极移动的现象。","lectures":[10],"id":"G514"},{"cn":"盐析法","en":"salting out","abbr":"","definition":"通过加入高浓度中性盐降低蛋白质溶解度使其沉淀的方法。","lectures":[10],"id":"G515"},{"cn":"离子交换层析","en":"ion-exchange chromatography","abbr":"","definition":"利用蛋白质与带电凝胶颗粒间静电相互作用力的差别，把蛋白质分开的层析方法。","lectures":[10],"id":"G516"},{"cn":"离子强度","en":"ionic strength","abbr":"","definition":"溶液中离子浓度及其电荷数的度量，影响蛋白质的溶解度与聚集状态。","lectures":[10],"id":"G517"},{"cn":"等电点","en":"isoelectric point","abbr":"pI","definition":"使蛋白质（或氨基酸）净电荷为零时的pH值。","lectures":[10],"id":"G518"},{"cn":"等电聚焦电泳","en":"isoelectric focusing","abbr":"IEF","definition":"在pH梯度中电泳，使蛋白质迁移至净电荷为零的pH处（即其pI）并聚焦成窄带的电泳技术。","lectures":[10],"id":"G519"},{"cn":"粗分级","en":"crude fractionation","abbr":"","definition":"用提取缓冲液提取材料后，采取简单方法使目标蛋白浓缩、同时去除大量杂质的纯化步骤。","lectures":[10],"id":"G520"},{"cn":"紫外吸收法","en":"UV absorbance method","abbr":"","definition":"利用芳香族氨基酸在280 nm附近有最大光吸收、核酸在260 nm附近有最大光吸收，用双波长校正核酸干扰的蛋白定量方法。","lectures":[10],"id":"G521"},{"cn":"纯度判据：色谱纯、电泳纯、结晶纯","en":"chromatographic / electrophoretic / crystallographic purity","abbr":"","definition":"色谱纯指层析图谱中只有一个洗脱峰；电泳纯指电泳图谱中只有一条条带；结晶纯指能够获得蛋白质晶体。","lectures":[10],"id":"G522"},{"cn":"细分级","en":"fine fractionation","abbr":"","definition":"在粗分级浓缩和初步纯化基础上，根据蛋白质分子大小、分子形状、分子表面特征或分子带电状况进一步纯化的步骤。","lectures":[10],"id":"G523"},{"cn":"荧光共振能量转移","en":"fluorescence resonance energy transfer","abbr":"FRET","definition":"两个荧光探针（给体与受体）在近距离内发生非辐射能量转移的现象，用于检测分子间相互作用。","lectures":[10],"id":"G524"},{"cn":"蛋白质免疫印迹","en":"Western blotting (immunoblotting)","abbr":"","definition":"在蛋白质凝胶电泳和固相免疫测定基础上发展起来的技术，为检测样品中是否存在蛋白抗原提供可靠方法。","lectures":[10],"id":"G525"},{"cn":"蛋白质分离纯化","en":"protein separation and purification","abbr":"","definition":"利用蛋白质在大小、电荷、形状、溶解性、亲和性等理化性质上的差异，将其从混合物中分离并纯化的过程。","lectures":[10],"id":"G526"},{"cn":"蛋白酶抑制剂","en":"protease inhibitor","abbr":"","definition":"抑制蛋白酶活性的化合物，防止提取过程中目的蛋白被降解。","lectures":[10],"id":"G527"},{"cn":"表面等离子共振","en":"surface plasmon resonance","abbr":"SPR","definition":"将配体固定在传感芯片表面，实时监测流经表面的分析物结合所引起的折射率变化，从而测定结合动力学与亲和力的生物物理技术。","lectures":[10],"id":"G528"},{"cn":"解离常数","en":"dissociation constant","abbr":"Kd","definition":"衡量两分子结合亲和力的平衡常数，Kd越小亲和力越强。","lectures":[10],"id":"G529"},{"cn":"超滤","en":"ultrafiltration","abbr":"","definition":"在压力驱动下使溶剂与小分子穿过滤膜、大分子被截留，从而实现浓缩或分离的膜分离技术。","lectures":[10],"id":"G530"},{"cn":"还原剂","en":"reducing agent","abbr":"","definition":"用于还原二硫键、防止蛋白氧化聚集的试剂，如DTT与2-巯基乙醇。","lectures":[10],"id":"G531"},{"cn":"透析","en":"dialysis","abbr":"","definition":"利用半透膜将蛋白质溶液与大量缓冲液隔开，只允许盐离子等小分子通过而截留蛋白质，从而去除小分子杂质的膜分离方法。","lectures":[10],"id":"G532"},{"cn":"酵母双杂交","en":"yeast two-hybrid system","abbr":"Y2H","definition":"利用真核转录因子DNA结合结构域（BD）与转录激活结构域（AD）分离后重组装激活报告基因的原理，检测两种蛋白质之间是否存在相互作用的技术。","lectures":[10],"id":"G533"},{"cn":"金属螯合亲和层析","en":"immobilized metal affinity chromatography","abbr":"IMAC","definition":"利用固相载体上螯合的金属离子（如Ni²⁺）与蛋白质表面组氨酸残基等的配位结合进行纯化的亲和层析。","lectures":[10],"id":"G534"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LECS = DATA.lectures;
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = (s,n)=> (s||'').length>n ? s.slice(0,n)+'…' : (s||'');

const saved = (()=>{try{return JSON.parse(localStorage.getItem('mb-viewer')||'{}')}catch(e){return{}}})();
const state = {
  view: saved.view || {type:'overview'},
  q: '',
  answers: new Set(saved.answers||[]),
  done: new Set(saved.done||[]),
  theme: saved.theme || 'light'
};
const persist = ()=>{
  try{localStorage.setItem('mb-viewer',JSON.stringify({
    view:state.view, answers:[...state.answers], done:[...state.done], theme:state.theme
  }))}catch(e){}
};

/* ---------- index for search ---------- */
const INDEX = [];
function idx(lec,type,id,title,text){
  INDEX.push({lec,type,id,title,text:(title+' '+text).toLowerCase()});
}
LECS.forEach(ch=>{
  ch.concepts.forEach(c=>idx(ch.lecture,'概念',c.id,c.cn+'（'+c.en+'）',[c.definition,c.detail,c.note].join(' ')));
  ch.processes.forEach(p=>idx(ch.lecture,'过程',p.id,p.name+'（'+p.en+'）',[p.overview,...p.steps.map(s=>s.name+s.detail),...p.key_points,...p.regulation].join(' ')));
  ch.distinctions.forEach(d=>idx(ch.lecture,'辨析',d.id,d.title||(d.a+' / '+d.b),[d.a,d.b,...d.difference,d.easy_mistake].join(' ')));
  ch.facts.forEach(f=>idx(ch.lecture,'事实',f.id,f.text.slice(0,40),f.text+' '+(f.note||'')));
  ch.methods.forEach(m=>idx(ch.lecture,'方法',m.id,m.cn+'（'+m.en+'）',[m.principle,m.steps,m.applications,m.limitations].join(' ')));
  ch.exam_points.forEach(e=>idx(ch.lecture,'考点',e.id,e.point,e.detail||''));
  ch.exercises.forEach(e=>idx(ch.lecture,'习题',e.id,e.stem.slice(0,50),[e.stem,e.options.join(' '),e.answer,e.analysis].join(' ')));
});
DATA.comprehensive_exercises.forEach(e=>idx(0,'综合题',e.id,e.stem.slice(0,50),[e.stem,e.options.join(' '),e.answer,e.analysis].join(' ')));
DATA.glossary.forEach(g=>idx('G','术语',g.id,g.cn+'（'+g.en+'）',g.definition));

/* ---------- utilities ---------- */
function hl(text,q){
  const t = esc(text);
  if(!q) return t;
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return t.replace(re,'<mark>$1</mark>');
}
const pg = arr => (arr&&arr.length) ? `<span class="pg">p.${arr.join(', ')}</span>` : '';
/* options usually already carry their own A. / B. labels — do not number them twice */
function optsHTML(e){
  const o = e.options || [];
  if(!o.length) return '';
  const labelled = o.every(x=>/^[A-Za-z][.、．)）]/.test(String(x).trim()));
  const tag = labelled ? 'ul' : 'ol';
  return `<${tag} class="${labelled?'opts plain':'opts'}">${o.map(x=>`<li>${esc(x)}</li>`).join('')}</${tag}>`;
}

function revealAll(on){
  $$('.ex').forEach(el=>{
    el.classList.toggle('revealed',on);
    const id = el.dataset.ex;
    if(on) state.answers.add(id); else state.answers.delete(id);
  });
  persist();
  $$('.ex .toggle').forEach(b=>b.textContent = b.closest('.ex').classList.contains('revealed')?'收起答案':'显示答案');
}

/* ---------- overview ---------- */
function viewOverview(){
  const m = DATA.meta, c = m.counts;
  const cards = LECS.map(ch=>`
    <article class="card" data-go="${ch.lecture}">
      <div class="k">第 ${ch.lecture} 讲 · ${ch.pages} 页</div>
      <h3>${esc(ch.title)}</h3>
      <p>${esc(short(ch.overview,150))}</p>
      <div class="chips">
        <span class="chip">概念 ${ch.concepts.length}</span>
        <span class="chip">过程 ${ch.processes.length}</span>
        <span class="chip">辨析 ${ch.distinctions.length}</span>
        <span class="chip">习题 ${ch.exercises.length}</span>
      </div>
    </article>`).join('');
  return `
    <div class="hero">
      <h1>《分子生物学》知识点图谱</h1>
      <p>${esc(m.course)}。${m.lectures} 次课 · ${m.pages} 页幻灯片逐页蒸馏，共 ${c.concepts} 条概念、${c.processes} 个过程、${c.distinctions} 组辨析、${c.exercises} 道习题。点击任意一讲进入，或用上方搜索检索全书。</p>
      <div class="stats">
        <div class="stat"><b>${c.concepts}</b><span>概念（中英）</span></div>
        <div class="stat"><b>${c.processes}</b><span>生物学过程</span></div>
        <div class="stat"><b>${c.distinctions}</b><span>易错辨析</span></div>
        <div class="stat"><b>${c.facts}</b><span>必记事实</span></div>
        <div class="stat"><b>${c.methods}</b><span>技术方法</span></div>
        <div class="stat"><b>${DATA.glossary.length}</b><span>术语对照</span></div>
        <div class="stat"><b>${c.exercises}</b><span>习题与解析</span></div>
      </div>
    </div>
    <div class="cards">${cards}</div>
    <footer>数据来源：<code>knowledge-points.json</code> · 模型 ${esc(m.model)} · 生成于 ${esc(m.generated)}</footer>`;
}

/* ---------- lecture ---------- */
function viewLecture(n){
  const ch = LECS.find(x=>x.lecture===n);
  if(!ch) return '<div class="empty">未找到该讲。</div>';
  const doneN = ch.exercises.filter(e=>state.done.has(e.id)).length;
  const pct = ch.exercises.length? Math.round(doneN/ch.exercises.length*100):0;

  const outline = ch.outline.map(s=>`
    <div class="ot"><h4><em>${esc(s.section)}</em>${esc(s.title)}</h4>
      <ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`).join('');

  const concepts = ch.concepts.map(c=>{
    const has = c.detail || c.note;
    return `<div class="concept" id="${c.id}">
      <div class="hd">
        <span class="cn">${esc(c.cn)}</span>
        <span class="en">${esc(c.en)}${c.abbr?` · ${esc(c.abbr)}`:''}</span>
        ${pg(c.pages)}
      </div>
      <div class="def">${esc(c.definition)}</div>
      ${has?`<button class="more" data-more>展开细节</button>
      <div class="extra">${c.detail?`<div><b>展开：</b>${esc(c.detail)}</div>`:''}
        ${c.note?`<div style="margin-top:6px"><span class="tag-note">提示</span>${esc(c.note)}</div>`:''}</div>`:''}
    </div>`;
  }).join('');

  const procs = ch.processes.map(p=>`
    <div class="proc" id="${p.id}">
      <div class="hd" data-proc>
        <h4>${esc(p.name)}</h4><span class="en">${esc(p.en)}</span>${pg(p.pages)}
      </div>
      <div class="body">
        ${p.overview?`<div class="ov">${esc(p.overview)}</div>`:''}
        <ol class="steps">${p.steps.map(s=>`<li>${s.name?`<span class="nm">${esc(s.name)}</span>：`:''}${esc(s.detail)}</li>`).join('')}</ol>
        ${p.key_points.length?`<div class="kv"><b>关键点：</b>${p.key_points.map(esc).join('；')}</div>`:''}
        ${p.regulation.length?`<div class="kv"><b>调控/偶联：</b>${p.regulation.map(esc).join('；')}</div>`:''}
        ${p.figures.length?`<div class="kv"><b>图示：</b>${p.figures.map(esc).join('；')}</div>`:''}
      </div>
    </div>`).join('');

  const dists = ch.distinctions.map(d=>`
    <div class="dist" id="${d.id}">
      <div class="side a"><h4>A</h4><div class="term">${esc(d.a)}</div></div>
      <div class="vs">VS</div>
      <div class="side b"><h4>B</h4><div class="term">${esc(d.b)}</div></div>
      <div class="foot">
        <div><b>${esc(d.title)}</b></div>
        <ul style="margin:6px 0 0;padding-left:18px">${d.difference.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${d.easy_mistake?`<div style="margin-top:6px" class="miss"><b>易错：</b>${esc(d.easy_mistake)}</div>`:''}
      </div>
    </div>`).join('');

  const facts = ch.facts.map(f=>`<li>${esc(f.text)}${f.note?`<span class="note">${esc(f.note)}</span>`:''}</li>`).join('');
  const methods = ch.methods.map(m=>`
    <div class="method" id="${m.id}">
      <h4>${esc(m.cn)}<span class="en">${esc(m.en)}</span></h4>
      <dl>
        ${m.principle?`<dt>原理</dt><dd>${esc(m.principle)}</dd>`:''}
        ${m.steps?`<dt>要点</dt><dd>${esc(m.steps)}</dd>`:''}
        ${m.applications?`<dt>用途</dt><dd>${esc(m.applications)}</dd>`:''}
        ${m.limitations?`<dt>局限</dt><dd>${esc(m.limitations)}</dd>`:''}
      </dl>
    </div>`).join('');
  const exams = ch.exam_points.map(e=>`<li><b>${esc(e.point)}</b>：${esc(e.detail)}</li>`).join('');

  const exs = ch.exercises.map(e=>exerciseHTML(e, 'L'+ch.lecture)).join('');

  return `
    <div class="lec-head">
      <div class="k">第 ${ch.lecture} 讲</div>
      <h1>${esc(ch.title)}</h1>
      <div class="lec-meta">
        <span>课件 ${esc(ch.source_file)} · ${ch.pages} 页</span>
        <span class="progress"><span>习题掌握</span><span class="bar"><i style="width:${pct}%"></i></span><span id="prog-txt">${doneN}/${ch.exercises.length}</span></span>
      </div>
    </div>
    <nav id="subnav">
      <a href="#s-main">主线</a><a href="#s-outline">框架</a><a href="#s-concept">概念</a>
      <a href="#s-process">过程</a><a href="#s-dist">辨析</a><a href="#s-fact">事实</a>
      <a href="#s-method">方法</a><a href="#s-exam">考点</a><a href="#s-ex">习题</a>
    </nav>

    <section class="block" id="s-main"><h2>本章主线</h2>
      <div class="overview-box">${esc(ch.overview)}</div></section>

    <section class="block" id="s-outline"><h2>知识框架<span class="cnt">${ch.outline.length} 节</span></h2>
      <div class="outline">${outline}</div></section>

    <section class="block" id="s-concept"><h2>名词概念<span class="cnt">${ch.concepts.length} 条</span></h2>
      ${concepts}</section>

    <section class="block" id="s-process"><h2>生物学过程<span class="cnt">${ch.processes.length} 个</span></h2>
      ${procs}</section>

    <section class="block" id="s-dist"><h2>易错辨析<span class="cnt">${ch.distinctions.length} 组</span></h2>
      ${dists}</section>

    <section class="block" id="s-fact"><h2>必记事实<span class="cnt">${ch.facts.length} 条</span></h2>
      <ul class="facts">${facts}</ul></section>

    <section class="block" id="s-method"><h2>技术方法<span class="cnt">${ch.methods.length} 项</span></h2>
      ${methods||'<div class="empty">本讲无单独技术条目。</div>'}</section>

    <section class="block" id="s-exam"><h2>考点提示<span class="cnt">${ch.exam_points.length} 条</span></h2>
      <ul class="exam">${exams}</ul></section>

    <section class="block" id="s-ex"><h2>习题与解析<span class="cnt">${ch.exercises.length} 道</span></h2>
      <div style="margin-bottom:10px">
        <button class="btn" data-all="1">全部显示答案</button>
        <button class="btn" data-all="0">全部收起</button>
      </div>
      ${exs}</section>
    <footer>页码对应原课件《${esc(ch.source_file)}》。</footer>`;
}

function exerciseHTML(e, tag){
  const on = state.answers.has(e.id), dn = state.done.has(e.id);
  return `<div class="ex ${on?'revealed':''}" data-ex="${e.id}" id="${e.id}">
    <div class="top">
      <span class="id">${e.id}</span><span class="type">${esc(e.type)}</span>
      <span class="pg">${e.pages&&e.pages.length?'p.'+e.pages.join(', '):''}</span>
    </div>
    <div class="stem">${esc(e.stem)}</div>
    ${optsHTML(e)}
    <div class="acts">
      <button class="btn toggle">${on?'收起答案':'显示答案'}</button>
      <label class="done"><input type="checkbox" data-done="${e.id}" ${dn?'checked':''}>已掌握</label>
    </div>
    <div class="ans">
      <div class="a">答案：${esc(e.answer)}</div>
      <div class="an"><b>解析：</b>${esc(e.analysis)}</div>
    </div>
  </div>`;
}

/* ---------- glossary ---------- */
function viewGlossary(){
  const rows = DATA.glossary.map(g=>`
    <tr>
      <td style="white-space:nowrap;color:var(--muted)">${g.id}</td>
      <td>${esc(g.cn)}${g.abbr?`<span style="color:var(--muted)">（${esc(g.abbr)}）</span>`:''}</td>
      <td class="en">${esc(g.en)}</td>
      <td>${esc(g.definition)}</td>
      <td>${g.lectures.map(n=>`<span class="lec-badge" data-jump-lec="${n}">${n}</span>`).join('')}</td>
    </tr>`).join('');
  return `
    <div class="lec-head"><div class="k">附录</div><h1>术语英汉对照总表</h1>
      <div class="lec-meta"><span>${DATA.glossary.length} 条去重术语，点击讲次徽章可跳转</span></div></div>
    <div class="gwrap">
    <table class="gtable"><thead><tr><th>编号</th><th>中文</th><th>English</th><th>释义</th><th>讲次</th></tr></thead>
    <tbody>${rows}</tbody></table>
    </div>`;
}

/* ---------- cross exercises ---------- */
function viewCross(){
  const exs = DATA.comprehensive_exercises.map(e=>`
    <div class="ex" data-ex="${e.id}" id="${e.id}">
      <div class="top"><span class="id">${e.id}</span><span class="type">${esc(e.type)}</span>
        <span class="pg">${esc((e.chapters||[]).join(' · '))}</span></div>
      <div class="stem">${esc(e.stem)}</div>
      ${optsHTML(e)}
      <div class="acts"><button class="btn toggle">显示答案</button></div>
      <div class="ans"><div class="a">答案：${esc(e.answer)}</div>
        <div class="an"><b>解析：</b>${esc(e.analysis)}</div></div>
    </div>`).join('');
  return `
    <div class="lec-head"><div class="k">附录</div><h1>跨章综合题</h1>
      <div class="lec-meta"><span>${DATA.comprehensive_exercises.length} 道，考查多章之间的联系</span></div></div>
    <div style="margin-bottom:10px"><button class="btn" data-all="1">全部显示答案</button>
      <button class="btn" data-all="0">全部收起</button></div>
    ${exs}`;
}

/* ---------- search ---------- */
function viewSearch(q){
  const ql = q.toLowerCase();
  const hits = INDEX.filter(it=>it.text.includes(ql));
  if(!hits.length) return `<div class="empty">没有找到与「${esc(q)}」有关的条目。</div>`;
  const groups = {};
  hits.forEach(h=>{ (groups[h.type] = groups[h.type]||[]).push(h); });
  const order = ['概念','过程','辨析','事实','方法','考点','习题','综合题','术语'];
  return `<div class="lec-head"><div class="k">搜索</div><h1>${hits.length} 条结果</h1>
    <div class="lec-meta"><span>关键词：${esc(q)}</span></div></div>` +
    order.filter(t=>groups[t]).map(t=>`
      <div class="res-group"><h3>${t} · ${groups[t].length}</h3>
        ${groups[t].map(h=>`<button class="res" data-jump="${h.lec}" data-id="${h.id}">
          <span class="k">${h.lec==='G'?'术语':(h.lec===0?'综合题':'第'+h.lec+'讲')} · ${h.id}</span>
          ${hl(h.title,q)}</button>`).join('')}
      </div>`).join('');
}

/* ---------- render ---------- */
function render(){
  const v = state.view;
  let html;
  if(state.q.trim()) html = viewSearch(state.q.trim());
  else if(v.type==='lecture') html = viewLecture(v.n);
  else if(v.type==='glossary') html = viewGlossary();
  else if(v.type==='cross') html = viewCross();
  else html = viewOverview();
  $('#view').innerHTML = html;
  $$('#side .nav-item').forEach(b=>{
    const t = b.dataset.nav;
    b.classList.toggle('active',
      (v.type==='lecture' && t===String(v.n)) ||
      (v.type!=='lecture' && t===v.type));
  });
  document.title = state.q.trim() ? '搜索 · 分子生物学知识点' :
    (v.type==='lecture' ? `第${v.n}讲 · 分子生物学知识点` : '分子生物学知识点图谱');
}

function go(view){
  state.view = view; state.q=''; $('#q').value='';
  persist(); render();
  const h = view.type==='lecture' ? '#L'+view.n
    : view.type==='glossary' ? '#glossary'
    : view.type==='cross' ? '#cross' : '#overview';
  history.replaceState(null,'',h);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- events ---------- */
$('#q').addEventListener('input', e=>{
  state.q = e.target.value; render();
});

$('#side').addEventListener('click', e=>{
  const item = e.target.closest('[data-nav]');
  if(!item) return;
  const nav = item.dataset.nav;
  go(nav==='overview' ? {type:'overview'}
    : nav==='glossary' ? {type:'glossary'}
    : nav==='cross' ? {type:'cross'}
    : {type:'lecture', n:Number(nav)});
});

$('#view').addEventListener('click', e=>{
  const card = e.target.closest('[data-go]');
  if(card){ go({type:'lecture', n:Number(card.dataset.go)}); return; }

  const more = e.target.closest('[data-more]');
  if(more){
    const ex = more.parentElement.querySelector('.extra');
    ex.classList.toggle('open');
    more.textContent = ex.classList.contains('open') ? '收起细节' : '展开细节';
    return;
  }
  const ph = e.target.closest('[data-proc]');
  if(ph){ ph.parentElement.classList.toggle('open'); return; }

  const tgl = e.target.closest('.toggle');
  if(tgl){
    const box = tgl.closest('.ex');
    const on = !box.classList.contains('revealed');
    box.classList.toggle('revealed', on);
    on ? state.answers.add(box.dataset.ex) : state.answers.delete(box.dataset.ex);
    tgl.textContent = on ? '收起答案' : '显示答案';
    persist(); return;
  }
  const all = e.target.closest('[data-all]');
  if(all){ revealAll(all.dataset.all==='1'); return; }

  const jump = e.target.closest('[data-jump]');
  if(jump){
    const lec = jump.dataset.jump;
    if(lec==='G'){ go({type:'glossary'}); return; }
    go(lec==='0' ? {type:'cross'} : {type:'lecture', n:Number(lec)});
    if(lec!=='0'){
      requestAnimationFrame(()=>{
        const el = document.getElementById(jump.dataset.id);
        if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash');
          setTimeout(()=>el.classList.remove('flash'),1700); }
      });
    }
    return;
  }
  const lb = e.target.closest('[data-jump-lec]');
  if(lb){ go({type:'lecture', n:Number(lb.dataset.jumpLec)}); return; }
});

$('#view').addEventListener('change', e=>{
  const cb = e.target.closest('[data-done]');
  if(!cb) return;
  const id = cb.dataset.done;
  cb.checked ? state.done.add(id) : state.done.delete(id);
  persist();
  const ch = LECS.find(c=>c.exercises.some(x=>x.id===id));
  if(ch){
    const n = ch.exercises.filter(x=>state.done.has(x.id)).length;
    const t = document.getElementById('prog-txt');
    const bar = document.querySelector('.bar i');
    if(t) t.textContent = n+'/'+ch.exercises.length;
    if(bar) bar.style.width = (n/ch.exercises.length*100)+'%';
  }
});

$('#theme').addEventListener('click', ()=>{
  state.theme = state.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme = state.theme;
  persist();
});
$('#expand').addEventListener('click',()=>revealAll(true));
$('#collapse').addEventListener('click',()=>revealAll(false));

document.addEventListener('keydown', e=>{
  const tag = document.activeElement && document.activeElement.tagName;
  if(e.key==='/' && tag!=='INPUT' && tag!=='TEXTAREA'){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'){ $('#q').value=''; state.q=''; render(); $('#q').blur(); }
  if((e.key==='ArrowLeft'||e.key==='ArrowRight') && !state.q && tag!=='INPUT' && state.view.type==='lecture'){
    const n = state.view.n + (e.key==='ArrowRight'?1:-1);
    if(n>=1 && n<=LECS.length) go({type:'lecture', n});
  }
});

/* ---------- boot ---------- */
document.documentElement.dataset.theme = state.theme;
document.getElementById('side').innerHTML = `
  <div class="brand"><b>分子生物学</b><span>知识点图谱</span></div>
  <button class="nav-item" data-nav="overview"><span class="no">◎</span><span class="t">总览<span class="m">10 讲 · ${DATA.meta.pages} 页</span></span></button>
  <div class="nav-label">课程</div>
  ${LECS.map(ch=>`<button class="nav-item" data-nav="${ch.lecture}" title="${esc(ch.title)}">
      <span class="no">${ch.lecture}</span>
      <span class="t">${esc(short(ch.title,18))}
        <span class="m">概念 ${ch.concepts.length} · 过程 ${ch.processes.length} · 习题 ${ch.exercises.length}</span>
      </span></button>`).join('')}
  <div class="nav-label">附录</div>
  <button class="nav-item" data-nav="glossary"><span class="no">A</span><span class="t">术语英汉对照<span class="m">${DATA.glossary.length} 条</span></span></button>
  <button class="nav-item" data-nav="cross"><span class="no">B</span><span class="t">跨章综合题<span class="m">${DATA.comprehensive_exercises.length} 道</span></span></button>
  <div class="nav-label">提示</div>
  <div style="padding:4px 10px;color:var(--muted);font-size:11.5px;line-height:1.7">
    <kbd>/</kbd> 聚焦搜索 · <kbd>Esc</kbd> 退出搜索<br>
    阅读时 <kbd>←</kbd> <kbd>→</kbd> 切换讲次
  </div>`;

/* deep link: #L3 / #L3-C07 / #glossary / #cross */
(function bootRoute(){
  const h = decodeURIComponent(location.hash||'');
  const lm = h.match(/^#L(\d+)(?:-(.+))?$/);
  if(lm){
    const n = Number(lm[1]);
    if(n>=1 && n<=LECS.length){
      state.view = {type:'lecture', n};
      render();
      if(lm[2]) requestAnimationFrame(()=>{
        const el = document.getElementById('L'+n+'-'+lm[2]);
        if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); }
      });
    }
  } else if(h==='#glossary'){ state.view={type:'glossary'}; render(); }
  else if(h==='#cross'){ state.view={type:'cross'}; render(); }
})();
render();
</script>
</body>
</html>
